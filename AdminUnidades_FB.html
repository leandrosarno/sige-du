<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Unidades - SIG EDU</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #f0f4f9; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; padding: 24px; color: #1f1f1f; }
        
        .admin-card {
            background: #ffffff; border: none; border-radius: 16px;
            padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            margin-bottom: 24px;
        }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .header-title { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; color: #0b57d0; margin: 0; }
        
        .btn-custom { border-radius: 50px; padding: 8px 20px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary-custom { background-color: #0b57d0; color: white; border: none; }
        .btn-primary-custom:hover { background-color: #0842a0; color: white; }
        .btn-outline-custom { border: 1px solid #747775; color: #444746; background: transparent; }
        .btn-outline-custom:hover { background-color: #f0f4f9; color: #1f1f1f; }

        .table-custom { margin-top: 10px; font-size: 14px; }
        .table-custom thead th { background-color: #f8f9fa; color: #444746; font-weight: 600; border-bottom: 2px solid #e3e3e3; padding: 12px; }
        .table-custom tbody td { padding: 12px; vertical-align: middle; border-bottom: 1px solid #f0f0f0; }
        .table-custom tbody tr:hover { background-color: #f8f9fa; }

        .img-thumbnail-ceu { width: 45px; height: 45px; object-fit: contain; border-radius: 8px; border: 1px solid #e3e3e3; background: #fff; padding: 2px; }

        .action-icon { cursor: pointer; color: #747775; transition: 0.2s; padding: 5px; border-radius: 50%; }
        .action-icon:hover { background-color: #e3e3e3; color: #1f1f1f; }
        .icon-edit:hover { color: #0b57d0; background-color: #e8f0fe; }
        .icon-delete:hover { color: #ba1a1a; background-color: #fce8e8; }

        /* Esconder botões na hora da impressão */
        @media print {
            .no-print, .btn-custom, .action-icon { display: none !important; }
            body { background-color: #fff; padding: 0; }
            .admin-card { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="container-fluid p-0 animate__animated animate__fadeIn">
        <div class="admin-card">
            <div class="header-actions">
                <h1 class="header-title">
                    <span class="material-symbols-outlined" style="font-size: 28px;">domain</span>
                    Gestão de Unidades (CEUs)
                </h1>
                <div class="no-print" style="display: flex; gap: 10px;">
                    <button class="btn-custom btn-outline-custom" onclick="window.imprimirLista()">
                        <span class="material-symbols-outlined" style="font-size: 18px;">print</span> Imprimir
                    </button>
                    <button class="btn-custom btn-primary-custom" onclick="window.abrirModalNovo()">
                        <span class="material-symbols-outlined" style="font-size: 18px;">add</span> Nova Unidade
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th style="width: 80px; text-align: center;">Logo</th>
                            <th style="width: 120px;">Código EOL</th>
                            <th>Nome da Unidade</th>
                            <th class="no-print" style="width: 100px; text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-unidades">
                        <tr><td colspan="4" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm me-2"></div>Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO/EDIÇÃO -->
    <div class="modal fade" id="modalUnidade" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <div class="modal-header" style="border-bottom: 1px solid #f0f0f0; padding: 20px 24px;">
                    <h5 class="modal-title" id="modalTitulo" style="font-weight: 600; color: #1f1f1f;">Cadastrar Unidade</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="padding: 24px;">
                    <form id="formUnidade">
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 13px; font-weight: 500; color: #444746;">Código EOL (ID) *</label>
                            <input type="text" class="form-control" id="txt-id" placeholder="Ex: 700039" required style="border-radius: 8px;">
                            <small class="text-muted" style="font-size: 11px;">O ID não pode ser alterado depois de salvo.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 13px; font-weight: 500; color: #444746;">Nome do CEU *</label>
                            <input type="text" class="form-control" id="txt-nome" placeholder="Ex: Caminho do Mar" required style="border-radius: 8px; text-transform: uppercase;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 13px; font-weight: 500; color: #444746;">URL do Logotipo</label>
                            <input type="url" class="form-control" id="txt-logo" placeholder="Cole o link da imagem (Drive, Imgur, etc)" style="border-radius: 8px;">
                        </div>
                    </form>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #f0f0f0; padding: 16px 24px;">
                    <button type="button" class="btn-custom btn-outline-custom" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-custom btn-primary-custom" onclick="window.salvarUnidade()">Salvar Unidade</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CONEXÃO COM FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let modalInstancia = null;
        let modoEdicao = false;

        window.onload = function() {
            modalInstancia = new bootstrap.Modal(document.getElementById('modalUnidade'));
            carregarTabela();
        };

        async function carregarTabela() {
            const tbody = document.getElementById('tabela-unidades');
            try {
                const querySnapshot = await getDocs(collection(db, "unidades"));
                let html = "";
                let lista = [];

                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    // O radar do Firebase para pegar o nome e ID seja como ele estiver cadastrado
                    const eol = dados.ID || dados.id_unidade || doc.id;
                    const nome = dados.nome_unidade || dados.nome || dados.nome_ceu || "SEM NOME";
                    const logo = dados.url_logo || dados.logo || "https://via.placeholder.com/150/f0f4f9/0b57d0?text=CEU";

                    lista.push({ eol, nome, logo });
                });

                // Ordena por nome em ordem alfabética
                lista.sort((a, b) => a.nome.localeCompare(b.nome));

                if(lista.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Nenhuma unidade cadastrada.</td></tr>`;
                    return;
                }

                lista.forEach(item => {
                    html += `
                        <tr>
                            <td class="text-center"><img src="${item.logo}" class="img-thumbnail-ceu" alt="Logo"></td>
                            <td><strong style="color: #0b57d0;">${item.eol}</strong></td>
                            <td style="font-weight: 500; color: #1f1f1f;">${item.nome.toUpperCase()}</td>
                            <td class="text-center no-print">
                                <span class="material-symbols-outlined action-icon icon-edit" onclick="window.abrirModalEditar('${item.eol}', '${item.nome.replace(/'/g, "\\'")}', '${item.logo}')" title="Editar">edit</span>
                                <span class="material-symbols-outlined action-icon icon-delete" onclick="window.confirmarExclusao('${item.eol}', '${item.nome.replace(/'/g, "\\'")}')" title="Excluir">delete</span>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Erro ao carregar os dados.</td></tr>`;
                console.error("Erro Firebase:", error);
            }
        }

        window.abrirModalNovo = function() {
            modoEdicao = false;
            document.getElementById('modalTitulo').innerText = "Cadastrar Nova Unidade";
            document.getElementById('txt-id').value = "";
            document.getElementById('txt-id').disabled = false;
            document.getElementById('txt-nome').value = "";
            document.getElementById('txt-logo').value = "";
            modalInstancia.show();
        };

        window.abrirModalEditar = function(eol, nome, logo) {
            modoEdicao = true;
            document.getElementById('modalTitulo').innerText = "Editar Unidade";
            document.getElementById('txt-id').value = eol;
            document.getElementById('txt-id').disabled = true; // O ID não pode mudar na edição
            document.getElementById('txt-nome').value = nome;
            
            // Se for o placeholder, limpa o campo
            document.getElementById('txt-logo').value = logo.includes("via.placeholder") ? "" : logo;
            
            modalInstancia.show();
        };

        window.salvarUnidade = async function() {
            const idDigitado = document.getElementById('txt-id').value.trim();
            const nomeDigitado = document.getElementById('txt-nome').value.trim().toUpperCase();
            const logoDigitado = document.getElementById('txt-logo').value.trim();

            if (!idDigitado || !nomeDigitado) {
                Swal.fire('Atenção', 'O Código EOL e o Nome são obrigatórios!', 'warning');
                return;
            }

            Swal.fire({ title: 'Salvando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

            try {
                // Salva na coleção "unidades", usando o ID digitado como nome do documento para facilitar
                const docRef = doc(db, "unidades", idDigitado);
                
                await setDoc(docRef, {
                    ID: idDigitado,
                    nome_unidade: nomeDigitado,
                    url_logo: logoDigitado
                }, { merge: true }); // Merge garante que não apague outros campos que possam existir

                modalInstancia.hide();
                Swal.fire('Sucesso!', 'A unidade foi salva com sucesso.', 'success');
                carregarTabela(); // Recarrega a tabela na hora
            } catch (error) {
                Swal.fire('Erro', 'Ocorreu um erro ao salvar: ' + error.message, 'error');
            }
        };

        window.confirmarExclusao = function(eol, nome) {
            Swal.fire({
                title: 'Tem certeza?',
                html: `Deseja realmente excluir a unidade <br><strong>${eol} - ${nome}</strong>?<br><br><span style="font-size:12px; color:#ba1a1a;">Esta ação não pode ser desfeita.</span>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ba1a1a',
                cancelButtonColor: '#747775',
                confirmButtonText: 'Sim, Excluir',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Excluindo...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
                    try {
                        await deleteDoc(doc(db, "unidades", eol));
                        Swal.fire('Excluído!', 'A unidade foi removida do banco de dados.', 'success');
                        carregarTabela();
                    } catch (error) {
                        Swal.fire('Erro', 'Não foi possível excluir: ' + error.message, 'error');
                    }
                }
            });
        };

        window.imprimirLista = function() {
            window.print();
        };
    </script>
</body>
</html>
