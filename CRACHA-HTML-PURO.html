<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Crachás V2 (Turbo HTML)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* =========================================
           TELA DE CONTROLE (Oculta na impressão)
           ========================================= */
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; padding: 20px; color: #2c3e50; }
        .card-main { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; text-align: center; }
        .btn-gerar { background: linear-gradient(135deg, #2980b9, #3498db); color: white; border: none; padding: 16px 20px; font-size: 18px; font-weight: 800; border-radius: 12px; width: 100%; transition: 0.3s; margin-bottom: 15px; }
        .btn-gerar:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(41, 128, 185, 0.4); color: white;}

        /* =========================================
           🖨️ CSS DE IMPRESSÃO (A MÁGICA DA FOLHA A4)
           ========================================= */
        #areaImpressao { display: none; }
        
        @media print {
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #areaFormulario { display: none !important; }
            #areaImpressao { display: block !important; }
            
            @page { size: A4 portrait; margin: 5mm; }

            .folha { page-break-after: always; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 5mm; }
            
            /* --- CRACHÁ DA CRIANÇA (8,5 x 6,0 cm) --- */
            .cracha-crianca { 
                width: 85mm; 
                height: 60mm; 
                border: 1px dashed #999; 
                border-radius: 4px; 
                box-sizing: border-box; 
                display: flex; 
                flex-direction: column; 
                background: #fff; 
                page-break-inside: avoid;
                overflow: hidden;
            }
            
            /* TOPO: 20mm DE ALTURA */
            .c-cabecalho { display: flex; height: 20mm; padding: 2mm; box-sizing: border-box; gap: 2mm; align-items: center; }
            .c-logo { width: 20mm; height: 20mm; object-fit: contain; }
            .c-textos-topo { display: flex; flex-direction: column; justify-content: center; }
            .c-ceu { font-size: 10px; font-weight: 900; margin: 0; line-height: 1.1; text-transform: uppercase;}
            .c-periodo { font-size: 8px; font-weight: bold; margin: 0; color: #333; margin-top: 1px;}
            
            /* NOME DA CRIANÇA E COR DA IDADE: 15mm DE ALTURA */
            .c-bloco-nome { 
                height: 15mm; 
                display: flex; 
                align-items: center; 
                justify-content: center; 
                text-align: center; 
                border-top: 1px solid #000; 
                border-bottom: 1px solid #000;
                padding: 0 2mm;
            }
            .c-nome { 
                font-size: 15px; 
                font-weight: 900; 
                margin: 0; 
                line-height: 1.1; 
                text-transform: uppercase;
                color: #000;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            
            /* MEIO: 20mm DE ALTURA (Dados, Ícones e Idade Gigante) */
            .c-meio { display: flex; height: 20mm; box-sizing: border-box; }
            .c-meio-esq { flex: 1; padding: 2mm; display: flex; flex-direction: column; justify-content: space-between; }
            
            .c-resp-tel { font-size: 8px; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #000;}
            
            .c-icones { display: flex; gap: 2mm; align-items: center;}
            .icon-box { width: 12mm; height: 12mm; display: flex; align-items: center; justify-content: center; }
            .icon-box img { max-width: 12mm; max-height: 12mm; object-fit: contain; }

            .c-meio-dir { 
                width: 25mm; 
                display: flex; 
                flex-direction: column; 
                align-items: center; 
                justify-content: center; 
                border-left: 1px solid #aaa; 
            }
            .c-label-idade { font-size: 8px; font-weight: bold; color: #444; margin: 0;}
            .c-idade-gigante { font-size: 35px; font-weight: 900; margin: 0; line-height: 1; color: #000;}

            /* FAIXA DO SOZINHO: 5mm DE ALTURA */
            .c-footer { height: 5mm; border-top: 1px solid #000; width: 100%; box-sizing: border-box; }

            /* --- CRACHÁ DO PAI (TAMANHO AJUSTADO) --- */
            .cracha-pai { width: 85mm; height: 50mm; border: 1px dashed #999; border-radius: 4px; padding: 3mm; box-sizing: border-box; display: flex; flex-direction: column; background: #fff; page-break-inside: avoid; justify-content: space-between;}
            .p-header { text-align: center; border-bottom: 1px solid #ccc; padding-bottom: 2mm; }
            .p-ceu { font-size: 11px; font-weight: 900; margin: 0; text-transform: uppercase; }
            .p-periodo { font-size: 8px; font-weight: bold; margin: 0; color: #444; }
            .p-titulo { font-size: 10px; font-weight: 900; margin: 2mm 0 0 0; text-decoration: underline;}
            
            .p-body { font-size: 9px; line-height: 1.4; }
            .p-destaque { font-weight: 900; font-size: 12px; text-transform: uppercase; color: #000;}
        }
    </style>
</head>
<body>

    <div id="areaFormulario" class="container">
        <div class="card-main mt-5">
            <h3 class="mb-3" style="color: #2980b9; font-weight: 900;"><i class="fas fa-bolt"></i> Crachás Turbo (V2)</h3>
            <p style="font-size: 14px; color: #7f8c8d; margin-bottom: 25px;">
                Criação em altíssima velocidade no formato 8,5x6,0cm perfeito para plásticos, usando renderização HTML.
            </p>

            <button id="btnGatilho" class="btn-gerar" onclick="iniciarGeracaoHTML()">
                <i class="fas fa-print me-2"></i> DESENHAR E IMPRIMIR CRACHÁS
            </button>
            <p style="font-size: 12px; color: #e74c3c; font-weight: bold; margin-top: 10px;">
                🚨 IMPORTANTE: Na tela da impressora, ative "Gráficos de Fundo" para imprimir as cores!
            </p>
        </div>
    </div>

    <!-- RENDENRIZAÇÃO INVISÍVEL -->
    <div id="areaImpressao"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec";
        
        // Link da Logo do CEU convertida
        const LOGO_CEU = "https://drive.google.com/thumbnail?id=1gWsCbNjlq0ZlK5NaAMao3MAU9lf7GX2d&sz=w400";

        async function iniciarGeracaoHTML() {
            const idPlanilha = localStorage.getItem('ceu_planilha_id');
            const nomeCeu = localStorage.getItem('ceu_nome_especifico') || "CEU";

            if (!idPlanilha) return Swal.fire('Erro', 'Banco de Dados não conectado!', 'error');

            const btn = document.getElementById('btnGatilho');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Extraindo dados...';
            btn.disabled = true;

            const pacote = { acao: "buscarDadosNovoCrachaHTML", dados: { idPlanilha: idPlanilha, nomeCeu: nomeCeu } };

            try {
                const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
                const res = await resRaw.json();
                let r = res.dados || res;

                btn.innerHTML = '<i class="fas fa-print me-2"></i> DESENHAR E IMPRIMIR CRACHÁS';
                btn.disabled = false;

                if (r.sucesso === true || res.status === "sucesso") {
                    montarHTMLImpressao(r.fila, r.regras, r.nomeCeu);
                } else {
                    Swal.fire('Aviso', r.erro || res.mensagem || 'Erro desconhecido', 'error');
                }
            } catch (e) {
                btn.innerHTML = '<i class="fas fa-print me-2"></i> DESENHAR E IMPRIMIR CRACHÁS';
                btn.disabled = false;
                Swal.fire('Erro de Conexão', 'Não foi possível comunicar com o servidor.', 'error');
            }
        }

        function montarHTMLImpressao(fila, regras, nomeCeu) {
            let htmlHTML = "";

            // 1. CRIANÇAS
            const paginasCriancas = Math.ceil(fila.length / 8);
            for (let p = 0; p < paginasCriancas; p++) {
                htmlHTML += `<div class="folha">`;
                for (let c = 0; c < 8; c++) {
                    let index = (p * 8) + c;
                    if (index >= fila.length) break;
                    let aluno = fila[index];

                    let imgDieta = aluno.dieta ? regras.dieta.sim : regras.dieta.nao;
                    let imgFoto  = aluno.restImg ? regras.img.sim : regras.img.nao;
                    let imgInc   = aluno.inclusao ? regras.inclusao.sim : regras.inclusao.nao;
                    let imgPisc  = aluno.piscina ? regras.piscina.sim : regras.piscina.nao;
                    
                    let bgSozinho = aluno.sozinho ? regras.sozinho.simCor : regras.sozinho.naoCor;

                    htmlHTML += `
                    <div class="cracha-crianca">
                        <div class="c-cabecalho">
                            <img src="${LOGO_CEU}" class="c-logo" alt="Logo">
                            <div class="c-textos-topo">
                                <p class="c-ceu">${nomeCeu}</p>
                                <p class="c-periodo">${regras.periodo}</p>
                            </div>
                        </div>
                        
                        <div class="c-bloco-nome" style="background-color: ${aluno.corIdade};">
                            <p class="c-nome">${aluno.nome}</p>
                        </div>
                        
                        <div class="c-meio">
                            <div class="c-meio-esq">
                                <p class="c-resp-tel">RESP: ${aluno.resp} | TEL: ${aluno.tel}</p>
                                <div class="c-icones">
                                    ${imgDieta ? `<div class="icon-box"><img src="${imgDieta}"></div>` : ''}
                                    ${imgFoto ? `<div class="icon-box"><img src="${imgFoto}"></div>` : ''}
                                    ${imgInc ? `<div class="icon-box"><img src="${imgInc}"></div>` : ''}
                                    ${imgPisc ? `<div class="icon-box"><img src="${imgPisc}"></div>` : ''}
                                </div>
                            </div>
                            <div class="c-meio-dir">
                                <p class="c-label-idade">IDADE</p>
                                <p class="c-idade-gigante">${aluno.idade}</p>
                            </div>
                        </div>

                        <div class="c-footer" style="background-color: ${bgSozinho};"></div>
                    </div>`;
                }
                htmlHTML += `</div>`;
            }

            // 2. PAIS (Não mudamos muito, apenas adaptamos para caber 10 na página)
            const paginasPais = Math.ceil(fila.length / 10);
            for (let p = 0; p < paginasPais; p++) {
                htmlHTML += `<div class="folha">`;
                for (let c = 0; c < 10; c++) {
                    let index = (p * 10) + c;
                    if (index >= fila.length) break;
                    let aluno = fila[index];

                    htmlHTML += `
                    <div class="cracha-pai">
                        <div class="p-header">
                            <p class="p-ceu">${nomeCeu}</p>
                            <p class="p-periodo">${regras.periodo}</p>
                            <p class="p-titulo">CRACHÁ DO RESPONSÁVEL</p>
                        </div>
                        <div class="p-body">
                            <div>CRIANÇA:<br><span class="p-destaque">${aluno.nome}</span></div>
                            <div style="margin-top:2mm; display:flex; justify-content: space-between;">
                                <span>RESPONSÁVEL:<br><span class="p-destaque">${aluno.resp}</span></span>
                                <span style="text-align: right;">IDADE:<br><span class="p-destaque">${aluno.idade}</span></span>
                            </div>
                        </div>
                    </div>`;
                }
                htmlHTML += `</div>`;
            }

            document.getElementById("areaImpressao").innerHTML = htmlHTML;
            setTimeout(() => {
                window.print();
                setTimeout(() => { document.getElementById("areaImpressao").innerHTML = ""; }, 1000);
            }, 500);
        }
    </script>
</body>
</html>
