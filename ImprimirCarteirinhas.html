<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Impressão: Carteirinhas e Envelopes</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <script src="config.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e2e8f0; margin: 0; padding: 20px; }
        
        .painel-controle { text-align: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-imprimir { background: #0d6efd; color: white; border: none; padding: 12px 25px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin: 5px; }
        .btn-imprimir:hover { background: #0b5ed7; transform: translateY(-2px); }
        
        /* 🌟 NOVO ESTILO DO BOTÃO DE 2ª VIA */
        .btn-2via { background: #64748b; }
        .btn-2via:hover { background: #475569; }

        .status-loading { font-size: 18px; color: #64748b; font-weight: bold; }

        .container-folha { display: flex; flex-wrap: wrap; gap: 0; justify-content: center; }
        
        /* Quebra de página forçada entre as Carteirinhas e os Envelopes */
        .quebra-pagina { width: 100%; height: 0; page-break-before: always; border: none; margin: 0; padding: 0; }

        /* =========================================
           🪪 ESTILO DA CARTEIRINHA   .
           ========================================= */
        .carteirinha {
            width: 10.5cm;
            height: 6.0cm;
            background: white;
            border: 2px solid #000;
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
            padding: 0.2cm;
            margin-bottom: 0.5cm;
            margin-right: 0.5cm;
            overflow: hidden;
            page-break-inside: avoid;
        }
        .topo { display: flex; width: calc(100% - 3.2cm); }
        .logo-pref { width: 2.0cm; height: 2.0cm; object-fit: contain; margin-right: 0.2cm; }
        .info-ceu { flex: 1; padding-top: 0.1cm; }
        .nome-ceu { font-size: 11px; font-weight: 900; color: #000; margin: 0; line-height: 1.1; text-transform: uppercase; }
        .endereco-ceu { font-size: 7px; font-weight: bold; color: #333; margin-top: 3px; line-height: 1.2; text-transform: uppercase;}
        
        .foto-aluno-cart {
            position: absolute;
            top: 0.2cm;
            right: 0.2cm;
            width: 3.0cm;
            height: 4.0cm;
            border: 1px solid #333;
            object-fit: cover;
            border-radius: 4px;
            background-color: #f1f5f9;
        }
        .dados-meio { display: flex; margin-top: 0.2cm; width: calc(100% - 3.2cm); gap: 0.1cm; }
        .bloco-dado { border: 1px solid #000; padding: 2px 4px; border-radius: 4px; flex: 1; text-align: center; }
        .titulo-dado { font-size: 6px; font-weight: 900; color: #333; display: block; text-transform: uppercase; }
        .valor-dado { font-size: 9px; font-weight: 900; color: #000; display: block; margin-top: 1px; }
        .bloco-duplo { flex: 1.5; display: flex; flex-direction: column; gap: 0.05cm; }
        .sub-bloco { border: 1px solid #000; padding: 1px 4px; border-radius: 4px; text-align: center; }
        
        /* 🏷️ SELO USO GERAL */
        .selo-projeto {
            position: absolute;
            bottom: 1.1cm;
            left: 0.2cm;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
            background: #f1f5f9; 
            color: #475569; 
            border: 1px solid #e2e8f0;
        }

        .nome-aluno-cart {
            position: absolute;
            bottom: 0.2cm;
            left: 0.2cm;
            width: calc(100% - 0.4cm);
            text-align: center;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            background: #f1f5f9;
            padding: 3px 0;
            border-radius: 4px;
            border: 1px solid #000;
            white-space: nowrap;
            overflow: hidden;
        }

        /* =========================================
           ✉️ ESTILO DA ETIQUETA DE ENVELOPE
           ========================================= */
        .etiqueta-envelope {
            width: 10.5cm;
            height: 6.0cm;
            background: white;
            border: 2px solid #000;
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
            padding: 0.4cm;
            margin-bottom: 0.5cm;
            margin-right: 0.5cm;
            page-break-inside: avoid;
        }
        .et-topo { display: flex; justify-content: space-between; border-bottom: 2px solid #ccc; padding-bottom: 0.2cm; margin-bottom: 0.2cm; align-items: flex-end; }
        .et-titulo { font-size: 10px; font-weight: 900; color: #64748b; margin: 0; text-transform: uppercase; }
        
        .et-sub { font-size: 20px; font-weight: 900; color: #000; margin: 0; }
        .et-destaque-prontuario { font-size: 45px; font-weight: 900; color: #000; margin: 0; line-height: 1; }

        .et-corpo { display: flex; gap: 0.3cm; }
        .et-dados { flex: 1; display: flex; flex-direction: column; gap: 0.15cm; }
        .et-campo { background: #f8fafc; padding: 4px; border-radius: 4px; border: 1px solid #e2e8f0; }
        .et-label { font-size: 8px; font-weight: bold; color: #64748b; display: block; text-transform: uppercase; }
        .et-valor { font-size: 11px; font-weight: 900; color: #000; display: block; }
        .et-nome { background: #e0e7ff; border-color: #c7d2fe; padding: 6px; }
        .et-valor-nome { font-size: 13px; font-weight: 900; color: #1e3a8a; }
        .foto-aluno-env { width: 2.8cm; height: 3.8cm; border: 2px solid #333; object-fit: cover; border-radius: 4px; background-color: #f1f5f9; }

        /* =========================================
           🖨️ CONFIGURAÇÕES DE IMPRESSÃO
           ========================================= */
        @media print {
            @page { margin: 0.5cm; size: A4 portrait; }
            body { background: white; padding: 0; }
            .painel-controle { display: none !important; }
            .container-folha { gap: 0; justify-content: center; }
            .carteirinha, .etiqueta-envelope { 
                margin: 0.1cm; 
                width: 9.6cm; 
                border: 2px solid #000; 
                page-break-inside: avoid;
            }
            .quebra-pagina { page-break-before: always !important; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="painel-controle">
        <h2 id="msg-status" class="status-loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Linha de Montagem: Carteirinhas + Envelopes...</h2>
        
        <!-- 🌟 OS DOIS BOTÕES DE IMPRESSÃO AQUI -->
        <button id="btn-print" class="btn-imprimir" style="display:none;" onclick="acionarImpressao()"><i class="fa-solid fa-print"></i> Imprimir Kit Completo</button>
        <button id="btn-print-2via" class="btn-imprimir btn-2via" style="display:none;" onclick="imprimirSegundaVia()"><i class="fa-solid fa-id-card"></i> Imprimir 2ª Via (Sem Etiqueta)</button>
    </div>

    <div id="area-geral"></div>

    <script>
       /* const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec"; */
        const idPlanilhaCeu = localStorage.getItem('ceu_planilha_id');

        window.onload = function() {
            if(!idPlanilhaCeu) {
                document.getElementById('msg-status').innerHTML = "Erro: Banco de dados não conectado.";
                return;
            }
            buscarDados();
        };

        async function buscarDados() {
            try {
                const pacote = {
                    acao: "buscarDadosImpressaoHTML",
                    dados: { idPlanilha: idPlanilhaCeu, tipo: "GERAL" } 
                };

                const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
                const res = await resRaw.json();

                if (res.status === "sucesso") {
                    montarHTML(res);
                } else {
                    document.getElementById('msg-status').innerHTML = "<i class='fa-solid fa-circle-exclamation text-danger'></i> " + res.mensagem;
                }
            } catch (e) {
                document.getElementById('msg-status').innerHTML = "Erro ao comunicar com o servidor.";
            }
        }

        function abreviarNome(nomeCompleto) {
            let partes = String(nomeCompleto).trim().split(" ");
            if (partes.length <= 2) return nomeCompleto; 
            let nomeFinal = partes[0] + " ";
            for (let i = 1; i < partes.length - 1; i++) {
                if (partes[i].length > 3) nomeFinal += partes[i][0] + ". ";
                else nomeFinal += partes[i] + " ";
            }
            nomeFinal += partes[partes.length - 1]; 
            return nomeFinal;
        }

        function montarHTML(dadosGerais) {
            const area = document.getElementById('area-geral');
            const semFotoPlaceholder = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

            let htmlCarteirinhas = "<div class='container-folha'>";
            
            // 🌟 COLOCAMOS UM ID NA CAIXA DOS ENVELOPES PARA O ROBÔ ACHAR!
            let htmlEnvelopes = "<div id='bloco-envelopes' class='container-folha'>";

            dadosGerais.alunos.forEach(al => {
                let fotoPronta = al.foto && al.foto.includes('http') ? al.foto : semFotoPlaceholder;
                let nomeAbreviado = abreviarNome(al.nome);

                // 1. MONTA A CARTEIRINHA
                htmlCarteirinhas += `
                <div class="carteirinha">
                    <div class="topo">
                        <img src="${dadosGerais.logo}" class="logo-pref" onerror="this.src='${semFotoPlaceholder}'">
                        <div class="info-ceu">
                            <p class="nome-ceu">${dadosGerais.ceu.nome}</p>
                            <p class="endereco-ceu">${dadosGerais.ceu.endereco}<br>${dadosGerais.ceu.telefone}</p>
                            <p class="endereco-ceu" style="margin-top:2px;"><b>OBRIGATÓRIO APRESENTAÇÃO.</b></p>
                        </div>
                    </div>
                    <div class="dados-meio">
                        <div class="bloco-dado">
                            <span class="titulo-dado">CARTEIRINHA</span>
                            <span class="valor-dado" style="font-size: 20px;">${al.carteirinha}</span>
                        </div>
                        <div class="bloco-dado">
                            <span class="titulo-dado">CÓD EOL</span>
                            <span class="valor-dado" style="font-size: 20px;">${al.eol}</span> 
                        </div>
                        <div class="bloco-duplo">
                            <div class="sub-bloco">
                                <span class="titulo-dado">NASCIMENTO</span>
                                <span class="valor-dado">${al.nascimento}</span>
                            </div>
                            <div class="sub-bloco">
                                <span class="titulo-dado">TELEFONE</span>
                                <span class="valor-dado">${al.telefone}</span>
                            </div>
                        </div>
                    </div>
                    <img src="${fotoPronta}" class="foto-aluno-cart" onerror="this.src='${semFotoPlaceholder}'">
                    <div class="selo-projeto selo-geral"><i class="fa-solid fa-id-card"></i> USO GERAL</div>
                    <div class="nome-aluno-cart">${nomeAbreviado}</div>
                </div>`;

                // 2. MONTA A ETIQUETA DO ENVELOPE
                htmlEnvelopes += `
                <div class="etiqueta-envelope">
                    <div class="et-topo">
                        <div>
                            <p class="et-titulo">Cód. EOL</p>
                            <p class="et-sub">${al.eol}</p>
                        </div>
                        <div style="text-align: right;">
                            <p class="et-destaque-prontuario">${al.carteirinha}</p>
                        </div>
                    </div>
                    <div class="et-corpo">
                        <div class="et-dados">
                            <div class="et-campo et-nome">
                                <span class="et-label">Nome do Aluno</span>
                                <span class="et-valor-nome">${al.nome}</span>
                            </div>
                            <div style="display: flex; gap: 0.1cm;">
                                <div class="et-campo" style="flex: 1;">
                                    <span class="et-label">Nascimento</span>
                                    <span class="et-valor">${al.nascimento}</span>
                                </div>
                                <div class="et-campo" style="flex: 1;">
                                    <span class="et-label">Telefone</span>
                                    <span class="et-valor">${al.telefone}</span>
                                </div>
                            </div>
                            <div class="et-campo">
                                <span class="et-label">Unidade</span>
                                <span class="et-valor" style="font-size: 8px;">${dadosGerais.ceu.nome}</span>
                            </div>
                        </div>
                        <img src="${fotoPronta}" class="foto-aluno-env" onerror="this.src='${semFotoPlaceholder}'">
                    </div>
                </div>`;
            });

            htmlCarteirinhas += "</div>";
            htmlEnvelopes += "</div>";

            // 🌟 INJETA TUDO NA TELA (com ID na quebra de página também)
            area.innerHTML = htmlCarteirinhas + "<div id='quebra-envelopes' class='quebra-pagina'></div>" + htmlEnvelopes;
            
            document.getElementById('msg-status').innerHTML = `✅ Pronto! ${dadosGerais.alunos.length} registros prontos para impressão.`;
            
            // Exibe os DOIS botões
            document.getElementById('btn-print').style.display = "inline-block";
            document.getElementById('btn-print-2via').style.display = "inline-block";
            
            // 🛑 REMOVIDO: O comando que imprimia tudo automaticamente para o funcionário poder escolher!
            // acionarImpressao();
        }

        // ========================================================
        // 🚀 O ROTEIRO DE IMPRESSÃO (KIT COMPLETO)
        // ========================================================
        function acionarImpressao() {
            setTimeout(() => {
                window.print(); 
                setTimeout(perguntarLimpeza, 1000); 
            }, 500);
        }

        // ========================================================
        // ✂️ O NOVO ROTEIRO DE IMPRESSÃO (APENAS 2ª VIA)
        // ========================================================
        function imprimirSegundaVia() {
            // 1. Esconde a parte dos envelopes e a quebra de página
            document.getElementById('bloco-envelopes').style.display = 'none';
            document.getElementById('quebra-envelopes').style.display = 'none';

            // 2. Aciona a impressora só com as carteirinhas
            setTimeout(() => {
                window.print();
                
                // 3. Volta a tela ao normal depois que fechar a janela de impressão
                setTimeout(() => {
                    document.getElementById('bloco-envelopes').style.display = 'flex';
                    document.getElementById('quebra-envelopes').style.display = 'block';
                    perguntarLimpeza();
                }, 1000);
            }, 500);
        }

        function perguntarLimpeza() {
            Swal.fire({
                title: '🖨️ Impressão Concluída?',
                text: 'As carteirinhas foram impressas corretamente?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#ef4444',
                confirmButtonText: '👍 SIM, limpar a fila!',
                cancelButtonText: '👎 NÃO, manter na fila',
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    processarLimpezaFila();
                }
            });
        }

        async function processarLimpezaFila() {
            Swal.fire({ title: 'Limpando fila...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const pacote = {
                    acao: "limparFilaImpressao",
                    dados: { idPlanilha: idPlanilhaCeu, tipo: "GERAL" }
                };

                const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
                const res = await resRaw.json();

                if (res.status === "sucesso") {
                    Swal.fire('Elegante!', 'A fila de Carteirinhas foi limpa com sucesso.', 'success').then(() => {
                        if(window.parent && typeof window.parent.atualizarContadoresImpressao === 'function') {
                            window.parent.atualizarContadoresImpressao();
                        }
                        document.getElementById('area-geral').innerHTML = "";
                        document.getElementById('msg-status').innerHTML = "Fila limpa. Aguardando novos alunos.";
                        document.getElementById('btn-print').style.display = "none";
                        document.getElementById('btn-print-2via').style.display = "none"; // Esconde o botão cinza
                    });
                } else {
                    Swal.fire('Aviso', res.mensagem, 'warning');
                }
            } catch (e) {
                Swal.fire('Erro', 'Falha na conexão ao tentar limpar a fila.', 'error');
            }
        }
    </script>
</body>
</html>

        .et-valor-nome { font-size: 13px; font-weight: 900; color: #1e3a8a; }
        .foto-aluno-env { width: 2.8cm; height: 3.8cm; border: 2px solid #333; object-fit: cover; border-radius: 4px; background-color: #f1f5f9; }

        /* =========================================
           🖨️ CONFIGURAÇÕES DE IMPRESSÃO
           ========================================= */
        @media print {
            @page { margin: 0.5cm; size: A4 portrait; }
            body { background: white; padding: 0; }
            .painel-controle { display: none !important; }
            .container-folha { gap: 0; justify-content: center; }
            .carteirinha, .etiqueta-envelope { 
                margin: 0.1cm; 
                width: 9.6cm; 
                border: 2px solid #000; 
                page-break-inside: avoid;
            }
            .quebra-pagina { page-break-before: always !important; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="painel-controle">
        <h2 id="msg-status" class="status-loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Linha de Montagem: Carteirinhas + Envelopes...</h2>
        <button id="btn-print" class="btn-imprimir" style="display:none;" onclick="acionarImpressao()"><i class="fa-solid fa-print"></i> Iniciar Impressão</button>
    </div>

    <div id="area-geral"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec";
        const idPlanilhaCeu = localStorage.getItem('ceu_planilha_id');

        window.onload = function() {
            if(!idPlanilhaCeu) {
                document.getElementById('msg-status').innerHTML = "Erro: Banco de dados não conectado.";
                return;
            }
            buscarDados();
        };

        async function buscarDados() {
            try {
                const pacote = {
                    acao: "buscarDadosImpressaoHTML",
                    dados: { idPlanilha: idPlanilhaCeu, tipo: "GERAL" } 
                };

                const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
                const res = await resRaw.json();

                if (res.status === "sucesso") {
                    montarHTML(res);
                } else {
                    document.getElementById('msg-status').innerHTML = "<i class='fa-solid fa-circle-exclamation text-danger'></i> " + res.mensagem;
                }
            } catch (e) {
                document.getElementById('msg-status').innerHTML = "Erro ao comunicar com o servidor.";
            }
        }

        function abreviarNome(nomeCompleto) {
            let partes = String(nomeCompleto).trim().split(" ");
            if (partes.length <= 2) return nomeCompleto; 
            let nomeFinal = partes[0] + " ";
            for (let i = 1; i < partes.length - 1; i++) {
                if (partes[i].length > 3) nomeFinal += partes[i][0] + ". ";
                else nomeFinal += partes[i] + " ";
            }
            nomeFinal += partes[partes.length - 1]; 
            return nomeFinal;
        }

        function montarHTML(dadosGerais) {
            const area = document.getElementById('area-geral');
            const semFotoPlaceholder = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";

            let htmlCarteirinhas = "<div class='container-folha'>";
            let htmlEnvelopes = "<div class='container-folha'>";

            dadosGerais.alunos.forEach(al => {
                let fotoPronta = al.foto && al.foto.includes('http') ? al.foto : semFotoPlaceholder;
                let nomeAbreviado = abreviarNome(al.nome);

                // 1. MONTA A CARTEIRINHA
                htmlCarteirinhas += `
                <div class="carteirinha">
                    <div class="topo">
                        <img src="${dadosGerais.logo}" class="logo-pref" onerror="this.src='${semFotoPlaceholder}'">
                        <div class="info-ceu">
                            <p class="nome-ceu">${dadosGerais.ceu.nome}</p>
                            <p class="endereco-ceu">${dadosGerais.ceu.endereco}<br>${dadosGerais.ceu.telefone}</p>
                            <p class="endereco-ceu" style="margin-top:2px;"><b>OBRIGATÓRIO APRESENTAÇÃO.</b></p>
                        </div>
                    </div>
                    <div class="dados-meio">
                        <div class="bloco-dado">
                            <span class="titulo-dado">CARTEIRINHA</span>
                            <span class="valor-dado" style="font-size: 20px;">${al.carteirinha}</span>
                        </div>
                        <div class="bloco-dado">
                            <span class="titulo-dado">CÓD EOL</span>
                            <span class="valor-dado" style="font-size: 20px;">${al.eol}</span> 
                        </div>
                        <div class="bloco-duplo">
                            <div class="sub-bloco">
                                <span class="titulo-dado">NASCIMENTO</span>
                                <span class="valor-dado">${al.nascimento}</span>
                            </div>
                            <div class="sub-bloco">
                                <span class="titulo-dado">TELEFONE</span>
                                <span class="valor-dado">${al.telefone}</span>
                            </div>
                        </div>
                    </div>
                    <img src="${fotoPronta}" class="foto-aluno-cart" onerror="this.src='${semFotoPlaceholder}'">
                    <div class="selo-projeto selo-geral"><i class="fa-solid fa-id-card"></i> USO GERAL</div>
                    <div class="nome-aluno-cart">${nomeAbreviado}</div>
                </div>`;

                // 2. MONTA A ETIQUETA DO ENVELOPE (COM O PRONTUÁRIO GIGANTE NA DIREITA)
                htmlEnvelopes += `
                <div class="etiqueta-envelope">
                    <div class="et-topo">
                        <!-- Cód EOL na esquerda -->
<!--                        <div>
                            <p class="et-titulo">Cód. EOL</p>
                            <p class="et-sub">${al.eol}</p>
                        </div>
                        <!-- Prontuário na direita e GIGANTE -->
<!--                        <div style="text-align: right;">
                           <!-- <p class="et-titulo">Prontuário</p> -->
<!--                            <p class="et-destaque-prontuario">${al.carteirinha}</p>
                        </div>
                    </div>
                    <div class="et-corpo">
                        <div class="et-dados">
                            <div class="et-campo et-nome">
                                <span class="et-label">Nome do Aluno</span>
                                <span class="et-valor-nome">${al.nome}</span>
                            </div>
                            <div style="display: flex; gap: 0.1cm;">
                                <div class="et-campo" style="flex: 1;">
                                    <span class="et-label">Nascimento</span>
                                    <span class="et-valor">${al.nascimento}</span>
                                </div>
                                <div class="et-campo" style="flex: 1;">
                                    <span class="et-label">Telefone</span>
                                    <span class="et-valor">${al.telefone}</span>
                                </div>
                            </div>
                            <div class="et-campo">
                                <span class="et-label">Unidade</span>
                                <span class="et-valor" style="font-size: 8px;">${dadosGerais.ceu.nome}</span>
                            </div>
                        </div>
                        <img src="${fotoPronta}" class="foto-aluno-env" onerror="this.src='${semFotoPlaceholder}'">
                    </div>
                </div>`;
            });

            htmlCarteirinhas += "</div>";
            htmlEnvelopes += "</div>";

            // INJETA TUDO NA TELA COM UMA QUEBRA DE PÁGINA NO MEIO
            area.innerHTML = htmlCarteirinhas + "<div class='quebra-pagina'></div>" + htmlEnvelopes;
            
            document.getElementById('msg-status').innerHTML = `✅ Pronto! ${dadosGerais.alunos.length} Carteirinhas e Envelopes gerados!`;
            document.getElementById('btn-print').style.display = "inline-block";
            
            acionarImpressao();
        }

        // ========================================================
        // 🚀 O ROTEIRO DE IMPRESSÃO E LIMPEZA
        // ========================================================
        function acionarImpressao() {
            setTimeout(() => {
                window.print(); 
                setTimeout(perguntarLimpeza, 1000); 
            }, 500);
        }

        function perguntarLimpeza() {
            Swal.fire({
                title: '🖨️ Impressão Concluída?',
                text: 'As carteirinhas e os envelopes foram impressos corretamente?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#ef4444',
                confirmButtonText: '👍 SIM, limpar a fila!',
                cancelButtonText: '👎 NÃO, manter na fila',
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    processarLimpezaFila();
                }
            });
        }

        async function processarLimpezaFila() {
            Swal.fire({ title: 'Limpando fila...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

            try {
                const pacote = {
                    acao: "limparFilaImpressao",
                    dados: { idPlanilha: idPlanilhaCeu, tipo: "GERAL" }
                };

                const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
                const res = await resRaw.json();

                if (res.status === "sucesso") {
                    Swal.fire('Elegante!', 'A fila de Carteirinhas de Uso Geral e Envelopes foi limpa com sucesso.', 'success').then(() => {
                        if(window.parent && typeof window.parent.atualizarContadoresImpressao === 'function') {
                            window.parent.atualizarContadoresImpressao();
                        }
                        document.getElementById('area-geral').innerHTML = "";
                        document.getElementById('msg-status').innerHTML = "Fila limpa. Aguardando novos alunos.";
                        document.getElementById('btn-print').style.display = "none";
                    });
                } else {
                    Swal.fire('Aviso', res.mensagem, 'warning');
                }
            } catch (e) {
                Swal.fire('Erro', 'Falha na conexão ao tentar limpar a fila.', 'error');
            }
        }
    </script>
</body>
</html>
