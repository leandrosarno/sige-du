<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-header { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; border-radius: 8px 8px 0 0 !important; }
    .table-hover tbody tr:hover { background-color: #e8f0fe; }
  </style>
</head>
<body class="p-3">

  <div class="container-fluid">
    <div class="card shadow-sm border-0">
      <div class="card-header p-3 d-flex justify-content-between align-items-center">
        <h5 class="m-0"><i class="fa-solid fa-child-reaching me-2"></i>Edição Rápida - Crachás e Regras</h5>
        <button class="btn btn-light btn-sm fw-bold" onclick="carregarLista()"><i class="fa-solid fa-rotate me-1"></i> Atualizar</button>
      </div>
      
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="inputBusca" class="form-control" placeholder="Buscar por Nome, Responsável ou Turma..." onkeyup="filtrarTabela()">
            </div>
          </div>
          <div class="col-md-6 text-end">
            <span class="badge bg-secondary p-2" id="totalRegistros">Total: 0 crianças</span>
          </div>
        </div>

        <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
          <table class="table table-hover table-striped align-middle border" id="tabelaLista">
            <thead class="table-dark sticky-top">
              <tr>
                <th>Nome da Criança</th>
                <th>Idade / Turma</th>
                <th>Responsável / Tel</th>
                <th class="text-center">Imprimir Crachá?</th>
                <th class="text-center">Indicadores</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="corpoTabela">
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalEdicao" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fa-solid fa-user-pen me-2"></i>Editar Regras da Criança</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formEdicao">
            <input type="hidden" id="editLinha">
            
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label fw-bold text-muted small mb-1">Nome da Criança</label>
                <input type="text" id="editNome" class="form-control fw-bold" required>
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold text-muted small mb-1">Idade</label>
                <input type="number" id="editIdade" class="form-control text-center" required>
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold text-muted small mb-1">Turma</label>
                <input type="text" id="editTurma" class="form-control text-center text-primary fw-bold">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small mb-1">Responsável</label>
                <input type="text" id="editResp" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small mb-1">Telefone</label>
                <input type="text" id="editTel" class="form-control">
              </div>

              <div class="col-12"><hr class="my-2"></div>
              
              <div class="col-md-4">
                <label class="form-label fw-bold text-primary small mb-1">🪪 Imprimir Crachá?</label>
                <select id="editImprimir" class="form-select border-primary fw-bold text-primary">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">🚶 Vai Desacompanhado?</label>
                <select id="editSozinho" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">🥗 Dieta Especial?</label>
                <select id="editDieta" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">♿ Inclusão?</label>
                <select id="editInclusao" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">🏊 Uso da Piscina?</label>
                <select id="editPiscina" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">📸 Restrição Imagem?</label>
                <select id="editRestImg" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary fw-bold" id="btnSalvar" onclick="salvarAlteracao()"><i class="fa-solid fa-floppy-disk me-1"></i> Salvar na Planilha</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
/*    const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec";   */
    let listaCriancasGlobal = [];
    let modalEdicaoBS;
    
    window.onload = function() {
      modalEdicaoBS = new bootstrap.Modal(document.getElementById('modalEdicao'));
      carregarLista();
    };

    // 🚀 ENGINE VIA FETCH IGUAL A TELA RECREIO
    async function carregarLista() {
      const idPlanilha = localStorage.getItem('ceu_planilha_id');
      if (!idPlanilha) {
         document.getElementById('corpoTabela').innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">⚠️ Planilha do CEU não conectada!</td></tr>';
         return;
      }

      document.getElementById('corpoTabela').innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">Carregando banco de dados...</p></td></tr>';
      
      const pacote = { acao: "carregarCriancasRF", dados: { idPlanilha: idPlanilha } };

      try {
          const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
          const res = await resRaw.json();

          if (res.sucesso) {
              listaCriancasGlobal = res.criancas || [];
              montarCorpoTabela(listaCriancasGlobal);
          } else {
              Swal.fire('Erro', res.erro, 'error');
              document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-3">${res.erro}</td></tr>`;
          }
      } catch (e) {
          Swal.fire('Erro', 'Falha na conexão com o servidor Google.', 'error');
          document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-3">Falha de conexão.</td></tr>`;
      }
    }

    function montarCorpoTabela(lista) {
      const tbody = document.getElementById('corpoTabela');
      tbody.innerHTML = '';
      document.getElementById('totalRegistros').innerText = `Total: ${lista.length} crianças`;

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Nenhuma criança encontrada no Banco de Dados.</td></tr>';
        return;
      }

      lista.forEach(c => {
        let btnImpClass = c.imprimir === 'SIM' ? 'btn-success' : 'btn-outline-danger';
        let btnImpText = c.imprimir === 'SIM' ? '🪪 SIM' : 'NÃO';
        
        let linhaHTML = `
          <tr>
              <td class="fw-bold text-dark">${c.nome}</td>
              <td>
                <div class="fw-bold text-primary">${c.turma || '-'}</div>
                <small class="text-muted">${c.idade} anos</small>
              </td>
              <td>
                <div class="fw-bold">${c.resp}</div>
                <small class="text-muted"><i class="fa-solid fa-phone me-1"></i>${c.tel}</small>
              </td>
              <td class="text-center">
                <button class="btn btn-sm ${btnImpClass} fw-bold" onclick="alternarImprimir(${c.linha}, '${c.imprimir}')" style="width: 80px;">${btnImpText}</button>
              </td>
              <td class="text-center">
                ${c.dieta === 'SIM' ? '<span class="badge bg-warning text-dark me-1" title="Dieta Especial">🥗</span>' : ''}
                ${c.sozinho === 'SIM' ? '<span class="badge bg-info text-dark me-1" title="Vai Desacompanhado">🚶</span>' : ''}
                ${c.inclusao === 'SIM' ? '<span class="badge bg-primary me-1" title="Inclusão">♿</span>' : ''}
                ${c.piscina === 'SIM' ? '<span class="badge bg-success me-1" title="Piscina">🏊</span>' : ''}
                ${c.restImg === 'SIM' ? '<span class="badge bg-dark me-1" title="Restrição de Imagem">📸</span>' : ''}
              </td>
              <td class="text-center">
                <button class="btn btn-light btn-sm fw-bold border" onclick="abrirModal(${c.linha})">
                  <i class="fa-solid fa-pen text-primary"></i> Editar
                </button>
              </td>
          </tr>
        `;
        tbody.innerHTML += linhaHTML;
      });
    }

    function filtrarTabela() {
      let termo = document.getElementById('inputBusca').value.toUpperCase();
      let filtrados = listaCriancasGlobal.filter(c => 
        c.nome.includes(termo) || c.resp.includes(termo) || c.turma.includes(termo)
      );
      montarCorpoTabela(filtrados);
    }

    async function alternarImprimir(linha, statusAtual) {
      let novoStatus = statusAtual === 'SIM' ? 'NÃO' : 'SIM';
      
      Swal.fire({ title: 'Alerando...', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });

      const pacote = { 
          acao: "alternarStatusImprimirRF", 
          dados: { idPlanilha: localStorage.getItem('ceu_planilha_id'), linha: linha, novoStatus: novoStatus } 
      };

      try {
          const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
          const res = await resRaw.json();
          if (res.sucesso) carregarLista();
      } catch (e) {
          Swal.fire('Erro', 'Não foi possível alterar o status.', 'error');
      }
    }

    function abrirModal(linha) {
      let c = listaCriancasGlobal.find(item => item.linha === linha);
      if (!c) return;

      document.getElementById('editLinha').value = c.linha;
      document.getElementById('editNome').value = c.nome;
      document.getElementById('editIdade').value = c.idade;
      document.getElementById('editTurma').value = c.turma;
      document.getElementById('editResp').value = c.resp;
      document.getElementById('editTel').value = c.tel;
      document.getElementById('editImprimir').value = c.imprimir;
      document.getElementById('editSozinho').value = c.sozinho;
      document.getElementById('editDieta').value = c.dieta;
      document.getElementById('editInclusao').value = c.inclusao;
      document.getElementById('editPiscina').value = c.piscina;
      document.getElementById('editRestImg').value = c.restImg;

      modalEdicaoBS.show();
    }

    async function salvarAlteracao() {
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Salvando...';

      const dados = {
        idPlanilha: localStorage.getItem('ceu_planilha_id'),
        linha: document.getElementById('editLinha').value,
        nome: document.getElementById('editNome').value,
        idade: document.getElementById('editIdade').value,
        turma: document.getElementById('editTurma').value,
        resp: document.getElementById('editResp').value,
        tel: document.getElementById('editTel').value,
        imprimir: document.getElementById('editImprimir').value,
        sozinho: document.getElementById('editSozinho').value,
        dieta: document.getElementById('editDieta').value,
        inclusao: document.getElementById('editInclusao').value,
        piscina: document.getElementById('editPiscina').value,
        restImg: document.getElementById('editRestImg').value
      };

      const pacote = { acao: "salvarCriancaRF", dados: dados };

      try {
          const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
          const res = await resRaw.json();
          
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Salvar na Planilha';
          
          if (res.sucesso) {
              modalEdicaoBS.hide();
              Swal.fire('Elegante!', 'Cadastro alterado com sucesso.', 'success');
              carregarLista();
          } else {
              Swal.fire('Erro', res.erro || 'Erro ao salvar', 'error');
          }
      } catch (e) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Salvar na Planilha';
          Swal.fire('Erro', 'Falha na conexão.', 'error');
      }
    }
  </script>
</body>
</html>
