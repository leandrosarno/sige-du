<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-header { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; border-radius: 8px 8px 0 0 !important; }
    .table-hover tbody tr:hover { background-color: #e8f0fe; }
    #area-bloqueada { text-align: center; margin-top: 100px; color: #dc3545; display: none; }
  </style>
</head>
<body class="p-3">

  <div id="area-bloqueada">
      <i class="fa-solid fa-shield-halved" style="font-size: 80px;"></i>
      <h1 style="font-weight: 900; margin-top: 20px;">ACESSO RESTRITO</h1>
      <p>Apenas unidades CEU autenticadas podem acessar a lista de crianças matriculadas.</p>
  </div>

  <div class="container-fluid" id="area-sistema" style="display: none;">
    <div class="card shadow-sm border-0">
      <div class="card-header p-3 d-flex justify-content-between align-items-center">
        <h5 class="m-0"><i class="fa-solid fa-child-reaching me-2"></i>Edição Rápida - Crachás e Regras</h5>
        <div>
            <span class="badge bg-light text-primary me-3 fs-6" id="nomeUnidade">CEU</span>
            <button class="btn btn-light btn-sm fw-bold" onclick="carregarLista()"><i class="fa-solid fa-rotate me-1"></i> Atualizar</button>
        </div>
      </div>
      
      <div class="card-body">
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="inputBusca" class="form-control" placeholder="Buscar por Nome, Responsável ou Turma..." onkeyup="filtrarTabela()">
            </div>
          </div>
          <div class="col-md-6 text-end">
            <span class="badge bg-secondary p-2" id="totalRegistros">Total: 0 crianças</span>
          </div>
        </div>

        <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
          <table class="table table-hover table-striped align-middle border" id="tabelaLista">
            <thead class="table-dark sticky-top">
              <tr>
                <th>Nome da Criança</th>
                <th>Idade / Turma</th>
                <th>Responsável / Tel</th>
                <th class="text-center">Imprimir Crachá?</th>
                <th class="text-center">Indicadores</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="corpoTabela">
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE EDIÇÃO -->
  <div class="modal fade" id="modalEdicao" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title"><i class="fa-solid fa-user-pen me-2"></i>Editar Regras da Criança</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formEdicao">
            <input type="hidden" id="editDocId">
            
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label fw-bold text-muted small mb-1">Nome da Criança</label>
                <input type="text" id="editNome" class="form-control fw-bold text-uppercase" required>
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold text-muted small mb-1">Idade</label>
                <input type="number" id="editIdade" class="form-control text-center" required>
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold text-muted small mb-1">Turma</label>
                <input type="text" id="editTurma" class="form-control text-center text-primary fw-bold text-uppercase">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small mb-1">Responsável</label>
                <input type="text" id="editResp" class="form-control text-uppercase">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small mb-1">Telefone</label>
                <input type="text" id="editTel" class="form-control">
              </div>

              <div class="col-12"><hr class="my-2"></div>
              
              <div class="col-md-4">
                <label class="form-label fw-bold text-primary small mb-1">🪪 Imprimir Crachá?</label>
                <select id="editImprimir" class="form-select border-primary fw-bold text-primary">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">🚶 Vai Desacompanhado?</label>
                <select id="editSozinho" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">🥗 Dieta Especial?</label>
                <select id="editDieta" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">♿ Inclusão?</label>
                <select id="editInclusao" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">🏊 Uso da Piscina?</label>
                <select id="editPiscina" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold text-muted small mb-1">📸 Restrição Imagem?</label>
                <select id="editRestImg" class="form-select">
                  <option value="SIM">SIM</option>
                  <option value="NÃO">NÃO</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-danger me-auto" onclick="apagarCrianca()"><i class="fa-solid fa-trash me-1"></i> Apagar Registro</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary fw-bold" id="btnSalvar" onclick="salvarAlteracao()"><i class="fa-solid fa-floppy-disk me-1"></i> Salvar no Firebase</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- MOTOR FIREBASE -->
  <script type="module">
    import { db } from './firebase_config.js';
    import { collection, getDocs, doc, updateDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    let ceuId = "";
    let listaCriancasGlobal = [];
    let modalEdicaoBS;
    
    window.onload = function() {
      ceuId = localStorage.getItem('sig_id_unidade') || "";
      const ceuNome = localStorage.getItem('sig_nome_unidade') || "CEU Desconhecido";
      
      if (!ceuId || ceuId === "000000") {
          // Permite ADMIN testar, do contrário bloqueia
          if (localStorage.getItem('sig_nivel_acesso')?.includes('ADMIN')) {
              ceuId = "999999"; 
              document.getElementById('nomeUnidade').innerText = "CEU TESTE ADMIN";
          } else {
              document.getElementById('area-bloqueada').style.display = 'block';
              return;
          }
      } else {
          document.getElementById('nomeUnidade').innerText = ceuNome;
      }

      document.getElementById('area-sistema').style.display = 'block';
      modalEdicaoBS = new bootstrap.Modal(document.getElementById('modalEdicao'));
      
      window.carregarLista();
    };

    window.carregarLista = async function() {
      const tbody = document.getElementById('corpoTabela');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">Carregando banco de dados...</p></td></tr>';
      
      try {
          // A LENTE DE PRIVACIDADE: Busca apenas onde id_unidade == ceuId
          const q = query(
              collection(db, "rf_inscricoes"), 
              where("id_unidade", "==", String(ceuId)),
              orderBy("nome_crianca")
          );
          
          const snapshot = await getDocs(q);
          listaCriancasGlobal = [];
          
          snapshot.forEach(docSnap => {
              listaCriancasGlobal.push({ id: docSnap.id, ...docSnap.data() });
          });

          montarCorpoTabela(listaCriancasGlobal);
      } catch (e) {
          console.error("Erro ao carregar lista:", e);
          Swal.fire('Erro', 'Falha na conexão com o banco de dados.', 'error');
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-3">Falha de conexão.</td></tr>`;
      }
    };

    function montarCorpoTabela(lista) {
      const tbody = document.getElementById('corpoTabela');
      tbody.innerHTML = '';
      document.getElementById('totalRegistros').innerText = `Total: ${lista.length} crianças`;

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Nenhuma criança encontrada no seu CEU.</td></tr>';
        return;
      }

      lista.forEach(c => {
        let btnImpClass = c.imprimir === 'SIM' ? 'btn-success' : 'btn-outline-danger';
        let btnImpText = c.imprimir === 'SIM' ? '🪪 SIM' : 'NÃO';
        
        let linhaHTML = `
          <tr>
              <td class="fw-bold text-dark">${c.nome_crianca || 'Não informado'}</td>
              <td>
                <div class="fw-bold text-primary">${c.turma || 'Sem Turma'}</div>
                <small class="text-muted">${c.idade || '?'} anos</small>
              </td>
              <td>
                <div class="fw-bold">${c.resp || '-'}</div>
                <small class="text-muted"><i class="fa-solid fa-phone me-1"></i>${c.tel || '-'}</small>
              </td>
              <td class="text-center">
                <button class="btn btn-sm ${btnImpClass} fw-bold" onclick="alternarImprimir('${c.id}', '${c.imprimir}')" style="width: 80px;">${btnImpText}</button>
              </td>
              <td class="text-center">
                ${c.dieta_especial === 'SIM' ? '<span class="badge bg-warning text-dark me-1" title="Dieta Especial">🥗</span>' : ''}
                ${c.sozinho === 'SIM' ? '<span class="badge bg-info text-dark me-1" title="Vai Desacompanhado">🚶</span>' : ''}
                ${c.inclusao === 'SIM' ? '<span class="badge bg-primary me-1" title="Inclusão">♿</span>' : ''}
                ${c.piscina === 'SIM' ? '<span class="badge bg-success me-1" title="Piscina">🏊</span>' : ''}
                ${c.restricao_imagem === 'SIM' ? '<span class="badge bg-dark me-1" title="Restrição de Imagem">📸</span>' : ''}
              </td>
              <td class="text-center">
                <button class="btn btn-light btn-sm fw-bold border" onclick="abrirModal('${c.id}')">
                  <i class="fa-solid fa-pen text-primary"></i> Editar
                </button>
              </td>
          </tr>
        `;
        tbody.innerHTML += linhaHTML;
      });
    }

    window.filtrarTabela = function() {
      let termo = document.getElementById('inputBusca').value.toUpperCase();
      let filtrados = listaCriancasGlobal.filter(c => 
        (c.nome_crianca || "").toUpperCase().includes(termo) || 
        (c.resp || "").toUpperCase().includes(termo) || 
        (c.turma || "").toUpperCase().includes(termo)
      );
      montarCorpoTabela(filtrados);
    };

    // ALTERAÇÃO OTIMIZADA DE CRACHÁ (Sem recarregar tudo)
    window.alternarImprimir = async function(docId, statusAtual) {
      let novoStatus = statusAtual === 'SIM' ? 'NÃO' : 'SIM';
      
      Swal.fire({ title: 'Alterando...', toast: true, position: 'top-end', showConfirmButton: false, timer: 1000 });

      try {
          await updateDoc(doc(db, "rf_inscricoes", docId), { imprimir: novoStatus });
          
          // Atualiza a matriz local para não gastar cota baixando tudo de novo
          let c = listaCriancasGlobal.find(x => x.id === docId);
          if(c) c.imprimir = novoStatus;
          
          window.filtrarTabela(); // Re-renderiza a tela com o novo dado
      } catch (e) {
          Swal.fire('Erro', 'Não foi possível alterar o status.', 'error');
      }
    };

    window.abrirModal = function(docId) {
      let c = listaCriancasGlobal.find(item => item.id === docId);
      if (!c) return;

      document.getElementById('editDocId').value = c.id;
      document.getElementById('editNome').value = c.nome_crianca || "";
      document.getElementById('editIdade').value = c.idade || "";
      document.getElementById('editTurma').value = c.turma || "";
      document.getElementById('editResp').value = c.resp || "";
      document.getElementById('editTel').value = c.tel || "";
      document.getElementById('editImprimir').value = c.imprimir || "SIM";
      document.getElementById('editSozinho').value = c.sozinho || "NÃO";
      document.getElementById('editDieta').value = c.dieta_especial || "NÃO";
      document.getElementById('editInclusao').value = c.inclusao || "NÃO";
      document.getElementById('editPiscina').value = c.piscina || "NÃO";
      document.getElementById('editRestImg').value = c.restricao_imagem || "NÃO";

      modalEdicaoBS.show();
    };

    window.salvarAlteracao = async function() {
      const btn = document.getElementById('btnSalvar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Salvando...';

      const docId = document.getElementById('editDocId').value;
      const dados = {
        nome_crianca: document.getElementById('editNome').value.trim().toUpperCase(),
        idade: parseInt(document.getElementById('editIdade').value),
        turma: document.getElementById('editTurma').value.trim().toUpperCase(),
        resp: document.getElementById('editResp').value.trim().toUpperCase(),
        tel: document.getElementById('editTel').value.trim(),
        imprimir: document.getElementById('editImprimir').value,
        sozinho: document.getElementById('editSozinho').value,
        dieta_especial: document.getElementById('editDieta').value,
        inclusao: document.getElementById('editInclusao').value,
        piscina: document.getElementById('editPiscina').value,
        restricao_imagem: document.getElementById('editRestImg').value
      };

      try {
          await updateDoc(doc(db, "rf_inscricoes", docId), dados);
          
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Salvar no Firebase';
          
          modalEdicaoBS.hide();
          Swal.fire('Atualizado!', 'O cadastro foi modificado com sucesso.', 'success');
          
          window.carregarLista();
      } catch (e) {
          console.error(e);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Salvar no Firebase';
          Swal.fire('Erro', 'Falha ao salvar no banco de dados.', 'error');
      }
    };

    window.apagarCrianca = function() {
        const docId = document.getElementById('editDocId').value;
        const nome = document.getElementById('editNome').value;

        Swal.fire({
            title: 'Remover Inscrição?',
            html: `Tem certeza que deseja apagar o registro de <b>${nome}</b>? <br>Essa ação não pode ser desfeita.`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc3545',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Sim, Apagar!'
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    await deleteDoc(doc(db, "rf_inscricoes", docId));
                    modalEdicaoBS.hide();
                    Swal.fire('Apagado!', 'O cadastro foi removido.', 'success');
                    window.carregarLista();
                } catch (e) {
                    Swal.fire('Erro', 'Não foi possível apagar.', 'error');
                }
            }
        });
    };
  </script>
</body>
</html>
