<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Inscritos - Recreio nas Férias</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body { background-color: #ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #1f1f1f; padding: 24px; }
        
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; font-size: 18px; vertical-align: middle; }

        .header-title { font-size: 20px; font-weight: 600; color: #1f1f1f; display: flex; align-items: center; gap: 8px; margin: 0; }
        
        .card-tabela { border: 1px solid #e3e3e3; border-radius: 16px; background: #ffffff; padding: 0; overflow: hidden; }
        
        /* TABELA CLEAN */
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 0; }
        thead { background-color: #f8f9fa; border-bottom: 2px solid #e3e3e3; }
        th { padding: 14px 16px; text-transform: uppercase; font-size: 11px; color: #444746; font-weight: 700; letter-spacing: 0.5px; }
        td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        tbody tr:hover { background-color: #fdfdfd; }
        
        /* BOTÕES DE AÇÃO */
        .btn-acao { background: transparent; border: none; padding: 6px; border-radius: 8px; cursor: pointer; transition: background 0.2s; color: #444746; }
        .btn-acao:hover { background: #f0f4f9; color: #0b57d0; }
        .btn-acao.delete:hover { background: #fce8e8; color: #ba1a1a; }
        
        /* TOGGLE RÁPIDO IMPRIMIR */
        .btn-imprimir { border: 1px solid #dadce0; background: #fff; padding: 4px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; width: 65px; text-align: center; }
        .btn-imprimir.sim { background: #c4eed0; color: #146c2e; border-color: #c4eed0; }
        .btn-imprimir.nao { background: #f1f3f4; color: #5f6368; }

        .pesquisa-box { background: #f0f4f9; border-radius: 50px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; width: 300px; }
        .pesquisa-box input { border: none; background: transparent; outline: none; font-size: 13px; width: 100%; }

        /* TAGS DE CARACTERÍSTICAS */
        .tag-info { font-size: 10px; background: #f0f4f9; border: 1px solid #e3e3e3; padding: 2px 6px; border-radius: 4px; color: #444746; font-weight: 600; margin-right: 4px; display: inline-block; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="container-fluid p-0">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="header-title"><span class="material-symbols-outlined text-primary" style="font-size: 24px; font-variation-settings: 'FILL' 1;">groups</span> Crianças Matriculadas</h4>
                <small class="text-muted" style="margin-left: 32px;" id="lbl-total">Carregando dados...</small>
            </div>
            
            <div class="d-flex gap-3">
                <div class="pesquisa-box">
                    <span class="material-symbols-outlined text-muted">search</span>
                    <input type="text" id="iptBusca" placeholder="Buscar criança ou responsável..." onkeyup="filtrarTabela()">
                </div>
                <button class="btn btn-outline-primary" style="border-radius: 50px; font-size: 13px; font-weight: 600;" onclick="carregarDados()">
                    <span class="material-symbols-outlined">sync</span> Atualizar
                </button>
            </div>
        </div>

        <div class="card-tabela">
            <div style="overflow-x: auto;">
                <table id="tabelaCriancas">
                    <thead>
                        <tr>
                            <th>Nome da Criança</th>
                            <th class="text-center">Idade</th>
                            <th class="text-center">Turma</th>
                            <th>Responsável / Contato</th>
                            <th>Características</th>
                            <th class="text-center">Imprimir Crachá</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyCriancas">
                        <tr><td colspan="7" class="text-center py-4">Buscando dados no Firebase...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO DA CRIANÇA -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                <div class="modal-header" style="border-bottom: 1px solid #f0f0f0; padding: 20px 24px;">
                    <h5 class="modal-title fw-bold" style="font-size: 16px; display: flex; align-items: center; gap: 8px;">
                        <span class="material-symbols-outlined text-primary">edit_square</span> Editar Cadastro
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="padding: 24px; background: #f8f9fa;">
                    <input type="hidden" id="edit_id">
                    
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">NOME DA CRIANÇA *</label>
                            <input type="text" id="edit_nome" class="form-control text-uppercase" style="border-radius: 8px; font-size: 13px;" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">IDADE *</label>
                            <input type="number" id="edit_idade" class="form-control text-center" style="border-radius: 8px; font-size: 13px;" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">TURMA</label>
                            <input type="text" id="edit_turma" class="form-control text-center text-uppercase" style="border-radius: 8px; font-size: 13px;">
                        </div>

                        <div class="col-md-6 mt-3">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">NOME DO RESPONSÁVEL</label>
                            <input type="text" id="edit_resp" class="form-control text-uppercase" style="border-radius: 8px; font-size: 13px;">
                        </div>
                        <div class="col-md-6 mt-3">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">TELEFONE (WhatsApp)</label>
                            <input type="text" id="edit_tel" class="form-control" style="border-radius: 8px; font-size: 13px;">
                        </div>

                        <div class="col-12 mt-4"><hr style="border-color: #e3e3e3; margin: 0;"></div>

                        <!-- CARACTERÍSTICAS -->
                        <div class="col-md-3 mt-3">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">INCLUSÃO (PCD)</label>
                            <select id="edit_inclusao" class="form-select" style="border-radius: 8px; font-size: 13px;">
                                <option value="NÃO">NÃO</option>
                                <option value="SIM">SIM</option>
                            </select>
                        </div>
                        <div class="col-md-3 mt-3">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">DIETA ESPECIAL</label>
                            <select id="edit_dieta" class="form-select" style="border-radius: 8px; font-size: 13px;">
                                <option value="NÃO">NÃO</option>
                                <option value="SIM">SIM</option>
                            </select>
                        </div>
                        <div class="col-md-3 mt-3">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">VAI SOZINHO</label>
                            <select id="edit_sozinho" class="form-select" style="border-radius: 8px; font-size: 13px;">
                                <option value="NÃO">NÃO</option>
                                <option value="SIM">SIM</option>
                            </select>
                        </div>
                        <div class="col-md-3 mt-3">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">USA PISCINA</label>
                            <select id="edit_piscina" class="form-select" style="border-radius: 8px; font-size: 13px;">
                                <option value="SIM">SIM</option>
                                <option value="NÃO">NÃO</option>
                            </select>
                        </div>
                        <div class="col-md-3 mt-3">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">RESTR. IMAGEM</label>
                            <select id="edit_rest_img" class="form-select" style="border-radius: 8px; font-size: 13px;">
                                <option value="NÃO">NÃO</option>
                                <option value="SIM">SIM</option>
                            </select>
                        </div>
                        <div class="col-md-4 mt-3">
                            <label class="form-label" style="font-size: 11px; font-weight: 700; color: #444746;">VEM DE ABRIGO?</label>
                            <select id="edit_abrigo" class="form-select" style="border-radius: 8px; font-size: 13px;">
                                <option value="NÃO">NÃO (Comunidade)</option>
                                <option value="SIM">SIM (Abrigo)</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #f0f0f0; padding: 16px 24px;">
                    <button type="button" class="btn text-muted fw-bold" data-bs-dismiss="modal" style="font-size: 13px;">Cancelar</button>
                    <button type="button" class="btn btn-primary fw-bold px-4" style="border-radius: 50px; font-size: 13px;" onclick="salvarEdicao()">
                        <span class="material-symbols-outlined" style="font-size: 16px;">save</span> Salvar Alterações
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let dadosGlobais = [];
        let modalEdicao = null;
        let ceuId = "";

        window.onload = async function() {
            ceuId = localStorage.getItem('sig_id_unidade') || "";
            if (!ceuId) {
                Swal.fire('Acesso Negado', 'Você precisa estar logado para acessar esta página.', 'error');
                return;
            }
            modalEdicao = new bootstrap.Modal(document.getElementById('modalEditar'));
            await carregarDados();
        };

        window.carregarDados = async function() {
            document.getElementById('tbodyCriancas').innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2 text-primary"></div> Carregando base de dados...</td></tr>`;
            
            try {
                let q = collection(db, "rf_inscricoes");
                
                if (ceuId !== "000000" && ceuId !== "999999") {
                    q = query(collection(db, "rf_inscricoes"), where("id_unidade", "==", String(ceuId)));
                }

                const snap = await getDocs(q);
                dadosGlobais = [];
                
                snap.forEach(docCrianca => {
                    dadosGlobais.push({ id: docCrianca.id, ...docCrianca.data() });
                });

                dadosGlobais.sort((a, b) => (a.nome_crianca || "").localeCompare(b.nome_crianca || ""));

                document.getElementById('lbl-total').innerText = `${dadosGlobais.length} crianças registradas`;
                renderizarTabela(dadosGlobais);

            } catch (error) {
                console.error("Erro ao buscar crianças:", error);
                document.getElementById('tbodyCriancas').innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger fw-bold">Falha ao conectar com o banco de dados.</td></tr>`;
                Swal.fire('Erro', 'Falha ao buscar as crianças no Firebase.', 'error');
            }
        };

        function renderizarTabela(lista) {
            const tbody = document.getElementById('tbodyCriancas');
            tbody.innerHTML = '';

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">Nenhuma criança encontrada.</td></tr>`;
                return;
            }

            lista.forEach(cri => {
                // 🌟 AQUI ESTÃO TODAS AS TAGS AGORA!
                let tags = '';
                if (cri.inclusao === 'SIM') tags += `<span class="tag-info text-primary border-primary">♿ Inclusão</span>`;
                if (cri.dieta_especial === 'SIM') tags += `<span class="tag-info text-warning border-warning" style="color: #b06000 !important;">🥗 Dieta</span>`;
                if (cri.sozinho === 'SIM') tags += `<span class="tag-info text-success border-success" style="color: #146c2e !important;">🚶 Vai Sozinho</span>`;
                if (cri.piscina === 'SIM') tags += `<span class="tag-info text-info border-info" style="color: #00639b !important;">🏊 Piscina</span>`;
                if (cri.restricao_imagem === 'SIM') tags += `<span class="tag-info text-dark border-dark">📷 Rest. Imagem</span>`;
                if (cri.abrigo && cri.abrigo !== 'NÃO' && cri.abrigo !== '-') tags += `<span class="tag-info text-danger border-danger">🏠 Abrigo</span>`;
                
                if (tags === '') tags = `<span class="text-muted" style="font-size: 11px;">Padrão</span>`;

                const isImprimir = (cri.imprimir === 'SIM');
                const classeBtnImp = isImprimir ? 'sim' : 'nao';
                const textoBtnImp = isImprimir ? 'SIM' : 'NÃO';

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold" style="color: #0b57d0;">${cri.nome_crianca}</td>
                        <td class="text-center fw-bold text-muted">${cri.idade}</td>
                        <td class="text-center"><span class="badge bg-light text-dark border">${cri.turma || '-'}</span></td>
                        <td>
                            <div style="font-weight: 600; color: #1f1f1f;">${cri.resp || 'Sem Resp.'}</div>
                            <div style="font-size: 11px; color: #747775;">${cri.tel || 'Sem Contato'}</div>
                        </td>
                        <td>${tags}</td>
                        <td class="text-center">
                            <div class="btn-imprimir ${classeBtnImp}" onclick="toggleImprimir('${cri.id}', '${cri.imprimir}')">
                                ${textoBtnImp}
                            </div>
                        </td>
                        <td class="text-center" style="white-space: nowrap;">
                            <button class="btn-acao" onclick="abrirModalEdicao('${cri.id}')" title="Editar"><span class="material-symbols-outlined">edit</span></button>
                            <button class="btn-acao delete" onclick="excluirCrianca('${cri.id}')" title="Excluir"><span class="material-symbols-outlined">delete</span></button>
                        </td>
                    </tr>
                `;
            });
        }

        window.toggleImprimir = async function(id, statusAtual) {
            const novoStatus = (statusAtual === 'SIM') ? 'NÃO' : 'SIM';
            try {
                await updateDoc(doc(db, "rf_inscricoes", id), { imprimir: novoStatus });
                const idx = dadosGlobais.findIndex(c => c.id === id);
                if (idx > -1) {
                    dadosGlobais[idx].imprimir = novoStatus;
                    renderizarTabela(dadosGlobais);
                }
            } catch (error) {
                Swal.fire('Erro', 'Falha ao alterar status de impressão.', 'error');
            }
        };

        window.abrirModalEdicao = function(id) {
            const cri = dadosGlobais.find(c => c.id === id);
            if (!cri) return;

            document.getElementById('edit_id').value = cri.id;
            document.getElementById('edit_nome').value = cri.nome_crianca || '';
            document.getElementById('edit_idade').value = cri.idade || '';
            document.getElementById('edit_turma').value = cri.turma || '';
            document.getElementById('edit_resp').value = cri.resp || '';
            document.getElementById('edit_tel').value = cri.tel || '';
            
            document.getElementById('edit_inclusao').value = cri.inclusao || 'NÃO';
            document.getElementById('edit_dieta').value = cri.dieta_especial || 'NÃO';
            document.getElementById('edit_sozinho').value = cri.sozinho || 'NÃO';
            document.getElementById('edit_piscina').value = cri.piscina || 'SIM';
            document.getElementById('edit_rest_img').value = cri.restricao_imagem || 'NÃO';
            
            let valAbrigo = cri.abrigo || 'NÃO';
            if (valAbrigo !== 'NÃO' && valAbrigo !== 'NAO' && valAbrigo !== '-') valAbrigo = 'SIM';
            document.getElementById('edit_abrigo').value = valAbrigo;

            modalEdicao.show();
        };

        window.salvarEdicao = async function() {
            const id = document.getElementById('edit_id').value;
            if (!id) return;

            const nome = document.getElementById('edit_nome').value.trim().toUpperCase();
            const idade = document.getElementById('edit_idade').value;

            if (!nome || !idade) {
                Swal.fire('Atenção', 'Nome e Idade são obrigatórios.', 'warning');
                return;
            }

            const dadosAtualizados = {
                nome_crianca: nome,
                idade: Number(idade),
                turma: document.getElementById('edit_turma').value.trim().toUpperCase(),
                resp: document.getElementById('edit_resp').value.trim().toUpperCase(),
                tel: document.getElementById('edit_tel').value.trim(),
                inclusao: document.getElementById('edit_inclusao').value,
                dieta_especial: document.getElementById('edit_dieta').value,
                sozinho: document.getElementById('edit_sozinho').value,
                piscina: document.getElementById('edit_piscina').value,
                restricao_imagem: document.getElementById('edit_rest_img').value,
                abrigo: document.getElementById('edit_abrigo').value
            };

            Swal.fire({ title: 'Salvando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                await updateDoc(doc(db, "rf_inscricoes", id), dadosAtualizados);
                const idx = dadosGlobais.findIndex(c => c.id === id);
                if (idx > -1) {
                    dadosGlobais[idx] = { ...dadosGlobais[idx], ...dadosAtualizados };
                }

                modalEdicao.hide();
                Swal.fire('Pronto!', 'Cadastro atualizado com sucesso.', 'success');
                renderizarTabela(dadosGlobais);

            } catch (error) {
                console.error(error);
                Swal.fire('Erro', 'Falha ao salvar no Firebase.', 'error');
            }
        };

        window.excluirCrianca = function(id) {
            const cri = dadosGlobais.find(c => c.id === id);
            
            Swal.fire({
                title: 'Excluir Matrícula?',
                html: `Tem certeza que deseja apagar a criança <b>${cri.nome_crianca}</b>?<br>Isso não pode ser desfeito.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ba1a1a',
                cancelButtonColor: '#747775',
                confirmButtonText: 'Sim, Excluir'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Apagando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    try {
                        await deleteDoc(doc(db, "rf_inscricoes", id));
                        dadosGlobais = dadosGlobais.filter(c => c.id !== id);
                        document.getElementById('lbl-total').innerText = `${dadosGlobais.length} crianças registradas`;
                        renderizarTabela(dadosGlobais);
                        Swal.fire('Excluído!', 'O registro foi apagado.', 'success');
                    } catch (error) {
                        Swal.fire('Erro', 'Falha ao excluir no Firebase.', 'error');
                    }
                }
            });
        };

        window.filtrarTabela = function() {
            const texto = document.getElementById('iptBusca').value.toLowerCase();
            const filtrados = dadosGlobais.filter(c => {
                return (c.nome_crianca && c.nome_crianca.toLowerCase().includes(texto)) || 
                       (c.resp && c.resp.toLowerCase().includes(texto));
            });
            renderizarTabela(filtrados);
        };
    </script>
</body>
</html>
