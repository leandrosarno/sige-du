<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada Qualitativa - Recreio nas Férias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .cabecalho-chamada { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .tabela-container { overflow-x: auto; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background-color: #2c3e50; color: white; text-align: center; padding: 12px; font-size: 13px; position: sticky; top: 0; z-index: 10; }
        td { border: 1px solid #dee2e6; padding: 4px; text-align: center; vertical-align: middle; }
        
        .col-nome { text-align: left !important; font-weight: bold; font-size: 13px; min-width: 250px; position: sticky; left: 0; background: white; z-index: 5; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        .col-turma { font-weight: bold; background-color: #f1f3f5; width: 60px; font-size: 13px; }
        
        .input-freq { width: 100%; height: 35px; text-align: center; border: none; font-weight: bold; font-size: 15px; outline: none; background: transparent; }
        .input-freq:focus { background-color: #e7f1ff; border-bottom: 2px solid #0d6efd; }
        
        .dia-bloqueado { background-color: #e9ecef !important; pointer-events: none; }
        .texto-ingresso { font-size: 10px; color: #dc3545; font-weight: bold; margin-left: 8px; }
        
        .totais-aluno { font-weight: 900; background-color: #f8f9fa; }
        .rodape-totais { background-color: #34495e; color: #f1c40f; font-weight: bold; }
        .rodape-totais td { padding: 10px; font-size: 14px; }

        /* Cabeçalho que só aparece na folha de papel */
        #cabecalho-impressao { display: none; text-align: center; margin-bottom: 20px; }
        #cabecalho-impressao h2 { margin: 0; font-size: 20px; font-weight: bold; text-transform: uppercase; }
        #cabecalho-impressao p { margin: 5px 0 0 0; font-size: 14px; }
        #area-bloqueada { text-align: center; margin-top: 100px; color: #dc3545; display: none; }

        /* 🖨️ A MÁGICA DA IMPRESSÃO A4 */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background-color: white; margin: 0; padding: 0; }
            .cabecalho-chamada { display: none !important; }
            #cabecalho-impressao { display: block !important; }
            .tabela-container { box-shadow: none; border: none; overflow: visible; }
            table { min-width: 100%; }
            th { background-color: #e9ecef !important; color: black !important; -webkit-print-color-adjust: exact; position: static; }
            .col-nome { position: static !important; box-shadow: none !important; }
            .rodape-totais, .rodape-totais td { background-color: #f1f3f5 !important; color: black !important; -webkit-print-color-adjust: exact; }
            .input-freq { color: black !important; }
        }
    </style>
</head>
<body>
    <div id="area-bloqueada">
        <i class="fas fa-lock" style="font-size: 80px;"></i>
        <h1 style="font-weight: 900; margin-top: 20px;">ACESSO RESTRITO</h1>
        <p>Apenas funcionários das Unidades CEU podem fazer o preenchimento da chamada.</p>
    </div>

    <div class="container-fluid py-4" id="area-sistema" style="display: none;">
        
        <!-- CABEÇALHO PARA IMPRESSORA -->
        <div id="cabecalho-impressao">
            <h2>Chamada Qualitativa - Recreio nas Férias</h2>
            <p><strong>Idade:</strong> <span id="print-idade">Não informada</span> | <strong>Agente Recreador:</strong> <span id="print-agente">Não informado</span></p>
            <p><strong>Unidade:</strong> <span id="print-ceu">CEU</span></p>
        </div>

        <!-- CABEÇALHO DO SISTEMA -->
        <div class="cabecalho-chamada d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h4 class="text-primary fw-bold mb-1"><i class="fas fa-clipboard-list"></i> Chamada Qualitativa</h4>
                <div class="text-muted small fw-bold" id="lbl-info-ceu">CEU NÃO IDENTIFICADO</div>
            </div>
            
            <div class="d-flex align-items-end gap-3 flex-grow-1" style="max-width: 700px;">
                <div class="flex-grow-1">
                    <label class="form-label small fw-bold text-muted mb-1">Agente Recreador</label>
                    <input type="text" class="form-control" id="txt-agente" placeholder="Nome do Agente" oninput="document.getElementById('print-agente').innerText = this.value || 'Não informado';">
                </div>
                <div style="width: 120px;">
                    <label class="form-label small fw-bold text-muted mb-1">Idade</label>
                    <select class="form-select" id="sel-idade" onchange="document.getElementById('print-idade').innerText = this.value ? this.value + ' Anos' : 'Não informada';">
                        <option value="">Selecione...</option>
                        <option value="4">4 Anos</option><option value="5">5 Anos</option><option value="6">6 Anos</option>
                        <option value="7">7 Anos</option><option value="8">8 Anos</option><option value="9">9 Anos</option>
                        <option value="10">10 Anos</option><option value="11">11 Anos</option><option value="12">12 Anos</option>
                        <option value="13">13 Anos</option><option value="14">14 Anos</option>
                    </select>
                </div>
                <button class="btn btn-primary fw-bold" onclick="carregarChamada()" id="btn-carregar">
                    <i class="fas fa-search"></i> Carregar
                </button>
                <button class="btn btn-success fw-bold" onclick="salvarChamada()" id="btn-salvar" style="display: none;">
                    <i class="fas fa-save"></i> Salvar
                </button>
                <button class="btn btn-dark fw-bold" onclick="prepararImpressao()" id="btn-imprimir" style="display: none;">
                    <i class="fas fa-print"></i> Imprimir
                </button>
            </div>
        </div>

        <div class="tabela-container" id="area-tabela" style="display: none;"></div>
    </div>

    <!-- MOTOR FIREBASE -->
    <script type="module">
        import { db } from './firebase_config.js';
        import { collection, query, where, getDocs, getDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        let matrizDias = [];
        let listaCriancasGlobal = [];
        let ceuId = "";

        window.onload = async function() {
            ceuId = localStorage.getItem('sig_id_unidade') || "";
            const ceuNome = localStorage.getItem('sig_nome_unidade') || "CEU Desconhecido";
            
            if (!ceuId || ceuId === "000000") {
                if (localStorage.getItem('sig_nivel_acesso')?.includes('ADMIN')) {
                    ceuId = "999999"; 
                    document.getElementById('lbl-info-ceu').innerText = "CEU TESTE ADMIN - Recreio nas Férias";
                    document.getElementById('print-ceu').innerText = "CEU TESTE ADMIN";
                } else {
                    document.getElementById('area-bloqueada').style.display = 'block';
                    return;
                }
            } else {
                document.getElementById('lbl-info-ceu').innerText = `${ceuNome.toUpperCase()} - Recreio nas Férias`;
                document.getElementById('print-ceu').innerText = ceuNome.toUpperCase();
            }

            document.getElementById('area-sistema').style.display = 'block';
        };

        window.carregarChamada = async function() {
            const idade = document.getElementById('sel-idade').value;
            if (!idade) {
                Swal.fire('Atenção', 'Selecione uma idade.', 'warning'); return;
            }

            const btn = document.getElementById('btn-carregar');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                // 1. PUXAR DATAS DA COLEÇÃO REGRAS (SME)
                const docRegras = await getDoc(doc(db, "configuracoes", "regras_rf"));
                if (!docRegras.exists()) {
                    Swal.fire('Atenção', 'A SME ainda não configurou as regras globais e datas do Recreio.', 'warning');
                    btn.innerHTML = '<i class="fas fa-search"></i> Carregar'; btn.disabled = false;
                    return;
                }

                let dIniStr = docRegras.data().diaIni;
                let dFimStr = docRegras.data().diaFim;
                
                if(!dIniStr || !dFimStr) {
                    Swal.fire('Atenção', 'As datas de Início e Fim do programa não estão configuradas na matriz SME.', 'warning');
                    btn.innerHTML = '<i class="fas fa-search"></i> Carregar'; btn.disabled = false;
                    return;
                }

                // MONTAR ESTRUTURA DE DIAS
                matrizDias = [];
                let dataAtual = new Date(dIniStr + "T00:00:00");
                let dataFim = new Date(dFimStr + "T00:00:00");
                
                while(dataAtual <= dataFim) {
                    let diaF = ("0" + dataAtual.getDate()).slice(-2) + "/" + ("0" + (dataAtual.getMonth() + 1)).slice(-2);
                    let strComparacao = dataAtual.toISOString().substring(0, 10); // "YYYY-MM-DD"
                    matrizDias.push({ formato: diaF, iso: strComparacao });
                    dataAtual.setDate(dataAtual.getDate() + 1);
                }

                // 2. PUXAR AS CRIANÇAS DESTE CEU E DESTA IDADE
                const qCriancas = query(
                    collection(db, "rf_inscricoes"),
                    where("id_unidade", "==", String(ceuId)),
                    where("idade", "==", parseInt(idade))
                );

                const snapCriancas = await getDocs(qCriancas);
                listaCriancasGlobal = [];

                snapCriancas.forEach(d => {
                    let c = d.data();
                    listaCriancasGlobal.push({
                        id: d.id,
                        nome: c.nome_crianca || "",
                        turma: c.turma || "",
                        dataMat: c.data_matricula || "",
                        // O Firebase vai trazer um objeto 'frequencias': { '15/01': 'P', '16/01': 'F' }
                        frequencias: c.frequencias || {}
                    });
                });

                // Ordena por turma e depois por nome
                listaCriancasGlobal.sort((a, b) => {
                    if(a.turma !== b.turma) return a.turma.localeCompare(b.turma);
                    return a.nome.localeCompare(b.nome);
                });

                if (listaCriancasGlobal.length === 0) {
                    Swal.fire('Poxa...', 'Nenhuma criança de ' + idade + ' anos foi matriculada ainda.', 'info');
                    document.getElementById('area-tabela').style.display = 'none';
                    document.getElementById('btn-salvar').style.display = 'none';
                    document.getElementById('btn-imprimir').style.display = 'none';
                } else {
                    renderizarTabela(listaCriancasGlobal, matrizDias);
                    document.getElementById('area-tabela').style.display = 'block';
                    document.getElementById('btn-salvar').style.display = 'inline-block'; 
                    document.getElementById('btn-imprimir').style.display = 'inline-block'; 
                }

            } catch (error) {
                console.error("Erro ao puxar chamada:", error);
                Swal.fire('Erro', 'Falha ao buscar dados no Firebase.', 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-search"></i> Carregar';
                btn.disabled = false;
            }
        };

        function renderizarTabela(criancas, dias) {
            let html = `<table><thead><tr>
                <th>TURMA</th>
                <th class="col-nome" style="background-color: #2c3e50; color: white;">NOME DA CRIANÇA</th>`;
            
            dias.forEach(d => { html += `<th>${d.formato}</th>`; });
            html += `<th>PRES. (P)</th><th>FALTAS (F)</th></tr></thead><tbody>`;

            criancas.forEach((c, idx) => {
                let badgeIngresso = "";
                let strDataMat = c.dataMat.substring(0, 10); // "YYYY-MM-DD"
                
                // Se a criança foi matriculada DEPOIS do primeiro dia do programa
                if (strDataMat > dias[0].iso) {
                    let dm = new Date(c.dataMat);
                    let formatada = ("0" + dm.getDate()).slice(-2) + "/" + ("0" + (dm.getMonth() + 1)).slice(-2);
                    badgeIngresso = `<span class="texto-ingresso" title="Entrou atrasada">(Ingresso: ${formatada})</span>`;
                }

                html += `<tr data-idx="${idx}" data-id="${c.id}" data-mat="${strDataMat}">
                    <td class="col-turma">${c.turma}</td>
                    <td class="col-nome">${c.nome} ${badgeIngresso}</td>`;

                dias.forEach((d, diaIdx) => {
                    // Bloqueia digitação nos dias em que a criança ainda não existia no sistema
                    let bloqueado = (d.iso < strDataMat) ? 'dia-bloqueado readonly tabindex="-1"' : '';
                    let visual = (d.iso < strDataMat) ? 'background-color: #e9ecef;' : '';
                    let freqSalva = c.frequencias[d.formato] || ""; 
                    let corTexto = freqSalva === 'P' ? 'color: #198754;' : (freqSalva === 'F' ? 'color: #dc3545;' : '');

                    html += `<td style="padding: 0; ${visual}">
                        <input type="text" class="input-freq ${bloqueado}" maxlength="1" data-dia="${diaIdx}" data-formato="${d.formato}" oninput="validarDigito(this)" value="${freqSalva}" style="${corTexto}">
                    </td>`;
                });

                html += `<td class="totais-aluno text-success" id="tot-p-${idx}">0</td>
                         <td class="totais-aluno text-danger" id="tot-f-${idx}">0</td></tr>`;
            });

            // RODAPÉ COM TOTAIS
            html += `<tr class="rodape-totais"><td colspan="2" style="text-align: right; background-color: #1a252f;">TOTAL NO DIA / GERAL:</td>`;
            dias.forEach((d, diaIdx) => { html += `<td id="tot-dia-${diaIdx}">0</td>`; });
            html += `<td id="tot-geral-p" style="background-color: #1a252f; color: #198754; font-size: 16px;">0</td>
                     <td id="tot-geral-f" style="background-color: #1a252f; color: #dc3545; font-size: 16px;">0</td></tr></tbody></table>`;
            
            document.getElementById('area-tabela').innerHTML = html;
            window.recalcularTudo();
        }

        window.validarDigito = function(input) {
            let valor = input.value.toUpperCase();
            if (valor !== 'P' && valor !== 'F') { input.value = ''; } 
            else { 
                input.value = valor;
                input.style.color = valor === 'P' ? '#198754' : '#dc3545';
            }
            window.recalcularTudo();
        };

        window.recalcularTudo = function() {
            let totalPresencasGeral = Array(matrizDias.length).fill(0);
            let somaGeralP = 0;
            let somaGeralF = 0;
            
            const linhas = document.querySelectorAll('tbody tr[data-idx]');
            
            linhas.forEach(tr => {
                let p = 0; let f = 0;
                let idxLinha = tr.getAttribute('data-idx');
                const inputs = tr.querySelectorAll('.input-freq');
                
                inputs.forEach(input => {
                    let val = input.value;
                    let idxDia = input.getAttribute('data-dia');
                    if (val === 'P') { p++; totalPresencasGeral[idxDia]++; } 
                    else if (val === 'F') { f++; }
                });

                document.getElementById(`tot-p-${idxLinha}`).innerText = p;
                document.getElementById(`tot-f-${idxLinha}`).innerText = f;
                
                somaGeralP += p;
                somaGeralF += f;
            });

            matrizDias.forEach((d, diaIdx) => {
                document.getElementById(`tot-dia-${diaIdx}`).innerText = totalPresencasGeral[diaIdx];
            });
            
            document.getElementById('tot-geral-p').innerText = somaGeralP;
            document.getElementById('tot-geral-f').innerText = somaGeralF;
        };

        window.salvarChamada = async function() {
            const btnSalvar = document.getElementById('btn-salvar');
            const linhas = document.querySelectorAll('tbody tr[data-idx]');
            
            btnSalvar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando no Firebase...';
            btnSalvar.disabled = true;

            try {
                // Abre um pacote de atualizações cirúrgicas no Firebase (Write Batch)
                const batch = writeBatch(db);
                
                linhas.forEach(tr => {
                    let idCrianca = tr.getAttribute('data-id');
                    let pCount = parseInt(document.getElementById(`tot-p-${tr.getAttribute('data-idx')}`).innerText);
                    let fCount = parseInt(document.getElementById(`tot-f-${tr.getAttribute('data-idx')}`).innerText);
                    let objFrequencias = {};

                    const inputs = tr.querySelectorAll('.input-freq');
                    inputs.forEach(input => {
                        let chaveData = input.getAttribute('data-formato'); // Ex: "15/01"
                        let valorLetra = input.value.toUpperCase();
                        if (valorLetra === 'P' || valorLetra === 'F') {
                            objFrequencias[chaveData] = valorLetra;
                        }
                    });

                    // Atualiza cirurgicamente Apenas 3 campos no documento da criança
                    const ref = doc(db, "rf_inscricoes", idCrianca);
                    batch.update(ref, { 
                        frequencias: objFrequencias,
                        presencas: pCount,
                        faltas: fCount
                    });
                });

                // Dispara o pacote para a nuvem
                await batch.commit();
                
                Swal.fire('Elegante!', 'A chamada foi gravada com sucesso no Firebase!', 'success');

            } catch (error) {
                console.error("Erro no batch:", error);
                Swal.fire('Erro', 'Falha ao salvar. Verifique sua internet.', 'error');
            } finally {
                btnSalvar.innerHTML = '<i class="fas fa-save"></i> Salvar';
                btnSalvar.disabled = false;
            }
        };
        
        window.prepararImpressao = function() {
            const agente = document.getElementById('txt-agente').value;
            document.getElementById('print-agente').innerText = agente || 'Não informado';
            window.print();
        };
    </script>
</body>
</html>
