<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Crachás HTML - Recreio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* =========================================
           🎨 TELA DO FORMULÁRIO (VISUAL)
           ========================================= */
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; padding: 20px; color: #2c3e50; }
        .card-main { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 700px; margin: 0 auto; text-align: center; }
        .btn-gerar { background: linear-gradient(135deg, #8e44ad, #9b59b6); color: white; border: none; padding: 16px 20px; font-size: 18px; font-weight: 800; border-radius: 12px; width: 100%; transition: 0.3s; margin-bottom: 15px; }
        .btn-gerar:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(142, 68, 173, 0.4); color: white;}
        .btn-limpar { background-color: #e74c3c; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; transition: 0.2s; width: 100%; }
        .btn-limpar:hover { background-color: #c0392b; }

        /* =========================================
           🖨️ MODO DE IMPRESSÃO (A MÁGICA HTML)
           ========================================= */
        #areaImpressao { display: none; }
        
        @media print {
            body { background: white; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #areaFormulario { display: none !important; }
            #areaImpressao { display: block !important; }
            
            @page { size: A4 portrait; margin: 10mm; }

            .folha { page-break-after: always; display: flex; flex-wrap: wrap; gap: 5mm; align-content: flex-start; justify-content: space-between; font-family: Arial, sans-serif; }
            
            /* CRACHÁ CRIANÇA (8 POR PÁGINA) */
            .cracha-crianca { width: 90mm; height: 64mm; border: 2px dashed #999; border-radius: 8px; padding: 3mm; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #fff; page-break-inside: avoid; }
            .c-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 2mm; margin-bottom: 2mm; }
            .c-ceu { font-size: 11px; font-weight: 900; margin: 0; text-transform: uppercase; }
            .c-periodo { font-size: 8px; font-weight: bold; margin: 0; color: #444; }
            
            .c-body { flex: 1; }
            .c-nome { font-size: 12px; font-weight: 900; margin-bottom: 2mm; line-height: 1.2; text-transform: uppercase; }
            .c-dados { font-size: 9px; margin: 0; line-height: 1.4; }
            
            .c-icones { display: flex; justify-content: space-between; margin-bottom: 2mm; }
            .icon-box { width: 18mm; height: 18mm; border: 1px solid #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
            .icon-box img { max-width: 16mm; max-height: 16mm; object-fit: contain; }

            .c-footer { width: 100%; padding: 2mm 0; text-align: center; border-radius: 4px; font-weight: bold; font-size: 9px; display: flex; align-items: center; justify-content: center; gap: 5px; color: #000; border: 1px solid #000;}
            .c-footer img { width: 12px; height: 12px; }

            /* CRACHÁ PAI (10 POR PÁGINA) */
            .cracha-pai { width: 90mm; height: 52mm; border: 2px dashed #999; border-radius: 8px; padding: 4mm; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #fff; page-break-inside: avoid; justify-content: space-between;}
            .p-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 2mm; }
            .p-ceu { font-size: 12px; font-weight: 900; margin: 0; text-transform: uppercase; }
            .p-periodo { font-size: 9px; font-weight: bold; margin: 0; color: #444; }
            
            .p-body { font-size: 11px; line-height: 1.6; }
            .p-destaque { font-weight: 900; font-size: 12px; text-transform: uppercase; }
        }
    </style>
</head>
<body>

    <div id="areaFormulario" class="container">
        <div class="card-main mt-4">
            <h3 class="mb-4 text-primary" style="font-weight: 900;"><i class="fas fa-id-badge"></i> Gerador de Crachás HTML</h3>
            <p style="font-size: 15px; color: #7f8c8d; margin-bottom: 25px;">
                O sistema desenha os crachás automaticamente na sua tela! As crianças sairão agrupadas (8 por folha) e os pais logo em seguida (10 por folha).
            </p>

            <button id="btnGatilho" class="btn-gerar" onclick="iniciarGeracao()">
                <i class="fas fa-print me-2"></i> IMPRIMIR CRACHÁS (CRIANÇAS + PAIS)
            </button>

            <hr style="border-color: #ecf0f1; margin: 25px 0;">
            <p style="font-size: 13px; color: #e74c3c; font-weight: 700; margin-bottom: 10px;">A impressão ocorreu sem erros? Libere a fila:</p>
            <button class="btn-limpar" onclick="limparFila()">
                <i class="fas fa-eraser me-2"></i> Limpar Fila (Apagar marcações "SIM")
            </button>
        </div>
    </div>

    <!-- O CONTEÚDO HTML VAI RENDERIZAR AQUI DENTRO PARA IMPRESSÃO -->
    <div id="areaImpressao"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec"; // SEU LINK AQUI
        
        async function iniciarGeracao() {
            const idPlanilha = localStorage.getItem('ceu_planilha_id');
            const nomeCeu = localStorage.getItem('ceu_nome_especifico') || "CEU";

            if (!idPlanilha) return Swal.fire('Erro', 'Banco de Dados não conectado!', 'error');

            const btn = document.getElementById('btnGatilho');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Desenhando Crachás...';
            btn.disabled = true;

            const pacote = { acao: "buscarDadosCrachasHTML", dados: { idPlanilha: idPlanilha, nomeCeu: nomeCeu } };

            try {
                const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
                const res = await resRaw.json();
                let r = res.dados || res; // Antibug do wrapper

                btn.innerHTML = '<i class="fas fa-print me-2"></i> IMPRIMIR CRACHÁS (CRIANÇAS + PAIS)';
                btn.disabled = false;

                if (r.sucesso === true || res.status === "sucesso") {
                    montarHTMLImpressao(r.fila, r.regras, r.nomeCeu);
                } else {
                    Swal.fire('Aviso', r.erro || res.mensagem || 'Erro desconhecido', 'error');
                }
            } catch (e) {
                btn.innerHTML = '<i class="fas fa-print me-2"></i> IMPRIMIR CRACHÁS (CRIANÇAS + PAIS)';
                btn.disabled = false;
                Swal.fire('Erro de Conexão', 'Não foi possível comunicar com o servidor.', 'error');
            }
        }

        function montarHTMLImpressao(fila, regras, nomeCeu) {
            let htmlHTML = "";

            // ==========================================
            // 1. GERAR PÁGINAS DAS CRIANÇAS (8 por folha)
            // ==========================================
            const paginasCriancas = Math.ceil(fila.length / 8);
            for (let p = 0; p < paginasCriancas; p++) {
                htmlHTML += `<div class="folha">`;
                for (let c = 0; c < 8; c++) {
                    let index = (p * 8) + c;
                    if (index >= fila.length) break;
                    let aluno = fila[index];

                    // Processar Ícones
                    let imgDieta = aluno.dieta ? regras.dieta.sim : regras.dieta.nao;
                    let imgFoto  = aluno.restImg ? regras.img.sim : regras.img.nao;
                    let imgInc   = aluno.inclusao ? regras.inclusao.sim : regras.inclusao.nao;
                    let imgPisc  = aluno.piscina ? regras.piscina.sim : regras.piscina.nao;
                    
                    let bgSozinho = aluno.sozinho ? regras.sozinho.simCor : regras.sozinho.naoCor;
                    let imgSozinho = aluno.sozinho ? regras.sozinho.simIcone : regras.sozinho.naoIcone;
                    let tagImgSozinho = imgSozinho ? `<img src="${imgSozinho}">` : '';

                    htmlHTML += `
                    <div class="cracha-crianca">
                        <div class="c-header">
                            <p class="c-ceu">${nomeCeu}</p>
                            <p class="c-periodo">${regras.periodo}</p>
                        </div>
                        <div class="c-body">
                            <p class="c-nome">${aluno.nome}</p>
                            <p class="c-dados"><b>IDADE:</b> ${aluno.idade} anos</p>
                            <p class="c-dados"><b>RESP:</b> ${aluno.resp}</p>
                            <p class="c-dados"><b>TEL:</b> ${aluno.tel}</p>
                        </div>
                        <div class="c-icones">
                            <div class="icon-box">${imgDieta ? `<img src="${imgDieta}">` : ''}</div>
                            <div class="icon-box">${imgFoto ? `<img src="${imgFoto}">` : ''}</div>
                            <div class="icon-box">${imgInc ? `<img src="${imgInc}">` : ''}</div>
                            <div class="icon-box">${imgPisc ? `<img src="${imgPisc}">` : ''}</div>
                        </div>
                        <div class="c-footer" style="background-color: ${bgSozinho};">
                            ${tagImgSozinho} VAI DESACOMPANHADO? ${aluno.sozinho ? 'SIM' : 'NÃO'}
                        </div>
                    </div>`;
                }
                htmlHTML += `</div>`;
            }

            // ==========================================
            // 2. GERAR PÁGINAS DOS PAIS (10 por folha)
            // ==========================================
            const paginasPais = Math.ceil(fila.length / 10);
            for (let p = 0; p < paginasPais; p++) {
                htmlHTML += `<div class="folha">`;
                for (let c = 0; c < 10; c++) {
                    let index = (p * 10) + c;
                    if (index >= fila.length) break;
                    let aluno = fila[index];

                    htmlHTML += `
                    <div class="cracha-pai">
                        <div class="p-header">
                            <p class="p-ceu">${nomeCeu}</p>
                            <p class="p-periodo">${regras.periodo}</p>
                            <p class="p-periodo" style="margin-top:2px;"><b>CRACHÁ DO RESPONSÁVEL</b></p>
                        </div>
                        <div class="p-body">
                            <div>CRIANÇA:<br><span class="p-destaque">${aluno.nome}</span></div>
                            <div style="margin-top:5px;">IDADE: <span class="p-destaque">${aluno.idade}</span></div>
                            <div style="margin-top:5px;">RESPONSÁVEL:<br><span class="p-destaque">${aluno.resp}</span></div>
                        </div>
                    </div>`;
                }
                htmlHTML += `</div>`;
            }

            // Manda para a tela e aciona a impressora
            document.getElementById("areaImpressao").innerHTML = htmlHTML;
            setTimeout(() => {
                window.print();
                // Limpa a tela após a impressão sem recarregar
                setTimeout(() => { document.getElementById("areaImpressao").innerHTML = ""; }, 1000);
            }, 500);
        }

        function limparFila() {
            Swal.fire({
                title: 'Limpar a fila?', text: "Apagar a palavra SIM da coluna I?", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#e74c3c', confirmButtonText: 'Sim, limpar fila!'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Limpando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    const pacote = { acao: "limparFilaCrachasRecreio", dados: { idPlanilha: localStorage.getItem('ceu_planilha_id') } };
                    
                    try {
                        const resRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
                        const res = await resRaw.json();
                        let r = res.dados || res;

                        if (r.sucesso === true || res.status === "sucesso") {
                            Swal.fire('Pronto!', r.mensagem || 'Fila limpa.', 'success');
                        } else {
                            Swal.fire('Erro', r.erro || res.mensagem, 'error');
                        }
                    } catch (e) { Swal.fire('Erro', 'Falha na conexão.', 'error'); }
                }
            });
        }
    </script>
</body>
</html>
