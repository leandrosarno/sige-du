<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressão - Chamada Qualitativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #000; }
        
        /* Painel de Controle (Oculto na impressão) */
        .painel-controle { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Estilo da Tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #000; padding: 6px; text-align: center; vertical-align: middle; font-size: 12px; }
        th { background-color: #f1f3f5; font-weight: bold; }
        .col-nome { text-align: left !important; min-width: 250px; font-weight: bold; }
        .col-turma { font-weight: bold; width: 60px; }
        .texto-p { color: #198754; font-weight: bold; }
        .texto-f { color: #dc3545; font-weight: bold; }
        
        /* Cabeçalho do Relatório (Visível apenas após carregar) */
        .cabecalho-relatorio { display: none; text-align: center; margin-bottom: 20px; }
        .cabecalho-relatorio h2 { margin: 0; font-size: 20px; font-weight: bold; text-transform: uppercase; }
        .cabecalho-relatorio p { margin: 5px 0 0 0; font-size: 14px; }

        /* 🖨️ REGRAS DE IMPRESSÃO (A Mágica Acontece Aqui) */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background-color: white; margin: 0; padding: 0; }
            .painel-controle { display: none !important; } /* Some com os botões */
            .cabecalho-relatorio { display: block; }
            table { box-shadow: none; margin-top: 10px; }
            th { background-color: #e9ecef !important; -webkit-print-color-adjust: exact; }
            /* Na impressão em preto e branco, força tons de cinza escuro para leitura */
            .texto-p, .texto-f { color: #000 !important; }
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4" id="area-aplicativo">
        
        <!-- PAINEL DE CONTROLE (Desaparece ao imprimir) -->
        <div class="painel-controle d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h4 class="text-primary fw-bold mb-1"><i class="fas fa-print"></i> Relatório de Frequência</h4>
                <div class="text-muted small">Módulo de Impressão - Recreio nas Férias</div>
            </div>
            
            <div class="d-flex align-items-end gap-3 flex-grow-1" style="max-width: 400px;">
                <div class="flex-grow-1">
                    <label class="form-label small fw-bold text-muted mb-1">Idade para Impressão</label>
                    <select class="form-select" id="sel-idade">
                        <option value="">Selecione...</option>
                        <option value="4">4 Anos</option><option value="5">5 Anos</option><option value="6">6 Anos</option>
                        <option value="7">7 Anos</option><option value="8">8 Anos</option><option value="9">9 Anos</option>
                        <option value="10">10 Anos</option><option value="11">11 Anos</option><option value="12">12 Anos</option>
                        <option value="13">13 Anos</option><option value="14">14 Anos</option>
                    </select>
                </div>
                <button class="btn btn-primary fw-bold" onclick="carregarRelatorio()" id="btn-carregar">
                    <i class="fas fa-search"></i> Gerar
                </button>
                <button class="btn btn-dark fw-bold" onclick="window.print()" id="btn-imprimir" style="display: none;">
                    <i class="fas fa-print"></i> Imprimir A4
                </button>
            </div>
        </div>

        <!-- CABEÇALHO FORMAL DO RELATÓRIO -->
        <div class="cabecalho-relatorio" id="cabecalho-doc">
            <h2>Relatório de Frequência Qualitativa</h2>
            <p><strong>Programa:</strong> Recreio nas Férias | <strong>Faixa Etária:</strong> <span id="lbl-idade-doc"></span></p>
        </div>

        <!-- TABELA DE DADOS -->
        <div id="area-tabela"></div>

    </div>

    <script>
        async function carregarRelatorio() {
            const idade = document.getElementById('sel-idade').value;
            const idPlanilha = localStorage.getItem('ceu_planilha_id');

            if (!idade) {
                Swal.fire('Atenção', 'Selecione uma idade.', 'warning'); return;
            }

            const btn = document.getElementById('btn-carregar');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const pacote = {
                acao: "buscarDadosImpressaoChamada",
                dados: { idPlanilha: idPlanilha, idade: idade }
            };

            try {
                const req = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
                const res = await req.json();

                if (res.sucesso) {
                    document.getElementById('lbl-idade-doc').innerText = idade + " Anos";
                    document.getElementById('cabecalho-doc').style.display = 'block';
                    document.getElementById('btn-imprimir').style.display = 'inline-block';
                    renderizarTabelaImpressao(res.criancas, res.dias);
                } else {
                    Swal.fire('Ops!', res.erro, 'info');
                    document.getElementById('area-tabela').innerHTML = '';
                    document.getElementById('cabecalho-doc').style.display = 'none';
                    document.getElementById('btn-imprimir').style.display = 'none';
                }
            } catch (e) {
                Swal.fire('Erro', 'Falha ao buscar dados para impressão.', 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-search"></i> Gerar';
                btn.disabled = false;
            }
        }

        function renderizarTabelaImpressao(criancas, dias) {
            let html = `<table><thead><tr>
                <th>TURMA</th>
                <th class="col-nome">NOME DA CRIANÇA</th>`;
            
            dias.forEach(d => { html += `<th>${d}</th>`; });
            html += `<th>PRES. (P)</th><th>FALTAS (F)</th></tr></thead><tbody>`;

            criancas.forEach(c => {
                html += `<tr>
                    <td class="col-turma">${c.turma}</td>
                    <td class="col-nome">${c.nome}</td>`;

                c.presencas.forEach(p => {
                    let classeCor = p === 'P' ? 'texto-p' : (p === 'F' ? 'texto-f' : '');
                    html += `<td class="${classeCor}">${p}</td>`;
                });

                html += `<td><strong>${c.totP}</strong></td>
                         <td><strong>${c.totF}</strong></td></tr>`;
            });

            html += `</tbody></table>`;
            
            document.getElementById('area-tabela').innerHTML = html;
        }
    </script>
</body>
</html>
