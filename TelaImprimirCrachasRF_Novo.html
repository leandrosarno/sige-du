<html lang="pt-BR">
<head>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; }
        
        @media print {
            @page { size: A4 portrait; margin: 7mm; }
            body { background: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
            .malha-impressao { gap: 4mm !important; }
        }

        .malha-impressao { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 10px; }

        .cracha {
            width: 9cm; height: 6cm; 
            border: 2px solid #1a202c;
            border-radius: 12px; 
            background: #fff;
            position: relative;
            box-sizing: border-box;
            overflow: hidden; 
            page-break-inside: avoid;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }

        .cabecalho { display: flex; height: 1.2cm; border-bottom: 2px solid #1a202c; background-color: #f8fafc;}
        .logo-sme { width: 1.5cm; border-right: 2px solid #1a202c; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .logo-sme img { max-width: 90%; max-height: 90%; object-fit: contain; }
        
        .textos-cabecalho { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
        .txt-sme { font-size: 7.5pt; font-weight: bold; color: #475569; }
        /* 👈 NOME DO CEU MAIOR E ULTRA NEGRITO */
        .txt-ceu { font-size: 9.5pt; font-weight: 900; color: #0f172a; letter-spacing: 0.5px; margin-top: 1px;}
        .txt-periodo { font-size: 6pt; border-top: 1px solid #cbd5e1; margin-top: 2px; padding-top: 1px; color: #475569; font-weight: bold;}

        .faixa-nome {
            height: 2.0cm; 
            display: flex; align-items: center; justify-content: center;
            border-bottom: 2px solid #1a202c;
            text-align: center; padding: 0 5px;
            font-size: 15pt; font-weight: 900; line-height: 1.1;
            text-transform: uppercase;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.05); 
            text-shadow: 1px 1px 1px rgba(255,255,255,0.5); 
        }

        .rodape { display: flex; height: 2.2cm; position: relative; } 
        
        .bloco-esq { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #1a202c; }
        
        .contatos { display: flex; flex-direction: column; justify-content: center; padding: 2px 5px; height: 0.9cm; border-bottom: 1px solid #1a202c; background-color: #f8fafc;}
        .linha-resp { display: flex; justify-content: space-between; font-size: 6pt; font-weight: bold; color: #64748b; }
        .linha-dados { display: flex; justify-content: space-between; font-size: 7.5pt; font-weight: bold; color: #0f172a;}
        
        /* 👈 ÍCONES MAIORES E SEM TEXTO/BORDA */
        .area-icones { display: flex; justify-content: space-around; padding: 0 10px; height: 1.3cm; align-items: center;}
        .box-icone { display: flex; justify-content: center; align-items: center; width: 22%;}
        .img-icone { height: 1.1cm; width: 1.1cm; border: none; background: transparent; } /* Sem borda, tamanho expandido */
        .img-icone img { width: 100%; height: 100%; object-fit: contain; } /* Contain evita que o ícone corte as pontas */
