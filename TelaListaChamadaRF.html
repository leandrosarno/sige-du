<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Impressão - Recreio nas Férias</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-box { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: white; }
    .btn-opcao { border: 2px solid #e0e6ed; border-radius: 10px; padding: 15px; cursor: pointer; transition: 0.3s; }
    .btn-opcao:hover, .btn-opcao.selecionado { border-color: #0d6efd; background-color: #e8f0fe; }
  </style>
</head>
<body class="p-4">

  <div class="container" style="max-width: 800px;">
    
    <div class="card-box p-4 mb-4 text-center">
      <div class="bg-primary text-white rounded-circle d-inline-flex p-3 mb-2">
        <i class="fa-solid fa-print fs-3"></i>
      </div>
      <h4 class="fw-bold text-dark m-0">Impressão de Listas</h4>
      <small class="text-muted">Frequências, Salas e Assinaturas</small>
    </div>

    <div class="card-box p-4 mb-4">
      <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-file-pdf me-2"></i>1. O que deseja imprimir?</h6>
      <select id="selectTipoDoc" class="form-select form-select-lg fw-bold mb-3 border-primary text-primary">
        <option value="CHAMADA">📋 Lista de Chamada Oficial</option>
        <option value="PORTA">🚪 Listagem para a Porta da Sala</option>
        <option value="ASSINATURA">✍️ Listagem para Assinatura dos Pais</option>
      </select>
    </div>

    <div class="card-box p-4 mb-4">
      <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-users me-2"></i>2. Escolha o Modo de Geração:</h6>
      
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <div class="btn-opcao selecionado" id="cardTodas" onclick="selecionarModo('TODAS')">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="radioModo" id="radioTodas" checked>
              <label class="form-check-label fw-bold text-dark" for="radioTodas">✨ TODAS AS TURMAS</label>
            </div>
            <small class="text-muted d-block mt-1">Gera a documentação de todas as turmas em lote.</small>
          </div>
        </div>

        <div class="col-md-6">
          <div class="btn-opcao" id="cardUnica" onclick="selecionarModo('UNICA')">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="radioModo" id="radioUnica">
              <label class="form-check-label fw-bold text-dark" for="radioUnica">🎯 APENAS UMA TURMA</label>
            </div>
            <small class="text-muted d-block mt-1">Escolha uma turma específica para imprimir.</small>
          </div>
        </div>
      </div>

      <div id="divSelectTurma" class="mb-3" style="display: none;">
        <select id="selectTurma" class="form-select form-select-lg fw-bold">
          <option value="">Carregando turmas...</option>
        </select>
      </div>

      <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mt-2" id="btnGerar" onclick="processarGeracao()">
        <i class="fa-solid fa-gear me-2"></i> Processar e Gerar PDF
      </button>
    </div>

    <div class="card-box p-4" id="divResultado" style="display: none;">
      <h6 class="fw-bold text-success mb-3"><i class="fa-solid fa-circle-check me-2"></i>Documentos Gerados com Sucesso!</h6>
      <div class="mb-3 text-center" id="divZip"></div>
      <div class="list-group" id="listaLinks"></div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec";
    const idPlanilhaAtiva = localStorage.getItem('ceu_planilha_id');
    const nomeCeuAtivo = localStorage.getItem('ceu_nome_especifico') || "CEU";

    let modoSelecionado = 'TODAS';

    window.onload = function() {
      carregarTurmasNoDropdown();
    };

    function selecionarModo(modo) {
      modoSelecionado = modo;
      document.getElementById('cardTodas').classList.toggle('selecionado', modo === 'TODAS');
      document.getElementById('cardUnica').classList.toggle('selecionado', modo === 'UNICA');
      document.getElementById('radioTodas').checked = (modo === 'TODAS');
      document.getElementById('radioUnica').checked = (modo === 'UNICA');
      document.getElementById('divSelectTurma').style.display = (modo === 'UNICA') ? 'block' : 'none';
    }

    async function carregarTurmasNoDropdown() {
      const select = document.getElementById('selectTurma');
      if (!idPlanilhaAtiva) {
        select.innerHTML = '<option value="">⚠️ Planilha não conectada</option>';
        return;
      }
      select.innerHTML = '<option value="">Carregando turmas da planilha...</option>';
      const pacote = { acao: "carregarCriancasRF", dados: { idPlanilha: idPlanilhaAtiva } };

      try {
        const resRaw = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(pacote) });
        const res = await resRaw.json();
        if (res.sucesso && res.criancas) {
          const turmasUnicas = [...new Set(res.criancas.map(c => c.turma).filter(t => t && t !== 'SEM TURMA'))].sort();
          if (turmasUnicas.length === 0) {
            select.innerHTML = '<option value="">Nenhuma turma cadastrada</option>';
          } else {
            select.innerHTML = '<option value="">-- Escolha a Turma --</option>';
            turmasUnicas.forEach(t => select.innerHTML += `<option value="${t}">Turma ${t}</option>`);
          }
        }
      } catch (e) { console.error(e); select.innerHTML = '<option value="">Erro de Conexão</option>'; }
    }

    async function processarGeracao() {
      let turmaAlvo = "TODAS";
      const tipoDoc = document.getElementById('selectTipoDoc').value;

      if (modoSelecionado === 'UNICA') {
        turmaAlvo = document.getElementById('selectTurma').value;
        if (!turmaAlvo) return Swal.fire('Aviso', 'Selecione uma turma na lista!', 'warning');
      }

      const btn = document.getElementById('btnGerar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Gerando Documentos...';
      document.getElementById('divResultado').style.display = 'none';

      // Decide qual motor chamar no Google Apps Script
      const acaoRobo = tipoDoc === 'CHAMADA' ? "gerarListaChamadaRF" : "gerarListasExtrasRF";

      const pacote = {
        acao: acaoRobo,
        dados: {
          idPlanilha: idPlanilhaAtiva,
          nomeCeu: nomeCeuAtivo,
          turmaDesejada: turmaAlvo,
          tipoLista: tipoDoc
        }
      };

      try {
        const resRaw = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(pacote) });
        const res = await resRaw.json();

        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-gear me-2"></i> Processar e Gerar PDF';

        if (res.sucesso || res.status === "sucesso") {
          exibirResultados(res);
        } else {
          Swal.fire('Atenção', res.erro || res.mensagem || 'Falha ao gerar', 'error');
        }
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-gear me-2"></i> Processar e Gerar PDF';
        Swal.fire('Erro', 'Falha na conexão com o Google.', 'error');
      }
    }

    function exibirResultados(res) {
      const divRes = document.getElementById('divResultado');
      const divZip = document.getElementById('divZip');
      const listaLinks = document.getElementById('listaLinks');
      divZip.innerHTML = '';
      listaLinks.innerHTML = '';

      if (res.zip) {
        divZip.innerHTML = `
          <a href="${res.zip}" target="_blank" class="btn btn-success btn-lg fw-bold shadow-sm">
            <i class="fa-solid fa-file-zipper me-2"></i> Baixar Todas (ZIP)
          </a>
        `;
      }
      if (res.paginas && res.paginas.length > 0) {
        res.paginas.forEach(p => {
          listaLinks.innerHTML += `
            <a href="${p.link}" target="_blank" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center fw-bold">
              <span><i class="fa-solid fa-file-pdf text-danger me-2"></i>${p.nome}</span>
              <span class="badge bg-primary rounded-pill">Abrir PDF</span>
            </a>
          `;
        });
      }
      divRes.style.display = 'block';
    }
  </script>
</body>
</html>
