<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="config.js"></script>
    <style>
      body { font-family: 'Nunito', sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #2d3748; }
      .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
      .header-icon { font-size: 35px; color: #ed8936; text-align: center; margin-bottom: 10px; }
      h2 { text-align: center; margin: 0 0 5px 0; color: #2b6cb0; font-weight: 800; font-size: 22px; }
      p { text-align: center; color: #718096; font-size: 14px; margin-bottom: 25px; }
      
      .form-group { margin-bottom: 20px; }
      label { display: block; font-weight: 800; color: #4a5568; margin-bottom: 8px; font-size: 14px; }
      select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600; outline: none; cursor: pointer; }
      select:focus { border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2); }
      
      .btn-gerar { width: 100%; padding: 15px; background: linear-gradient(135deg, #4299e1, #3182ce); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
      .btn-gerar:hover { opacity: 0.9; }
      
      #msg-status { text-align: center; margin-top: 15px; font-weight: 800; font-size: 14px; display: none; padding: 12px; border-radius: 8px; }
      .sucesso { background-color: #c6f6d5; color: #22543d; }
      .erro { background-color: #fed7d7; color: #742a2a; }
      .btn-pdf { display: inline-block; margin-top: 10px; padding: 8px 15px; background: #e53e3e; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
  </head>
  <body>

    <div class="card">
      <div class="header-icon"><i class="fas fa-clipboard-list"></i></div>
      <h2>Listagem Especial</h2>
     
      <div class="form-group">
        <label><i class="fas fa-filter"></i> 1. Qual o tipo de relatório?</label>
        <select id="tipoRelatorio">
          <option value="INCLUSAO">🤝 Crianças de Inclusão</option>
          <option value="DIETA ESPECIAL">🍎 Crianças com Dieta Especial</option>
          <option value="VAI DESACOMPANHADO">🚶‍♂️ Saída Desacompanhado (Vai Sozinho)</option>
          <option value="USO DE PISCINA">🏊‍♂️ Uso de Piscina</option>
          <option value="RESTRICAO DE IMAGEM">📷 Restrição de Imagem</option>
        </select>
      </div>

      <div class="form-group">
        <label><i class="fas fa-sort-alpha-down"></i> 2. Qual a ordem desejada?</label>
        <select id="ordemRelatorio">
          <option value="ALFABETICA">A a Z (Apenas Ordem Alfabética)</option>
          <option value="IDADE_ALFA">Por Idade, depois Alfabética</option>
          <option value="TURMA_IDADE_ALFA">Por Turma, depois Idade, depois Alfabética</option>
        </select>
      </div>

      <button id="btnAcionar" class="btn-gerar" onclick="gerarRelatorio()"><i class="fas fa-file-pdf"></i> Gerar PDF Oficial</button>
      <div id="msg-status"></div>
    </div>

    <script>
      // O SEU LINK DA API FICA AQUI
/*      const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec"; */

      async function gerarRelatorio() {
        const idPlanilha = localStorage.getItem('ceu_planilha_id');
        // 🧠 AQUI PEGAMOS O NOME DO CEU DIRETO DO DASHBOARD!
        const nomeCeu = localStorage.getItem('ceu_nome_especifico') || "CEU Desconhecido"; 

        if (!idPlanilha) {
            alert("⚠️ Erro: Banco de dados do CEU não encontrado.");
            return;
        }

        const config = {
          idPlanilha: idPlanilha,
          nomeCeu: nomeCeu, // Mandando pro servidor
          tipo: document.getElementById('tipoRelatorio').value,
          ordem: document.getElementById('ordemRelatorio').value
        };

        const btn = document.getElementById('btnAcionar');
        const msg = document.getElementById('msg-status');
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando PDF...';
        btn.disabled = true;
        msg.style.display = 'none';

        const pacote = {
            acao: "gerarListagemEspecial",
            dados: config
        };

        try {
            const respostaRaw = await fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) });
            const resposta = await respostaRaw.json();

            btn.innerHTML = '<i class="fas fa-file-pdf"></i> Gerar PDF Oficial';
            btn.disabled = false;
            msg.style.display = 'block';

            const deuCerto = resposta.sucesso === true || resposta.status === "sucesso";
            const textoErro = resposta.erro || resposta.mensagem || JSON.stringify(resposta);

            if (deuCerto) {
              msg.className = "sucesso";
              msg.innerHTML = "✅ Relatório gerado! (" + resposta.quantidade + " crianças).<br><br><a href='" + resposta.urlPdf + "' target='_blank' class='btn-pdf'><i class='fas fa-download'></i> Baixar PDF</a>";
              window.open(resposta.urlPdf, "_blank"); 
            } else {
              msg.className = "erro";
              msg.innerHTML = "❌ Erro: " + textoErro;
            }
        } catch (error) {
            btn.innerHTML = '<i class="fas fa-file-pdf"></i> Gerar PDF Oficial';
            btn.disabled = false;
            msg.style.display = 'block';
            msg.className = "erro";
            msg.innerHTML = "❌ Falha na conexão com o servidor.";
        }
      }
    </script>
  </body>
</html>
