<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
        .card-list { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); border: none; overflow: hidden; }
        .cabecalho-lista { background: #ffffff; padding: 20px 25px; border-bottom: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center; }
        .btn-novo { background: #0d6efd; color: white; font-weight: bold; border-radius: 8px; padding: 10px 20px; transition: 0.3s; }
        .btn-novo:hover { background: #0b5ed7; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(13,110,253,0.3); color: white; }
        .search-box { position: relative; width: 100%; max-width: 400px; }
        .search-box input { border-radius: 20px; padding-left: 40px; border: 1px solid #cbd5e1; background: #f8fafc; }
        .search-box .material-icons { position: absolute; left: 12px; top: 10px; color: #94a3b8; }
        .table-custom { margin-bottom: 0; }
        .table-custom thead { background-color: #f8fafc; color: #475569; font-size: 13px; text-transform: uppercase; }
        .table-custom th { padding: 15px; font-weight: 700; border-bottom: 2px solid #e2e8f0; }
        .table-custom td { padding: 15px; vertical-align: middle; color: #334155; font-size: 14px; border-bottom: 1px solid #f1f5f9; }
        .table-custom tr:hover { background-color: #f8fafc; }
        .foto-miniatura { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; }
        .btn-acao { background: #f1f5f9; color: #475569; border: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 12px; transition: 0.2s; }
        .btn-acao:hover { background: #e2e8f0; color: #0d6efd; }
    </style>
</head>
<body>

    <div class="card-list animate__animated animate__fadeIn">
        
        <div class="cabecalho-lista">
            <div>
                <h4 class="m-0 fw-bold text-dark d-flex align-items-center gap-2">
                    <span class="material-icons text-primary" style="font-size: 28px;">people_alt</span> Munícipes Cadastrados
                </h4>
                <small class="text-muted" id="contador-alunos">Carregando dados...</small>
            </div>
            
            <div class="d-flex gap-3">
                <div class="search-box">
                    <span class="material-icons">search</span>
                    <input type="text" id="campo-busca" class="form-control" placeholder="Buscar por Nome, EOL ou Prontuário..." onkeyup="filtrarTabela()">
                </div>
                <button class="btn btn-novo d-flex align-items-center gap-2" onclick="abrirNovoCadastro()">
                    <span class="material-icons">add_circle</span> Novo Aluno
                </button>
            </div>
        </div>

        <div class="table-responsive" style="max-height: 65vh; overflow-y: auto;">
            <table class="table table-custom table-hover" id="tabela-alunos">
                <thead>
                    <tr>
                        <th class="text-center" width="80">Foto</th>
                        <th>Prontuário / ID</th>
                        <th>Cód. EOL</th>
                        <th>Nome do Munícipe</th>
                        <th>CIN / CPF</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted">
                            <div class="spinner-border text-primary mb-3" role="status"></div>
                            <br>Buscando alunos no banco de dados...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec"; // Cole seu Link API aqui
        let alunosGlobais = [];

        window.onload = function() {
            carregarAlunos();
        };

        function carregarAlunos() {
            const codigoCeu = localStorage.getItem('ceu_codigo_eol');
            if(!codigoCeu) return Swal.fire('Erro', 'CEU não identificado.', 'error');

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({
                    acao: "listarAlunosNovoSistema",
                    dados: { idCeu: codigoCeu }
                })
            })
            .then(res => res.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    alunosGlobais = retorno.alunos;
                    renderizarTabela(alunosGlobais);
                } else {
                    document.getElementById('corpo-tabela').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">${retorno.mensagem}</td></tr>`;
                }
            })
            .catch(err => {
                document.getElementById('corpo-tabela').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Erro de conexão. Tente novamente.</td></tr>`;
            });
        }

        function renderizarTabela(lista) {
            const tbody = document.getElementById('corpo-tabela');
            document.getElementById('contador-alunos').innerText = `${lista.length} aluno(s) encontrado(s)`;
            
            if(lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted"><span class="material-icons fs-1 mb-2">person_off</span><br>Nenhum aluno cadastrado ainda.</td></tr>`;
                return;
            }

            let html = '';
            lista.forEach(al => {
                const urlFoto = (al.foto && al.foto.includes('http')) ? al.foto : 'https://via.placeholder.com/100/cbd5e1/ffffff?text=FOTO';
                
                // Atributo data-busca esconde o texto que será usado no filtro da pesquisa
                html += `
                <tr data-busca="${al.nome.toUpperCase()} ${al.eol} ${al.prontuario} ${al.cpf}">
                    <td class="text-center"><img src="${urlFoto}" class="foto-miniatura"></td>
                    <td class="fw-bold text-primary">${al.prontuario} <br><small class="text-muted fw-normal">${al.idAluno}</small></td>
                    <td class="fw-bold">${al.eol}</td>
                    <td class="fw-bold">${al.nome}</td>
                    <td class="text-muted">${al.cpf || '-'}</td>
                    <td class="text-center">
                        <button class="btn-acao" onclick="editarAluno('${al.idAluno}')">
                            <span class="material-icons align-middle fs-6">edit</span> EDITAR
                        </button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // Filtro em tempo real (Pesquisa Super Rápida no navegador)
        function filtrarTabela() {
            const termo = document.getElementById('campo-busca').value.toUpperCase();
            const linhas = document.querySelectorAll('#corpo-tabela tr');
            
            linhas.forEach(linha => {
                const dadosEscondidos = linha.getAttribute('data-busca');
                if(dadosEscondidos && dadosEscondidos.includes(termo)) {
                    linha.style.display = '';
                } else {
                    linha.style.display = 'none';
                }
            });
        }

        // A Ponte para a Tela de Cadastro que já fizemos!
        function abrirNovoCadastro() {
            // Como esta tela está dentro do iframe do Dashboard, pedimos pro Dashboard mudar a tela!
            window.parent.abrirFormFilho('tela_alunos.html', document.querySelector('.sidebar a.ativo'));
        }

        function editarAluno(id) {
            // Em vez de dar o aviso "Em breve", agora ele abre a tela de cadastro passando o ID!
            window.parent.abrirFormFilho(`tela_alunos.html?id=${id}`, document.querySelector('.sidebar a.ativo'));
        }
    </script>
</body>
</html>
