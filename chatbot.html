<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistente Virtual do CEU Caminho do Mar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cor:#0b5d7a;--cor2:#e6f2f6;--bg:#eef5f8;--txt:#1b2630;--mut:#5b6b77;--sol:#f5b301;--coral:#ee6c4d;--verde:#2fa36b;--azul:#2f9fd0;--linha:#dbe7ed}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#dfe9ef;color:var(--txt);display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100dvh;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 40px #0b5d7a22}

/* Cabeçalho com a faixa de lápis de cor */
header{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px 16px;background:var(--cor);color:#fff}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--sol) 25%,var(--coral) 0 50%,var(--verde) 0 75%,var(--azul) 0)}
header div{flex:1}
header h1{font-size:17px;font-weight:800;line-height:1.25}
header small{font-size:12px;font-weight:600;opacity:.92}
header small:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fe38a;margin-right:6px}
#logo{height:38px;max-width:120px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--cor2);flex:none}
header .av{width:46px;height:46px;border:2px solid #fff8}

/* Área do chat com marca d'água ao centro */
.stage{position:relative;flex:1;min-height:0;display:flex;background:var(--bg)}
#marca{position:absolute;inset:0;margin:auto;width:min(60%,320px);max-height:60%;object-fit:contain;opacity:.10;filter:brightness(0);pointer-events:none;user-select:none}
#chat{position:relative;flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}

.m{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:in .25s ease}
.m.user{align-self:flex-end}
.b{padding:10px 14px;border-radius:18px;line-height:1.5;font-size:15px;background:#fff;box-shadow:0 1px 3px #0b5d7a1f;overflow-wrap:anywhere;min-width:0}
.bot .b{border-bottom-left-radius:4px}
.user .b{background:var(--cor);color:#fff;border-bottom-right-radius:4px}

/* Itens com logotipo (colunas C e D) */
.l{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px}
.it,.card{--ac:var(--sol)}
.it:nth-child(4n+2),.card:nth-child(4n+2){--ac:var(--coral)}
.it:nth-child(4n+3),.card:nth-child(4n+3){--ac:var(--verde)}
.it:nth-child(4n),.card:nth-child(4n){--ac:var(--azul)}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#f8fbfc;border:1px solid var(--linha);border-left:6px solid var(--ac);border-radius:6px 14px 14px 6px}
.lw{flex:none;width:64px;height:64px;display:grid;place-items:center;padding:6px;background:#fff;border:1px solid var(--linha);border-radius:12px}
.lg{max-width:100%;max-height:100%;object-fit:contain}
.ini{width:100%;height:100%;display:grid;place-items:center;border-radius:8px;background:var(--cor2);background:color-mix(in srgb,var(--ac) 24%,#fff);color:var(--cor);font-size:26px;font-weight:800}
.tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.tx b{font-size:15px;font-weight:800}
.tx span{color:var(--mut);font-size:14px;white-space:pre-line}
.go{align-self:flex-start;margin-top:6px;padding:6px 12px;border-radius:999px;background:var(--cor);color:#fff;font-size:13px;font-weight:700;text-decoration:none;transition:background .15s}
.go:hover,.go:focus-visible{background:#0e7a9c;outline:0}

.nuc{margin-top:14px;padding-bottom:4px;border-bottom:2px solid var(--sol);font-weight:800;color:var(--cor)}
.nuc:before{content:"🏫 "}
.sel{width:100%;margin-top:6px;padding:10px 12px;border:1.5px solid var(--cor);border-radius:10px;background:#fff;color:var(--txt);font:inherit;font-size:16px}
.col{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.col .chip{width:100%;text-align:left}

/* Redes sociais */
.socs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.soc{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border:1px solid var(--linha);border-radius:14px;background:#fff;text-decoration:none;transition:transform .15s,background .15s}
.soc:hover,.soc:focus-visible{background:var(--cor2);transform:translateY(-2px);outline:0}
.soc b{font-size:26px;font-weight:400;line-height:1}
.soc img{width:34px;height:34px;object-fit:contain}
.soc.t{width:auto;height:44px;padding:0 14px}
.soc.t b{font-size:14px;font-weight:700;color:var(--cor)}

/* Cartões de turmas e unidades */
.card{margin-top:8px;padding:10px 12px;border:1px solid var(--linha);border-left:6px solid var(--ac);border-radius:6px 12px 12px 6px;background:#f8fbfc;font-size:14px}
.card h4{font-size:15px;font-weight:800;color:var(--cor);margin-bottom:4px}
.card p{color:var(--mut)}
.card a{color:var(--cor);font-weight:700}

.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--cor);color:var(--cor);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip:hover,.chip:focus-visible{background:var(--cor);color:#fff;outline:0}
footer{border-top:1px solid #e1e7ec;padding:10px 12px;background:#fff}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;border:1.5px solid #cfdce4;border-radius:999px;padding:10px 16px;font:inherit;font-size:16px;outline:0}
input:focus{border-color:var(--cor);box-shadow:0 0 0 3px #0b5d7a22}
.send{border:0;background:var(--cor);color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:p 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes p{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="av" id="hav" alt="">
    <div><h1 id="titulo"></h1><small>Online</small></div>
    <img id="logo" alt="Logotipo da escola">
  </header>
  <div class="stage">
    <img id="marca" alt="" aria-hidden="true">
    <main id="chat" aria-live="polite"></main>
  </div>
  <footer>
    <div id="chips"></div>
    <form id="f"><input id="q" placeholder="Digite sua dúvida ou escolha uma opção" autocomplete="off"><button class="send" aria-label="Enviar">➤</button></form>
  </footer>
</div>

<script>
/* ===== CONFIGURAÇÃO ===== */
const CFG={
  sheetId:'1CM5X5d6yoK1_UceTw6Sq-XG-bvwrGxcZpzcbuO6Edyk',
  abaFaq:'FAQ',
  nomeBot:'Marina, a Assistente Virtual',
  escola:'CEU CAMINHO DO MAR',
  avatar:'MARINA AVATAR.png',   // arquivo do avatar, na mesma pasta do index.html
  logo:'/images/logo_branco_sem_fundo.png',        // arquivo do logotipo  /images/logo_branco_sem_fundo.png
  marca:'/images/logo_branco_sem_fundo.png',       // logotipo da marca d'água (centro do chat)
  marcaSilhueta:false   // true = marca d'água cinza clara (ideal para logotipo branco); false = usa as cores do arquivo
};

/* ===== UTILITÁRIOS ===== */
const $=s=>document.querySelector(s),chat=$('#chat'),cache={};
let faq=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ERRO='Não consegui acessar as informações agora. Tente novamente em instantes.';
const erro=m=>Object.assign(new Error(m),{diag:1});
let abaT='Turmas';

/* Imagem: aceita link https, link de compartilhamento do Google Drive ou nome de arquivo da pasta do site */
const imgUrl=s=>{s=(s||'').trim();if(!s)return'';
  const d=s.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]+)/);
  return d?`https://drive.google.com/thumbnail?id=${d[1]}&sz=w400`:/^https?:/i.test(s)?s:encodeURI(s)};
/* Link: completa com https:// quando faltar */
const lnk=s=>{s=(s||'').trim();return s?(/^https?:\/\//i.test(s)?s:'https://'+s):''};
const REDE=[['instagram','📸 Ver no Instagram'],['facebook','👍 Ver no Facebook'],['youtu','▶️ Assistir no YouTube'],['wa.me','💬 Chamar no WhatsApp'],['whatsapp','💬 Chamar no WhatsApp'],['tiktok','🎵 Ver no TikTok'],['linkedin','💼 Ver no LinkedIn']];
const rotulo=u=>{const h=u.toLowerCase().replace(/^https?:\/\/(www\.)?/,'').split('/')[0];return(REDE.find(([k])=>h.includes(k))||[0,'🌐 Visitar site'])[1]};
/* Ícone do botão do menu, conforme a palavra-chave */
const ICO=[['telefone','📞'],['secretaria','🗂️'],['doc','📄'],['unidade','📍'],['rede','📱'],['turma','🎓'],['ativ','🎓'],['parceiro','🤝'],['horario','🕒'],['evento','🎉']];
const ico=s=>{const n=norm(s);return(ICO.find(([k])=>n.includes(k))||[0,'✨'])[1]};
const chip=r=>`<button class="chip" data-tab="${esc(r[1])}" data-lb="${esc(r[0])}"><span aria-hidden="true">${ico(r[0]+' '+r[1])}</span>${esc(r[0])}</button>`;

function csv(t){const r=[];let l=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){l.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;l.push(c);r.push(l);l=[];c=''}
    else c+=ch}
  if(c||l.length){l.push(c);r.push(l)}
  return r}

/* Lê uma aba (a linha 1 é tratada como cabeçalho e ignorada) */
async function aba(nome){
  if(cache[nome])return cache[nome];
  const u=`https://docs.google.com/spreadsheets/d/${CFG.sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(nome)}`;
  const r=await fetch(u);if(!r.ok)throw erro(ERRO);
  const rows=csv(await r.text()).slice(1).filter(l=>l.some(x=>x.trim()));
  if(!rows.length)throw erro(`Não encontrei dados na aba "${esc(nome)}". Confira se o nome é idêntico ao da planilha e se há linhas abaixo do cabeçalho.`);
  return cache[nome]=rows;
}

/* ===== MENSAGENS ===== */
function msg(html,who='bot'){
  const d=document.createElement('div');d.className='m '+who;
  d.innerHTML=(who=='bot'?`<img class="av" src="${CFG.avatar}" alt="" onerror="this.style.opacity=0">`:'')+`<div class="b">${html}</div>`;
  chat.append(d);chat.scrollTop=chat.scrollHeight;return d.querySelector('.b');
}
async function bot(fn){
  const b=msg('<span class="dots"><i></i><i></i><i></i></span>');
  const [,h]=await Promise.all([wait(550),fn().catch(e=>e.diag?e.message:ERRO)]);
  b.innerHTML=h;b.parentElement.scrollIntoView({block:b.offsetHeight>chat.clientHeight*.8?'start':'end',behavior:'smooth'});
}

/* Se a imagem do logotipo não carregar, mostra a inicial do título */
document.addEventListener('error',e=>{const i=e.target;
  if(i.classList&&i.classList.contains('lg'))i.replaceWith(Object.assign(document.createElement('span'),{className:'ini',textContent:[...(i.alt||'')][0]||'•'}));
},true);

/* ===== RESPOSTAS POR ABA ===== */
/* Item genérico: A = título, B = descrição, C = imagem (opcional), D = link (opcional) */
const item=(a,b,c,d,comImg)=>{
  const src=imgUrl(c),u=lnk(d);
  const tile=src?`<span class="lw"><img class="lg" src="${esc(src)}" alt="${esc(a)}" loading="lazy" referrerpolicy="no-referrer"></span>`
    :comImg?`<span class="lw"><span class="ini">${esc([...String(a)][0]||'•')}</span></span>`:'';
  return `<li class="it">${tile}<div class="tx"><b>${esc(a)}</b>${b?`<span>${esc(b)}</span>`:''}${u?`<a class="go" href="${esc(u)}" target="_blank" rel="noopener">${rotulo(u)}</a>`:''}</div></li>`;
};
const lista=(rows,fa)=>{const comImg=rows.some(r=>(r[2]||'').trim());
  return '<ul class="l">'+rows.map(r=>{const[a,b]=fa?fa(r):[r[0],r[1]];return item(a,b,r[2],r[3],comImg)}).join('')+'</ul>'};
const menu=()=>'<div class="col">'+[...faq].sort((a,b)=>ord(a[0],b[0])).map(chip).join('')+'</div>';
const vazio='Ainda não há informações cadastradas nesta seção.';

const R={
  telefones:async n=>{const r=await aba(n);return r.length?'Este é nosso PABX 3396-5600 e estas são nossas opções de atendimento:'+lista(r,x=>['Opção '+x[0],x[1]]):vazio},
  secretaria:async n=>{const r=await aba(n);return r.length?'A secretaria atende nos seguintes dias e horários:'+lista(r):vazio},
  docs:async n=>{const r=await aba(n);return r.length?'Estes são os documentos disponíveis:'+lista(r):vazio},
  unidades:async n=>{const r=await aba(n);return r.length?'Conheça nossas unidades:'+r.map(x=>`<div class="card"><h4>${esc(x[0])}</h4><p>📍 ${esc(x[1])}</p><p>🕒 Atendimento: ${esc(x[2])}</p><p>📞 <a href="tel:${esc((x[3]||'').replace(/[^\d+]/g,''))}">${esc(x[3])}</a></p></div>`).join(''):vazio},
  redes:async n=>{
    const r=(await aba(n)).filter(x=>(x[1]||'').trim());
    return 'Siga a gente nas redes sociais:<div class="socs">'+r.map(x=>{
      const u=lnk(x[1]),dom=u.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/.*$/,''),i=(x[0]||'').trim(),img=/\.(png|jpe?g|svg|webp|gif)(\?\S*)?$/i.test(i)||/drive\.google\.com/i.test(i);
      const ic=img?`<img src="${esc(imgUrl(i))}" alt="${esc(dom)}">`:`<b>${esc(i||dom)}</b>`;
      return `<a class="soc${img||(i&&[...i].length<=3)?'':' t'}" href="${esc(u)}" target="_blank" rel="noopener" title="${esc(dom)}">${ic}</a>`;
    }).join('')+'</div>';
  },
  turmas:async n=>{
    abaT=n;const t=await turmas(n),ano=new Date().getFullYear();
    if(!t.length)return `Ainda não há turmas cadastradas para ${ano}.`;
    return `Qual atividade você procura? Escolha o núcleo e a atividade (turmas de ${ano}):`+
      porNucleo(t).map(([n,l])=>`<div class="nuc">${esc(n)}</div><select class="sel" data-nuc="${esc(n)}" aria-label="Atividades de ${esc(n)}"><option value="" disabled selected>Escolha a atividade</option><option value="*">Todas deste núcleo</option>`+[...new Set(l.map(x=>x.mod))].sort(ord).map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')+`</select>`).join('');
  }
};

/* Turmas do ano corrente; mesma turma em vários dias vira um único cartão */
async function turmas(n){
  const ano=new Date().getFullYear(),m=new Map();
  const rows=await aba(n);
  rows.forEach(r=>{
    if(parseInt(String(r[10]).replace(/\D/g,''))!==ano)return;
    const id=((r[0]||'')+(r[1]||'')).trim();
    if(!m.has(id))m.set(id,{id,mod:(r[2]||'').trim(),nuc:(r[4]||'').trim()||'Outros',fx:r[3],prof:r[5],hor:[]});
    m.get(id).hor.push(`${r[8]}: ${r[9]}`);
  });
  if(!m.size)throw erro(`Li ${rows.length} linhas da aba "${esc(n)}", mas nenhuma com o ano ${ano} na coluna K. Valores encontrados lá: ${esc([...new Set(rows.map(r=>String(r[10]).trim()))].slice(0,5).join(', '))}.`);
  return[...m.values()];
}
const ord=(a,b)=>String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base',numeric:true});
const porNucleo=t=>{const g=new Map();t.forEach(x=>{if(!g.has(x.nuc))g.set(x.nuc,[]);g.get(x.nuc).push(x)});return[...g.entries()].sort((a,b)=>ord(a[0],b[0]))};
async function mostrarTurmas(mod,nuc){
  msg(esc(mod?(nuc?`${mod} (${nuc})`:mod):(nuc?`Todas de ${nuc}`:'Ver todas')),'user');
  await bot(async()=>{
    const t=(await turmas(abaT)).filter(x=>(!mod||x.mod==mod)&&(!nuc||x.nuc==nuc));
    if(!t.length)return 'Não encontrei turmas para essa atividade.';
    return `Encontrei ${t.length} turma(s):`+porNucleo(t).map(([n,l])=>`<div class="nuc">${esc(n)}</div>`+
      l.sort((a,b)=>ord(a.mod,b.mod)||ord(a.id,b.id)).map(x=>`<div class="card"><h4>${esc(x.id)}</h4><p>${esc(x.mod)}</p><p>🎂 Faixa etária: ${esc(x.fx)}</p><p>👩‍🏫 Professor(a): ${esc(x.prof)}</p><p>🕒 ${x.hor.map(esc).join('<br>')}</p></div>`).join('')).join('');
  });
}

/* Abas sem layout próprio (ex.: PARCEIROS DO CEU) usam o item genérico: A título, B descrição, C imagem, D link */
async function perguntar(texto,tab,rot){
  msg(esc(texto),'user');
  const f=R[Object.keys(R).find(k=>norm(tab).includes(k))]||(async n=>{const r=await aba(n);return r.length?`Aqui está o que encontrei em <b>${esc(rot||texto)}</b>:`+lista(r):vazio});
  await bot(()=>f(tab));
}

/* ===== EVENTOS ===== */
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  if('mod' in c.dataset)mostrarTurmas(c.dataset.mod,c.dataset.nuc);
  else if(c.dataset.tab)perguntar(c.dataset.lb||c.textContent,c.dataset.tab,c.dataset.lb);
});
document.addEventListener('change',e=>{
  const x=e.target.closest('.sel');if(!x||!x.value)return;
  const v=x.value;x.selectedIndex=0;
  mostrarTurmas(v=='*'?'':v,x.dataset.nuc);
});
$('#f').onsubmit=e=>{
  e.preventDefault();const i=$('#q'),v=i.value.trim();if(!v)return;i.value='';
  const n=norm(v),f=n.length>2&&faq.find(x=>norm(x[0]).includes(n)||n.includes(norm(x[0]))||norm(x[1]).includes(n));
  if(f)perguntar(v,f[1],f[0]);
  else{msg(esc(v),'user');bot(async()=>'Não encontrei essa informação, mas posso ajudar com estes assuntos:'+menu())}
};

/* ===== INÍCIO ===== */
(async()=>{
  document.title=CFG.escola+' - '+CFG.nomeBot;
  $('#titulo').textContent=CFG.nomeBot;
  $('#hav').src=CFG.avatar;$('#hav').onerror=function(){this.style.opacity=0};
  $('#logo').src=CFG.logo;$('#logo').onerror=function(){this.remove()};
  const mk=$('#marca');mk.src=CFG.marca;mk.onerror=()=>mk.remove();if(!CFG.marcaSilhueta)mk.style.filter='none';
  await bot(async()=>{
    try{
      faq=(await aba(CFG.abaFaq)).filter(r=>r[0]&&r[1]);
      $('#chips').innerHTML=faq.map(chip).join('');
    }catch(e){return ERRO}
    return `Olá! 👋 Eu sou a ${esc(CFG.nomeBot)} do ${esc(CFG.escola)}. Escolha uma opção abaixo ou digite sua dúvida.`;
  });
})();
</script>
</body>
</html>
