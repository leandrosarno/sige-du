<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            background: #1a252f;
            border-bottom: 1px solid #34495e;
        }

        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }

        .sidebar a:hover, .sidebar a.ativo {
            background: #34495e;
            border-left: 4px solid #0d6efd;
            color: white;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 260px);
        }

        .topbar {
            height: 60px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        #frame-filho {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            background-color: #f4f7f6;
        }
    </style>
</head>
<body>

    <div class="sidebar">
    <div class="sidebar-header">
            <span class="material-icons" id="dash-icone-padrao" style="font-size: 40px;">account_balance</span>
            
            <img id="dash-img-logo" src="" alt="Logo" style="display: none; width: 100%; max-height: 120px; object-fit: contain; margin: 0 auto;">
        </div>

        <a href="#" class="ativo" onclick="abrirFormFilho('inicio.html', this)">
            <span class="material-icons">home</span> Início
        </a>
        <a href="#" onclick="abrirFormFilho('alunos.html', this)">
            <span class="material-icons">people</span> Alunos
        </a>
        <a href="#" onclick="abrirFormFilho('professores.html', this)">
            <span class="material-icons">school</span> Professores
        </a>
        <a href="#" onclick="abrirFormFilho('turmas.html', this)">
            <span class="material-icons">class</span> Turmas
        </a>

        <div style="margin-top: auto;"></div>
        <a href="#" onclick="fazerLogout()" style="background: #c0392b;">
            <span class="material-icons">logout</span> Sair
        </a>
    </div>

    <div class="main-content">
        
<div class="topbar">
            <div>
                <span class="text-muted">Unidade: </span>
                <strong id="lbl-ceu">Carregando...</strong>
            </div>
            <div class="text-end">
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
                    <img id="img-avatar-usuario" src="" alt="Avatar" style="display: none; width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #0d6efd;">
                    <span class="material-icons" id="icone-avatar-padrao" style="font-size: 30px; color: #0d6efd;">account_circle</span>
                    
                    <a href="#" onclick="abrirTrocaSenhaLogado(); return false;" id="lbl-rf" style="font-weight: bold; color: #0d6efd; text-decoration: underline;" title="Clique para alterar a sua senha">
                        RF: Carregando...
                    </a>
                </div>
                <div id="lbl-nome-usuario" style="font-size: 11px; color: #6c757d; font-weight: 600; margin-top: 2px;">
                    Funcionário
                </div>
            </div>
        </div>

        <iframe id="frame-filho" src="inicio.html"></iframe>

    </div>

    <script>
        function abrirFormFilho(urlTela, elementoClicado) {
            document.getElementById('frame-filho').src = urlTela;
            const links = document.querySelectorAll('.sidebar a');
            links.forEach(l => l.classList.remove('ativo'));
            elementoClicado.classList.add('ativo');
        }

const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec"; // 🚨 Cole aqui a URL terminada em /exec

        window.onload = function() {
            try {
                const idPlanilha = localStorage.getItem('ceu_planilha_id');
                const rfLogado = localStorage.getItem('ceu_rf_logado');
                const codigoEol = localStorage.getItem('ceu_codigo_eol');
                const nomeUsuario = localStorage.getItem('ceu_nome_usuario');
                const nomeCeu = localStorage.getItem('ceu_nome_especifico');

                if (!rfLogado) {
                    window.location.href = "index.html"; 
                    return;
                }

                if (!idPlanilha || idPlanilha.trim() === "") {
                    alert("⚠️ Atenção: A sua Unidade (CEU) ainda não tem um Banco de Dados configurado.");
                    window.location.href = "index.html";
                    return;
                }

                // 🎯 ATUALIZA UNIDADE
                if (codigoEol && nomeCeu && nomeCeu.trim() !== "") {
                    document.getElementById('lbl-ceu').innerText = codigoEol + " - " + nomeCeu;
                } else if (codigoEol) {
                    document.getElementById('lbl-ceu').innerText = "EOL: " + codigoEol;
                } else {
                    document.getElementById('lbl-ceu').innerText = "ID: " + idPlanilha;
                }

                // 🎯 ATUALIZA RF E NOME DO FUNCIONÁRIO
 // 🎯 ATUALIZA RF, NOME E FOTO DO FUNCIONÁRIO
                document.getElementById('lbl-rf').innerText = "RF: " + rfLogado;
                
                if (nomeUsuario && nomeUsuario !== "undefined" && nomeUsuario.trim() !== "") {
                    document.getElementById('lbl-nome-usuario').innerText = nomeUsuario;
                } else {
                    document.getElementById('lbl-nome-usuario').innerText = "Funcionário";
                }

                // 📸 Carrega a foto do Avatar
                const fotoUser = localStorage.getItem('ceu_foto_usuario');
                if (fotoUser && fotoUser !== "undefined" && fotoUser.trim() !== "") {
                    document.getElementById('icone-avatar-padrao').style.display = 'none';
                    const imgAvatar = document.getElementById('img-avatar-usuario');
                    imgAvatar.src = fotoUser;
                    imgAvatar.style.display = 'block';
                }

                // 🎯 CARREGA LOGO
                const logoSalva = localStorage.getItem('ceu_logo_especifica');
                const tamanhoSalvo = localStorage.getItem('ceu_tamanho_logo'); 
                const imgDash = document.getElementById('dash-img-logo');
                const iconePadrao = document.getElementById('dash-icone-padrao');

                if (logoSalva && imgDash) {
                    if (iconePadrao) iconePadrao.style.display = 'none';
                    imgDash.src = logoSalva;
                    if (tamanhoSalvo) imgDash.style.height = tamanhoSalvo;
                    imgDash.style.display = 'block';
                }
            } catch (erro) {
                console.error("Erro ao carregar Dashboard:", erro);
            }
        };

// ==========================================
        // 🔑 POP-UP PARA ALTERAR SENHA E FOTO
        // ==========================================
        function abrirTrocaSenhaLogado() {
            const rf = localStorage.getItem('ceu_rf_logado');
            const ceu = localStorage.getItem('ceu_codigo_eol');

            Swal.fire({
                title: 'Meu Perfil',
                html: `
                    <div style="text-align: left; font-size: 14px;">
                        <label class="fw-bold mt-2" style="color: #0d6efd;">📷 Alterar Minha Foto:</label>
                        <input type="file" id="swal-foto" class="form-control mb-2" accept="image/*" onchange="previewAvatar(event)">
                        <div style="text-align: center;">
                            <img id="swal-preview-foto" src="" style="display: none; width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #0d6efd; margin: 5px auto;">
                        </div>

                        <hr style="margin: 15px 0;">

                        <label class="fw-bold mt-2">Senha Atual:</label>
                        <input type="password" id="swal-senha-atual" class="swal2-input" style="margin-top: 5px;" placeholder="Sua senha atual">
                        
                        <label class="fw-bold mt-2">Nova Senha:</label>
                        <input type="password" id="swal-nova-senha" class="swal2-input" style="margin-top: 5px;" placeholder="Mínimo 8 caracteres">
                        
                        <label class="fw-bold mt-2">Confirmar Nova Senha:</label>
                        <input type="password" id="swal-conf-senha" class="swal2-input" style="margin-top: 5px;" placeholder="Repita a nova senha">
                        
                        <div class="text-muted mt-2" style="font-size:12px; background: #f8f9fa; padding: 10px; border-radius: 8px;">
                            Sua nova senha deve ter entre 8 e 12 caracteres, contendo:<br>
                            ✔️ 1 Letra Maiúscula | ✔️ 1 Letra minúscula<br>
                            ✔️ 1 Número | ✔️ 1 Símbolo especial (!@#$)
                        </div>
                    </div>
                `,
                confirmButtonText: '💾 Salvar Dados',
                confirmButtonColor: '#198754',
                showCancelButton: true,
                cancelButtonText: 'Cancelar',
                focusConfirm: false,
                preConfirm: async () => {
                    const sAtual = document.getElementById('swal-senha-atual').value.trim();
                    const s1 = document.getElementById('swal-nova-senha').value.trim();
                    const s2 = document.getElementById('swal-conf-senha').value.trim();
                    const fileInput = document.getElementById('swal-foto');

                    if (!sAtual || !s1 || !s2) {
                        Swal.showValidationMessage('⚠️ Preencha todas as senhas para prosseguir!');
                        return false;
                    }
                    if (s1 !== s2) {
                        Swal.showValidationMessage('⚠️ As novas senhas não conferem!');
                        return false;
                    }
                    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                        Swal.showValidationMessage('⚠️ A nova senha não atende aos requisitos de segurança!');
                        return false;
                    }

                    // Lê a foto escolhida (se houver)
                    let fotoBase64 = null;
                    let nomeArquivo = null;

                    if (fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        nomeArquivo = file.name;
                        
                        // Converte a foto para Base64 usando uma Promessa
                        fotoBase64 = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = e => resolve(e.target.result);
                            reader.onerror = e => reject(e);
                            reader.readAsDataURL(file);
                        });
                    }

                    return { senhaAtual: sAtual, novaSenha: s1, fotoBase64: fotoBase64, nomeArquivo: nomeArquivo };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'A gravar dados e foto...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

                    const pacote = {
                        acao: "alterarSenhaLogado",
                        dados: {
                            rf: rf,
                            ceu: ceu,
                            senhaAtual: result.value.senhaAtual,
                            novaSenha: result.value.novaSenha,
                            fotoBase64: result.value.fotoBase64,
                            nomeArquivo: result.value.nomeArquivo
                        }
                    };

                    fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) })
                    .then(res => res.json())
                    .then(retorno => {
                        if (retorno.status === "sucesso") {
                            // 🎯 A MÁGICA FINAL: Atualiza a foto na tela instantaneamente!
                            if (retorno.novaFoto && retorno.novaFoto !== "") {
                                localStorage.setItem('ceu_foto_usuario', retorno.novaFoto);
                                document.getElementById('icone-avatar-padrao').style.display = 'none';
                                const imgAvatar = document.getElementById('img-avatar-usuario');
                                imgAvatar.src = retorno.novaFoto;
                                imgAvatar.style.display = 'block';
                            }
                            Swal.fire('Sucesso!', retorno.mensagem, 'success');
                        } else {
                            Swal.fire('Atenção', retorno.mensagem, 'warning');
                        }
                    })
                    .catch(err => {
                        Swal.fire('Erro', 'Falha ao conectar com o servidor.', 'error');
                    });
                }
            });
        }

        // Função para mostrar a miniatura da foto dentro do Pop-up antes de salvar
        function previewAvatar(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('swal-preview-foto');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function fazerLogout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
