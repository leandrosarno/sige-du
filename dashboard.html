<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            background: #1a252f;
            border-bottom: 1px solid #34495e;
        }

        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }

        .sidebar a:hover, .sidebar a.ativo {
            background: #34495e;
            border-left: 4px solid #0d6efd;
            color: white;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 260px);
        }

        .topbar {
            height: 60px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        #frame-filho {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            background-color: #f4f7f6;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span class="material-icons" id="dash-icone-padrao" style="font-size: 40px;">account_balance</span>
            
            <img id="dash-img-logo" src="" alt="Logo" style="display: none; width: 100%; max-height: 120px; object-fit: contain; margin: 0 auto 10px auto;">
            
            <h5 class="mt-2 mb-0" id="dash-nome-sistema"></h5>
        </div>

        <a href="#" class="ativo" onclick="abrirFormFilho('inicio.html', this)">
            <span class="material-icons">home</span> Início
        </a>
        <a href="#" onclick="abrirFormFilho('alunos.html', this)">
            <span class="material-icons">people</span> Alunos
        </a>
        <a href="#" onclick="abrirFormFilho('professores.html', this)">
            <span class="material-icons">school</span> Professores
        </a>
        <a href="#" onclick="abrirFormFilho('turmas.html', this)">
            <span class="material-icons">class</span> Turmas
        </a>

        <div style="margin-top: auto;"></div>
        <a href="#" onclick="fazerLogout()" style="background: #c0392b;">
            <span class="material-icons">logout</span> Sair
        </a>
    </div>

    <div class="main-content">
        
        <div class="topbar">
            <div>
                <span class="text-muted">Unidade: </span>
                <strong id="lbl-ceu">Carregando...</strong>
            </div>
            <div>
                <span class="material-icons" style="vertical-align: middle;">account_circle</span>
                <span id="lbl-usuario">Funcionário</span>
            </div>
        </div>

        <iframe id="frame-filho" src="inicio.html"></iframe>

    </div>

    <script>
        function abrirFormFilho(urlTela, elementoClicado) {
            document.getElementById('frame-filho').src = urlTela;
            const links = document.querySelectorAll('.sidebar a');
            links.forEach(l => l.classList.remove('ativo'));
            elementoClicado.classList.add('ativo');
        }

        window.onload = function() {
            try {
                const idPlanilha = localStorage.getItem('ceu_planilha_id');
                const rfLogado = localStorage.getItem('ceu_rf_logado');
                const codigoEol = localStorage.getItem('ceu_codigo_eol');

                // Segurança: se não estiver logado, redireciona
                if (!rfLogado) {
                    window.location.href = "index.html"; 
                    return;
                }

                if (!idPlanilha || idPlanilha.trim() === "") {
                    alert("⚠️ Atenção: A sua Unidade (CEU) ainda não tem um Banco de Dados configurado.");
                    window.location.href = "index.html";
                    return;
                }

                // 🎯 ATUALIZA UNIDADE E RF NO TOPO
                const nomeCeu = localStorage.getItem('ceu_nome_especifico');
                
                if (codigoEol && nomeCeu && nomeCeu.trim() !== "") {
                    document.getElementById('lbl-ceu').innerText = codigoEol + " - " + nomeCeu;
                } else if (codigoEol) {
                    document.getElementById('lbl-ceu').innerText = "EOL: " + codigoEol;
                } else {
                    document.getElementById('lbl-ceu').innerText = "ID: " + idPlanilha;
                }
                document.getElementById('lbl-usuario').innerText = "RF: " + rfLogado;

                // 🎯 CARREGA LOGO E NOME DO CEU ESPECÍFICO
                const nomeSalvo = localStorage.getItem('ceu_nome_especifico');
                const logoSalva = localStorage.getItem('ceu_logo_especifica');
                // Opcional: mantemos a altura padrão se tiver configurado no Geral
                const tamanhoSalvo = localStorage.getItem('ceu_tamanho_logo'); 

                const elNome = document.getElementById('dash-nome-sistema');
                if (elNome) {
                    // Se não tiver nome, mostra vazio para ficar limpo
                    elNome.innerText = (nomeSalvo && nomeSalvo.trim() !== "") ? nomeSalvo : " ";
                }

                const imgDash = document.getElementById('dash-img-logo');
                const iconePadrao = document.getElementById('dash-icone-padrao');

                if (logoSalva && imgDash) {
                    if (iconePadrao) iconePadrao.style.display = 'none';
                    imgDash.src = logoSalva;
                    if (tamanhoSalvo) {
                        imgDash.style.height = tamanhoSalvo;
                    }
                    imgDash.style.display = 'block';
                }
            } catch (erro) {
                console.error("Erro ao carregar Dashboard:", erro);
            }
        };

        function fazerLogout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
