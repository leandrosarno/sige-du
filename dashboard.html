<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            background: #1a252f;
            border-bottom: 1px solid #34495e;
        }

        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }

        .sidebar a:hover, .sidebar a.ativo {
            background: #34495e;
            border-left: 4px solid #0d6efd;
            color: white;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 260px);
        }

        .topbar {
            height: 60px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        #frame-filho {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            background-color: #f4f7f6;
        }
    </style>
</head>
<body>

    <div class="sidebar">
    <div class="sidebar-header">
            <span class="material-icons" id="dash-icone-padrao" style="font-size: 40px;">account_balance</span>
            
            <img id="dash-img-logo" src="" alt="Logo" style="display: none; width: 100%; max-height: 120px; object-fit: contain; margin: 0 auto;">
        </div>

        <a href="#" class="ativo" onclick="abrirFormFilho('inicio.html', this)">
            <span class="material-icons">home</span> Início
        </a>
        <a href="#" onclick="abrirFormFilho('alunos.html', this)">
            <span class="material-icons">people</span> Alunos
        </a>
        <a href="#" onclick="abrirFormFilho('professores.html', this)">
            <span class="material-icons">school</span> Professores
        </a>
        <a href="#" onclick="abrirFormFilho('turmas.html', this)">
            <span class="material-icons">class</span> Turmas
        </a>

        <div style="margin-top: auto;"></div>
        <a href="#" onclick="fazerLogout()" style="background: #c0392b;">
            <span class="material-icons">logout</span> Sair
        </a>
    </div>

    <div class="main-content">
        
<div class="topbar">
            <div>
                <span class="text-muted">Unidade: </span>
                <strong id="lbl-ceu">Carregando...</strong>
            </div>
            <div class="text-end">
                <div>
                    <span class="material-icons" style="vertical-align: middle; font-size: 18px; color: #0d6efd;">account_circle</span>
                    <a href="#" onclick="abrirTrocaSenhaLogado(); return false;" id="lbl-rf" style="font-weight: bold; color: #0d6efd; text-decoration: underline;" title="Clique para alterar a sua senha">
                        RF: Carregando...
                    </a>
                </div>
                <div id="lbl-nome-usuario" style="font-size: 11px; color: #6c757d; font-weight: 600; margin-top: -2px;">
                    Funcionário
                </div>
            </div>
        </div>

        <iframe id="frame-filho" src="inicio.html"></iframe>

    </div>

    <script>
        function abrirFormFilho(urlTela, elementoClicado) {
            document.getElementById('frame-filho').src = urlTela;
            const links = document.querySelectorAll('.sidebar a');
            links.forEach(l => l.classList.remove('ativo'));
            elementoClicado.classList.add('ativo');
        }

const API_URL = "SUA_URL_DO_WEB_APP_AQUI"; // 🚨 Cole aqui a URL terminada em /exec

        window.onload = function() {
            try {
                const idPlanilha = localStorage.getItem('ceu_planilha_id');
                const rfLogado = localStorage.getItem('ceu_rf_logado');
                const codigoEol = localStorage.getItem('ceu_codigo_eol');
                const nomeUsuario = localStorage.getItem('ceu_nome_usuario');
                const nomeCeu = localStorage.getItem('ceu_nome_especifico');

                if (!rfLogado) {
                    window.location.href = "index.html"; 
                    return;
                }

                if (!idPlanilha || idPlanilha.trim() === "") {
                    alert("⚠️ Atenção: A sua Unidade (CEU) ainda não tem um Banco de Dados configurado.");
                    window.location.href = "index.html";
                    return;
                }

                // 🎯 ATUALIZA UNIDADE
                if (codigoEol && nomeCeu && nomeCeu.trim() !== "") {
                    document.getElementById('lbl-ceu').innerText = codigoEol + " - " + nomeCeu;
                } else if (codigoEol) {
                    document.getElementById('lbl-ceu').innerText = "EOL: " + codigoEol;
                } else {
                    document.getElementById('lbl-ceu').innerText = "ID: " + idPlanilha;
                }

                // 🎯 ATUALIZA RF E NOME DO FUNCIONÁRIO
                document.getElementById('lbl-rf').innerText = "RF: " + rfLogado;
                if (nomeUsuario && document.getElementById('lbl-nome-usuario')) {
                    document.getElementById('lbl-nome-usuario').innerText = nomeUsuario;
                }

                // 🎯 CARREGA LOGO
                const logoSalva = localStorage.getItem('ceu_logo_especifica');
                const tamanhoSalvo = localStorage.getItem('ceu_tamanho_logo'); 
                const imgDash = document.getElementById('dash-img-logo');
                const iconePadrao = document.getElementById('dash-icone-padrao');

                if (logoSalva && imgDash) {
                    if (iconePadrao) iconePadrao.style.display = 'none';
                    imgDash.src = logoSalva;
                    if (tamanhoSalvo) imgDash.style.height = tamanhoSalvo;
                    imgDash.style.display = 'block';
                }
            } catch (erro) {
                console.error("Erro ao carregar Dashboard:", erro);
            }
        };

        // ==========================================
        // 🔑 POP-UP PARA ALTERAR A SENHA
        // ==========================================
        function abrirTrocaSenhaLogado() {
            const rf = localStorage.getItem('ceu_rf_logado');
            const ceu = localStorage.getItem('ceu_codigo_eol');

            Swal.fire({
                title: '🔑 Alterar Minha Senha',
                html: `
                    <div style="text-align: left; font-size: 14px;">
                        <label class="fw-bold mt-2">Senha Atual:</label>
                        <input type="password" id="swal-senha-atual" class="swal2-input" placeholder="Digite sua senha atual">
                        
                        <label class="fw-bold mt-2">Nova Senha:</label>
                        <input type="password" id="swal-nova-senha" class="swal2-input" placeholder="Mínimo 8 caracteres">
                        
                        <label class="fw-bold mt-2">Confirmar Nova Senha:</label>
                        <input type="password" id="swal-conf-senha" class="swal2-input" placeholder="Repita a nova senha">
                        
                        <div class="text-muted mt-2" style="font-size:12px;">
                            Sua nova senha deve ter entre 8 e 12 caracteres, contendo:<br>
                            ✔️ 1 Letra Maiúscula<br>
                            ✔️ 1 Letra minúscula<br>
                            ✔️ 1 Número<br>
                            ✔️ 1 Símbolo especial (!@#$)
                        </div>
                    </div>
                `,
                confirmButtonText: '💾 Salvar Nova Senha',
                confirmButtonColor: '#198754',
                showCancelButton: true,
                cancelButtonText: 'Cancelar',
                focusConfirm: false,
                preConfirm: () => {
                    const sAtual = document.getElementById('swal-senha-atual').value.trim();
                    const s1 = document.getElementById('swal-nova-senha').value.trim();
                    const s2 = document.getElementById('swal-conf-senha').value.trim();

                    if (!sAtual || !s1 || !s2) {
                        Swal.showValidationMessage('⚠️ Preencha todos os campos!');
                        return false;
                    }
                    if (s1 !== s2) {
                        Swal.showValidationMessage('⚠️ As novas senhas não conferem!');
                        return false;
                    }
                    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                        Swal.showValidationMessage('⚠️ A nova senha não atende aos requisitos de segurança!');
                        return false;
                    }
                    return { senhaAtual: sAtual, novaSenha: s1 };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'A gravar...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

                    const pacote = {
                        acao: "alterarSenhaLogado",
                        dados: {
                            rf: rf,
                            ceu: ceu,
                            senhaAtual: result.value.senhaAtual,
                            novaSenha: result.value.novaSenha
                        }
                    };

                    fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) })
                    .then(res => res.json())
                    .then(retorno => {
                        if (retorno.status === "sucesso") {
                            Swal.fire('Sucesso!', retorno.mensagem, 'success');
                        } else {
                            Swal.fire('Atenção', retorno.mensagem, 'warning');
                        }
                    })
                    .catch(err => {
                        Swal.fire('Erro', 'Falha ao conectar com o servidor.', 'error');
                    });
                }
            });
        }

        function fazerLogout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
