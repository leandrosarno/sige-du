<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema CEU - Painel Principal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        /* ==========================================
           O DESIGN DO FORM PAI (MDI FORM)
           ========================================== */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh; /* Ocupa 100% da altura da tela */
            overflow: hidden; /* Corta barras de rolagem duplas */
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* O MENU LATERAL (A Barra Fixa) */
        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            background: #1a252f;
            border-bottom: 1px solid #34495e;
        }

        .sidebar-header img {
            max-height: 60px;
            max-width: 100%;
            margin-bottom: 10px;
        }

        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }

        .sidebar a:hover, .sidebar a.ativo {
            background: #34495e;
            border-left: 4px solid #0d6efd;
            color: white;
        }

        /* A ÁREA CENTRAL ONDE RODA O FILHO */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 260px);
        }

        /* O CABEÇALHO DO TOPO */
        .topbar {
            height: 60px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        /* O \"FORM FILHO\" (O iFrame) */
        #frame-filho {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
            background-color: #f4f7f6;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <span class="material-icons" style="font-size: 40px;">account_balance</span>
            <h5 class="mt-2 mb-0" id="nome-sistema">SISTEMA CEU</h5>
        </div>

        <a href="#" class="ativo" onclick="abrirFormFilho('inicio.html', this)">
            <span class="material-icons">home</span> Início
        </a>
        <a href="#" onclick="abrirFormFilho('alunos.html', this)">
            <span class="material-icons">people</span> Alunos
        </a>
        <a href="#" onclick="abrirFormFilho('professores.html', this)">
            <span class="material-icons">school</span> Professores
        </a>
        <a href="#" onclick="abrirFormFilho('turmas.html', this)">
            <span class="material-icons">class</span> Turmas
        </a>

        <div style="margin-top: auto;"></div>
        <a href="#" onclick="fazerLogout()" style="background: #c0392b;">
            <span class="material-icons">logout</span> Sair
        </a>
    </div>

    <div class="main-content">
        
        <div class="topbar">
            <div>
                <span class="text-muted">Unidade: </span>
                <strong id="lbl-ceu">Carregando...</strong>
            </div>
            <div>
                <span class="material-icons" style="vertical-align: middle;">account_circle</span>
                <span id="lbl-usuario">Funcionário</span>
            </div>
        </div>

        <iframe id="frame-filho" src="inicio.html"></iframe>

    </div>

    <script>
        // Função que imita o Delphi: Troca apenas o conteúdo do miolo
        function abrirFormFilho(urlTela, elementoClicado) {
            // Muda a página que está rodando dentro do iFrame
            document.getElementById('frame-filho').src = urlTela;

            // Muda o efeito visual do menu (marca qual está selecionado)
            const links = document.querySelectorAll('.sidebar a');
            links.forEach(l => l.classList.remove('ativo'));
            elementoClicado.classList.add('ativo');
        }

// Função de Segurança: Carregar dados do Login
        window.onload = function() {
            const idPlanilha = localStorage.getItem('ceu_planilha_id');
            const rfLogado = localStorage.getItem('ceu_rf_logado');
            
            // Verifica se fez login
            if(!rfLogado) {
                window.location.href = "index.html"; 
                return;
            }

            // Verifica se o Gestor configurou a planilha daquele CEU na Coluna R
            if(!idPlanilha || idPlanilha.trim() === "") {
                alert("⚠️ Atenção: A sua Unidade (CEU) ainda não tem um Banco de Dados configurado no sistema central. Fale com a Coordenação.");
                window.location.href = "index.html";
                return;
            }

            // Se tudo estiver certo, libera a entrada!
            document.getElementById('lbl-ceu').innerText = "ID do Banco: " + idPlanilha;
            document.getElementById('lbl-usuario').innerText = "RF: " + rfLogado;
        };

        function fazerLogout() {
            // Limpa a memória de segurança e volta para o Login
            localStorage.removeItem('ceu_planilha_id');
            localStorage.removeItem('ceu_rf_logado');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
