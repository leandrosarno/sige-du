<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Painel Principal - Sistema CEU</title> 
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Referência ao config.js do Google Sheets foi removida -->
    
    <style>
        body {
            margin: 0; padding: 0; display: flex; height: 100vh;
            overflow: hidden; background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            width: 220px; background: #2c3e50; color: white;
            display: flex; flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            height: 100vh; overflow-y: auto; overflow-x: hidden; white-space: nowrap;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px; text-align: center; background: #1a252f;
            border-bottom: 1px solid #34495e; transition: all 0.3s;
        }

        .sidebar a {
            color: #ecf0f1; text-decoration: none; padding: 15px 20px;
            display: flex; align-items: center; gap: 12px;
            border-left: 4px solid transparent; transition: all 0.2s;
            font-size: 10px; 
            font-weight: normal !important; 
        }

        .sidebar a:hover, .sidebar a.ativo {
            background: #34495e; border-left: 4px solid #0d6efd; color: white;
        }

        .sidebar .submenu { background: #233140; }
        .sidebar .submenu a { 
            padding-left: 40px; padding-top: 12px; padding-bottom: 12px; 
            font-size: 10px;
            font-weight: normal !important;
        }
        
        .main-content {
            flex-grow: 1; display: flex; flex-direction: column;
            width: calc(100% - 220px);
            transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .topbar {
            height: 60px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 10;
        }

        #frame-filho { flex-grow: 1; border: none; width: 100%; height: 100%; background-color: #f4f7f6; }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: #1a252f; }
        .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .sidebar.recolhido { width: 70px !important; overflow-x: hidden; }
        .main-content.expandido { width: calc(100% - 70px); margin-left: 0; }
        
        .sidebar.recolhido .sidebar-header { padding: 20px 0; display: flex; justify-content: center; }
        .sidebar.recolhido a { padding: 15px 0 !important; justify-content: center !important; align-items: center !important; font-size: 0 !important; }
        
        .sidebar.recolhido a[style*="display: none"], .sidebar.recolhido a.d-none { display: none !important; }
        
        .sidebar.recolhido a .material-icons { color: #ecf0f1; margin: 0 !important; font-size: 24px !important; }
        .sidebar.recolhido a:hover .material-icons, .sidebar.recolhido a.ativo .material-icons { color: white; }
        
        .sidebar.recolhido a > div, .sidebar.recolhido a > span:not(.material-icons),
        .sidebar.recolhido .badge, .sidebar.recolhido .sidebar-header img,
        .sidebar.recolhido a[data-bs-toggle="collapse"] .material-icons:last-child,
        .sidebar.recolhido .submenu { display: none !important; }
        
        .mobile-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5); z-index: 999;
        }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -220px; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
            .sidebar.mobile-open { left: 0; }
            .main-content { width: 100% !important; }
            .topbar { padding: 0 10px; }
        }
    </style>
</head>
<body>

    <div id="mobile-overlay" class="mobile-overlay" onclick="window.alternarMenuLateral()"></div>

    <div class="sidebar">
        <div class="sidebar-header">
            <span class="material-icons" id="dash-icone-padrao" style="font-size: 40px;">account_balance</span>
            <img id="dash-img-logo" src="" alt="Logo" style="display: none; width: 100%; max-height: 120px; object-fit: contain; margin: 0 auto;">
        </div>

        <div id="menu-dinamico-container" style="flex-grow: 1; overflow-y: auto;">
            <div class="text-center text-muted" style="font-size: 11px; margin-top: 20px;">
                <div class="spinner-border spinner-border-sm mb-1" role="status"></div><br>
                Montando Painel...
            </div>
        </div>

        <div style="margin-top: auto;"></div>
        <a href="#" onclick="window.fazerLogout()" style="background: #c0392b;">
            <span class="material-icons">logout</span> Sair
        </a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="btnToggleMenu" class="btn btn-outline-secondary border-0 p-1" onclick="window.alternarMenuLateral()" title="Recolher/Expandir Menu">
                    <i class="fas fa-bars fs-4" style="color: #2c3e50;"></i>
                </button>
                <div style="font-size: 14px;">
                    <span class="text-muted d-none d-sm-inline">Unidade: </span>
                    <strong id="lbl-ceu">Carregando....</strong>
                </div>
            </div>
            
            <div class="text-end">
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
                    <img id="img-avatar-usuario" src="" alt="Avatar" style="display: none; width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #0d6efd;">
                    <span class="material-icons" id="icone-avatar-padrao" style="font-size: 30px; color: #0d6efd;">account_circle</span>
                    
                    <a href="#" onclick="window.abrirTrocaSenhaLogado(); return false;" id="lbl-rf" style="font-weight: bold; color: #0d6efd; text-decoration: underline; font-size: 14px;" title="Clique para alterar a sua senha">
                        RF: Carregando...
                    </a>
                </div>
                <!-- O nome simples do usuário restaurado na Topbar -->
                <div id="lbl-nome-usuario" style="font-size: 11px; color: #6c757d; font-weight: 600; margin-top: 2px;">
                    Funcionário
                </div>
            </div>
        </div>

        <iframe id="frame-filho" src="inicio_FB.html"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- MOTOR FIREBASE INTEGRADO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f",
            measurementId: "G-E5LLYGW7DN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // FUNÇÕES GLOBAIS DE UI 
        // ==========================================
        window.abrirFormFilho = function(nomeDaTelaHTML, elementoClicado) {
            document.getElementById('frame-filho').src = nomeDaTelaHTML;
            const links = document.querySelectorAll('.sidebar a');
            links.forEach(l => l.classList.remove('ativo'));
            if (elementoClicado) elementoClicado.classList.add('ativo');

            if (window.innerWidth <= 768) {
                window.alternarMenuLateral();
            }
        };

        window.removerAtivo = function(elemento) {
            elemento.classList.remove('ativo');
        };

        window.alternarMenuLateral = function() {
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');
            const overlay = document.getElementById('mobile-overlay');
            
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('mobile-open');
                if (overlay.style.display === 'block') {
                    overlay.style.display = 'none';
                } else {
                    overlay.style.display = 'block';
                }
            } else {
                if (sidebar) sidebar.classList.toggle('recolhido');
                if (mainContent) mainContent.classList.toggle('expandido');
            }
        };

        window.fazerLogout = function() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "index_FB.html"; 
        };

        window.previewAvatar = function(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('swal-preview-foto').src = e.target.result; }
                reader.readAsDataURL(file);
            }
        };

        window.abrirTrocaSenhaLogado = function() {
            const rf = localStorage.getItem('sig_rf');
            const ceu = localStorage.getItem('sig_id_unidade');
            const fotoAtual = localStorage.getItem('sig_foto') || '';

            const avatarSrc = (fotoAtual && fotoAtual !== "undefined" && fotoAtual.trim() !== "") 
                ? fotoAtual 
                : 'https://via.placeholder.com/120/0d6efd/ffffff?text=FOTO';

            Swal.fire({
                title: '👤 Meu Perfil',
                html: `
                    <div style="text-align: left; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                        <div style="text-align: center; margin-bottom: 25px; margin-top: 10px;">
                            <div style="position: relative; display: inline-block;">
                                <img id="swal-preview-foto" src="${avatarSrc}" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid #f4f7f6; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
                                <label for="swal-foto" style="position: absolute; bottom: 0; right: 0; background: #0d6efd; color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.3s;">
                                    <span class="material-icons" style="font-size: 20px;">camera_alt</span>
                                </label>
                                <input type="file" id="swal-foto" style="display: none;" accept="image/*" onchange="window.previewAvatar(event)">
                            </div>
                            <div style="margin-top: 10px; font-size: 13px; color: #6c757d; font-weight: 500;">Clique na câmera para enviar sua foto</div>
                        </div>
                        <hr style="border-color: #dee2e6; margin: 20px 0;">
                        <h6 style="color: #0d6efd; font-weight: bold; margin-bottom: 15px;"><span class="material-icons" style="font-size: 18px; vertical-align: text-bottom;">lock_reset</span> Alterar Senha (Opcional)</h6>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted" style="font-size: 13px; font-weight: 600; margin-bottom: 4px;">Senha Atual</label>
                            <input type="password" id="swal-senha-atual" class="form-control form-control-lg" style="border-radius: 8px; font-size: 14px;" placeholder="Digite para alterar a senha">
                        </div>
                        
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted" style="font-size: 13px; font-weight: 600; margin-bottom: 4px;">Nova Senha</label>
                                <input type="password" id="swal-nova-senha" class="form-control form-control-lg" style="border-radius: 8px; font-size: 14px;" placeholder="Mín. 8 caract.">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label text-muted" style="font-size: 13px; font-weight: 600; margin-bottom: 4px;">Confirmar</label>
                                <input type="password" id="swal-conf-senha" class="form-control form-control-lg" style="border-radius: 8px; font-size: 14px;" placeholder="Repita a senha">
                            </div>
                        </div>
                    </div>
                `,
                confirmButtonText: '<span class="material-icons" style="vertical-align: middle; font-size: 18px; margin-right: 5px;">save</span> Salvar Perfil',
                confirmButtonColor: '#0d6efd',
                showCancelButton: true,
                cancelButtonText: 'Cancelar',
                width: '450px',
                focusConfirm: false,
                preConfirm: async () => {
                    const sAtual = document.getElementById('swal-senha-atual').value.trim();
                    const s1 = document.getElementById('swal-nova-senha').value.trim();
                    const s2 = document.getElementById('swal-conf-senha').value.trim();
                    const fileInput = document.getElementById('swal-foto');

                    if (sAtual || s1 || s2) {
                        if (!sAtual || !s1 || !s2) { Swal.showValidationMessage('⚠️ Preencha a Atual, a Nova e a Confirmação!'); return false; }
                        if (s1 !== s2) { Swal.showValidationMessage('⚠️ As novas senhas não conferem!'); return false; }
                        if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                            Swal.showValidationMessage('⚠️ A nova senha deve ter letras, números e símbolos!'); return false;
                        }
                    }

                    if (!sAtual && !s1 && !s2 && fileInput.files.length === 0) {
                        Swal.showValidationMessage('⚠️ Nenhuma alteração informada.'); return false;
                    }

                    let fotoBase64 = null;
                    if (fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        fotoBase64 = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = e => resolve(e.target.result);
                            reader.onerror = e => reject(e);
                            reader.readAsDataURL(file);
                        });
                    }
                    return { senhaAtual: sAtual, novaSenha: s1, fotoBase64: fotoBase64 };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Salvando no Firebase...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

                    const val = result.value;
                    const chaveComposta = `${rf}_${ceu}`;

                    try {
                        const docRef = doc(db, "usuarios", chaveComposta);
                        const docSnap = await getDoc(docRef);

                        if (!docSnap.exists()) {
                            // Fallback caso seja o cadastro muito antigo
                            const q = query(collection(db, "usuarios"), where("rf_usuario", "==", rf), where("id_unidade", "==", ceu));
                            const snap = await getDocs(q);
                            if(snap.empty) {
                                Swal.fire('Erro', 'Usuário não encontrado no banco.', 'error');
                                return;
                            }
                            const userDoc = snap.docs[0];
                            const userData = userDoc.data();
                            if (val.novaSenha && userData.senha_usuario !== val.senhaAtual) {
                                Swal.fire('Atenção', 'A senha atual informada está incorreta.', 'warning');
                                return;
                            }
                            const updates = {};
                            if (val.novaSenha) updates.senha_usuario = val.novaSenha;
                            if (val.fotoBase64) updates.url_foto = val.fotoBase64;
                            await updateDoc(userDoc.ref, updates);
                            if (updates.url_foto) {
                                localStorage.setItem('sig_foto', updates.url_foto);
                                document.getElementById('icone-avatar-padrao').style.display = 'none';
                                const imgAvatar = document.getElementById('img-avatar-usuario');
                                imgAvatar.src = updates.url_foto;
                                imgAvatar.style.display = 'block';
                            }
                            Swal.fire('Elegante!', 'Perfil atualizado com sucesso.', 'success');
                            return;
                        }

                        const userData = docSnap.data();

                        if (val.novaSenha && userData.senha_usuario !== val.senhaAtual) {
                            Swal.fire('Atenção', 'A senha atual informada está incorreta.', 'warning');
                            return;
                        }

                        const updates = {};
                        if (val.novaSenha) updates.senha_usuario = val.novaSenha;
                        if (val.fotoBase64) updates.url_foto = val.fotoBase64;

                        await updateDoc(docRef, updates);

                        if (updates.url_foto) {
                            localStorage.setItem('sig_foto', updates.url_foto);
                            document.getElementById('icone-avatar-padrao').style.display = 'none';
                            const imgAvatar = document.getElementById('img-avatar-usuario');
                            imgAvatar.src = updates.url_foto;
                            imgAvatar.style.display = 'block';
                        }

                        Swal.fire('Elegante!', 'Perfil atualizado com sucesso.', 'success');
                    } catch (error) {
                        console.error(error);
                        Swal.fire('Erro', 'Falha ao atualizar no banco de dados.', 'error');
                    }
                }
            });
        };

        // ==========================================
        // O MOTOR DO MENU DINÂMICO
        // ==========================================
        async function carregarMenuDinamico(perfisUsuario) {
            try {
                const temPermissao = (perfisPermitidos) => {
                    if (!perfisPermitidos || !Array.isArray(perfisPermitidos)) return false;
                    return perfisUsuario.some(p => perfisPermitidos.includes(p));
                };

                const [gavetasSnap, botoesSnap] = await Promise.all([
                    getDocs(collection(db, "gavetas")),
                    getDocs(collection(db, "botoes"))
                ]);

                let gavetas = [];
                gavetasSnap.forEach(doc => gavetas.push(doc.data()));

                let botoes = [];
                botoesSnap.forEach(doc => botoes.push(doc.data()));

                const gavetasPermitidas = gavetas
                    .filter(g => temPermissao(g.perfis_permitidos))
                    .sort((a, b) => Number(a.ordem) - Number(b.ordem));

                const botoesPermitidos = botoes
                    .filter(b => temPermissao(b.perfis_permitidos))
                    .sort((a, b) => Number(a.ordem) - Number(b.ordem));

                let menuHTML = `
                    <a href="javascript:void(0)" class="ativo" id="link-inicio" onclick="window.abrirFormFilho('inicio_FB.html', this)">
                        <span class="material-icons">home</span> Início
                    </a>
                `;

                gavetasPermitidas.forEach(gaveta => {
                    const botoesDaGaveta = botoesPermitidos.filter(b => b.id_gaveta === gaveta.id_gaveta);

                    if (botoesDaGaveta.length > 0) {
                        menuHTML += `
                        <a href="#submenu_${gaveta.id_gaveta}" data-bs-toggle="collapse" style="justify-content: space-between;" onclick="window.removerAtivo(this)">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <span class="material-icons">${gaveta.icone_gaveta}</span> ${gaveta.nome_gaveta}
                            </div>
                            <span class="material-icons" style="font-size: 18px;">expand_more</span>
                        </a>
                        <div class="collapse submenu" id="submenu_${gaveta.id_gaveta}">
                        `;

                        botoesDaGaveta.forEach(botao => {
                            menuHTML += `
                            <a href="javascript:void(0)" onclick="window.abrirFormFilho('${botao.url_destino}', this)">
                                <span class="material-icons" style="font-size: 15px;">${botao.icone || 'chevron_right'}</span> ${botao.nome_botao}
                            </a>
                            `;
                        });

                        menuHTML += `</div>`;
                    }
                });

                document.getElementById('menu-dinamico-container').innerHTML = menuHTML;

            } catch (erro) {
                console.error("Falha ao desenhar o menu dinâmico:", erro);
                document.getElementById('menu-dinamico-container').innerHTML = `<p class="text-danger text-center mt-3">Falha ao carregar os menus do sistema.</p>`;
            }
        }

        // ==========================================
        // INICIALIZAÇÃO FIREBASE E CARREGAMENTO
        // ==========================================
        async function inicializarDashboard() {
            try {
                const rfLogado = localStorage.getItem('sig_rf');
                let idUnidade = localStorage.getItem('sig_id_unidade');
                const nomeUsuario = localStorage.getItem('sig_nome');
                const fotoUser = localStorage.getItem('sig_foto');

                if (!rfLogado) {
                    window.location.href = "index_FB.html";
                    return;
                }

                let perfisUsuario = ["UNIDADE"];
                try {
                    const cru = localStorage.getItem('sig_nivel_acesso') || "UNIDADE";
                    if (cru.startsWith('[')) {
                        let lido = JSON.parse(cru);
                        if (lido.length === 1 && lido[0].includes(',')) {
                            perfisUsuario = lido[0].split(',').map(p => p.trim().toUpperCase());
                        } else {
                            perfisUsuario = lido.map(p => p.trim().toUpperCase());
                        }
                    } else {
                        perfisUsuario = cru.split(',').map(p => p.trim().toUpperCase());
                    }
                } catch (e) {
                    perfisUsuario = ["UNIDADE"];
                }

                const isAdmin = perfisUsuario.includes("ADMIN");
                const isDRE = perfisUsuario.includes("DRE");
                const isSME = perfisUsuario.includes("SME");
                const isProfessor = perfisUsuario.includes("PROFESSOR");
                const isUnidade = perfisUsuario.includes("UNIDADE");

                // PREENCHE DADOS DO USUÁRIO NA BARRA SUPERIOR
                document.getElementById('lbl-rf').innerText = "RF: " + rfLogado;
                
                // Manteve-se o "Funcionário" ou o primeiro nome limpo
                document.getElementById('lbl-nome-usuario').innerText = nomeUsuario ? nomeUsuario.split(' ')[0] : "Funcionário";

                if (fotoUser && fotoUser !== "undefined" && fotoUser.trim() !== "") {
                    document.getElementById('icone-avatar-padrao').style.display = 'none';
                    const imgAvatar = document.getElementById('img-avatar-usuario');
                    imgAvatar.src = fotoUser;
                    imgAvatar.style.display = 'block';
                }

                // BUSCA DO NOME DA UNIDADE E LOGO
                try {
                    if (!idUnidade) { idUnidade = "000000"; }
                    
                    let dadosUnidade = null;
                    const docRef = doc(db, "unidades", idUnidade);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        dadosUnidade = docSnap.data();
                    } else {
                        const unidadesRef = collection(db, "unidades");
                        let q = query(unidadesRef, where("id_unidade", "==", idUnidade));
                        let snap = await getDocs(q);
                        
                        if (snap.empty) {
                            q = query(unidadesRef, where("id_unidade", "==", Number(idUnidade)));
                            snap = await getDocs(q);
                        }
                        if (!snap.empty) dadosUnidade = snap.docs[0].data();
                    }

                    if (dadosUnidade) {
                        document.getElementById('lbl-ceu').innerText = dadosUnidade.nome_unidade || (idUnidade + " - UNIDADE");
                        
                        if (dadosUnidade.url_logo) {
                            const imgDash = document.getElementById('dash-img-logo');
                            const iconePadrao = document.getElementById('dash-icone-padrao');
                            iconePadrao.style.display = 'none';
                            imgDash.src = dadosUnidade.url_logo;
                            imgDash.style.display = 'block';
                        }
                    } else {
                        document.getElementById('lbl-ceu').innerText = "UNIDADE: " + idUnidade;
                    }
                } catch (erro) {
                    console.error("Erro ao buscar a unidade no Firebase:", erro);
                    document.getElementById('lbl-ceu').innerText = "UNIDADE: " + idUnidade;
                }

                // INICIA O MOTOR DINÂMICO
                await carregarMenuDinamico(perfisUsuario);

                // CONTROLE DA TELA INICIAL (IFRAME)
                if (isProfessor && !isUnidade && !isAdmin && !isDRE && !isSME) {
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar) sidebar.style.display = 'none';
                    
                    const topbar = document.querySelector('.topbar');
                    if (topbar) topbar.style.display = 'none';
                    
                    const mainContent = document.querySelector('.main-content');
                    if (mainContent) mainContent.style.width = '100%';
                    
                    document.body.style.backgroundColor = '#f0f2f5';
                    document.getElementById('frame-filho').src = "ChamadaOnline.html";

                } else if (!isUnidade && !isAdmin && (isDRE || isSME)) {
                    document.getElementById('frame-filho').src = "PainelDRE.html";
                } else {
                    document.getElementById('frame-filho').src = "inicio_FB.html"; 
                }

            } catch (falhaFatal) {
                console.error("Falha Fatal na inicialização:", falhaFatal);
                document.getElementById('lbl-ceu').innerText = "ERRO DE CONEXÃO";
            }
        }

        inicializarDashboard();
    </script>
</body>
</html>
