<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Painel Principal - Sistema CEU</title> 
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ÍCONES VAZADOS E FINOS -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body {
            margin: 0; padding: 0; display: flex; height: 100vh;
            overflow: hidden; background-color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* CONFIGURAÇÃO GLOBAL DOS ÍCONES VAZADOS (MENORES) */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
            font-size: 18px; /* Ícones pequenos e delicados */
        }

        /* 🌟 SIDEBAR ESTILO GEMINI/MINIMALISTA */
        .sidebar {
            width: 250px; background-color: #ffffff; /* Fundo 100% Branco */
            display: flex; flex-direction: column;
            transition: width 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s;
            height: 100vh; overflow-y: auto; overflow-x: hidden; white-space: nowrap;
            z-index: 1000; border-right: 1px solid #f0f0f0; /* Borda super discreta */
        }

        .sidebar-header {
            padding: 12px 20px; text-align: left; background: transparent;
            display: flex; align-items: center; justify-content: center; gap: 12px; 
            color: #1f1f1f; font-weight: 600; min-height: 64px;
        }

        /* Botões mais compactos e finos */
        .sidebar a {
            color: #444746; text-decoration: none; padding: 8px 16px;
            display: flex; align-items: center; gap: 10px;
            border-radius: 50px; margin: 1px 12px; transition: all 0.2s ease;
            font-size: 13px; font-weight: 500; min-height: 36px; /* Altura menor */
        }

        .sidebar a .material-symbols-outlined { color: #444746; font-size: 18px; }
        .sidebar a:hover { background-color: #f0f4f9; color: #1f1f1f; }
        
        /* Selecionado */
        .sidebar a.ativo { background-color: #e8f0fe; color: #0b57d0; font-weight: 600; }
        .sidebar a.ativo .material-symbols-outlined { color: #0b57d0; font-variation-settings: 'FILL' 1, 'wght' 400; }

        .sidebar .submenu { background: transparent; }
        .sidebar .submenu a { padding-left: 42px; font-size: 12px; min-height: 32px; margin-top: 1px;}
        .sidebar .submenu a .material-symbols-outlined { font-size: 16px; }
        
        /* 🌟 CONTEÚDO PRINCIPAL */
        .main-content {
            flex-grow: 1; display: flex; flex-direction: column;
            width: calc(100% - 250px);
            transition: width 0.3s cubic-bezier(0.2, 0, 0, 1);
            background: #ffffff;
        }

        /* 🌟 BARRA SUPERIOR CLEAN */
        .topbar {
            height: 56px; /* Barra superior ligeiramente menor */
            background: #ffffff; border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 10;
        }

        .btn-menu-toggle {
            color: #444746; background: transparent; border: none;
            border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-menu-toggle:hover { background: #f0f4f9; }
        .btn-menu-toggle .material-symbols-outlined { font-size: 20px; }

        #frame-filho { flex-grow: 1; border: none; width: 100%; height: 100%; background-color: #ffffff; }

        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 10px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #bdc1c6; }
        
        /* 🌟 ESTADOS DO MENU RECOLHIDO (Bolinhas menores) */
        .sidebar.recolhido { width: 68px !important; overflow-x: hidden; }
        .main-content.expandido { width: calc(100% - 68px); margin-left: 0; }
        
        .sidebar.recolhido .sidebar-header { justify-content: center; padding: 12px 0; }
        .sidebar.recolhido .sidebar-header img { display: none !important; }
        .sidebar.recolhido .sidebar-header .material-symbols-outlined { margin: 0; }
        
        .sidebar.recolhido a { 
            padding: 0 !important; 
            margin: 4px auto !important;
            width: 36px; height: 36px; /* Botões recolhidos menores */
            justify-content: center !important; 
            border-radius: 50%;
        }
        
        .sidebar.recolhido a[style*="display: none"], .sidebar.recolhido a.d-none { display: none !important; }
        .sidebar.recolhido a .txt-menu, 
        .sidebar.recolhido .badge, 
        .sidebar.recolhido a[data-bs-toggle="collapse"] .icon-expand,
        .sidebar.recolhido .submenu { display: none !important; }

        .mobile-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4); z-index: 999; backdrop-filter: blur(2px);
        }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -250px; box-shadow: 2px 0 12px rgba(0,0,0,0.1); width: 250px !important; opacity: 1 !important;}
            .sidebar.mobile-open { left: 0; }
            .main-content { width: 100% !important; }
        }
    </style>
</head>
<body>

    <div id="mobile-overlay" class="mobile-overlay" onclick="window.alternarMenuLateral()"></div>

    <div class="sidebar">
        <!-- LOGO DA UNIDADE FICA AQUI NO TOPO -->
        <div class="sidebar-header">
            <span class="material-symbols-outlined text-primary" id="dash-icone-padrao" style="font-size: 24px; font-variation-settings: 'FILL' 1;">account_balance</span>
            <img id="dash-img-logo" src="" alt="Logo" style="display: none; max-width: 140px; max-height: 35px; object-fit: contain;">
        </div>

        <div id="menu-dinamico-container" style="flex-grow: 1; overflow-y: auto; padding-top: 8px;">
            <div class="text-center text-muted" style="font-size: 11px; margin-top: 20px;">
                <div class="spinner-border spinner-border-sm mb-2" role="status" style="color: #0b57d0;"></div><br>
                Carregando...
            </div>
        </div>

        <div style="margin-top: auto; padding-bottom: 12px;">
            <a href="#" onclick="window.fazerLogout()" style="color: #ba1a1a;">
                <span class="material-symbols-outlined" style="color: #ba1a1a;">logout</span> <span class="txt-menu">Sair do Sistema</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="btnToggleMenu" class="btn-menu-toggle" onclick="window.alternarMenuLateral()" title="Recolher Menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div style="font-size: 13px; font-weight: 600; color: #1f1f1f; margin-left: 4px;">
                    <strong id="lbl-ceu">Carregando...</strong>
                </div>
            </div>
            
            <div class="text-end">
                <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px;">
                    <a href="#" onclick="window.abrirTrocaSenhaLogado(); return false;" id="lbl-rf" style="font-weight: 500; color: #444746; text-decoration: none; font-size: 12px;" title="Clique para alterar a sua senha">
                        RF: Carregando...
                    </a>
                    <img id="img-avatar-usuario" src="" alt="Avatar" style="display: none; width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #e3e3e3; cursor: pointer;" onclick="window.abrirTrocaSenhaLogado();">
                    <span class="material-symbols-outlined" id="icone-avatar-padrao" style="font-size: 32px; color: #0b57d0; cursor: pointer;" onclick="window.abrirTrocaSenhaLogado(); font-variation-settings: 'FILL' 1;">account_circle</span>
                </div>
            </div>
        </div>

        <iframe id="frame-filho" src="inicio_FB.html"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- MOTOR FIREBASE INTEGRADO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.abrirFormFilho = function(nomeDaTelaHTML, elementoClicado) {
            document.getElementById('frame-filho').src = nomeDaTelaHTML;
            const links = document.querySelectorAll('.sidebar a');
            links.forEach(l => l.classList.remove('ativo'));
            if (elementoClicado) elementoClicado.classList.add('ativo');

            if (window.innerWidth <= 768) {
                window.alternarMenuLateral();
            }
        };

        window.removerAtivo = function(elemento) {
            elemento.classList.remove('ativo');
        };

        window.alternarMenuLateral = function() {
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');
            const overlay = document.getElementById('mobile-overlay');
            
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('mobile-open');
                if (overlay.style.display === 'block') {
                    overlay.style.display = 'none';
                } else {
                    overlay.style.display = 'block';
                }
            } else {
                if (sidebar) sidebar.classList.toggle('recolhido');
                if (mainContent) mainContent.classList.toggle('expandido');
            }
        };

        window.fazerLogout = function() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "index_FB.html"; 
        };

        window.previewAvatar = function(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('swal-preview-foto').src = e.target.result; }
                reader.readAsDataURL(file);
            }
        };

        window.abrirTrocaSenhaLogado = function() {
            const rf = localStorage.getItem('sig_rf');
            const ceu = localStorage.getItem('sig_id_unidade');
            const fotoAtual = localStorage.getItem('sig_foto') || '';

            const avatarSrc = (fotoAtual && fotoAtual !== "undefined" && fotoAtual.trim() !== "") 
                ? fotoAtual 
                : 'https://via.placeholder.com/120/f0f4f9/0b57d0?text=FOTO';

            Swal.fire({
                title: '<span style="color:#1f1f1f; font-weight:600; font-size: 18px;">Meu Perfil</span>',
                html: `
                    <div style="text-align: left; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                        <div style="text-align: center; margin-bottom: 25px; margin-top: 10px;">
                            <div style="position: relative; display: inline-block;">
                                <img id="swal-preview-foto" src="${avatarSrc}" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                                <label for="swal-foto" style="position: absolute; bottom: 0; right: 0; background: #0b57d0; color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.3s;">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">photo_camera</span>
                                </label>
                                <input type="file" id="swal-foto" style="display: none;" accept="image/*" onchange="window.previewAvatar(event)">
                            </div>
                        </div>
                        <hr style="border-color: #e3e3e3; margin: 20px 0;">
                        
                        <div class="mb-3">
                            <label class="form-label" style="font-size: 12px; color: #444746; font-weight: 500; margin-bottom: 4px;">Senha Atual</label>
                            <input type="password" id="swal-senha-atual" class="form-control" style="border-radius: 8px; font-size: 13px; border: 1px solid #c7c7c7; padding: 8px;" placeholder="Digite para alterar">
                        </div>
                        
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label" style="font-size: 12px; color: #444746; font-weight: 500; margin-bottom: 4px;">Nova Senha</label>
                                <input type="password" id="swal-nova-senha" class="form-control" style="border-radius: 8px; font-size: 13px; border: 1px solid #c7c7c7; padding: 8px;" placeholder="Mín. 8 caract.">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label" style="font-size: 12px; color: #444746; font-weight: 500; margin-bottom: 4px;">Confirmar</label>
                                <input type="password" id="swal-conf-senha" class="form-control" style="border-radius: 8px; font-size: 13px; border: 1px solid #c7c7c7; padding: 8px;" placeholder="Repita a senha">
                            </div>
                        </div>
                    </div>
                `,
                confirmButtonText: 'Salvar Perfil',
                confirmButtonColor: '#0b57d0',
                showCancelButton: true,
                cancelButtonText: 'Cancelar',
                width: '400px',
                focusConfirm: false,
                customClass: {
                    popup: 'rounded-4 border-0 shadow-lg',
                    confirmButton: 'rounded-pill px-4 fw-bold',
                    cancelButton: 'rounded-pill px-4'
                },
                preConfirm: async () => {
                    const sAtual = document.getElementById('swal-senha-atual').value.trim();
                    const s1 = document.getElementById('swal-nova-senha').value.trim();
                    const s2 = document.getElementById('swal-conf-senha').value.trim();
                    const fileInput = document.getElementById('swal-foto');

                    if (sAtual || s1 || s2) {
                        if (!sAtual || !s1 || !s2) { Swal.showValidationMessage('⚠️ Preencha a Atual, a Nova e a Confirmação!'); return false; }
                        if (s1 !== s2) { Swal.showValidationMessage('⚠️ As novas senhas não conferem!'); return false; }
                        if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                            Swal.showValidationMessage('⚠️ A nova senha deve ter letras, números e símbolos!'); return false;
                        }
                    }

                    if (!sAtual && !s1 && !s2 && fileInput.files.length === 0) {
                        Swal.showValidationMessage('⚠️ Nenhuma alteração informada.'); return false;
                    }

                    let fotoBase64 = null;
                    if (fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        fotoBase64 = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = e => resolve(e.target.result);
                            reader.onerror = e => reject(e);
                            reader.readAsDataURL(file);
                        });
                    }
                    return { senhaAtual: sAtual, novaSenha: s1, fotoBase64: fotoBase64 };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Salvando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

                    const val = result.value;
                    const chaveComposta = `${rf}_${ceu}`;

                    try {
                        const docRef = doc(db, "usuarios", chaveComposta);
                        const docSnap = await getDoc(docRef);

                        if (!docSnap.exists()) {
                            const q = query(collection(db, "usuarios"), where("rf_usuario", "==", rf), where("id_unidade", "==", ceu));
                            const snap = await getDocs(q);
                            if(snap.empty) return Swal.fire('Erro', 'Usuário não encontrado no banco.', 'error');
                            
                            const userDoc = snap.docs[0];
                            if (val.novaSenha && userDoc.data().senha_usuario !== val.senhaAtual) {
                                return Swal.fire('Atenção', 'A senha atual informada está incorreta.', 'warning');
                            }
                            const updates = {};
                            if (val.novaSenha) updates.senha_usuario = val.novaSenha;
                            if (val.fotoBase64) updates.url_foto = val.fotoBase64;
                            
                            await updateDoc(userDoc.ref, updates);
                            
                            if (updates.url_foto) {
                                localStorage.setItem('sig_foto', updates.url_foto);
                                document.getElementById('icone-avatar-padrao').style.display = 'none';
                                const imgAvatar = document.getElementById('img-avatar-usuario');
                                imgAvatar.src = updates.url_foto;
                                imgAvatar.style.display = 'block';
                            }
                            Swal.fire('Pronto!', 'Perfil atualizado com sucesso.', 'success');
                            return;
                        }

                        if (val.novaSenha && docSnap.data().senha_usuario !== val.senhaAtual) {
                            return Swal.fire('Atenção', 'A senha atual informada está incorreta.', 'warning');
                        }

                        const updates = {};
                        if (val.novaSenha) updates.senha_usuario = val.novaSenha;
                        if (val.fotoBase64) updates.url_foto = val.fotoBase64;

                        await updateDoc(docRef, updates);

                        if (updates.url_foto) {
                            localStorage.setItem('sig_foto', updates.url_foto);
                            document.getElementById('icone-avatar-padrao').style.display = 'none';
                            const imgAvatar = document.getElementById('img-avatar-usuario');
                            imgAvatar.src = updates.url_foto;
                            imgAvatar.style.display = 'block';
                        }
                        Swal.fire('Pronto!', 'Perfil atualizado com sucesso.', 'success');
                    } catch (error) {
                        Swal.fire('Erro', 'Falha ao atualizar no banco de dados.', 'error');
                    }
                }
            });
        };

        // ==========================================
        // O MOTOR DO MENU DINÂMICO
        // ==========================================
        async function carregarMenuDinamico(perfisUsuario) {
            try {
                const temPermissao = (perfisPermitidos) => {
                    if (!perfisPermitidos || !Array.isArray(perfisPermitidos)) return false;
                    return perfisUsuario.some(p => perfisPermitidos.includes(p));
                };

                const [gavetasSnap, botoesSnap] = await Promise.all([
                    getDocs(collection(db, "gavetas")),
                    getDocs(collection(db, "botoes"))
                ]);

                let gavetas = [];
                gavetasSnap.forEach(doc => gavetas.push(doc.data()));

                let botoes = [];
                botoesSnap.forEach(doc => botoes.push(doc.data()));

                const gavetasPermitidas = gavetas
                    .filter(g => temPermissao(g.perfis_permitidos))
                    .sort((a, b) => Number(a.ordem) - Number(b.ordem));

                const botoesPermitidos = botoes
                    .filter(b => temPermissao(b.perfis_permitidos))
                    .sort((a, b) => Number(a.ordem) - Number(b.ordem));

                let menuHTML = `
                    <a href="javascript:void(0)" class="ativo" id="link-inicio" onclick="window.abrirFormFilho('inicio_FB.html', this)">
                        <span class="material-symbols-outlined">space_dashboard</span> <span class="txt-menu">Painel Inicial</span>
                    </a>
                `;

                gavetasPermitidas.forEach(gaveta => {
                    const botoesDaGaveta = botoesPermitidos.filter(b => b.id_gaveta === gaveta.id_gaveta);

                    if (botoesDaGaveta.length > 0) {
                        menuHTML += `
                        <a href="#submenu_${gaveta.id_gaveta}" data-bs-toggle="collapse" style="justify-content: space-between;" onclick="window.removerAtivo(this)">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span class="material-symbols-outlined">${gaveta.icone_gaveta}</span> <span class="txt-menu">${gaveta.nome_gaveta}</span>
                            </div>
                            <span class="material-symbols-outlined icon-expand" style="font-size: 18px; color: #747775;">expand_more</span>
                        </a>
                        <div class="collapse submenu" id="submenu_${gaveta.id_gaveta}">
                        `;

                        botoesDaGaveta.forEach(botao => {
                            menuHTML += `
                            <a href="javascript:void(0)" onclick="window.abrirFormFilho('${botao.url_destino}', this)">
                                <span class="material-symbols-outlined" style="color: #747775;">${botao.icone || 'chevron_right'}</span> <span class="txt-menu">${botao.nome_botao}</span>
                            </a>
                            `;
                        });

                        menuHTML += `</div>`;
                    }
                });

                document.getElementById('menu-dinamico-container').innerHTML = menuHTML;

            } catch (erro) {
                document.getElementById('menu-dinamico-container').innerHTML = `<p class="text-danger text-center mt-3">Falha ao carregar menu.</p>`;
            }
        }

        // ==========================================
        // INICIALIZAÇÃO FIREBASE E CARREGAMENTO
        // ==========================================
        async function inicializarDashboard() {
            try {
                const rfLogado = localStorage.getItem('sig_rf');
                let idUnidade = localStorage.getItem('sig_id_unidade');

                if (!rfLogado) {
                    window.location.href = "index_FB.html";
                    return;
                }

                let perfisUsuario = ["UNIDADE"];
                try {
                    const cru = localStorage.getItem('sig_nivel_acesso') || "UNIDADE";
                    if (cru.startsWith('[')) {
                        let lido = JSON.parse(cru);
                        if (lido.length === 1 && lido[0].includes(',')) {
                            perfisUsuario = lido[0].split(',').map(p => p.trim().toUpperCase());
                        } else {
                            perfisUsuario = lido.map(p => p.trim().toUpperCase());
                        }
                    } else {
                        perfisUsuario = cru.split(',').map(p => p.trim().toUpperCase());
                    }
                } catch (e) {
                    perfisUsuario = ["UNIDADE"];
                }

                const isAdmin = perfisUsuario.includes("ADMIN");
                const isDRE = perfisUsuario.includes("DRE");
                const isSME = perfisUsuario.includes("SME");
                const isProfessor = perfisUsuario.includes("PROFESSOR");
                const isUnidade = perfisUsuario.includes("UNIDADE");

                document.getElementById('lbl-rf').innerText = rfLogado;

                // BUSCA DO NOME DA UNIDADE E LOGO
                try {
                    if (!idUnidade) { idUnidade = "000000"; }
                    
                    let dadosUnidade = null;
                    const docRef = doc(db, "unidades", idUnidade);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        dadosUnidade = docSnap.data();
                    } else {
                        const unidadesRef = collection(db, "unidades");
                        let q = query(unidadesRef, where("id_unidade", "==", idUnidade));
                        let snap = await getDocs(q);
                        
                        if (snap.empty) {
                            q = query(unidadesRef, where("id_unidade", "==", Number(idUnidade)));
                            snap = await getDocs(q);
                        }
                        if (!snap.empty) dadosUnidade = snap.docs[0].data();
                    }

                    if (dadosUnidade) {
                        document.getElementById('lbl-ceu').innerText = `${idUnidade} - ${dadosUnidade.nome_unidade.toUpperCase()}`;
                        
                        if (dadosUnidade.url_logo) {
                            const imgDash = document.getElementById('dash-img-logo');
                            const iconePadrao = document.getElementById('dash-icone-padrao');
                            iconePadrao.style.display = 'none';
                            imgDash.src = dadosUnidade.url_logo;
                            imgDash.style.display = 'block';
                        }
                    } else {
                        document.getElementById('lbl-ceu').innerText = `${idUnidade} - UNIDADE NÃO IDENTIFICADA`;
                    }
                } catch (erro) {
                    document.getElementById('lbl-ceu').innerText = "ERRO AO CARREGAR NOME DA UNIDADE";
                }

                await carregarMenuDinamico(perfisUsuario);

                if (isProfessor && !isUnidade && !isAdmin && !isDRE && !isSME) {
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar) sidebar.style.display = 'none';
                    
                    const topbar = document.querySelector('.topbar');
                    if (topbar) topbar.style.display = 'none';
                    
                    const mainContent = document.querySelector('.main-content');
                    if (mainContent) mainContent.style.width = '100%';
                    
                    document.getElementById('frame-filho').src = "ChamadaOnline.html";
                } else {
                    document.getElementById('frame-filho').src = "inicio_FB.html"; 
                }

            } catch (falhaFatal) {
                document.getElementById('lbl-ceu').innerText = "ERRO DE CONEXÃO";
            }
        }

        inicializarDashboard();
    </script>
</body>
</html>
