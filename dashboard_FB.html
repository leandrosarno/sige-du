<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Sistema CEU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; padding: 24px; color: #1f1f1f; }
        
        .welcome-card {
            border: none; border-radius: 24px; color: #1f1f1f;
            padding: 32px 40px; margin-bottom: 24px;
            background-color: #f0f4f9;
            transition: background 0.5s ease;
        }
        
        .bg-manha { background-color: #e8f0fe; color: #174ea6; }
        .bg-tarde { background-color: #fef7e0; color: #b06000; }
        .bg-noite { background-color: #f1f3f4; color: #202124; }

        .cards-container { display: flex; flex-wrap: wrap; gap: 16px; }
        
        /* 🌟 O SEGREDOS DO CARTÃO COMPACTO: width: 320px */
        .stat-card {
            background: #ffffff; border: 1px solid #e3e3e3; border-radius: 16px;
            padding: 24px; text-align: left; box-shadow: none;
            transition: background 0.2s; display: flex; flex-direction: column; justify-content: center;
            width: 320px; max-width: 100%;
        }
        .stat-card:hover { background: #f8f9fa; }
        
        .stat-card h6 { color: #444746; font-size: 13px; font-weight: 600; margin-bottom: 12px; text-transform: none; }
        .stat-card h3 { color: #1f1f1f; font-size: 36px; font-weight: 400; margin: 0; line-height: 1; display: flex; align-items: center; gap: 10px;}

        .skeleton { background: #e2e8f0; border-radius: 8px; color: transparent !important; animation: pulse 1.5s infinite; display: inline-block; min-width: 60px; height: 36px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .card-link { cursor: pointer; }
        .card-link h3 { color: #0b57d0; font-size: 20px; font-weight: 500;}
        
        .tag-global { font-size: 11px; color: #b3261e; text-transform: uppercase; margin-top: 10px; font-weight: 600; letter-spacing: 0.5px; border: 1px solid #f9dedc; background: #fce8e8; padding: 4px 8px; border-radius: 6px; display: inline-block;}
        .tag-erro { font-size: 11px; color: #b3261e; font-weight: 500; line-height: 1.2; display: block; text-transform: none; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        
        <div id="cartao-boas-vindas" class="welcome-card bg-manha animate__animated animate__fadeIn">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 id="saudacao-usuario" class="fw-bold mb-2" style="letter-spacing: -0.5px;">Carregando...</h2>
                    <p id="data-atual" class="mb-0" style="font-size: 16px; font-weight: 500;"></p>
                </div>
                <i id="icone-tempo" class="fas fa-sun" style="font-size: 48px;"></i>
            </div>
        </div>

        <div class="cards-container animate__animated animate__fadeInUp">
            
            <div class="stat-card" style="display: none;">
                <h6>Munícipes Cadastrados</h6>
                <h3 id="tot-municipes" class="skeleton">0</h3>
            </div>
            <div class="stat-card" style="display: none;">
                <h6>Turmas Ativas</h6>
                <h3 id="tot-turmas" class="skeleton">0</h3>
            </div>
            <div class="stat-card" style="display: none;">
                <h6>Matrículas Realizadas</h6>
                <h3 id="tot-matriculas" class="skeleton">0</h3>
            </div>
            <div class="stat-card" style="display: none;">
                <h6>Fila de Espera</h6>
                <h3 id="tot-fila" class="skeleton">0</h3>
            </div>
            <div class="stat-card card-link" style="display: none;" onclick="abrirAgendaTV()">
                <h6>Agenda da TV</h6>
                <h3><i class="fas fa-tv"></i> Acessar</h3>
            </div>

            <!-- CARTÃO ATIVO: RECREIO NAS FÉRIAS -->
            <div class="stat-card">
                <h6>Recreio nas Férias (Inscrições)</h6>
                <h3 id="tot-recreio" class="skeleton">0</h3>
            </div>

        </div>
    </div>

    <!-- MOTOR FIREBASE UNIVERSAL -->
    <script type="module">
        import { db } from './firebase_config.js';
        import { collection, query, where, getCountFromServer, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        window.onload = function() {
            configurarCartaoBoasVindas();
            carregarEstatisticasFirebase();
        };

        function configurarCartaoBoasVindas() {
            const nomeCompleto = localStorage.getItem('ceu_nome_usuario') || localStorage.getItem('sig_nome') || "Gestor";
            const primeiroNome = nomeCompleto.split(' ')[0];
            const nomeFormatado = primeiroNome.charAt(0).toUpperCase() + primeiroNome.slice(1).toLowerCase();

            const data = new Date();
            const hora = data.getHours();

            const cartao = document.getElementById('cartao-boas-vindas');
            const saudacao = document.getElementById('saudacao-usuario');
            const icone = document.getElementById('icone-tempo');
            const dataTexto = document.getElementById('data-atual');

            if (hora >= 5 && hora < 12) {
                saudacao.innerText = "Bom dia, " + nomeFormatado + "!";
                cartao.className = "welcome-card bg-manha";
                icone.className = "fas fa-sun";
            } else if (hora >= 12 && hora < 18) {
                saudacao.innerText = "Boa tarde, " + nomeFormatado + "!";
                cartao.className = "welcome-card bg-tarde";
                icone.className = "fas fa-cloud-sun";
            } else {
                saudacao.innerText = "Boa noite, " + nomeFormatado + "!";
                cartao.className = "welcome-card bg-noite";
                icone.className = "fas fa-moon";
            }

            const opcoesData = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let dataFormatada = data.toLocaleDateString('pt-BR', opcoesData);
            dataFormatada = dataFormatada.charAt(0).toUpperCase() + dataFormatada.slice(1);
            dataTexto.innerText = dataFormatada;
        }

        async function carregarEstatisticasFirebase() {
            const el = document.getElementById('tot-recreio');
            const idUnidade = localStorage.getItem('sig_id_unidade') || "";
            
            let perfisUsuario = ["UNIDADE"];
            try {
                const cru = localStorage.getItem('sig_nivel_acesso') || "UNIDADE";
                if (cru.startsWith('[')) {
                    let lido = JSON.parse(cru);
                    if (lido.length === 1 && lido[0].includes(',')) perfisUsuario = lido[0].split(',').map(p => p.trim().toUpperCase());
                    else perfisUsuario = lido.map(p => p.trim().toUpperCase());
                } else perfisUsuario = cru.split(',').map(p => p.trim().toUpperCase());
            } catch (e) { perfisUsuario = ["UNIDADE"]; }

            const isSME = perfisUsuario.includes('SME') || (perfisUsuario.includes('ADMIN') && idUnidade === '000000');
            const isDRE = perfisUsuario.includes('DRE') || (perfisUsuario.includes('ADMIN') && idUnidade !== '000000');

            try {
                const refColecao = collection(db, "rf_inscricoes");
                let totalEncontrado = 0;
                let isGlobal = false;

                if (isSME) {
                    const snapshot = await getCountFromServer(refColecao);
                    totalEncontrado = snapshot.data().count;
                    isGlobal = true;
                } 
                else if (isDRE) {
                    const qUnidades = query(collection(db, "unidades"), where("id_regional", "==", String(idUnidade).trim()));
                    const snapUnidades = await getDocs(qUnidades);
                    
                    for (let docU of snapUnidades.docs) {
                        let eolCEU = docU.id;
                        const qStr = query(refColecao, where("id_unidade", "==", String(eolCEU)));
                        const qNum = query(refColecao, where("id_unidade", "==", Number(eolCEU)));
                        const [s1, s2] = await Promise.all([getCountFromServer(qStr), getCountFromServer(qNum)]);
                        totalEncontrado += (s1.data().count + s2.data().count);
                    }
                } 
                else {
                    const qStr = query(refColecao, where("id_unidade", "==", String(idUnidade).trim()));
                    const snapStr = await getCountFromServer(qStr);
                    totalEncontrado += snapStr.data().count;

                    const idNumerico = Number(idUnidade);
                    if (!isNaN(idNumerico)) {
                        const qNum = query(refColecao, where("id_unidade", "==", idNumerico));
                        const snapNum = await getCountFromServer(qNum);
                        totalEncontrado += snapNum.data().count;
                    }
                }

                animarContador("tot-recreio", totalEncontrado, isGlobal);

            } catch (error) {
                console.error("Erro ao processar estatísticas:", error);
                el.classList.remove('skeleton');
                el.innerHTML = `<span class="tag-erro"><i class="fas fa-bug"></i> Falha de Conexão</span>`;
            }
        }

        function animarContador(idElemento, valorFinal, isGlobal) {
            const el = document.getElementById(idElemento);
            el.classList.remove('skeleton'); 

            if (valorFinal === 0) {
                el.innerHTML = "0";
                return;
            }

            let atual = 0;
            const incremento = Math.ceil(valorFinal / 25);
            
            const timer = setInterval(() => {
                atual += incremento;
                if (atual >= valorFinal) {
                    atual = valorFinal;
                    clearInterval(timer);
                    
                    let textoFinal = atual.toLocaleString('pt-BR');
                    
                    if (isGlobal) {
                        el.innerHTML = `<div>${textoFinal} <br><div class="tag-global"><i class="fas fa-database"></i> Rede SME Global</div></div>`;
                    } else {
                        el.innerHTML = textoFinal;
                    }
                } else {
                    el.innerText = atual.toLocaleString('pt-BR');
                }
            }, 30);
        }
    </script>
</body>
</html>
