<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard SIG-EDU</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --google-blue: #1a73e8;
            --bg-color: #f0f2f5;
            --border-color: #dadce0;
            --sidebar-bg: #202124;
            --sidebar-hover: #3c4043;
            --text-light: #e8eaed;
        }
        body { margin: 0; display: flex; height: 100vh; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 10px; color: #333; overflow: hidden; }
        
        /* MENU LATERAL (SIDEBAR) */
        .sidebar { width: 220px; background-color: var(--sidebar-bg); color: var(--text-light); display: flex; flex-direction: column; border-right: 1px solid #000; }
        .sidebar-header { padding: 15px; text-align: center; border-bottom: 1px solid var(--sidebar-hover); background-color: #171717; }
        
        /* O Logo agora começa oculto para não mostrar imagem quebrada */
        .sidebar-header img { width: 80%; max-height: 50px; object-fit: contain; margin-bottom: 10px; display: none; margin-left: auto; margin-right: auto; }
        
        .sidebar-header h3 { margin: 0; font-size: 11px; font-weight: bold; }
        .sidebar-header p { margin: 2px 0 0 0; font-size: 9px; color: #9aa0a6; }
        .menu-lista { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .menu-item { padding: 8px 15px; border-bottom: 1px solid var(--sidebar-hover); cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .menu-item:hover { background-color: var(--sidebar-hover); border-left: 3px solid var(--google-blue); padding-left: 12px; }
        .menu-item .material-icons { font-size: 14px; }
        .submenu { list-style: none; padding: 0; margin: 0; background-color: #1a1b1e; display: none; }
        .menu-item.active + .submenu { display: block; }
        .submenu li { padding: 6px 15px 6px 40px; border-bottom: 1px solid var(--sidebar-hover); cursor: pointer; color: #bdc1c6; }
        .submenu li:hover { color: white; background-color: var(--sidebar-hover); }
        .menu-separador { border-top: 1px dashed #555; margin: 4px 10px; }
        
        /* ÁREA PRINCIPAL */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { background-color: white; height: 40px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .btn-logout { background-color: #dc3545; color: white; border: none; padding: 4px 10px; font-size: 10px; font-weight: bold; cursor: pointer; }
        
        /* SISTEMA DE CARTÕES (GRID) */
        .dashboard-container { padding: 20px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; border: 1px solid var(--border-color); border-top: 3px solid var(--google-blue); padding: 15px; text-align: center; box-shadow: 1px 1px 5px rgba(0,0,0,0.05);}
        .card h4 { margin: 0 0 5px 0; font-size: 10px; color: #666; text-transform: uppercase; }
        .card .numero { font-size: 24px; font-weight: bold; color: #333; margin: 0; }
        .card.card-destaque { border-top-color: #ff9800; background-color: #fff8e1; }
        .card.card-turno { border-top-color: #4caf50; }
        
        .btn-analitico { background-color: var(--google-blue); color: white; border: 1px solid #0d47a1; padding: 6px 15px; font-size: 10px; font-weight: bold; cursor: pointer; display: inline-block; margin-right: 10px; }
        .actions-bar { margin-bottom: 15px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img id="painel-logo" src="" alt="Logo Unidade">
            <h3 id="painel-nome-ceu">Carregando...</h3>
            <p id="painel-nome-usuario">Usuário</p>
        </div>
        <ul class="menu-lista" id="menu-dinamico">
            <!-- O MENU SERÁ INJETADO AQUI PELO JAVASCRIPT -->
        </ul>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <header class="topbar">
            <b id="painel-titulo-modulo">VISÃO GERAL</b>
            <button class="btn-logout" onclick="window.sairDoSistema()">SAIR</button>
        </header>
        <div class="dashboard-container" id="area-cartoes">
            <!-- OS CARTÕES SERÃO INJETADOS AQUI PELO JAVASCRIPT -->
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        // Importamos também o doc e getDoc para caso você tenha salvo o código como ID do documento
        import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f",
            measurementId: "G-E5LLYGW7DN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // 1. CARREGAMENTO DOS DADOS DO CEU LOGADO
        // ==========================================
        async function inicializarDashboard() {
            if(!localStorage.getItem('sig_rf')) {
                window.location.href = "index_FB.html";
                return;
            }

            const idUnidadeSalva = localStorage.getItem('sig_id_unidade');
            document.getElementById('painel-nome-usuario').innerText = localStorage.getItem('sig_nome') || "Gestor";

            try {
                let dadosUnidade = null;

                // TENTATIVA 1: Busca direto pelo ID do Documento (caso a unidade seja o nome do doc no Firebase)
                const docRef = doc(db, "unidades", idUnidadeSalva);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    dadosUnidade = docSnap.data();
                } else {
                    // TENTATIVA 2: Busca usando "where" como TEXTO
                    const unidadesRef = collection(db, "unidades");
                    const qTexto = query(unidadesRef, where("id_unidade", "==", idUnidadeSalva));
                    const snapTexto = await getDocs(qTexto);
                    
                    if (!snapTexto.empty) {
                        dadosUnidade = snapTexto.docs[0].data();
                    } else {
                        // TENTATIVA 3: Busca usando "where" como NÚMERO
                        const qNumero = query(unidadesRef, where("id_unidade", "==", Number(idUnidadeSalva)));
                        const snapNumero = await getDocs(qNumero);
                        if (!snapNumero.empty) {
                            dadosUnidade = snapNumero.docs[0].data();
                        }
                    }
                }

                // Se encontrou dados na coleção 'unidades', aplica na tela!
                if (dadosUnidade) {
                    if (dadosUnidade.nome_unidade) {
                        document.getElementById('painel-nome-ceu').innerText = dadosUnidade.nome_unidade;
                    } else {
                        document.getElementById('painel-nome-ceu').innerText = "UNIDADE " + idUnidadeSalva;
                    }

                    if (dadosUnidade.url_logo) {
                        const logoElement = document.getElementById('painel-logo');
                        logoElement.src = dadosUnidade.url_logo;
                        logoElement.style.display = 'block'; // Mostra a imagem lindona
                    }
                } else {
                    document.getElementById('painel-nome-ceu').innerText = "UNIDADE " + idUnidadeSalva;
                }

            } catch (erro) {
                console.error("Erro ao buscar a coleção unidades:", erro);
                document.getElementById('painel-nome-ceu').innerText = "UNIDADE " + idUnidadeSalva;
            }
            
            // Verifica o nível e injeta HTML
            const perfil = localStorage.getItem('sig_nivel_acesso');
            if(perfil === 'DRE') {
                window.montarInterfaceDRE();
            } else if (perfil === 'SME') {
                window.montarInterfaceSME();
            } else {
                window.montarInterfaceUnidade(); 
            }
        }

        // ==========================================
        // 2. CONSTRUTORES DE TELA E MENUS
        // ==========================================
        window.montarInterfaceUnidade = function() {
            document.getElementById('painel-titulo-modulo').innerText = "VISÃO GERAL - UNIDADE";
            document.getElementById('menu-dinamico').innerHTML = `
                <li class="menu-item" onclick="window.alternarMenu(this)"><span class="material-icons">home</span> Início</li>
                <li class="menu-item" onclick="window.alternarMenu(this)"><span class="material-icons">people</span> Cadastros</li>
                <ul class="submenu">
                    <li>Munícipes</li>
                    <li>Incluir Novo munícipe</li>
                    <li>Edição Rápida</li>
                </ul>
                <li class="menu-item" onclick="window.alternarMenu(this)"><span class="material-icons">school</span> Turmas e Matrículas</li>
                <ul class="submenu">
                    <li>Turmas</li>
                    <li>Fazer Matrículas</li>
                    <li>Gerenciar Matrículas</li>
                    <div class="menu-separador"></div>
                    <li>Chamada On-line</li>
                    <li>Liberar Chamada On-line</li>
                    <div class="menu-separador"></div>
                    <li>Configurar Lista de Espera</li>
                </ul>
                <li class="menu-item" onclick="window.alternarMenu(this)"><span class="material-icons">print</span> Impressão/Expedição</li>
                <ul class="submenu">
                    <li>Carteirinhas: Uso Geral</li>
                    <li>Carteirinhas: Projeto Academia Livre</li>
                    <li>Carteirinhas: Projeto Raia Livre</li>
                    <div class="menu-separador"></div>
                    <li>Listas de Chamada: Física</li>
                    <li>Listas de Chamada: On-line</li>
                    <div class="menu-separador"></div>
                    <li>Lista de Vagas</li>
                    <li>Protocolo para retirar Carteirinhas</li>
                </ul>
                <li class="menu-item" onclick="window.alternarMenu(this)"><span class="material-icons">sports_volleyball</span> Recreio nas Férias</li>
                <ul class="submenu">
                    <li>Cadastrar</li>
                    <li>Edição Rápida</li>
                    <li>Crachás de Acesso</li>
                    <li>Painel de Gráficos</li>
                    <li>Listas de Impressão</li>
                    <li>Chamada Qualitativa</li>
                </ul>
                <li class="menu-item" onclick="window.alternarMenu(this)"><span class="material-icons">settings</span> Cadastros Base</li>
                <ul class="submenu">
                    <li>Núcleos</li>
                    <li>Espaços</li>
                    <li>Professores</li>
                    <li>Tipo Responsável</li>
                    <li>Modalidades</li>
                </ul>
            `;
            document.getElementById('area-cartoes').innerHTML = `
                <div class="cards-grid">
                    <div class="card card-turno">
                        <h4>Boas Vindas</h4>
                        <p style="margin:0; font-size: 11px; font-weight:bold;">Turno da Manhã</p>
                    </div>
                    <div class="card card-destaque">
                        <h4>Resumo da Unidade</h4>
                        <p style="margin:0; font-size: 11px; color:#ff9800; font-weight:bold;">Operacional</p>
                    </div>
                    <div class="card"><h4>Munícipes Cadastrados</h4><p class="numero">0</p></div>
                    <div class="card"><h4>Turmas Ativas</h4><p class="numero">0</p></div>
                    <div class="card"><h4>Matrículas Realizadas</h4><p class="numero">0</p></div>
                    <div class="card"><h4>Fila de Espera</h4><p class="numero">0</p></div>
                    <div class="card"><h4>Agenda da TV</h4><p class="numero">0</p></div>
                </div>
                <div style="text-align: center;">
                    <button class="btn-analitico">ACESSAR PAINEL ANALÍTICO DE VAGAS</button>
                </div>
            `;
        };

        window.montarInterfaceDRE = function() {
            document.getElementById('painel-titulo-modulo').innerText = "VISÃO ESTRATÉGICA - DRE";
            document.getElementById('menu-dinamico').innerHTML = `
                <li class="menu-item"><span class="material-icons">dashboard</span> Painel DRE</li>
                <li class="menu-item"><span class="material-icons">rule</span> RF - Regras</li>
                <li class="menu-item"><span class="material-icons">directions_bus</span> RF - Passeios</li>
                <li class="menu-item"><span class="material-icons">event</span> RF - Atrações e Eventos</li>
                <li class="menu-item" onclick="window.alternarMenu(this)"><span class="material-icons">bar_chart</span> Relatórios DRE</li>
                <ul class="submenu">
                    <li>Relatório Idade/Turma</li>
                </ul>
            `;
            document.getElementById('area-cartoes').innerHTML = `
                <div class="actions-bar">
                    <button class="btn-analitico" style="background: #28a745;">EXPORTAR EXCEL</button>
                    <button class="btn-analitico" style="background: #6c757d;">IMPRIMIR / PDF</button>
                    <button class="btn-analitico">ATUALIZAR DADOS</button>
                </div>
                <div class="cards-grid">
                    <div class="card card-turno">
                        <h4>Boas Vindas</h4>
                        <p style="margin:0; font-size: 11px; font-weight:bold;">Turno da Manhã</p>
                    </div>
                    <div class="card card-destaque">
                        <h4>Total de Matrículas da REDE</h4>
                        <p class="numero">0</p>
                    </div>
                    <div class="card card-destaque">
                        <h4>Total Inscritos Recreio Férias</h4>
                        <p class="numero">0</p>
                    </div>
                </div>
            `;
        };

        window.montarInterfaceSME = function() {
            document.getElementById('painel-titulo-modulo').innerText = "VISÃO GLOBAL - SME";
            document.getElementById('menu-dinamico').innerHTML = `
                <li class="menu-item"><span class="material-icons">home</span> Início</li>
            `;
            document.getElementById('area-cartoes').innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <span class="material-icons" style="font-size: 48px; color: #ccc;">construction</span>
                    <h3 style="color: #666;">Módulo SME em Desenvolvimento</h3>
                    <p>Este módulo será trabalhado em breve.</p>
                </div>
            `;
        };

        // ==========================================
        // FUNÇÕES GERAIS E CLIQUES
        // ==========================================
        window.alternarMenu = function(elemento) {
            document.querySelectorAll('.menu-item').forEach(el => {
                if(el !== elemento) el.classList.remove('active');
            });
            elemento.classList.toggle('active');
        };

        window.sairDoSistema = function() {
            localStorage.clear();
            window.location.href = "index_FB.html";
        };

        // Roda ao carregar a página
        inicializarDashboard();
    </script>
</body>
</html>
