<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-EDU | Painel de Controle</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --google-blue: #1a73e8;
            --bg-color: #eef0f3;
            --sidebar-bg: #202124;
            --sidebar-hover: #3c4043;
            --text-light: #e8eaed;
            --border-color: #dadce0;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10px;
            color: #333;
            overflow: hidden;
        }

        /* MENU LATERAL (SIDEBAR) */
        .sidebar {
            width: 220px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #000;
        }

        .sidebar-header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--sidebar-hover);
            background-color: #171717;
        }

        .sidebar-header img {
            width: 80%;
            height: 40px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .sidebar-header h3 { margin: 0; font-size: 11px; font-weight: bold; }
        .sidebar-header p { margin: 2px 0 0 0; font-size: 9px; color: #9aa0a6; }

        .menu-lista {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .menu-item {
            padding: 8px 15px;
            border-bottom: 1px solid var(--sidebar-hover);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        
        .menu-item:hover { background-color: var(--sidebar-hover); border-left: 3px solid var(--google-blue); padding-left: 12px; }
        .menu-item .material-icons { font-size: 14px; }

        .submenu {
            list-style: none;
            padding: 0;
            margin: 0;
            background-color: #1a1b1e;
            display: none; /* Escondido por padrão */
        }
        
        .menu-item.active + .submenu { display: block; } /* Mostra quando ativo */

        .submenu li {
            padding: 6px 15px 6px 40px;
            border-bottom: 1px solid var(--sidebar-hover);
            cursor: pointer;
            color: #bdc1c6;
        }
        .submenu li:hover { color: white; background-color: var(--sidebar-hover); }
        .menu-separador { border-top: 1px dashed #555; margin: 4px 10px; }

        /* ÁREA PRINCIPAL */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .topbar {
            background-color: white;
            height: 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .btn-logout {
            background-color: #dc3545; color: white; border: none; 
            padding: 4px 10px; font-size: 10px; font-weight: bold; cursor: pointer;
        }

        /* SISTEMA DE CARTÕES (GRID) */
        .dashboard-container { padding: 20px; }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--google-blue);
            padding: 15px;
            text-align: center;
        }
        
        .card h4 { margin: 0 0 5px 0; font-size: 10px; color: #666; text-transform: uppercase; }
        .card .numero { font-size: 24px; font-weight: bold; color: #333; margin: 0; }
        
        .card.card-destaque { border-top-color: #ff9800; background-color: #fff8e1; }
        .card.card-turno { border-top-color: #4caf50; }

        .btn-analitico {
            background-color: var(--google-blue); color: white; border: 1px solid #0d47a1;
            padding: 6px 15px; font-size: 10px; font-weight: bold; cursor: pointer; display: block; width: 200px; margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img id="painel-logo" src="" alt="Logo">
            <h3 id="painel-nome-ceu">Carregando...</h3>
            <p id="painel-nome-usuario">Usuário</p>
        </div>

        <ul class="menu-lista" id="menu-dinamico">
            <!-- O MENU SERÁ INJETADO AQUI PELO JAVASCRIPT DEPENDENDO DO PERFIL -->
        </ul>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <header class="topbar">
            <b id="painel-titulo-modulo">VISÃO GERAL - UNIDADE</b>
            <button class="btn-logout" onclick="sairDoSistema()">SAIR</button>
        </header>

        <div class="dashboard-container" id="area-cartoes">
            <!-- OS CARTÕES SERÃO INJETADOS AQUI PELO JAVASCRIPT -->
        </div>
    </main>

    <script>
        // ==========================================
        // 1. CARREGAMENTO INICIAL DAS MOCHILAS
        // ==========================================
        window.onload = function() {
            // Se não tiver login na mochila, expulsa para a tela de login
            if(!localStorage.getItem('ceu_rf_logado')) {
                window.location.href = "index_FB.html";
                return;
            }

            // Preenche o cabeçalho
            document.getElementById('painel-nome-ceu').innerText = localStorage.getItem('ceu_nome_especifico') || "UNIDADE NÃO IDENTIFICADA";
            document.getElementById('painel-nome-usuario').innerText = localStorage.getItem('ceu_nome_usuario') || "Gestor";
            
            const logo = localStorage.getItem('ceu_logo_sistema');
            if(logo) document.getElementById('painel-logo').src = logo;

            // Roteamento de Interface (O que o usuário pode ver?)
            const perfil = localStorage.getItem('ceu_perfil');
            
            if(perfil === 'DRE') {
                montarInterfaceDRE();
            } else {
                montarInterfaceUnidade();
            }
        };

        // ==========================================
        // 2. CONSTRUTOR DO MODO UNIDADE (CEU)
        // ==========================================
        function montarInterfaceUnidade() {
            document.getElementById('painel-titulo-modulo').innerText = "VISÃO GERAL - UNIDADE";
            
            // Injetando a sua árvore de Menus no HTML
            document.getElementById('menu-dinamico').innerHTML = `
                <li class="menu-item" onclick="alternarMenu(this)"><span class="material-icons">home</span> Início</li>
                
                <li class="menu-item" onclick="alternarMenu(this)"><span class="material-icons">people</span> Cadastros</li>
                <ul class="submenu">
                    <li>Munícipes</li>
                    <li>Incluir Novo munícipe</li>
                    <li>Edição Rápida</li>
                </ul>

                <li class="menu-item" onclick="alternarMenu(this)"><span class="material-icons">school</span> Turmas e Matrículas</li>
                <ul class="submenu">
                    <li>Turmas</li>
                    <li>Fazer Matrículas</li>
                    <li>Gerenciar Matrículas</li>
                    <div class="menu-separador"></div>
                    <li>Chamada On-line</li>
                    <li>Liberar Chamada On-line</li>
                    <div class="menu-separador"></div>
                    <li>Configurar Lista de Espera</li>
                </ul>

                <li class="menu-item" onclick="alternarMenu(this)"><span class="material-icons">print</span> Impressão/Expedição</li>
                <ul class="submenu">
                    <li>Carteirinhas: Uso Geral</li>
                    <li>Carteirinhas: Projeto Academia Livre</li>
                    <li>Carteirinhas: Projeto Raia Livre</li>
                    <div class="menu-separador"></div>
                    <li>Listas de Chamada: Física</li>
                    <li>Listas de Chamada: On-line</li>
                    <div class="menu-separador"></div>
                    <li>Lista de Vagas</li>
                    <li>Protocolo para retirar Carteirinhas</li>
                </ul>

                <li class="menu-item" onclick="alternarMenu(this)"><span class="material-icons">sports_volleyball</span> Recreio nas Férias</li>
                <ul class="submenu">
                    <li>Cadastrar</li>
                    <li>Edição Rápida</li>
                    <li>Crachás de Acesso</li>
                    <li>Painel de Gráficos</li>
                    <li>Listas de Impressão</li>
                    <li>Chamada Qualitativa</li>
                </ul>

                <li class="menu-item" onclick="alternarMenu(this)"><span class="material-icons">settings</span> Cadastros Base</li>
                <ul class="submenu">
                    <li>Núcleos</li>
                    <li>Espaços</li>
                    <li>Professores</li>
                    <li>Tipo Responsável</li>
                    <li>Modalidades</li>
                </ul>
            `;

            // Injetando os seus Cartões da Unidade
            document.getElementById('area-cartoes').innerHTML = `
                <div class="cards-grid">
                    <div class="card card-turno">
                        <h4>Boas Vindas</h4>
                        <p style="margin:0; font-size: 11px; font-weight:bold;">Turno da Manhã</p>
                    </div>
                    <div class="card card-destaque">
                        <h4>Resumo da Unidade</h4>
                        <p style="margin:0; font-size: 11px; color:#ff9800; font-weight:bold;">Operacional</p>
                    </div>
                    <div class="card"><h4>Munícipes Cadastrados</h4><p class="numero">0</p></div>
                    <div class="card"><h4>Turmas Ativas</h4><p class="numero">0</p></div>
                    <div class="card"><h4>Matrículas Realizadas</h4><p class="numero">0</p></div>
                    <div class="card"><h4>Fila de Espera</h4><p class="numero">0</p></div>
                    <div class="card"><h4>Agenda da TV</h4><p class="numero">0</p></div>
                </div>
                <button class="btn-analitico">ACESSAR PAINEL ANALÍTICO DE VAGAS</button>
            `;
        }

        // ==========================================
        // 3. CONSTRUTOR DO MODO DRE
        // ==========================================
        function montarInterfaceDRE() {
            document.getElementById('painel-titulo-modulo').innerText = "VISÃO ESTRATÉGICA - DRE";
            
            // Aqui construiremos os Menus da DRE futuramente
            document.getElementById('menu-dinamico').innerHTML = `
                <li class="menu-item"><span class="material-icons">dashboard</span> Painel DRE</li>
                <li class="menu-item"><span class="material-icons">rule</span> RF - Regras</li>
                <li class="menu-item"><span class="material-icons">directions_bus</span> RF - Passeios</li>
            `;

            document.getElementById('area-cartoes').innerHTML = `
                <h3 style="margin-top:0;">Visão Geral da Rede</h3>
                <!-- Aqui entrarão os cartões sumarizados de todos os CEUs -->
            `;
        }

        // ==========================================
        // FUNÇÕES AUXILIARES
        // ==========================================
        function alternarMenu(elemento) {
            // Fecha todos os outros antes de abrir o clicado
            document.querySelectorAll('.menu-item').forEach(el => {
                if(el !== elemento) el.classList.remove('active');
            });
            elemento.classList.toggle('active');
        }

        function sairDoSistema() {
            localStorage.clear();
            window.location.href = "index_FB.html";
        }
    </script>
</body>
</html>
