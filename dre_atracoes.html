<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Atrações e Eventos - DRE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px; }
        .card-container { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .titulo-secao { font-size: 18px; font-weight: 700; color: #2c3e50; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #2c3e50; color: white; padding: 12px; font-size: 13px; text-align: center; }
        td { border: 1px solid #dee2e6; padding: 10px; font-size: 14px; text-align: center; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="container-fluid" style="max-width: 1200px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 style="color: #2c3e50; font-weight: 700;">🎭 Gestão de Atrações, Teatro e Jogos</h2>
            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">Voltar ao Painel</button>
        </div>

        <!-- FORMULÁRIO DE CADASTRO -->
        <div class="card-container">
            <div class="titulo-secao"><span class="material-icons">event_available</span> Nova Atração / Evento para a Rede</div>
            <form id="formAtracao" onsubmit="event.preventDefault(); salvarAtracao();">
                <input type="hidden" id="atr_id">
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-bold">Título da Atração / Espetáculo</label>
                        <input type="text" id="atr_titulo" class="form-control" placeholder="Ex: O Pequeno Príncipe / Festival de Jogos" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Categoria</label>
                        <select id="atr_tipo" class="form-select" required>
                            <option value="Teatro / Espetáculo">Teatro / Espetáculo</option>
                            <option value="Contação de Histórias">Contação de Histórias</option>
                            <option value="Jogos e Recreação">Jogos e Recreação</option>
                            <option value="Oficina / Vivência">Oficina / Vivência</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label fw-bold">Data</label>
                        <input type="date" id="atr_data" class="form-control" required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label fw-bold">Horário</label>
                        <input type="time" id="atr_horario" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Local / Espaço no CEU</label>
                        <input type="text" id="atr_local" class="form-control" placeholder="Ex: Teatro / Quadra Coberta" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Público-Alvo</label>
                        <input type="text" id="atr_publico" class="form-control" placeholder="Ex: Infantil / Livre / Estudantes" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Breve Descrição</label>
                        <input type="text" id="atr_descricao" class="form-control" placeholder="Detalhes da atração...">
                    </div>
                </div>
                <div class="text-end">
                    <button type="button" class="btn btn-warning me-2" id="btnCancelar" style="display:none;" onclick="limparFormulario()">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-bold px-4">Salvar Atração</button>
                </div>
            </form>
        </div>

        <!-- LISTA DE ATRAÇÕES CADASTRADAS -->
        <div class="card-container">
            <div class="titulo-secao"><span class="material-icons">list_alt</span> Atrações Cadastradas na Rede</div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Categoria</th>
                            <th>Data / Horário</th>
                            <th>Local</th>
                            <th>Público-Alvo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaAtracoes">
                        <tr><td colspan="6" class="text-center py-3">Carregando atrações...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let listaGlobalAtracoes = [];

        function carregarAtracoes() {
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "buscarDadosAtracoesDRE" }) })
            .then(res => res.json())
            .then(retorno => {
                if (retorno.sucesso) {
                    listaGlobalAtracoes = retorno.atracoes || [];
                    renderizarTabela();
                } else {
                    document.getElementById('tabelaAtracoes').innerHTML = `<tr><td colspan="6" class="text-danger">Erro ao carregar.</td></tr>`;
                }
            });
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tabelaAtracoes');
            tbody.innerHTML = "";
            if (listaGlobalAtracoes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-muted py-3">Nenhuma atração cadastrada até o momento.</td></tr>`;
                return;
            }

            listaGlobalAtracoes.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold; text-align: left;">${item.titulo}<br><small class="text-muted">${item.descricao || ''}</small></td>
                        <td><span class="badge bg-info text-dark">${item.tipo}</span></td>
                        <td>${item.data.split('-').reverse().join('/')} às ${item.horario}</td>
                        <td>${item.local}</td>
                        <td>${item.publico}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editarAtracao('${item.id}')"><span class="material-icons" style="font-size: 16px; vertical-align: middle;">edit</span></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="excluirAtracao('${item.id}')"><span class="material-icons" style="font-size: 16px; vertical-align: middle;">delete</span></button>
                        </td>
                    </tr>
                `;
            });
        }

        function salvarAtracao() {
            const pacote = {
                acaoSub: "salvar",
                id: document.getElementById('atr_id').value,
                titulo: document.getElementById('atr_titulo').value,
                tipo: document.getElementById('atr_tipo').value,
                descricao: document.getElementById('atr_descricao').value,
                data: document.getElementById('atr_data').value,
                horario: document.getElementById('atr_horario').value,
                local: document.getElementById('atr_local').value,
                publico: document.getElementById('atr_publico').value
            };

            Swal.fire({ title: 'Salvando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "gerenciarAtracaoDRE", dados: pacote }) })
            .then(res => res.json())
            .then(retorno => {
                if (retorno.sucesso) {
                    Swal.fire('Sucesso!', retorno.mensagem, 'success');
                    limparFormulario();
                    carregarAtracoes();
                } else {
                    Swal.fire('Erro', retorno.erro, 'error');
                }
            });
        }

        function editarAtracao(id) {
            const item = listaGlobalAtracoes.find(x => x.id === id);
            if (!item) return;
            document.getElementById('atr_id').value = item.id;
            document.getElementById('atr_titulo').value = item.titulo;
            document.getElementById('atr_tipo').value = item.tipo;
            document.getElementById('atr_descricao').value = item.descricao;
            document.getElementById('atr_data').value = item.data;
            document.getElementById('atr_horario').value = item.horario;
            document.getElementById('atr_local').value = item.local;
            document.getElementById('atr_publico').value = item.publico;
            document.getElementById('btnCancelar').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function excluirAtracao(id) {
            Swal.fire({
                title: 'Tem certeza?', text: "Deseja remover esta atração da rede?", icon: 'warning',
                showCancelButton: true, confirmButtonText: 'Sim, excluir', cancelButtonText: 'Cancelar'
            }).then(result => {
                if (result.isConfirmed) {
                    fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "gerenciarAtracaoDRE", dados: { acaoSub: "excluir", id: id } }) })
                    .then(res => res.json())
                    .then(retorno => {
                        if (retorno.sucesso) {
                            Swal.fire('Excluído!', retorno.mensagem, 'success');
                            carregarAtracoes();
                        }
                    });
                }
            });
        }

        function limparFormulario() {
            document.getElementById('formAtracao').reset();
            document.getElementById('atr_id').value = "";
            document.getElementById('btnCancelar').style.display = 'none';
        }

        window.onload = carregarAtracoes;
    </script>
</body>
</html>
