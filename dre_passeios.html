<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Passeios - DRE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        
        .header-dre { background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 20px 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        
        /* LINHA DO TEMPO HORIZONTAL */
        .timeline-container { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; scroll-behavior: smooth; }
        .timeline-container::-webkit-scrollbar { height: 10px; }
        .timeline-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .timeline-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .dia-card { min-width: 380px; max-width: 380px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }
        .dia-header { background: #0d6efd; color: white; text-align: center; padding: 15px; font-weight: 800; font-size: 18px; letter-spacing: 1px; }
        .dia-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }
        
        .form-label { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 2px; text-transform: uppercase; }
        .form-control { font-size: 13px; border-radius: 6px; padding: 8px 10px; border: 1px solid #cbd5e1; background: #f8fafc; }
        .form-control:focus { border-color: #0d6efd; box-shadow: none; background: white; }
        
        /* BOTÕES DO RODAPÉ DIVIDIDOS EM 4 */
        .card-footer-botoes { display: flex; gap: 5px; padding: 12px; background: #f8fafc; border-top: 1px solid #e2e8f0; }
        .btn-card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; border: none; border-radius: 8px; font-size: 10px; font-weight: bold; transition: 0.2s; color: white; text-transform: uppercase; letter-spacing: 0.5px;}
        .btn-card-del { background: #ef4444; } .btn-card-del:hover { background: #dc2626; }
        .btn-card-save { background: #0ea5e9; } .btn-card-save:hover { background: #0284c7; }
        .btn-card-print { background: #10b981; } .btn-card-print:hover { background: #059669; }
        .btn-card-add { background: #8b5cf6; } .btn-card-add:hover { background: #7c3aed; }
        .btn-card i { font-size: 18px; margin-bottom: 2px; }
        
        .acesso-negado { text-align: center; margin-top: 100px; color: #dc3545; }
    </style>
</head>
<body>

    <div id="area-restrita" style="display: none;">
        <div class="header-dre">
            <div>
                <h3 style="margin: 0; font-weight: 800;"><i class="material-icons align-middle">directions_bus</i> Gestão de Passeios</h3>
                <p style="margin: 0; font-size: 14px; opacity: 0.9;" id="subtitulo-programa">Conectando ao Banco de Dados...</p>
            </div>
        </div>

        <div class="timeline-container" id="container-dias">
            <h5 class="text-muted mt-5 mx-auto"><div class="spinner-border text-primary me-2" role="status"></div> Construindo linha do tempo e buscando registros...</h5>
        </div>
    </div>

    <div id="area-bloqueada" class="acesso-negado" style="display: none;">
        <i class="material-icons" style="font-size: 80px;">gavel</i>
        <h1 style="font-weight: 900;">ACESSO RESTRITO</h1>
        <p>Esta tela é de uso exclusivo da Diretoria Regional de Educação (DRE).</p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec"; 
        let dadosGlobais = {}; 

        window.onload = function() {
            const perfil = localStorage.getItem('ceu_perfil') || "CEU";
            if (perfil !== "DRE" && perfil !== "SME") {
                document.getElementById('area-bloqueada').style.display = 'block';
                return;
            }
            document.getElementById('area-restrita').style.display = 'block';
            iniciarSistema();
        };

        function normalizarData(str) {
            if (!str) return null;
            if (str.indexOf('-') > 0) return new Date(str + "T00:00:00");
            if (str.indexOf('/') > 0) {
                let p = str.split('/');
                return new Date(`${p[2]}-${p[1]}-${p[0]}T00:00:00`);
            }
            return null;
        }

        async function iniciarSistema() {
            try {
                let resRegras = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "buscarDadosPasseiosDRE" }) });
                let textRegras = await resRegras.text();
                let dadosRegras;
                try { dadosRegras = JSON.parse(textRegras); } catch(e) { return; }
                if(!dadosRegras.sucesso) return;

                dadosGlobais = dadosRegras;
                document.getElementById('subtitulo-programa').innerText = `Programa Recreio nas Férias - ${dadosRegras.programa.mes}/${dadosRegras.programa.ano}`;

                let resSalvos = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "buscarPasseiosSalvosDRE" }) });
                let dadosSalvos = await resSalvos.json();
                let listaSalvos = dadosSalvos.sucesso ? dadosSalvos.passeiosSalvos : [];

                construirLinhaDoTempo(dadosRegras.programa.inicio, dadosRegras.programa.fim, listaSalvos);
                
            } catch(e) { console.error(e); }
        }

        function construirLinhaDoTempo(dataInicioStr, dataFimStr, listaSalvos) {
            const container = document.getElementById('container-dias');
            container.innerHTML = "";

            let dataAtual = normalizarData(String(dataInicioStr));
            let dataFim = normalizarData(String(dataFimStr));
            if (!dataAtual || !dataFim || isNaN(dataAtual.getTime()) || isNaN(dataFim.getTime())) return;

            const diasSemana = ["DOMINGO", "SEGUNDA", "TERÇA", "QUARTA", "QUINTA", "SEXTA", "SÁBADO"];
            let travaAntiLoop = 0; 

            while (dataAtual <= dataFim && travaAntiLoop < 40) {
                let diaFormatado = ("0" + dataAtual.getDate()).slice(-2) + "/" + ("0" + (dataAtual.getMonth() + 1)).slice(-2) + "/" + String(dataAtual.getFullYear()).slice(-2);
                let nomeSemana = diasSemana[dataAtual.getDay()];
                let cabecalhoDia = `${diaFormatado} (${nomeSemana})`;

                // 🧠 PEGA TODOS OS PASSEIOS CADASTRADOS NESTE DIA ESPECÍFICO
                let passeiosDoDia = listaSalvos.filter(p => String(p.dataPasseio).trim() === String(cabecalhoDia).trim());

                if (passeiosDoDia.length === 0) {
                    // Se não tem nada, gera 1 card em branco
                    container.innerHTML += gerarCardHTML(gerarIdAleatorio(), cabecalhoDia, {});
                } else {
                    // Se tem passeios gravados, gera 1 card para cada passeio achado!
                    passeiosDoDia.forEach(salvo => {
                        container.innerHTML += gerarCardHTML(gerarIdAleatorio(), cabecalhoDia, salvo);
                    });
                }
                
                travaAntiLoop++;
                dataAtual.setDate(dataAtual.getDate() + 1);
            }
        }

        function gerarIdAleatorio() {
            return Math.random().toString(36).substr(2, 9);
        }

        // ==========================================
        // 🧩 HTML DOS CARTÕES (AGORA COM ID ESCONDIDO E BOTÃO NOVO)
        // ==========================================
        function gerarCardHTML(uid, dataTexto, salvo) {
            return `
            <div class="dia-card">
                <div class="dia-header">${dataTexto}</div>
                <div class="dia-body">
                    
                    <!-- 🛡️ O ID SECRETO FICA AQUI -->
                    <input type="hidden" id="id_passeio_${uid}" value="${salvo.idPasseio || ''}">

                    <div>
                        <label class="form-label">EOLs (Separe por ponto e vírgula ';')</label>
                        <input type="text" class="form-control fw-bold text-primary" id="eol_${uid}" placeholder="Ex: 700039; 700041" value="${salvo.eols || ''}" onblur="preencherNomesCEU('${uid}')">
                    </div>
                    <div>
                        <label class="form-label">Nome(s) do(s) CEU(s)</label>
                        <textarea class="form-control text-primary fw-bold" id="nomes_${uid}" rows="2" readonly style="background:#e2e8f0; font-size: 11px;">${salvo.ceus || ''}</textarea>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label">Passeio</label>
                            <input type="text" class="form-control" id="passeio_${uid}" value="${salvo.passeio || ''}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Destino</label>
                            <input type="text" class="form-control" id="destino_${uid}" value="${salvo.destino || ''}">
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-4">
                            <label class="form-label">Evento</label>
                            <input type="text" class="form-control text-center" id="horario_evento_${uid}" placeholder="09h às 15h" value="${salvo.horarioEvento || ''}">
                        </div>
                        <div class="col-4">
                            <label class="form-label">Saída CEU</label>
                            <input type="time" class="form-control" id="saida_ceu_${uid}" value="${salvo.saidaCeu || ''}">
                        </div>
                        <div class="col-4">
                            <label class="form-label">Retorno</label>
                            <input type="time" class="form-control" id="chegada_ceu_${uid}" value="${salvo.chegadaCeu || ''}">
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label">Faixa Etária</label>
                            <input type="text" class="form-control" id="faixa_${uid}" placeholder="Ex: Infantil" value="${salvo.faixa || ''}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Idades</label>
                            <input type="text" class="form-control text-center" id="idade_${uid}" placeholder="06 a 14" value="${salvo.idade || ''}">
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label">Chegada (Polo)</label>
                            <input type="time" class="form-control" id="chegada_van_${uid}" value="${salvo.chegadaVan || ''}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Qtd (Van)</label>
                            <input type="number" class="form-control" id="qtd_${uid}" placeholder="Ex: 40" value="${salvo.qtd || ''}">
                        </div>
                    </div>

                </div>
                
                <div class="card-footer-botoes">
                    <button class="btn-card btn-card-del" onclick="excluirPasseio('${dataTexto}', '${uid}', this)" title="Apagar"><i class="material-icons">delete_sweep</i>Limpar</button>
                    <button class="btn-card btn-card-save" onclick="salvarPasseio('${dataTexto}', '${uid}')" title="Gravar"><i class="material-icons">save</i>Salvar</button>
                    <button class="btn-card btn-card-print" onclick="gerarRelatorioEAutorizacoes('${uid}', '${dataTexto}')" title="Imprimir"><i class="material-icons">print</i>Imp.</button>
                    <button class="btn-card btn-card-add" onclick="adicionarPasseioExtra(this, '${dataTexto}')" title="Adicionar Passeio"><i class="material-icons">add_box</i>Novo</button>
                </div>
            </div>
            `;
        }

        // ==========================================
        // 🚀 A MÁGICA: CRIAR NOVO CARD AO LADO!
        // ==========================================
        function adicionarPasseioExtra(botaoElement, dataTexto) {
            let uidNovo = gerarIdAleatorio();
            let htmlNovoCard = gerarCardHTML(uidNovo, dataTexto, {});
            
            // Injeta o card clonado logo depois do atual
            let cardAtual = botaoElement.closest('.dia-card');
            cardAtual.insertAdjacentHTML('afterend', htmlNovoCard);
            
            // Rola a tela suavemente para mostrar o novo card
            cardAtual.nextElementSibling.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        function preencherNomesCEU(uid) {
            let campoEol = document.getElementById(`eol_${uid}`).value;
            let campoNomes = document.getElementById(`nomes_${uid}`);
            if(!campoEol.trim()) { campoNomes.value = ""; return; }

            let eols = campoEol.split(';');
            let nomesEncontrados = [];

            eols.forEach(e => {
                let eolLimpo = e.trim();
                if(eolLimpo) {
                    let ceuAchado = dadosGlobais.ceus.find(c => c.eol === eolLimpo);
                    if(ceuAchado) nomesEncontrados.push(ceuAchado.nome);
                    else nomesEncontrados.push(`NÃO ENCONTRADO (${eolLimpo})`);
                }
            });
            campoNomes.value = nomesEncontrados.join(' | ');
        }

        async function salvarPasseio(dataTexto, uid) {
            let form = {
                idPasseio: document.getElementById(`id_passeio_${uid}`).value,
                dataPasseio: dataTexto,
                eols: document.getElementById(`eol_${uid}`).value,
                ceus: document.getElementById(`nomes_${uid}`).value,
                passeio: document.getElementById(`passeio_${uid}`).value.toUpperCase(),
                destino: document.getElementById(`destino_${uid}`).value.toUpperCase(),
                horarioEvento: document.getElementById(`horario_evento_${uid}`).value,
                saidaCeu: document.getElementById(`saida_ceu_${uid}`).value,
                chegadaCeu: document.getElementById(`chegada_ceu_${uid}`).value,
                faixa: document.getElementById(`faixa_${uid}`).value.toUpperCase(),
                idade: document.getElementById(`idade_${uid}`).value,
                chegadaVan: document.getElementById(`chegada_van_${uid}`).value,
                qtd: document.getElementById(`qtd_${uid}`).value
            };

            if(!form.eols || !form.ceus) return Swal.fire('Atenção', 'Preencha o(s) EOL(s) do CEU antes de salvar!', 'warning');
            Swal.fire({ title: 'Salvando...', text: 'Gravando dados...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

            try {
                let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "gerenciarPasseioDRE", dados: { subAcao: "salvar", ...form } }) });
                let retorno = await res.json();
                
                if(retorno.sucesso) {
                    // Atualiza o ID invisível na tela para ele não criar cópias se você salvar de novo!
                    document.getElementById(`id_passeio_${uid}`).value = retorno.idPasseio;
                    Swal.fire('Salvo!', retorno.mensagem, 'success');
                } else Swal.fire('Erro', retorno.erro, 'error');
            } catch(e) { Swal.fire('Erro', 'Falha na conexão.', 'error'); }
        }

        function excluirPasseio(dataTexto, uid, btnElement) {
            let idPasseio = document.getElementById(`id_passeio_${uid}`).value;

            // Se não tem ID, significa que nunca foi salvo no banco. Apenas limpa a tela.
            if (!idPasseio) {
                document.getElementById(`eol_${uid}`).value = "";
                document.getElementById(`nomes_${uid}`).value = "";
                document.getElementById(`passeio_${uid}`).value = "";
                document.getElementById(`destino_${uid}`).value = "";
                document.getElementById(`horario_evento_${uid}`).value = "";
                document.getElementById(`saida_ceu_${uid}`).value = "";
                document.getElementById(`chegada_ceu_${uid}`).value = "";
                document.getElementById(`faixa_${uid}`).value = "";
                document.getElementById(`idade_${uid}`).value = "";
                document.getElementById(`chegada_van_${uid}`).value = "";
                document.getElementById(`qtd_${uid}`).value = "";
                return;
            }

            Swal.fire({
                title: 'Deseja Apagar o Passeio?',
                text: "Isso vai excluir permanentemente este passeio do banco de dados.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'Sim, Excluir!',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Excluindo...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
                    try {
                        let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "gerenciarPasseioDRE", dados: { subAcao: "excluir", idPasseio: idPasseio } }) });
                        let retorno = await res.json();
                        
                        if(retorno.sucesso) {
                            Swal.fire('Apagado!', 'Registro removido.', 'success').then(() => {
                                iniciarSistema(); // Recarrega a tela toda para limpar perfeitamente
                            });
                        } else {
                            Swal.fire('Aviso', retorno.erro, 'info');
                        }
                    } catch(e) { Swal.fire('Erro', 'Falha na conexão.', 'error'); }
                }
            });
        }

        function gerarRelatorioEAutorizacoes(uid, dataTexto) {
            let form = {
                data: dataTexto,
                eols: document.getElementById(`eol_${uid}`).value,
                ceus: document.getElementById(`nomes_${uid}`).value,
                passeio: document.getElementById(`passeio_${uid}`).value.toUpperCase(),
                destino: document.getElementById(`destino_${uid}`).value.toUpperCase(),
                horarioEvento: document.getElementById(`horario_evento_${uid}`).value,
                saidaCeu: document.getElementById(`saida_ceu_${uid}`).value,
                chegadaCeu: document.getElementById(`chegada_ceu_${uid}`).value,
                faixa: document.getElementById(`faixa_${uid}`).value.toUpperCase(),
                idade: document.getElementById(`idade_${uid}`).value,
                chegadaVan: document.getElementById(`chegada_van_${uid}`).value,
                qtd: document.getElementById(`qtd_${uid}`).value,
                mesAno: `${dadosGlobais.programa.mes} / ${dadosGlobais.programa.ano}`
            };

            if(!form.ceus) return Swal.fire('Atenção', 'Preencha ao menos um EOL válido antes de gerar.', 'warning');

            let janela = window.open('', '_blank', 'width=1000,height=800');
            
            let html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Relatório e Autorizações - ${dataTexto}</title>
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; color: #333; }
                        h2 { text-align: center; color: #2c3e50; font-size: 20px; margin-bottom: 20px; text-transform: uppercase;}
                        table { width: 100%; border-collapse: collapse; margin-bottom: 40px; font-size: 13px; }
                        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; }
                        th { background-color: #f1f5f9; color: #334155; width: 30%; font-weight: bold; text-transform: uppercase; font-size: 11px;}
                        td { font-weight: bold; color: #0f172a; }
                        .page-break { page-break-before: always; }
                        .auth-container { border: 1px dashed #94a3b8; border-radius: 8px; padding: 30px; margin-bottom: 30px; font-family: 'Times New Roman', serif; font-size: 15px; line-height: 1.6;}
                        .auth-title { text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 20px; text-decoration: underline; }
                        .auth-linha { border-bottom: 1px solid #000; display: inline-block; }
                        .auth-assinatura { text-align: center; margin-top: 50px; }
                        .auth-assinatura-linha { border-top: 1px solid #000; width: 60%; margin: 0 auto; padding-top: 5px; font-size: 13px;}
                        @media print { body { padding: 0; } }
                    </style>
                </head>
                <body>

                    <h2>Cronograma de Passeio - ${form.data}</h2>
                    <table>
                        <tr><th>Unidades (CEUs) Contempladas</th><td>${form.ceus}</td></tr>
                        <tr><th>Nome do Passeio</th><td>${form.passeio}</td></tr>
                        <tr><th>Local / Destino</th><td>${form.destino}</td></tr>
                        <tr><th>Horário do Evento</th><td>${form.horarioEvento}</td></tr>
                        <tr><th>Horário Chegada Van/Ônibus no Polo</th><td>${form.chegadaVan}</td></tr>
                        <tr><th>Horário de Saída do CEU</th><td>${form.saidaCeu}</td></tr>
                        <tr><th>Horário Previsão Retorno CEU</th><td>${form.chegadaCeu}</td></tr>
                        <tr><th>Quantidade de Alunos por Veículo</th><td>${form.qtd} alunos</td></tr>
                        <tr><th>Faixa Etária / Idades</th><td>${form.faixa} - ${form.idade}</td></tr>
                    </table>

                    <div class="page-break"></div>
            `;

            for(let i=0; i<4; i++) {
                let nomesCEUAuth = form.ceus.split('|').map(c => c.trim()).join(' / ');
                html += `
                    <div class="auth-container">
                        <div style="text-align: center; font-weight: bold; text-transform: uppercase;">${nomesCEUAuth}</div>
                        <div style="text-align: center; font-weight: bold; margin-bottom: 20px;">Recreio nas Férias – ${form.mesAno}</div>
                        
                        <div class="auth-title">AUTORIZAÇÃO</div>

                        <div>
                            Nome da criança: <span class="auth-linha" style="width: 75%;"></span><br><br>
                            Nome da(o) responsável: <span class="auth-linha" style="width: 70%;"></span><br><br>
                            
                            <strong>Local do passeio:</strong> ${form.destino}<br>
                            <strong>Data:</strong> ${form.data}<br>
                            <strong>Horário previsto de saída e retorno:</strong> Saída às ${form.saidaCeu} | Retorno às ${form.chegadaCeu}<br><br>
                            
                            <p style="text-indent: 40px; text-align: justify;">
                                Autorizo meu(inha) filho(a) a participar do passeio do <strong>Recreio nas Férias – ${form.mesAno}</strong>, no dia e horário informados acima.
                            </p>
                        </div>

                        <div class="auth-assinatura">
                            <div class="auth-assinatura-linha">Assinatura do pai / mãe / responsável</div>
                        </div>
                    </div>
                `;

                if ((i + 1) % 2 === 0 && i < 3) html += `<div class="page-break"></div>`;
            }

            html += `
                    <script>
                        setTimeout(function() { window.print(); }, 800);
                    <\/script>
                </body>
                </html>
            `;

            janela.document.write(html);
            janela.document.close();
        }
    </script>
</body>
</html>
