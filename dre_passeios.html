<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Passeios - DRE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="config.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        
        .header-dre { background: linear-gradient(135deg, #2c3e50, #34495e); color: white; padding: 20px 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        
        .btn-header { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 8px 16px; border-radius: 8px; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-header:hover { background: white; color: #2c3e50; }

        .card-custom { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; padding: 20px; margin-bottom: 20px;}
        .card-title { color: #0d6efd; font-weight: 800; font-size: 16px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}
        
        .form-label { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 2px; text-transform: uppercase; }
        .form-control, .form-select { font-size: 13px; border-radius: 6px; padding: 8px 10px; border: 1px solid #cbd5e1; background: #f8fafc; }
        .form-control:focus, .form-select:focus { border-color: #0d6efd; box-shadow: none; background: white; }
        
        .btn-ceu { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .btn-ceu:hover { background: #0ea5e9; color: white; }

        /* TABELA DE PASSEIOS COM SCROLL */
        .table-container { max-height: 600px; overflow-y: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        .table-container::-webkit-scrollbar { width: 8px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px;}
        thead { background: #f1f5f9; position: sticky; top: 0; z-index: 1;}
        th { padding: 12px; text-transform: uppercase; font-size: 11px; color: #475569; font-weight: 800;}
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        
        .btn-acao { background: none; border: none; cursor: pointer; padding: 5px; border-radius: 4px; transition: 0.2s;}
        .btn-acao:hover { background: #f1f5f9; }
        
        .acesso-negado { text-align: center; margin-top: 100px; color: #dc3545; }
    </style>
</head>
<body>

    <div id="area-restrita" style="display: none;">
        <div class="header-dre">
            <div>
                <h3 style="margin: 0; font-weight: 800;"><i class="material-icons align-middle">directions_bus</i> Gestão de Passeios</h3>
                <p style="margin: 0; font-size: 14px; opacity: 0.9;" id="subtitulo-programa">Carregando Sistema...</p>
            </div>
            <div>
                <button class="btn-header" onclick="abrirModalRelatorioCEU()">
                    <i class="material-icons">summarize</i> Cronograma por CEU
                </button>
            </div>
        </div>

        <div class="row" id="area-sistema" style="display: none;">
            <!-- FORMULÁRIO (ESQUERDA) -->
            <div class="col-md-4">
                <div class="card-custom">
                    <div class="card-title">
                        <i class="material-icons">add_location_alt</i> Dados do Passeio
                    </div>
                    
                    <input type="hidden" id="form_id_passeio">

                    <div class="mb-3">
                        <label class="form-label">Data do Passeio</label>
                        <select class="form-select fw-bold text-primary" id="form_data"></select>
                    </div>

                    <!-- BOTÕES MÁGICOS DA DRE -->
                    <div class="mb-3">
                        <label class="form-label">CEUs da DRE (Clique para adicionar)</label>
                        <div id="container-botoes-ceus" class="d-flex flex-wrap gap-2"></div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">EOLs (Separados por ';')</label>
                        <input type="text" class="form-control fw-bold" id="form_eols" placeholder="Ex: 700039; 700041" onblur="preencherNomesCEU()">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome(s) do(s) CEU(s)</label>
                        <textarea class="form-control text-primary fw-bold" id="form_nomes" rows="2" readonly style="background:#e2e8f0; font-size: 11px;"></textarea>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6"><label class="form-label">Passeio</label><input type="text" class="form-control text-uppercase" id="form_passeio"></div>
                        <div class="col-6"><label class="form-label">Destino</label><input type="text" class="form-control text-uppercase" id="form_destino"></div>
                    </div>
                    
                    <div class="row g-2 mb-2">
                        <div class="col-4"><label class="form-label">Evento</label><input type="text" class="form-control text-center text-uppercase" id="form_evento" placeholder="09h às 15h"></div>
                        <div class="col-4"><label class="form-label">Saída CEU</label><input type="time" class="form-control" id="form_saida"></div>
                        <div class="col-4"><label class="form-label">Retorno</label><input type="time" class="form-control" id="form_retorno"></div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6"><label class="form-label">Faixa Etária</label><input type="text" class="form-control text-uppercase" id="form_faixa" placeholder="Ex: Infantil"></div>
                        <div class="col-6"><label class="form-label">Idades</label><input type="text" class="form-control text-center text-uppercase" id="form_idade" placeholder="06 a 14"></div>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-6"><label class="form-label">Chegada (Polo)</label><input type="time" class="form-control" id="form_chegada_van"></div>
                        <div class="col-6"><label class="form-label">Qtd (Van)</label><input type="number" class="form-control" id="form_qtd" placeholder="Ex: 40"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-secondary flex-grow-1 fw-bold" onclick="limparFormulario()"><i class="material-icons align-middle fs-5">clear_all</i> Limpar</button>
                        <button class="btn btn-primary flex-grow-1 fw-bold" onclick="salvarPasseio()"><i class="material-icons align-middle fs-5">save</i> Salvar</button>
                    </div>
                </div>
            </div>

            <!-- LISTAGEM (DIREITA) -->
            <div class="col-md-8">
                <div class="card-custom h-100">
                    <div class="card-title d-flex justify-content-between">
                        <span><i class="material-icons">list_alt</i> Passeios Registrados</span>
                        <span class="badge bg-secondary" id="contador-passeios">0 passeios</span>
                    </div>
                    
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Passeio / Destino</th>
                                    <th>CEU(s)</th>
                                    <th>Horários</th>
                                    <th class="text-center">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-tabela-passeios">
                                <!-- Preenchido via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="area-bloqueada" class="acesso-negado" style="display: none;">
        <i class="material-icons" style="font-size: 80px;">gavel</i>
        <h1 style="font-weight: 900;">ACESSO RESTRITO</h1>
        <p>Esta tela é de uso exclusivo da Diretoria Regional de Educação (DRE).</p>
    </div>

    <script>
        let dadosGlobais = {}; 
        let eolDreLogada = ""; 

        window.onload = function() {
            const perfil = localStorage.getItem('ceu_perfil') || "CEU";
            eolDreLogada = localStorage.getItem('ceu_codigo_eol'); // Pega o EOL da DRE logada

            if (perfil !== "DRE" && perfil !== "SME") {
                document.getElementById('area-bloqueada').style.display = 'block';
                return;
            }
            document.getElementById('area-restrita').style.display = 'block';
            iniciarSistema();
        };

        function normalizarData(str) {
            if (!str) return null;
            if (str.indexOf('-') > 0) return new Date(str + "T00:00:00");
            if (str.indexOf('/') > 0) {
                let p = str.split('/');
                return new Date(`${p[2]}-${p[1]}-${p[0]}T00:00:00`);
            }
            return null;
        }

        async function iniciarSistema() {
            Swal.fire({ title: 'Carregando Sistema...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            try {
                let resRegras = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "buscarDadosPasseiosDRE" }) });
                let dadosRegras = await resRegras.json();
                
                if(!dadosRegras.sucesso) return Swal.fire('Erro', dadosRegras.erro, 'error');

                dadosGlobais = dadosRegras;
                document.getElementById('subtitulo-programa').innerText = `Programa Recreio nas Férias - ${dadosRegras.programa.mes}/${dadosRegras.programa.ano}`;

                let resSalvos = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "buscarPasseiosSalvosDRE" }) });
                let dadosSalvos = await resSalvos.json();
                
                dadosGlobais.passeiosSalvos = dadosSalvos.sucesso ? dadosSalvos.passeiosSalvos : []; 

                // Montar Interface
                montarComboDatas(dadosRegras.programa.inicio, dadosRegras.programa.fim);
                montarBotoesCEU();
                renderizarTabela();
                
                document.getElementById('area-sistema').style.display = 'flex';
                Swal.close();
            } catch(e) { 
                Swal.fire('Erro', 'Falha de comunicação com o servidor.', 'error');
            }
        }

        // ==========================================
        // 🗓️ COMBO DE DATAS E BOTÕES DOS CEUs
        // ==========================================
        function montarComboDatas(dataInicioStr, dataFimStr) {
            let combo = document.getElementById('form_data');
            combo.innerHTML = '<option value="">Selecione a data...</option>';
            
            let dataAtual = normalizarData(String(dataInicioStr));
            let dataFim = normalizarData(String(dataFimStr));
            const diasSemana = ["DOMINGO", "SEGUNDA", "TERÇA", "QUARTA", "QUINTA", "SEXTA", "SÁBADO"];
            
            while (dataAtual <= dataFim) {
                let diaFormatado = ("0" + dataAtual.getDate()).slice(-2) + "/" + ("0" + (dataAtual.getMonth() + 1)).slice(-2) + "/" + String(dataAtual.getFullYear()).slice(-2);
                let nomeSemana = diasSemana[dataAtual.getDay()];
                let cabecalhoDia = `${diaFormatado} (${nomeSemana})`;
                
                combo.innerHTML += `<option value="${cabecalhoDia}">${cabecalhoDia}</option>`;
                dataAtual.setDate(dataAtual.getDate() + 1);
            }
        }

        function montarBotoesCEU() {
            let container = document.getElementById('container-botoes-ceus');
            container.innerHTML = "";
            
            // Filtra os CEUs onde a DRE seja igual à DRE logada (ou mostra todos se for SME)
            let ceusDestaDre = dadosGlobais.ceus.filter(c => localStorage.getItem('ceu_perfil') === 'SME' || c.dreEol === eolDreLogada);
            
            if (ceusDestaDre.length === 0) {
                container.innerHTML = "<span class='text-muted small'>Nenhum CEU vinculado encontrado.</span>";
                return;
            }

            ceusDestaDre.forEach(ceu => {
                let btn = document.createElement('button');
                btn.className = "btn-ceu";
                btn.innerText = ceu.nome.replace("CEU ", ""); 
                btn.onclick = () => adicionarEol(ceu.eol);
                container.appendChild(btn);
            });
        }

        function adicionarEol(eol) {
            let campo = document.getElementById('form_eols');
            let valoresAtuais = campo.value.split(';').map(v => v.trim()).filter(v => v !== "");
            
            if (!valoresAtuais.includes(String(eol))) {
                valoresAtuais.push(eol);
                campo.value = valoresAtuais.join('; ');
                preencherNomesCEU();
            }
        }

        function preencherNomesCEU() {
            let campoEol = document.getElementById('form_eols').value;
            let campoNomes = document.getElementById('form_nomes');
            if(!campoEol.trim()) { campoNomes.value = ""; return; }

            let eols = campoEol.split(';');
            let nomesEncontrados = [];

            eols.forEach(e => {
                let eolLimpo = e.trim();
                if(eolLimpo) {
                    let ceuAchado = dadosGlobais.ceus.find(c => c.eol === eolLimpo);
                    if(ceuAchado) nomesEncontrados.push(ceuAchado.nome);
                    else nomesEncontrados.push(`NÃO ENCONTRADO (${eolLimpo})`);
                }
            });
            campoNomes.value = nomesEncontrados.join(' | ');
        }

        function limparFormulario() {
            document.getElementById('form_id_passeio').value = "";
            document.getElementById('form_data').value = "";
            document.getElementById('form_eols').value = "";
            document.getElementById('form_nomes').value = "";
            document.getElementById('form_passeio').value = "";
            document.getElementById('form_destino').value = "";
            document.getElementById('form_evento').value = "";
            document.getElementById('form_saida').value = "";
            document.getElementById('form_retorno').value = "";
            document.getElementById('form_faixa').value = "";
            document.getElementById('form_idade').value = "";
            document.getElementById('form_chegada_van').value = "";
            document.getElementById('form_qtd').value = "";
        }

        // ==========================================
        // 💾 SALVAR E RENDERIZAR TABELA COM O FILTRO VISUAL
        // ==========================================
        async function salvarPasseio() {
            let form = {
                idPasseio: document.getElementById('form_id_passeio').value,
                dataPasseio: document.getElementById('form_data').value,
                eols: document.getElementById('form_eols').value,
                ceus: document.getElementById('form_nomes').value,
                passeio: document.getElementById('form_passeio').value.toUpperCase(),
                destino: document.getElementById('form_destino').value.toUpperCase(),
                horarioEvento: document.getElementById('form_evento').value.toUpperCase(),
                saidaCeu: document.getElementById('form_saida').value,
                chegadaCeu: document.getElementById('form_retorno').value,
                faixa: document.getElementById('form_faixa').value.toUpperCase(),
                idade: document.getElementById('form_idade').value.toUpperCase(),
                chegadaVan: document.getElementById('form_chegada_van').value,
                qtd: document.getElementById('form_qtd').value
            };

            if(!form.dataPasseio) return Swal.fire('Atenção', 'Selecione a data do passeio.', 'warning');
            if(!form.eols || !form.ceus) return Swal.fire('Atenção', 'Preencha o(s) EOL(s) do CEU.', 'warning');

            Swal.fire({ title: 'Salvando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

            try {
                let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "gerenciarPasseioDRE", dados: { subAcao: "salvar", ...form } }) });
                let retorno = await res.json();
                
                if(retorno.sucesso) {
                    Swal.fire('Salvo!', 'Passeio registrado com sucesso.', 'success');
                    limparFormulario();
                    let resSalvos = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "buscarPasseiosSalvosDRE" }) });
                    let dadosSalvos = await resSalvos.json();
                    dadosGlobais.passeiosSalvos = dadosSalvos.sucesso ? dadosSalvos.passeiosSalvos : []; 
                    renderizarTabela();
                } else Swal.fire('Erro', retorno.erro, 'error');
            } catch(e) { Swal.fire('Erro', 'Falha na conexão.', 'error'); }
        }

        function renderizarTabela() {
            let tbody = document.getElementById('corpo-tabela-passeios');
            tbody.innerHTML = "";

            // 🛡️ O FILTRO MÁGICO DA DRE (Mesma lógica das Atrações)
            let perfil = localStorage.getItem('ceu_perfil') || "CEU";
            let eolsDestaDre = dadosGlobais.ceus
                                .filter(c => perfil === 'SME' || c.dreEol === eolDreLogada)
                                .map(c => String(c.eol).trim());

            // Peneira a lista global que veio do servidor
            let passeiosFiltrados = dadosGlobais.passeiosSalvos.filter(p => {
                if (perfil === 'SME') return true; 
                let eolsPasseio = String(p.eols).split(';').map(e => e.trim());
                return eolsPasseio.some(eol => eolsDestaDre.includes(eol));
            });

            document.getElementById('contador-passeios').innerText = `${passeiosFiltrados.length} passeios`;

            if (passeiosFiltrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted"><b>Nenhum passeio agendado</b><br>Sua DRE ainda não possui passeios registrados.</td></tr>`;
                return;
            }

            passeiosFiltrados.forEach(p => {
                let ceusFormatados = p.ceus.replace(/\|/g, '<br><small class="text-muted">'); 
                
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-primary">${p.dataPasseio.substring(0,8)}</td>
                        <td>
                            <b>${p.passeio}</b><br>
                            <small class="text-muted"><i class="material-icons" style="font-size:10px;">place</i> ${p.destino}</small>
                        </td>
                        <td>${ceusFormatados}</td>
                        <td style="font-size:11px;">
                            S: <b>${p.saidaCeu}</b> | R: <b>${p.chegadaCeu}</b>
                        </td>
                        <td class="text-center" style="white-space: nowrap;">
                            <button class="btn-acao text-primary" onclick="editarPasseio('${p.idPasseio}')" title="Editar"><i class="material-icons">edit</i></button>
                            <button class="btn-acao text-success" onclick="gerarAutorizacoesEspecificas('${p.idPasseio}')" title="Imprimir Autorizações"><i class="material-icons">print</i></button>
                            <button class="btn-acao text-danger" onclick="excluirPasseio('${p.idPasseio}')" title="Apagar"><i class="material-icons">delete</i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function editarPasseio(id) {
            let p = dadosGlobais.passeiosSalvos.find(x => x.idPasseio === id);
            if(p) {
                document.getElementById('form_id_passeio').value = p.idPasseio;
                document.getElementById('form_data').value = p.dataPasseio;
                document.getElementById('form_eols').value = p.eols;
                document.getElementById('form_nomes').value = p.ceus;
                document.getElementById('form_passeio').value = p.passeio;
                document.getElementById('form_destino').value = p.destino;
                document.getElementById('form_evento').value = p.horarioEvento;
                document.getElementById('form_saida').value = p.saidaCeu;
                document.getElementById('form_retorno').value = p.chegadaCeu;
                document.getElementById('form_faixa').value = p.faixa;
                document.getElementById('form_idade').value = p.idade;
                document.getElementById('form_chegada_van').value = p.chegadaVan;
                document.getElementById('form_qtd').value = p.qtd;
            }
        }

        function excluirPasseio(id) {
            Swal.fire({
                title: 'Apagar Passeio?',
                text: "Isso não pode ser desfeito.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Excluir'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Excluindo...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
                    try {
                        let res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "gerenciarPasseioDRE", dados: { subAcao: "excluir", idPasseio: id } }) });
                        let retorno = await res.json();
                        
                        if(retorno.sucesso) {
                            Swal.fire('Apagado!', '', 'success');
                            limparFormulario();
                            let resSalvos = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: "buscarPasseiosSalvosDRE" }) });
                            let dadosSalvos = await resSalvos.json();
                            dadosGlobais.passeiosSalvos = dadosSalvos.sucesso ? dadosSalvos.passeiosSalvos : []; 
                            renderizarTabela();
                        } else Swal.fire('Erro', retorno.erro, 'error');
                    } catch(e) { Swal.fire('Erro', 'Falha na conexão.', 'error'); }
                }
            });
        }

        // ==========================================
        // 🖨️ MÓDULOS DE IMPRESSÃO (COPIADOS E AJUSTADOS)
        // ==========================================
        function abrirModalRelatorioCEU() {
            if(!dadosGlobais.ceus) return Swal.fire('Aguarde', 'Os dados ainda estão carregando...', 'warning');

            let ceusDestaDre = dadosGlobais.ceus.filter(c => localStorage.getItem('ceu_perfil') === 'SME' || c.dreEol === eolDreLogada);

            if (ceusDestaDre.length === 0) {
                return Swal.fire('Atenção', 'Nenhum CEU vinculado à sua DRE foi encontrado.', 'warning');
            }

            let ceusOrdenados = [...ceusDestaDre].sort((a,b) => a.nome.localeCompare(b.nome));
            let options = '<option value="">Selecione o CEU...</option>';
            ceusOrdenados.forEach(c => { options += `<option value="${c.eol}">${c.nome}</option>`; });

            Swal.fire({
                title: '<i class="material-icons text-primary fs-1">view_week</i><br>Gerar Cronograma de Mural',
                html: `<select id="swal-ceu-relatorio" class="form-select text-center fw-bold">${options}</select>`,
                showCancelButton: true, confirmButtonText: 'Gerar Planilha', confirmButtonColor: '#0d6efd',
                preConfirm: () => {
                    const sel = document.getElementById('swal-ceu-relatorio');
                    if (!sel.value) Swal.showValidationMessage('Selecione um CEU!');
                    return { eol: sel.value, nome: sel.options[sel.selectedIndex].text };
                }
            }).then((result) => {
                if (result.isConfirmed) gerarPlanilhaCronograma(result.value.eol, result.value.nome);
            });
        }

        function gerarPlanilhaCronograma(eolCeu, nomeCeu) {
            let passeiosDesteCeu = dadosGlobais.passeiosSalvos.filter(p => {
                let lista = String(p.eols).split(';').map(x => x.trim());
                return lista.includes(String(eolCeu));
            });

            let dataAtual = normalizarData(String(dadosGlobais.programa.inicio));
            let dataFim = normalizarData(String(dadosGlobais.programa.fim));
            let diasDoPrograma = [];
            
            while(dataAtual <= dataFim) {
                let diaF = ("0" + dataAtual.getDate()).slice(-2) + "/" + ("0" + (dataAtual.getMonth() + 1)).slice(-2);
                let semanaCurta = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"][dataAtual.getDay()];
                let formatoBanco = `${diaF}/${String(dataAtual.getFullYear()).slice(-2)} (${["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"][dataAtual.getDay()]})`;
                
                diasDoPrograma.push({ dataObj: new Date(dataAtual), cabecalhoHtml: `${semanaCurta}<br><span style="font-size:18px;">${diaF}</span>`, formatoBanco: formatoBanco });
                dataAtual.setDate(dataAtual.getDate() + 1);
            }

            let htmlTabelas = ''; let semanaAtualArray = [];
            diasDoPrograma.forEach((dia, index) => {
                semanaAtualArray.push(dia);
                if (dia.dataObj.getDay() === 6 || index === diasDoPrograma.length - 1) {
                    htmlTabelas += `<div class="cabecalho-pagina"><h1>CRONOGRAMA DE PASSEIOS</h1><h2>${nomeCeu} | ${dadosGlobais.programa.mes}/${dadosGlobais.programa.ano}</h2></div><table class="tabela-cronograma"><thead><tr>`;
                    semanaAtualArray.forEach(d => { htmlTabelas += `<th>${d.cabecalhoHtml}</th>`; });
                    htmlTabelas += `</tr></thead><tbody><tr>`;
                    semanaAtualArray.forEach(d => {
                        htmlTabelas += `<td valign="top">`;
                        let pt = passeiosDesteCeu.filter(p => String(p.dataPasseio).trim() === d.formatoBanco);
                        if(pt.length === 0) htmlTabelas += `<div class="card-vazio">Sem passeios</div>`;
                        else {
                            pt.forEach(p => {
                                htmlTabelas += `<div class="card-passeio"><div class="card-titulo">${p.passeio}</div><div class="card-linha"><b>📍</b> ${p.destino}</div><div class="card-linha"><b>⌚</b> ${p.horarioEvento}</div><div class="card-linha"><b>🚌</b> ${p.saidaCeu}</div><div class="card-linha"><b>🏠</b> ${p.chegadaCeu}</div><div class="card-linha"><b>👶</b> ${p.faixa} (${p.idade})</div><div class="card-linha"><b>👥</b> ${p.qtd} vagas</div></div>`;
                            });
                        }
                        htmlTabelas += `</td>`;
                    });
                    htmlTabelas += `</tr></tbody></table>`;
                    if (index !== diasDoPrograma.length - 1) htmlTabelas += `<div class="page-break"></div>`;
                    semanaAtualArray = []; 
                }
            });

            let janela = window.open('', '_blank', 'width=1100,height=800');
            janela.document.write(`<html><head><title>Cronograma</title><style>@page{size:A4 landscape;margin:15mm;}body{font-family:sans-serif;padding:20px;}.cabecalho-pagina{text-align:center;margin-bottom:20px;}h1{margin:0;font-size:22px;}h2{margin:5px 0 0 0;font-size:16px;color:#3b82f6;border-bottom:2px solid #e2e8f0;display:inline-block;padding-bottom:10px;}.tabela-cronograma{width:100%;border-collapse:collapse;table-layout:fixed;}th{background:#f8fafc;border:2px solid #cbd5e1;padding:12px;text-align:center;}td{border:2px solid #cbd5e1;padding:10px;}.card-passeio{background:#f0fdf4;border-left:5px solid #22c55e;padding:10px;margin-bottom:10px;font-size:11px;}.card-titulo{font-weight:bold;color:#166534;margin-bottom:5px;text-transform:uppercase;border-bottom:1px dashed #bbf7d0;}.card-vazio{text-align:center;font-style:italic;color:#94a3b8;font-size:12px;margin-top:20px;}.page-break{page-break-before:always;}</style></head><body>${htmlTabelas}<script>setTimeout(function(){window.print();},1000);<\/script></body></html>`);
            janela.document.close();
        }


function gerarAutorizacoesEspecificas(id) {
            let form = dadosGlobais.passeiosSalvos.find(x => x.idPasseio === id);
            if(!form) return;
            form.data = form.dataPasseio;
            form.mesAno = `${dadosGlobais.programa.mes} / ${dadosGlobais.programa.ano}`;

            let janela = window.open('', '_blank', 'width=1000,height=800');
            
            // 🌟 CSS AJUSTADO PARA DISTRIBUIR O ESPAÇO HOMOGENEAMENTE (8 CÓPIAS)
            let html = `<html><head><style>
                @page { size: A4 portrait; margin: 15mm 10mm; } /* Margens maiores no topo/base e laterais ajustadas */
                body { font-family: Arial, sans-serif; margin: 0; padding: 0; color: #333; }
                h2 { text-align: center; color: #2c3e50; font-size: 16px; text-transform: uppercase; margin-bottom: 10px; margin-top: 5px;}
                
                /* TABELA DO RELATÓRIO (PÁGINA 1) */
                table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12px; }
                th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
                th { background: #f1f5f9; width: 30%; } 
                .page-break { page-break-before: always; }
                
                /* AUTORIZAÇÕES (PÁGINA 2) - 8 POR PÁGINA COM MAIS RESPIRO */
                .auth-container { 
                    border: 1px dashed #94a3b8; 
                    border-radius: 4px; 
                    padding: 8px 10px; /* Um pouquinho mais de respiro interno */
                    margin-bottom: 14px; /* Mais espaço entre as autorizações */
                    font-size: 11px; 
                    line-height: 1.15; 
                }
                .auth-header { text-align: center; font-weight: bold; font-size: 10px; text-transform: uppercase; margin-bottom: 3px;}
                .auth-title { text-align: center; font-weight: bold; font-size: 11px; margin-bottom: 4px; text-decoration: underline; }
                
                .auth-linha { border-bottom: 1px solid #000; display: inline-block; }
                
                /* ALINHAMENTO EM COLUNAS LADO A LADO */
                .linha-flex { display: flex; justify-content: space-between; margin-bottom: 4px; gap: 8px;}
                .campo-flex { flex-grow: 1; white-space: nowrap; }
                
                .auth-assinatura { text-align: center; margin-top: 10px; }
                .auth-assinatura-linha { border-top: 1px solid #000; width: 50%; margin: 0 auto; padding-top: 2px; font-size: 9px;}
                
                @media print { body { padding: 0; } }
            </style></head><body>
            
            <h2>Cronograma de Passeio - ${form.data}</h2>
            <table>
                <tr><th>Unidades Contempladas</th><td>${form.ceus}</td></tr>
                <tr><th>Passeio</th><td>${form.passeio}</td></tr>
                <tr><th>Destino</th><td>${form.destino}</td></tr>
                <tr><th>Evento</th><td>${form.horarioEvento}</td></tr>
                <tr><th>Chegada Polo</th><td>${form.chegadaVan}</td></tr>
                <tr><th>Saída CEU</th><td>${form.saidaCeu}</td></tr>
                <tr><th>Retorno CEU</th><td>${form.chegadaCeu}</td></tr>
                <tr><th>Qtd. Alunos</th><td>${form.qtd}</td></tr>
                <tr><th>Faixa Etária</th><td>${form.faixa} (${form.idade})</td></tr>
            </table>
            
            <div class="page-break"></div>`;

            // 🚀 LAÇO MANTIDO PARA GERAR AS 8 CÓPIAS
            for(let i=0; i<8; i++) {
                let nomesCEUAuth = form.ceus.split('|').map(c => c.trim()).join(' / ');
                
                html += `
                <div class="auth-container">
                    <div class="auth-header">
                        ${nomesCEUAuth} <span style="margin:0 10px;">|</span> Recreio nas Férias – ${form.mesAno}
                    </div>
                    
                    <div class="auth-title">AUTORIZAÇÃO DE PASSEIO</div>
                    
                    <!-- PRIMEIRA LINHA: NOME E RESPONSÁVEL -->
                    <div class="linha-flex">
                        <div class="campo-flex" style="width: 55%;">Nome da criança: <span class="auth-linha" style="width: 70%;"></span></div>
                        <div class="campo-flex" style="width: 45%;">Resp.: <span class="auth-linha" style="width: 80%;"></span></div>
                    </div>
                    
                    <!-- SEGUNDA LINHA: LOCAL, DATA E HORÁRIO -->
                    <div class="linha-flex">
                        <div class="campo-flex" style="width: 50%;"><strong>Local:</strong> ${form.destino}</div>
                        <div class="campo-flex" style="width: 25%;"><strong>Data:</strong> ${form.data.substring(0,5)}</div>
                        <div class="campo-flex" style="width: 25%;"><strong>Horário:</strong> ${form.saidaCeu} às ${form.chegadaCeu}</div>
                    </div>
                    
                    <p style="margin: 3px 0; text-align: justify;">
                        Autorizo meu(inha) filho(a) a participar do passeio do <strong>Recreio nas Férias – ${form.mesAno}</strong>, no local, dia e horário informados acima.
                    </p>
                    
                    <div class="auth-assinatura">
                        <div class="auth-assinatura-linha">Assinatura do pai / mãe / responsável</div>
                    </div>
                </div>`;
            }
            
            janela.document.write(html + `<script>setTimeout(function(){window.print();},800);<\/script></body></html>`);
            janela.document.close();
        }

    </script>
</body>
</html>
