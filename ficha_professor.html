<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Cadastral - Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* MÁGICA DA IMPRESSÃO: Oculta botões e fundos escuros quando for para o papel */
        @media print {
            @page { margin: 15mm; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: white !important; }
            .no-print { display: none !important; }
            .a4-page { box-shadow: none !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }
        }
        
        body { background: #525659; font-family: 'Arial', sans-serif; }
        
        /* O formato visual de uma folha de papel na tela */
        .a4-page {
            background: white;
            width: 210mm;
            min-height: 297mm;
            margin: 20px auto;
            padding: 20mm;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .cabecalho { border-bottom: 3px solid #0d6efd; padding-bottom: 15px; margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; }
        .cabecalho img { max-height: 80px; max-width: 200px; object-fit: contain; }
        .titulo-doc { text-align: center; flex-grow: 1; font-weight: 900; font-size: 22px; text-transform: uppercase; color: #2c3e50; line-height: 1.2; }
        
        .foto-prof { width: 130px; height: 130px; border-radius: 12px; object-fit: cover; border: 3px solid #e2e8f0; }
        
        .info-box { border: 2px solid #edf2f7; border-radius: 10px; padding: 15px; margin-bottom: 25px; background: #f8fafc; }
        .info-title { font-weight: bold; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 15px; color: #0d6efd; font-size: 16px; text-transform: uppercase; }
        
        .info-label { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
        .info-value { font-size: 15px; font-weight: bold; color: #1e293b; margin-bottom: 12px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 4px; }
    </style>
</head>
<body>

    <!-- BOTÃO FLUTUANTE QUE SÓ APARECE NA TELA -->
    <div class="text-center mt-4 mb-3 no-print">
        <button class="btn btn-primary btn-lg shadow" onclick="window.print()" style="font-weight: bold; border-radius: 50px; padding: 10px 30px;">
            <i class="material-icons align-middle">print</i> IMPRIMIR FICHA
        </button>
        <button class="btn btn-secondary btn-lg shadow ms-2" onclick="window.close()" style="border-radius: 50px;">Fechar</button>
    </div>

    <!-- A FOLHA A4 -->
    <div class="a4-page" id="conteudo-ficha">
        <div class="text-center mt-5">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <h4 class="mt-3 text-muted">Buscando dados no servidor...</h4>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec";
        
        window.onload = function() {
            // Pega o ID que veio na URL (ex: ?id=PRF12345)
            const urlParams = new URLSearchParams(window.location.search);
            const idProf = urlParams.get('id');
            const idPlanilha = localStorage.getItem('ceu_planilha_id');
            
            if(!idProf || !idPlanilha) {
                document.getElementById('conteudo-ficha').innerHTML = '<h3 class="text-danger text-center mt-5">Erro: Faltam parâmetros para gerar a ficha!</h3>';
                return;
            }

            fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify({ acao: "buscarProfessorPorId", dados: { id_planilha: idPlanilha, id_prof: idProf } }) 
            })
            .then(res => res.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    montarFicha(retorno.professor);
                } else {
                    document.getElementById('conteudo-ficha').innerHTML = '<h3 class="text-danger text-center mt-5">' + retorno.mensagem + '</h3>';
                }
            })
            .catch(() => {
                document.getElementById('conteudo-ficha').innerHTML = '<h3 class="text-danger text-center mt-5">Erro de conexão com o Banco de Dados.</h3>';
            });
        };

        function montarFicha(p) {
            // Puxa as infos do CEU que estão salvas na memória do navegador
            const nomeCeu = localStorage.getItem('ceu_nome') || "NOME DA UNIDADE INDISPONÍVEL";
            const logoCeu = localStorage.getItem('ceu_logo') || localStorage.getItem('ceu_logo_sistema') || "https://via.placeholder.com/200x80?text=LOGO+DA+UNIDADE";
            
            // Tratamento da foto (se a API retornou miniatura, vamos tentar tirar o "&sz=w150" para pegar ela maior, senão usa a que veio)
            let fotoSrc = p.foto;
            if(!fotoSrc || fotoSrc === "") fotoSrc = 'https://via.placeholder.com/150/e2e8f0/94a3b8?text=SEM+FOTO';
            else fotoSrc = fotoSrc.replace("&sz=w150", "&sz=w400"); // Pega a foto em melhor qualidade para impressão
            
            const html = `
                <div class="cabecalho">
                    <img src="${logoCeu}" alt="Logo">
                    <div class="titulo-doc">
                        FICHA CADASTRAL DE PROFESSOR<br>
                        <span style="font-size: 15px; font-weight: normal; color: #64748b;">${nomeCeu}</span>
                    </div>
                </div>
                
                <div class="d-flex gap-4 mb-4" style="align-items: center;">
                    <div>
                        <img src="${fotoSrc}" class="foto-prof">
                    </div>
                    <div class="flex-grow-1">
                        <div class="row">
                            <div class="col-8">
                                <div class="info-label">Nome Completo</div>
                                <div class="info-value" style="font-size: 20px; color: #0d6efd;">${p.nome}</div>
                            </div>
                            <div class="col-4">
                                <div class="info-label">Registro / ID</div>
                                <div class="info-value" style="font-size: 20px;">${p.id}</div>
                            </div>
                            <div class="col-6">
                                <div class="info-label">Tipo de Vínculo / Responsável</div>
                                <div class="info-value">${p.responsavel || 'NÃO INFORMADO'}</div>
                            </div>
                            <div class="col-6">
                                <div class="info-label">Telefone de Contato</div>
                                <div class="info-value">${p.telefone || 'NÃO INFORMADO'}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-title">INFORMAÇÕES FUNCIONAIS</div>
                    <div class="row">
                        <div class="col-12">
                            <div class="info-label">E-mail</div>
                            <div class="info-value" style="text-transform: lowercase;">${p.email || 'NÃO INFORMADO'}</div>
                        </div>
                        <div class="col-6">
                            <div class="info-label">Tipo de Falta Padrão</div>
                            <div class="info-value">${p.falta || 'NÃO INFORMADO'}</div>
                        </div>
                        <div class="col-6">
                            <div class="info-label">Período de Férias</div>
                            <div class="info-value">${p.ferias || 'NÃO INFORMADO'}</div>
                        </div>
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-title">QUADRO DE HORÁRIOS ADMINISTRATIVOS</div>
                    <div class="row">
                        <div class="col-12">
                            <div class="info-label">Horário de Reunião Coletiva</div>
                            <div class="info-value">${p.reuniao || 'NÃO INFORMADO'}</div>
                        </div>
                        <div class="col-12">
                            <div class="info-label">Horário de Planejamento (Aulas e Diários)</div>
                            <div class="info-value">${p.planejamento || 'NÃO INFORMADO'}</div>
                        </div>
                    </div>
                </div>

                <!-- CAMPO DE ASSINATURA -->
                <div style="margin-top: 120px; text-align: center;">
                    <div style="border-top: 1px solid #1e293b; width: 65%; margin: 0 auto; padding-top: 8px;">
                        <strong style="font-size: 16px;">${p.nome}</strong><br>
                        <span style="color: #64748b; font-size: 14px;">Assinatura do(a) Professor(a) / Responsável</span>
                    </div>
                </div>
                
                <div style="position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; font-size: 11px; color: #94a3b8;">
                    Documento gerado pelo Sistema de Gestão CEU em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}
                </div>
            `;
            
            document.getElementById('conteudo-ficha').innerHTML = html;
            
            // Opcional: Aciona a janela de impressão automaticamente 1 segundo após carregar os dados
            setTimeout(() => { window.print(); }, 1000);
        }
    </script>
</body>
</html>
