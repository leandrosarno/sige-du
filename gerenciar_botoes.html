<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Botões (Submenus)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
        .card-custom { border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); background: #fff; }
        .card-header-custom { background: #2c3e50; color: white; border-radius: 10px 10px 0 0 !important; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .table-hover tbody tr:hover { background-color: #f8f9fa; transition: 0.2s; }
        .btn-action { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; margin: 0 3px; }
        .badge-perfil { font-size: 11px; padding: 5px 10px; font-weight: 600; border-radius: 6px; margin-bottom: 2px; display: inline-block; }
        
        .bg-admin { background-color: #dc3545; color: white; }
        .bg-dre { background-color: #6f42c1; color: white; }
        .bg-sme { background-color: #fd7e14; color: white; }
        .bg-unidade { background-color: #0d6efd; color: white; }
        .bg-professor { background-color: #198754; color: white; }
    </style>
</head>
<body>

    <div class="container-fluid" id="tela-conteudo" style="display: none;">
        <div class="card card-custom">
            <div class="card-header-custom">
                <h5 class="mb-0"><i class="fas fa-hand-pointer me-2"></i> Estrutura do Menu: Botões e Submenus</h5>
                <button class="btn btn-light btn-sm fw-bold" style="color: #2c3e50;" onclick="window.abrirModalBotao()">
                    <i class="fas fa-plus me-1"></i> Novo Botão
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4 text-center" style="width: 80px;">Ordem</th>
                                <th>Ícone</th>
                                <th>Nome do Botão</th>
                                <th>Gaveta Pai</th>
                                <th>Tela Destino (HTML)</th>
                                <th>Visível Para</th>
                                <th class="text-center pe-4">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-botoes">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div>
                                    Carregando estrutura...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE E LÓGICA -->
    <script type="module">
        import { db } from './firebase_config.js';
        import { collection, getDocs, doc, setDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // Variável global para armazenar as gavetas e não precisar ir no banco toda hora
        window.gavetasGlobais = [];

        // 1. TRAVA DE SEGURANÇA INTELIGENTE (APENAS ADMIN)
        window.onload = async function() {
            let perfisUsuario = ["UNIDADE"];
            try {
                const cru = localStorage.getItem('sig_nivel_acesso') || "UNIDADE";
                if (cru.startsWith('[')) {
                    let lido = JSON.parse(cru);
                    if (lido.length === 1 && lido[0].includes(',')) {
                        perfisUsuario = lido[0].split(',').map(p => p.trim().toUpperCase());
                    } else {
                        perfisUsuario = lido.map(p => p.trim().toUpperCase());
                    }
                } else {
                    perfisUsuario = cru.split(',').map(p => p.trim().toUpperCase());
                }
            } catch (e) {
                perfisUsuario = ["UNIDADE"];
            }

            if (!perfisUsuario.includes('ADMIN')) {
                Swal.fire({
                    icon: 'error', title: 'Acesso Negado', text: 'Você não tem permissão para alterar a estrutura do sistema.',
                    confirmButtonColor: '#0d6efd', allowOutsideClick: false
                }).then(() => { window.location.href = "inicio_FB.html"; });
            } else {
                document.getElementById('tela-conteudo').style.display = 'block';
                await carregarGavetasNaMemoria(); // Busca as gavetas primeiro!
                carregarBotoes();
            }
        };

        // Carrega a lista de gavetas para usar no formulário
        async function carregarGavetasNaMemoria() {
            try {
                const snap = await getDocs(collection(db, "gavetas"));
                window.gavetasGlobais = [];
                snap.forEach(doc => window.gavetasGlobais.push(doc.data()));
                window.gavetasGlobais.sort((a, b) => Number(a.ordem) - Number(b.ordem));
            } catch(e) {
                console.error("Erro ao carregar gavetas pai:", e);
            }
        }

        // 2. LER BOTÕES (READ E ORDENAR)
        async function carregarBotoes() {
            try {
                const querySnapshot = await getDocs(collection(db, "botoes"));
                const tabela = document.getElementById('tabela-botoes');
                tabela.innerHTML = '';

                if(querySnapshot.empty) {
                    tabela.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">Nenhum botão cadastrado.</td></tr>`;
                    return;
                }

                let listaBotoes = [];
                querySnapshot.forEach((doc) => listaBotoes.push(doc.data()));

                // Ordena primeiro pela Gaveta e depois pela Ordem do botão
                listaBotoes.sort((a, b) => {
                    if(a.id_gaveta < b.id_gaveta) return -1;
                    if(a.id_gaveta > b.id_gaveta) return 1;
                    return Number(a.ordem) - Number(b.ordem);
                });

                listaBotoes.forEach((b) => {
                    let perfis = Array.isArray(b.perfis_permitidos) ? b.perfis_permitidos : [];
                    
                    const badgesHtml = perfis.map(p => {
                        let cor = 'bg-primary';
                        if(p === 'ADMIN') cor = 'bg-admin';
                        if(p === 'DRE') cor = 'bg-dre'; 
                        if(p === 'SME') cor = 'bg-sme';
                        if(p === 'PROFESSOR') cor = 'bg-professor';
                        if(p === 'UNIDADE') cor = 'bg-unidade';
                        return `<span class="badge badge-perfil ${cor}">${p}</span>`;
                    }).join(' ');

                    // Procura o nome da gaveta pai para ficar bonito na tabela
                    const gavetaPai = window.gavetasGlobais.find(g => g.id_gaveta === b.id_gaveta);
                    const nomeGavetaPai = gavetaPai ? gavetaPai.nome_gaveta : `<span class="text-danger">Gaveta Órfã (${b.id_gaveta})</span>`;

                    const row = `
                        <tr>
                            <td class="ps-4 text-center fw-bold text-muted">${b.ordem}</td>
                            <td><span class="material-icons text-success align-middle" style="font-size: 18px;">${b.icone || 'chevron_right'}</span></td>
                            <td class="fw-bold">${b.nome_botao}</td>
                            <td class="text-secondary" style="font-size: 11px;">${nomeGavetaPai}</td>
                            <td class="text-primary" style="font-size: 11px;">${b.url_destino}</td>
                            <td>${badgesHtml}</td>
                            <td class="text-center pe-4">
                                <button class="btn btn-outline-primary btn-action" onclick="window.editarBotao('${b.id_botao}')" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-outline-danger btn-action" onclick="window.excluirBotao('${b.id_botao}')" title="Excluir">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tabela.insertAdjacentHTML('beforeend', row);
                });
            } catch (erro) {
                console.error("Erro na tabela de botões:", erro);
                Swal.fire('Erro', 'Falha ao buscar estrutura no Firebase.', 'error');
            }
        }

        // 3. ADICIONAR E EDITAR BOTÃO
        window.abrirModalBotao = async function(idEdicao = null) {
            let botao = { id_botao: '', id_gaveta: '', nome_botao: '', url_destino: '', icone: '', ordem: '', perfis_permitidos: ['UNIDADE', 'ADMIN'] };
            let titulo = "Novo Botão";
            let idReadOnly = "";

            if (window.gavetasGlobais.length === 0) {
                Swal.fire('Atenção', 'Você precisa criar pelo menos uma Gaveta antes de criar botões!', 'warning');
                return;
            }

            if (idEdicao) {
                titulo = "Editar Botão";
                idReadOnly = "readonly disabled style='background-color: #e9ecef;'";
                Swal.fire({ title: 'Buscando estrutura...', didOpen: () => { Swal.showLoading() } });
                
                try {
                    const docSnap = await getDoc(doc(db, "botoes", idEdicao));
                    if (docSnap.exists()) {
                        botao = docSnap.data();
                        if (!Array.isArray(botao.perfis_permitidos)) botao.perfis_permitidos = [];
                        Swal.close();
                    }
                } catch (e) {
                    Swal.fire('Erro', 'Falha ao buscar dados do botão.', 'error');
                    return;
                }
            }

            const isChecked = (perfil) => botao.perfis_permitidos.includes(perfil) ? 'checked' : '';

            // Monta as opções do Select baseadas nas gavetas cadastradas
            const optionsGavetas = window.gavetasGlobais.map(g => 
                `<option value="${g.id_gaveta}" ${botao.id_gaveta === g.id_gaveta ? 'selected' : ''}>${g.nome_gaveta}</option>`
            ).join('');

            Swal.fire({
                title: `<i class="fas ${idEdicao ? 'fa-edit' : 'fa-hand-pointer'} text-success"></i> ${titulo}`,
                html: `
                    <div class="text-start" style="font-size: 13px;">
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="fw-bold mb-1 text-muted">ID do Botão (Sem espaços)</label>
                                <input type="text" id="swal-id-botao" class="form-control form-control-sm" value="${botao.id_botao}" ${idReadOnly} placeholder="Ex: btn_alunos" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9_]/g, '')">
                            </div>
                            <div class="col-6">
                                <label class="fw-bold mb-1 text-muted">Gaveta Pai (Onde ele fica?)</label>
                                <select id="swal-id-gaveta" class="form-select form-select-sm">
                                    <option value="" disabled ${!botao.id_gaveta ? 'selected' : ''}>Selecione...</option>
                                    ${optionsGavetas}
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-8">
                                <label class="fw-bold mb-1 text-muted">Nome de Exibição</label>
                                <input type="text" id="swal-nome-botao" class="form-control form-control-sm" value="${botao.nome_botao}" placeholder="Ex: Fazer Matrículas">
                            </div>
                            <div class="col-4">
                                <label class="fw-bold mb-1 text-muted">Ordem na Gaveta</label>
                                <input type="number" id="swal-ordem" class="form-control form-control-sm" value="${botao.ordem}" placeholder="Ex: 1">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-8">
                                <label class="fw-bold mb-1 text-muted">Tela de Destino (Link HTML)</label>
                                <input type="text" id="swal-url" class="form-control form-control-sm" value="${botao.url_destino}" placeholder="Ex: FormMatricula.html">
                            </div>
                            <div class="col-4">
                                <label class="fw-bold mb-1 text-muted">Ícone</label>
                                <input type="text" id="swal-icone" class="form-control form-control-sm" value="${botao.icone}" placeholder="Ex: school">
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-12">
                                <label class="fw-bold mb-2 text-muted">Quem pode ver esse botão?</label>
                                <div class="d-flex flex-wrap gap-3 p-2 border rounded bg-light">
                                    <div class="form-check"><input class="form-check-input chk-perfil-botao" type="checkbox" value="UNIDADE" id="pb-uni" ${isChecked('UNIDADE')}><label class="form-check-label fw-bold text-primary" for="pb-uni">UNIDADE</label></div>
                                    <div class="form-check"><input class="form-check-input chk-perfil-botao" type="checkbox" value="PROFESSOR" id="pb-prof" ${isChecked('PROFESSOR')}><label class="form-check-label fw-bold text-success" for="pb-prof">PROFESSOR</label></div>
                                    <div class="form-check"><input class="form-check-input chk-perfil-botao" type="checkbox" value="DRE" id="pb-dre" ${isChecked('DRE')}><label class="form-check-label fw-bold" style="color: #6f42c1;" for="pb-dre">DRE</label></div>
                                    <div class="form-check"><input class="form-check-input chk-perfil-botao" type="checkbox" value="SME" id="pb-sme" ${isChecked('SME')}><label class="form-check-label fw-bold text-warning" for="pb-sme">SME</label></div>
                                    <div class="form-check"><input class="form-check-input chk-perfil-botao" type="checkbox" value="ADMIN" id="pb-admin" ${isChecked('ADMIN')}><label class="form-check-label fw-bold text-danger" for="pb-admin">ADMIN</label></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `,
                width: '600px', showCancelButton: true, confirmButtonText: '<i class="fas fa-save me-1"></i> Salvar Botão',
                cancelButtonText: 'Cancelar', confirmButtonColor: '#2c3e50', focusConfirm: false,
                preConfirm: () => {
                    const id_botao = document.getElementById('swal-id-botao').value.trim();
                    const id_gaveta = document.getElementById('swal-id-gaveta').value;
                    const ordem = document.getElementById('swal-ordem').value.trim();
                    const nome_botao = document.getElementById('swal-nome-botao').value.trim();
                    const url_destino = document.getElementById('swal-url').value.trim();
                    const icone = document.getElementById('swal-icone').value.trim();
                    
                    const perfisMarcados = Array.from(document.querySelectorAll('.chk-perfil-botao:checked')).map(cb => cb.value);

                    if (!id_botao || !id_gaveta || !nome_botao || !url_destino || !ordem || perfisMarcados.length === 0) {
                        Swal.showValidationMessage('Preencha os campos obrigatórios (incluindo Tela de Destino) e selecione pelo menos um perfil!');
                        return false;
                    }
                    return { id_botao, id_gaveta, ordem: Number(ordem), nome_botao, url_destino, icone, perfis_permitidos: perfisMarcados };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Salvando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    const val = result.value;
                    try {
                        await setDoc(doc(db, "botoes", val.id_botao), {
                            id_botao: val.id_botao, 
                            id_gaveta: val.id_gaveta,
                            ordem: val.ordem, 
                            nome_botao: val.nome_botao,
                            url_destino: val.url_destino,
                            icone: val.icone, 
                            perfis_permitidos: val.perfis_permitidos
                        });
                        Swal.fire('Sucesso!', 'O botão foi salvo.', 'success');
                        carregarBotoes();
                    } catch (error) {
                        console.error(error);
                        Swal.fire('Erro', 'Falha ao salvar no banco de dados.', 'error');
                    }
                }
            });
        };

        window.editarBotao = function(idBotao) { window.abrirModalBotao(idBotao); };

        // 4. EXCLUIR BOTÃO
        window.excluirBotao = function(idBotao) {
            Swal.fire({
                title: 'Tem certeza?', 
                text: `Deseja excluir o botão "${idBotao}"? O acesso a essa tela será removido do menu.`, 
                icon: 'warning',
                showCancelButton: true, 
                confirmButtonColor: '#dc3545', 
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sim, Excluir',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Excluindo...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        await deleteDoc(doc(db, "botoes", idBotao));
                        Swal.fire('Excluído!', 'Botão removido da estrutura.', 'success');
                        carregarBotoes();
                    } catch (error) {
                        Swal.fire('Erro', 'Falha ao excluir o botão.', 'error');
                    }
                }
            });
        };
    </script>
</body>
</html>
