<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importador de Munícipes - ADMIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Leitor de CSV (PapaParse) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .import-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; border-top: 5px solid #0d6efd; display: none; }
        .progress { height: 25px; border-radius: 12px; display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- A DIV com id="tela-conteudo" começa oculta e só aparece para o ADMIN -->
    <div class="import-card animate__animated animate__fadeIn" id="tela-conteudo">
        <h3 class="fw-bold text-primary mb-3"><i class="fas fa-file-csv"></i> Importação em Massa</h3>
        <p class="text-muted mb-4">Selecione o arquivo CSV contendo os dados dos munícipes. O cabeçalho deve conter a coluna <b>id_unidade</b>.</p>
        
        <input type="file" id="arquivoCsv" class="form-control mb-3" accept=".csv">
        <button id="btnImportar" class="btn btn-primary w-100 fw-bold py-2" onclick="iniciarImportacao()">
            <i class="fas fa-cloud-upload-alt me-2"></i> INICIAR MIGRAÇÃO
        </button>

        <div class="progress" id="barra-progresso-container">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" id="barra-progresso" role="progressbar" style="width: 0%;">0%</div>
        </div>
        <p id="status-texto" class="mt-2 text-muted fw-bold" style="display: none;"></p>
    </div>

    <!-- MOTOR DO IMPORTADOR CENTRALIZADO -->
    <script type="module">
        import { db } from './firebase_config.js';
        import { collection, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // ==========================================
        // 1. TRAVA DE SEGURANÇA INTELIGENTE
        // ==========================================
        window.onload = function() {
            let perfisUsuario = ["UNIDADE"];
            try {
                const cru = localStorage.getItem('sig_nivel_acesso') || "UNIDADE";
                if (cru.startsWith('[')) {
                    let lido = JSON.parse(cru);
                    if (lido.length === 1 && lido[0].includes(',')) {
                        perfisUsuario = lido[0].split(',').map(p => p.trim().toUpperCase());
                    } else {
                        perfisUsuario = lido.map(p => p.trim().toUpperCase());
                    }
                } else {
                    perfisUsuario = cru.split(',').map(p => p.trim().toUpperCase());
                }
            } catch (e) {
                perfisUsuario = ["UNIDADE"];
            }

            if (!perfisUsuario.includes('ADMIN')) {
                Swal.fire({
                    icon: 'error', title: 'Acesso Negado', text: 'Esta ferramenta é restrita aos Administradores do sistema.',
                    confirmButtonColor: '#0d6efd', allowOutsideClick: false
                }).then(() => { 
                    window.location.href = "inicio_FB.html"; 
                });
            } else {
                // Libera a interface de importação para o Administrador
                document.getElementById('tela-conteudo').style.display = 'block';
            }
        }

        // ==========================================
        // 2. LÓGICA DE IMPORTAÇÃO COM PAPAPARSE
        // ==========================================
        window.iniciarImportacao = function() {
            const arquivoInput = document.getElementById('arquivoCsv');
            if (!arquivoInput.files[0]) {
                Swal.fire('Atenção', 'Selecione um arquivo CSV do seu computador primeiro.', 'warning');
                return;
            }

            const btn = document.getElementById('btnImportar');
            const barraContainer = document.getElementById('barra-progresso-container');
            const barra = document.getElementById('barra-progresso');
            const statusText = document.getElementById('status-texto');

            btn.disabled = true;
            barraContainer.style.display = 'flex';
            statusText.style.display = 'block';

            Papa.parse(arquivoInput.files[0], {
                header: true,
                skipEmptyLines: true,
                complete: async function(resultados) {
                    const dados = resultados.data;
                    if (dados.length === 0) {
                        Swal.fire('Erro', 'O arquivo CSV está vazio ou em formato inválido.', 'error');
                        btn.disabled = false;
                        return;
                    }

                    // Validação crítica de coluna
                    if (!dados[0].hasOwnProperty('id_unidade')) {
                        Swal.fire('Erro Crítico', 'A coluna obrigatória "id_unidade" não foi encontrada no cabeçalho do CSV. Verifique a planilha.', 'error');
                        btn.disabled = false;
                        return;
                    }

                    const totalRegistros = dados.length;
                    statusText.innerText = `Preparando ${totalRegistros} registros...`;

                    const TAMANHO_LOTE = 450; // Margem de segurança de lotes do Firestore (limite é 500)
                    let lotesEnviados = 0;
                    let totalLotes = Math.ceil(totalRegistros / TAMANHO_LOTE);

                    try {
                        for (let i = 0; i < totalRegistros; i += TAMANHO_LOTE) {
                            const lote = dados.slice(i, i + TAMANHO_LOTE);
                            const batch = writeBatch(db);

                            lote.forEach(municipe => {
                                // O FAXINEIRO DE COLUNAS FANTASMAS (Limpa colunas vazias geradas pelo Excel)
                                Object.keys(municipe).forEach(chave => {
                                    if (!chave || chave.trim() === "") {
                                        delete municipe[chave];
                                    }
                                });

                                // Cria uma referência nova para a coleção "municipes"
                                const docRef = doc(collection(db, "municipes")); 
                                
                                // Adiciona as chaves de rastro
                                municipe.data_cadastro = new Date().toISOString();
                                municipe.rf_cadastrador = localStorage.getItem('sig_rf') || "SISTEMA_MIGRACAO";
                                
                                batch.set(docRef, municipe);
                            });

                            // Executa o envio do pacote de 450 itens para o banco
                            await batch.commit();
                            lotesEnviados++;

                            // Atualiza a barrinha visual
                            const percentual = Math.round((lotesEnviados / totalLotes) * 100);
                            barra.style.width = percentual + '%';
                            barra.innerText = percentual + '%';
                            statusText.innerText = `Processando Lote ${lotesEnviados}: ${Math.min(i + TAMANHO_LOTE, totalRegistros)} de ${totalRegistros}`;
                        }

                        Swal.fire('Migração Concluída!', `Todos os ${totalRegistros} munícipes foram injetados no Firebase com sucesso.`, 'success');
                        statusText.innerText = "Importação finalizada com sucesso!";
                        statusText.classList.replace('text-muted', 'text-success');

                    } catch (erro) {
                        console.error("Erro na importação:", erro);
                        Swal.fire('Erro na Migração', 'Ocorreu um erro no disparo para o Firebase. Abra o console (F12) para ver os detalhes.', 'error');
                        statusText.innerText = "Falha no envio.";
                        statusText.classList.replace('text-muted', 'text-danger');
                    } finally {
                        btn.disabled = false;
                    }
                }
            });
        };
    </script>
</body>
</html>
