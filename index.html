<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-EDU - Login</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="config.js"></script>
    
    <style>
        :root { --cor-primaria: #0d6efd; --cor-fundo: #f4f7f6; }
        body { background-color: var(--cor-fundo); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header span { font-size: 50px; color: var(--cor-primaria); }
        .login-header h3 { font-weight: 700; color: #333; margin-top: 10px; }
        .btn-login { background-color: var(--cor-primaria); border: none; width: 100%; padding: 12px; font-weight: bold; font-size: 16px; margin-top: 20px; }
        .btn-login:hover { background-color: #0b5ed7; }
        .form-control { padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header" id="box-logo">
            <span class="material-icons" id="icone-padrao" style="font-size: 75px; color: var(--cor-primaria);">account_balance</span>
            <img id="img-logo" src="" alt="Logo do Sistema" style="display: none; width: 100%; height: 120px; object-fit: contain; margin: 0 auto 15px auto;">
            <h3 id="titulo-sistema">A carregar...</h3>
            <p class="text-muted">Acesso Restrito</p>
        </div>

        <form id="formLogin" onsubmit="event.preventDefault(); fazerLogin();">
            <div class="mb-3">
                <label class="form-label fw-bold">Código EOL da Unidade</label>
                <input type="number" class="form-control" id="id_ceu" placeholder="Ex: 123456" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">RF do Funcionário</label>
                <input type="number" class="form-control" id="rf_usuario" placeholder="Apenas números" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Senha de Acesso</label>
                <input type="password" class="form-control" id="senha_usuario" placeholder="Sua senha" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login" id="btn-entrar">ENTRAR</button>
        </form>
    </div>

    <script>
        // ==========================================
        // LOGO: O HEADER VOLTOU PARA A COMUNICAÇÃO PERFEITA
        // ==========================================
        window.onload = function() {
            localStorage.clear();

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "obterConfiguracoes", dados: {} })
            })
            .then(res => res.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    document.getElementById('titulo-sistema').innerText = retorno.dados.nomeSistema;
                    localStorage.setItem('ceu_nome_sistema', retorno.dados.nomeSistema);
                    
                    if (retorno.dados.logoUrl) {
                        localStorage.setItem('ceu_logo_sistema', retorno.dados.logoUrl);
                        document.getElementById('icone-padrao').style.display = 'none';
                        const img = document.getElementById('img-logo');
                        img.src = retorno.dados.logoUrl;
                        
                        if(retorno.dados.tamanhoLogo) {
                            img.style.height = retorno.dados.tamanhoLogo; 
                            localStorage.setItem('ceu_tamanho_logo', retorno.dados.tamanhoLogo); 
                        }
                        img.style.display = 'block';
                    }
                }
            })
            .catch(erro => console.error("Aviso: Falha ao puxar a Logo.", erro));
        };

        // ==========================================
        // O MOTOR BLINDADO DE LOGIN COM HEADERS
        // ==========================================
        function fazerLogin() {
            const ceu = document.getElementById('id_ceu').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!ceu || !rf || !senha) {
                Swal.fire('Atenção', 'Preencha todos os campos.', 'warning');
                return;
            }

            Swal.fire({
                title: 'A validar acessos...',
                text: 'A comunicar com o servidor central.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    acao: "validarLogin", 
                    dados: { id_ceu: ceu, rf_usuario: rf, senha_usuario: senha } 
                })
            })
            .then(resposta => {
                if (!resposta.ok) throw new Error("Erro de servidor (HTTP " + resposta.status + ")");
                return resposta.json();
            })
            .then(retorno => {
                if (retorno.status === "primeiro_acesso") {
                    tratarPrimeiroAcesso(retorno.mensagem, retorno.dados_usuario);
                } 
                else if (retorno.status === "sucesso") {
                    
                    localStorage.setItem('ceu_codigo_eol', ceu);
                    localStorage.setItem('ceu_rf_logado', rf); 
                    
                    localStorage.setItem('ceu_planilha_id', retorno.token.id_planilha_banco);
                    localStorage.setItem('ceu_nome', retorno.token.nome_ceu);
                    localStorage.setItem('ceu_nome_especifico', retorno.token.nome_ceu);
                    localStorage.setItem('ceu_nome_usuario', retorno.token.nome_usuario);
                    
                    if(retorno.token.logo_ceu) localStorage.setItem('ceu_logo', retorno.token.logo_ceu);
                    if(retorno.token.foto_usuario) localStorage.setItem('ceu_foto_usuario', retorno.token.foto_usuario);
                    
                    localStorage.setItem('ceu_perfil', retorno.token.perfil_usuario); 
                    
                    // 🚀 O REDIRECIONAMENTO CORRIGIDO: Joga direto para o admin.html!
                    window.location.href = "dashboard.html"; 
                }
                else {
                    Swal.fire('Acesso Negado', retorno.mensagem || retorno.erro || 'Credenciais inválidas.', 'error');
                }
            })
            .catch(erro => {
                Swal.fire('Erro de Comunicação', 'Falha ao ligar ao servidor do Google. Tente novamente.', 'error');
                console.error("Erro fatal no Fetch de Login: ", erro);
            });
        }

        // ==========================================
        // PRIMEIRO ACESSO
        // ==========================================
        function tratarPrimeiroAcesso(mensagemDoServidor, dadosUsuario) {
            Swal.fire({
                title: '🔒 Primeiro Acesso',
                text: mensagemDoServidor,
                icon: 'info',
                html: `
                    <div style="text-align: left; font-size: 14px;">
                        <label class="mt-2 fw-bold">Nova Senha:</label>
                        <input type="password" id="swal-nova-senha" class="swal2-input" placeholder="Mínimo 8 caracteres">
                        <label class="mt-2 fw-bold">Confirmar Nova Senha:</label>
                        <input type="password" id="swal-conf-senha" class="swal2-input" placeholder="Repita a senha">
                    </div>
                `,
                confirmButtonText: 'Gravar Nova Senha',
                confirmButtonColor: '#198754',
                allowOutsideClick: false,
                preConfirm: () => {
                    const s1 = document.getElementById('swal-nova-senha').value;
                    const s2 = document.getElementById('swal-conf-senha').value;
                    if (s1 !== s2) { Swal.showValidationMessage('As senhas não conferem!'); return false; }
                    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                        Swal.showValidationMessage('A senha é muito fraca!'); return false;
                    }
                    return s1;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    enviarNovaSenha(dadosUsuario.rf, dadosUsuario.ceu, result.value);
                }
            });
        }

        function enviarNovaSenha(rf, ceu, novaSenha) {
            Swal.fire({ title: 'A gravar...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            
            fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "alterarSenhaPrimeiroAcesso", dados: { rf: rf, ceu: ceu, novaSenha: novaSenha } }) 
            })
            .then(resp => resp.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    Swal.fire('Sucesso!', retorno.mensagem, 'success').then(() => { document.getElementById('senha_usuario').value = ''; });
                } else {
                    Swal.fire('Erro', retorno.mensagem, 'error');
                }
            });
        }
    </script>
</body>
</html>

        function enviarNovaSenha(rf, ceu, novaSenha) {
            Swal.fire({ title: 'A gravar...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            
            fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "alterarSenhaPrimeiroAcesso", dados: { rf: rf, ceu: ceu, novaSenha: novaSenha } }) 
            })
            .then(resp => resp.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    Swal.fire('Sucesso!', retorno.mensagem, 'success').then(() => { document.getElementById('senha_usuario').value = ''; });
                } else {
                    Swal.fire('Erro', retorno.mensagem, 'error');
                }
            });
        }
    </script>
</body>
