<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>SIG-EDU - Login</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    
    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0b5ed7;
            --bg-color: #f4f7f6;
            --text-main: #333333;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            width: 800px; 
            max-width: 95%;
            min-height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .login-left {
            flex: 1;
            background: white; 
            color: var(--text-main);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-right: 1px solid #e2e8f0;
        }

        .login-left h1 {
            font-size: 20px; 
            font-weight: 800;
            margin: 0 0 5px 0;
            line-height: 1.2;
            color: var(--primary);
        }

        .login-left p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            max-width: 90%;
        }

        .login-right {
            flex: 1;
            padding: 30px 40px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .login-right h2 {
            color: var(--text-main);
            font-size: 20px; 
            font-weight: 800;
            margin: 0 0 5px 0;
        }

        .login-right p.subtitulo {
            color: var(--text-muted);
            font-size: 13px; 
            margin: 0 0 20px 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 11px; 
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-custom {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group-custom .material-icons {
            position: absolute;
            left: 12px;
            color: #94a3b8;
            font-size: 18px; 
        }

        .form-control {
            width: 100%;
            padding: 10px 15px 10px 35px;
            font-family: inherit;
            font-size: 13px; 
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            transition: 0.3s;
            color: var(--text-main);
            font-weight: 600;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .btn-login {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 12px; 
            font-size: 14px; 
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-login:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .rodape-form {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .login-card { flex-direction: column; width: 100%; }
            .login-left { padding: 30px 20px; min-height: 200px; border-right: none; border-bottom: 1px solid #e2e8f0; }
            .login-right { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <div class="login-left" id="box-logo">
            <span class="material-icons" id="icone-padrao" style="font-size: 70px; margin-bottom: 10px; color: var(--primary);">account_balance</span>
            <img id="img-logo" src="" alt="Logo do Sistema" style="display: none; max-width: 90%; max-height: 100px; object-fit: contain; margin: 0 auto 15px auto;">
            
            <h1 id="titulo-sistema">A carregar...</h1>
            <p>Plataforma unificada de gestão de alunos e credenciamento.</p>
        </div>

        <div class="login-right">
            <h2>Acesso Restrito</h2>
            <p class="subtitulo">Insira as credenciais da sua Unidade.</p>

            <form id="formLogin" onsubmit="fazerLogin(event);">
                
                <div class="form-group">
                    <label class="form-label">Código EOL da Unidade</label>
                    <div class="input-group-custom">
                        <span class="material-icons">domain</span>
                        <input type="number" class="form-control" id="id_ceu" placeholder="Ex: 123456" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">RF do Funcionário</label>
                    <div class="input-group-custom">
                        <span class="material-icons">badge</span>
                        <input type="number" class="form-control" id="rf_usuario" placeholder="Apenas números" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Senha de Acesso</label>
                    <div class="input-group-custom">
                        <span class="material-icons">lock</span>
                        <input type="password" class="form-control" id="senha_usuario" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="btn-entrar">
                    ENTRAR <span class="material-icons" style="font-size: 16px;">login</span>
                </button>
            </form>

            <div class="rodape-form">
                Versão 2.0 • Protegido & Seguro
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            localStorage.clear(); 

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "obterConfiguracoes", dados: {} })
            })
            .then(res => res.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    document.getElementById('titulo-sistema').innerText = retorno.dados.nomeSistema;
                    localStorage.setItem('ceu_nome_sistema', retorno.dados.nomeSistema);
                    
                    if (retorno.dados.logoUrl) {
                        localStorage.setItem('ceu_logo_sistema', retorno.dados.logoUrl);
                        document.getElementById('icone-padrao').style.display = 'none';
                        const img = document.getElementById('img-logo');
                        img.src = retorno.dados.logoUrl;
                        
                        if(retorno.dados.tamanhoLogo) {
                            img.style.height = retorno.dados.tamanhoLogo; 
                            localStorage.setItem('ceu_tamanho_logo', retorno.dados.tamanhoLogo); 
                        }
                        img.style.display = 'block';
                    }
                }
            })
            .catch(erro => console.error("Aviso: Falha ao puxar a Logo. Sistema continua rodando."));
        };

        function fazerLogin(event) {
            event.preventDefault(); 

            const ceu = document.getElementById('id_ceu').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!ceu || !rf || !senha) {
                Swal.fire('Atenção', 'Preencha todos os campos.', 'warning');
                return;
            }

            Swal.fire({
                title: 'A validar acessos...',
                text: 'A comunicar com o servidor central.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    acao: "validarLogin", 
                    dados: { id_ceu: ceu, rf_usuario: rf, senha_usuario: senha } 
                })
            })
            .then(resposta => {
                if (!resposta.ok) throw new Error("Erro de servidor (HTTP " + resposta.status + ")");
                return resposta.json();
            })
            .then(retorno => {
                if (retorno.status === "primeiro_acesso") {
                    tratarPrimeiroAcesso(retorno.mensagem, retorno.dados_usuario);
                } 
                else if (retorno.status === "sucesso") {
                    localStorage.setItem('ceu_codigo_eol', ceu);
                    localStorage.setItem('ceu_rf_logado', rf); 
                    localStorage.setItem('ceu_planilha_id', retorno.token.id_planilha_banco);
                    localStorage.setItem('ceu_nome', retorno.token.nome_ceu);
                    localStorage.setItem('ceu_nome_especifico', retorno.token.nome_ceu);
                    localStorage.setItem('ceu_nome_usuario', retorno.token.nome_usuario);
                    
                    if(retorno.token.logo_ceu) localStorage.setItem('ceu_logo', retorno.token.logo_ceu);
                    if(retorno.token.foto_usuario) localStorage.setItem('ceu_foto_usuario', retorno.token.foto_usuario);
                    
                    localStorage.setItem('ceu_perfil', retorno.token.perfil_usuario); 
                    
                    Swal.fire('Bem-vindo!', retorno.mensagem, 'success').then(() => { 
                        window.location.href = "dashboard.html"; 
                    }); 
                } 
                else {
                    Swal.fire('Acesso Negado', retorno.mensagem || retorno.erro || 'Credenciais inválidas.', 'error');
                }
            })
            .catch(erro => {
                Swal.fire('Erro de Comunicação', 'Falha ao ligar ao servidor do Google. Tente novamente.', 'error');
                console.error("Erro fatal no Fetch de Login: ", erro);
            });
        }

        function tratarPrimeiroAcesso(mensagemDoServidor, dadosUsuario) {
            Swal.fire({
                title: '🔒 Primeiro Acesso',
                text: mensagemDoServidor,
                icon: 'info',
                html: `
                    <div style="text-align: left; font-size: 14px;">
                        <label class="mt-2 fw-bold">Nova Senha:</label>
                        <input type="password" id="swal-nova-senha" class="swal2-input" placeholder="Mínimo 8 caracteres">
                        <label class="mt-2 fw-bold">Confirmar Nova Senha:</label>
                        <input type="password" id="swal-conf-senha" class="swal2-input" placeholder="Repita a senha">
                    </div>
                `,
                confirmButtonText: 'Gravar Nova Senha',
                confirmButtonColor: '#198754',
                allowOutsideClick: false,
                preConfirm: () => {
                    const s1 = document.getElementById('swal-nova-senha').value;
                    const s2 = document.getElementById('swal-conf-senha').value;
                    if (s1 !== s2) { Swal.showValidationMessage('As senhas não conferem!'); return false; }
                    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                        Swal.showValidationMessage('A senha é muito fraca!'); return false;
                    }
                    return s1;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    enviarNovaSenha(dadosUsuario.rf, dadosUsuario.ceu, result.value);
                }
            });
        }

        function enviarNovaSenha(rf, ceu, novaSenha) {
            Swal.fire({ title: 'A gravar...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            
            fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "alterarSenhaPrimeiroAcesso", dados: { rf: rf, ceu: ceu, novaSenha: novaSenha } }) 
            })
            .then(resp => resp.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    Swal.fire('Sucesso!', retorno.mensagem, 'success').then(() => { document.getElementById('senha_usuario').value = ''; });
                } else {
                    Swal.fire('Erro', retorno.mensagem, 'error');
                }
            });
        }
    </script>
</body>
</html>
