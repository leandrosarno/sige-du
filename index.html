<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema CEU - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        :root {
            --cor-primaria: #0d6efd;
            --cor-fundo: #f4f7f6;
        }
        body {
            background-color: var(--cor-fundo);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header span {
            font-size: 50px;
            color: var(--cor-primaria);
        }
        .login-header h3 {
            font-weight: 700;
            color: #333;
            margin-top: 10px;
        }
        .btn-login {
            background-color: var(--cor-primaria);
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
        }
        .btn-login:hover {
            background-color: #0b5ed7;
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <span class="material-icons">account_balance</span>
            <h3>SISTEMA CEU</h3>
            <p class="text-muted">Acesso Restrito</p>
        </div>

        <form id="formLogin" onsubmit="fazerLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-bold">Código EOL do CEU</label>
                <input type="number" class="form-control" id="id_ceu" placeholder="Ex: 123456" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">RF do Funcionário</label>
                <input type="number" class="form-control" id="rf_usuario" placeholder="Apenas números" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Senha de Acesso</label>
                <input type="password" class="form-control" id="senha_usuario" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary btn-login" id="btn-entrar">ENTRAR</button>
        </form>
    </div>

    <script>
        // ==========================================
        // 🔗 LIGAÇÃO COM A API DO GOOGLE SHEETS
        // ==========================================
        const API_URL = "SUA_URL_DO_WEB_APP_AQUI"; // 🚨 COLOQUE AQUI O SEU LINK DO GOOGLE (Terminado em /exec)

        // ==========================================
        // 🚀 FUNÇÃO PRINCIPAL DE LOGIN
        // ==========================================
        function fazerLogin(event) {
            event.preventDefault(); // Impede a página de recarregar

            const ceu = document.getElementById('id_ceu').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!ceu || !rf || !senha) return;

            // Mostra o ecrã de carregamento
            Swal.fire({
                title: 'A validar acessos...',
                text: 'A comunicar com o servidor central.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            // Cria o pacote de dados para enviar à API
            const pacote = {
                acao: "validarLogin",
                dados: { id_ceu: ceu, rf_usuario: rf, senha_usuario: senha }
            };

            // Envia o pedido (POST) para o Google Apps Script
            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(pacote)
            })
            .then(resposta => resposta.json())
            .then(retorno => {
                if (retorno.status === "sucesso") {
                    // 🎉 LOGIN COM SUCESSO
                    
                    // Guarda o "Bilhete Dourado" (ID da planilha) no navegador para usar nas outras telas!
                    localStorage.setItem('ceu_planilha_id', retorno.token.id_planilha_banco);
                    localStorage.setItem('ceu_rf_logado', rf);
                    
                    Swal.fire('Bem-vindo!', retorno.mensagem, 'success').then(() => {
                        // Redireciona para o Painel Principal (Amanhã nós criamos o dashboard.html)
                        window.location.href = "dashboard.html";
                    });

                } else if (retorno.status === "primeiro_acesso") {
                    // 🚦 REGRA DO PRIMEIRO ACESSO (Obriga a trocar a senha)
                    tratarPrimeiroAcesso(retorno.mensagem, retorno.dados_usuario);
                } else {
                    // ❌ ERRO DE LOGIN (Senha errada, CEU não existe, etc.)
                    Swal.fire('Acesso Negado', retorno.mensagem, 'error');
                }
            })
            .catch(erro => {
                Swal.fire('Erro de Comunicação', 'Falha ao ligar ao servidor. Verifique a internet ou o link da API.', 'error');
                console.error(erro);
            });
        }

        // ==========================================
        // 🔑 FUNÇÃO: OBRIGAR A TROCAR SENHA
        // ==========================================
        function tratarPrimeiroAcesso(mensagemDoServidor, dadosUsuario) {
            Swal.fire({
                title: '🔒 Primeiro Acesso',
                text: mensagemDoServidor,
                icon: 'info',
                html: `
                    <div style="text-align: left; font-size: 14px;">
                        <label class="mt-2 fw-bold">Nova Senha:</label>
                        <input type="password" id="swal-nova-senha" class="swal2-input" placeholder="Mínimo 8 caracteres">
                        <label class="mt-2 fw-bold">Confirmar Nova Senha:</label>
                        <input type="password" id="swal-conf-senha" class="swal2-input" placeholder="Repita a senha">
                        <div class="text-muted mt-2" style="font-size:12px;">
                            Sua nova senha deve ter entre 8 e 12 caracteres, incluindo:<br>
                            ✔️ 1 Letra Maiúscula<br>
                            ✔️ 1 Letra minúscula<br>
                            ✔️ 1 Número<br>
                            ✔️ 1 Símbolo especial (!@#$)
                        </div>
                    </div>
                `,
                confirmButtonText: 'Gravar Nova Senha',
                confirmButtonColor: '#198754',
                allowOutsideClick: false,
                preConfirm: () => {
                    const s1 = document.getElementById('swal-nova-senha').value;
                    const s2 = document.getElementById('swal-conf-senha').value;
                    
                    if (s1 !== s2) {
                        Swal.showValidationMessage('As senhas não conferem!');
                        return false;
                    }
                    // Validação pesada
                    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                        Swal.showValidationMessage('A senha é muito fraca. Siga as regras abaixo!');
                        return false;
                    }
                    return s1;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    enviarNovaSenha(dadosUsuario.rf, dadosUsuario.ceu, result.value);
                }
            });
        }

        // ==========================================
        // 🚀 ENVIA A NOVA SENHA PARA A API
        // ==========================================
        function enviarNovaSenha(rf, ceu, novaSenha) {
            Swal.fire({ title: 'A gravar...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

            const pacote = {
                acao: "alterarSenhaPrimeiroAcesso",
                dados: { rf: rf, ceu: ceu, novaSenha: novaSenha }
            };

            fetch(API_URL, { method: 'POST', body: JSON.stringify(pacote) })
            .then(resp => resp.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    Swal.fire('Sucesso!', retorno.mensagem, 'success').then(() => {
                        document.getElementById('senha_usuario').value = ''; // Limpa a senha velha
                    });
                } else {
                    Swal.fire('Erro', retorno.mensagem, 'error');
                }
            });
        }
    </script>
</body>
</html>
