<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-EDU - Login</title>
    
    <!-- Bloqueadores de Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="config.js"></script> 
    
    <style>
        :root { 
            --cor-primaria: #0d6efd; 
            --cor-fundo-tela: #e2e8f0;
            --bg-card: #0a1422; /* A cor exata que você pediu */
            --bg-logo: #060c14; 
            --bg-input: #112136;
            --borda-input: #1e3a5f;
            --texto-claro: #f8fafc;
            --texto-mutado: #94a3b8;
        }
        
        body { background-color: var(--cor-fundo-tela); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Inter', sans-serif; }
        
        /* CARTÃO ULTRA COMPACTO */
        .login-card { 
            background: var(--bg-card); 
            border-radius: 10px; /* Bordas um pouco mais fechadas */
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            width: 580px; /* Reduzido de 680px para 580px */
            max-width: 95%; 
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            /* Sem min-height para ele abraçar o conteúdo e ficar bem baixo */
        }
        
        /* LADO ESQUERDO: APENAS A LOGO */
        .login-left {
            width: 40%;
            background: var(--bg-logo);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        /* LADO DIREITO: ESPAÇOS CORTADOS AO MÁXIMO */
        .login-right {
            width: 60%;
            padding: 20px 25px; /* Margens internas muito menores */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-right h2 { font-weight: 800; color: var(--texto-claro); font-size: 16px; margin: 0 0 0px 0; }
        #titulo-sistema { font-size: 10px; color: var(--cor-primaria); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        
        /* CAMPOS DE ENTRADA EXTREMAMENTE COLADOS */
        .input-wrapper { margin-bottom: 8px; /* Antes era 12px */ }
        
        .form-label { display: block; font-size: 9px; font-weight: 700; color: var(--texto-mutado); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        
        /* CAIXA E ÍCONE ALINHADOS */
        .caixa-input { position: relative; }
        .caixa-input .icone-campo { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--texto-mutado); font-size: 16px; pointer-events: none; }
        
        .form-control { 
            padding: 4px 8px 4px 30px; /* Espaço interno bem menor */
            height: 32px; /* Caixa mais fina */
            border-radius: 5px; 
            border: 1px solid var(--borda-input); 
            background: var(--bg-input); 
            color: var(--texto-claro);
            font-weight: 600; 
            font-size: 12px; 
            width: 100%; 
            transition: 0.3s;
            box-sizing: border-box;
        }
        
        .form-control::placeholder { color: #475569; }
        .form-control:focus { 
            border-color: var(--cor-primaria); 
            box-shadow: 0 0 0 2px rgba(13,110,253,0.25); 
            background: var(--bg-card); 
            color: white;
            outline: none; 
        }

        /* 🚀 REMOVE AS SETINHAS DO CAMPO DE NÚMERO (RF) */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* MOSTRADOR DINÂMICO DO CEU */
        #nome-ceu-display {
            font-size: 9px;
            font-weight: 700;
            margin-top: 2px;
            margin-left: 2px;
            color: var(--texto-mutado);
            display: flex;
            align-items: center;
            gap: 3px;
            min-height: 12px;
        }
        
        /* BOTÃO COMPACTO E COLADO */
        .btn-login { background-color: var(--cor-primaria); border: none; width: 100%; height: 34px; font-weight: 800; font-size: 12px; border-radius: 5px; margin-top: 4px; transition: 0.3s; color: white; display: flex; justify-content: center; align-items: center; gap: 6px; cursor: pointer; }
        .btn-login:hover { background-color: #0b5ed7; transform: translateY(-2px); }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .login-card { flex-direction: column; width: 100%; }
            .login-left { width: 100%; min-height: 120px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .login-right { width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        
        <!-- LADO ESQUERDO: APENAS A LOGO -->
        <div class="login-left" id="box-logo">
            <span class="material-icons" id="icone-padrao" style="font-size: 55px; color: var(--cor-primaria);">account_balance</span>
            <img id="img-logo" src="" alt="Logo do Sistema" style="display: none; max-width: 95%; max-height: 90px; object-fit: contain;">
        </div>

        <!-- LADO DIREITO: FORMULÁRIO ESPREMIDO -->
        <div class="login-right">
            
            <h2>Acesso Restrito</h2>
            <div id="titulo-sistema">A carregar sistema...</div>

            <form id="formLogin" onsubmit="event.preventDefault(); fazerLogin();">
                
                <div class="input-wrapper">
                    <label class="form-label">Cód EOL da Unidade</label>
                    <div class="caixa-input">
                        <span class="material-icons icone-campo">domain</span>
                        <input type="text" inputmode="numeric" class="form-control" id="id_ceu" placeholder="Ex: 123456" oninput="verificarNomeCEU()" required autocomplete="off">
                    </div>
                    <div id="nome-ceu-display"></div>
                </div>

                <div class="input-wrapper">
                    <label class="form-label">RF do Funcionário</label>
                    <div class="caixa-input">
                        <span class="material-icons icone-campo">badge</span>
                        <input type="number" class="form-control" id="rf_usuario" placeholder="Apenas números" required>
                    </div>
                </div>

                <div class="input-wrapper">
                    <label class="form-label">Senha de Acesso</label>
                    <div class="caixa-input">
                        <span class="material-icons icone-campo">lock</span>
                        <input type="password" class="form-control" id="senha_usuario" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="btn-entrar">
                    ENTRAR NO SISTEMA <span class="material-icons" style="font-size: 15px;">arrow_forward</span>
                </button>
            </form>
        </div>

    </div>

    <!-- JAVASCRIPT INTACTO -->
    <script>
        // ==========================================
        // 📚 DICIONÁRIO DE CEUS
        // ==========================================
        const dicionarioCEUs = {
            "777777": "DRE SANTO AMARO",
            "999999": "SME (Secretaria)",
            "700039": "CEU CAMINHO DO MAR",
            "700041": "CEU VILA RUBI",
            "700042": "CEU ALVARENGA",
            "700043": "CEU CIDADE DUTRA"
        };

        function verificarNomeCEU() {
            let codigo = document.getElementById('id_ceu').value.trim();
            const display = document.getElementById('nome-ceu-display');

            if (codigo === "") {
                display.innerHTML = "";
            } else if (dicionarioCEUs[codigo]) {
                display.innerHTML = `<span class="material-icons" style="font-size:11px;">check_circle</span> ${dicionarioCEUs[codigo]}`;
                display.style.color = "#10b981"; 
            } else {
                display.innerHTML = `<span class="material-icons" style="font-size:11px;">search</span> Procurando...`;
                display.style.color = "#f59e0b"; 
            }
        }

        window.onload = function() {
            localStorage.clear(); 

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "obterConfiguracoes", dados: {} })
            })
            .then(res => res.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    document.getElementById('titulo-sistema').innerText = retorno.dados.nomeSistema;
                    localStorage.setItem('ceu_nome_sistema', retorno.dados.nomeSistema);
                    
                    if (retorno.dados.logoUrl) {
                        localStorage.setItem('ceu_logo_sistema', retorno.dados.logoUrl);
                        document.getElementById('icone-padrao').style.display = 'none';
                        const img = document.getElementById('img-logo');
                        img.src = retorno.dados.logoUrl;
                        img.style.display = 'block';
                    }
                }
            })
            .catch(erro => console.error("Aviso: Falha ao puxar a Logo. Sistema continua rodando."));
        };

        function fazerLogin() {
            const ceu = document.getElementById('id_ceu').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!ceu || !rf || !senha) {
                Swal.fire('Atenção', 'Preencha todos os campos.', 'warning');
                return;
            }

            Swal.fire({
                title: 'A validar acessos...',
                text: 'A comunicar com o servidor central.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    acao: "validarLogin", 
                    dados: { id_ceu: ceu, rf_usuario: rf, senha_usuario: senha } 
                })
            })
            .then(resposta => {
                if (!resposta.ok) throw new Error("Erro de servidor (HTTP " + resposta.status + ")");
                return resposta.json();
            })
            .then(retorno => {
                if (retorno.status === "primeiro_acesso") {
                    tratarPrimeiroAcesso(retorno.mensagem, retorno.dados_usuario);
                } 
                else if (retorno.status === "sucesso") {
                    
                    localStorage.setItem('ceu_codigo_eol', ceu);
                    localStorage.setItem('ceu_rf_logado', rf); 
                    
                    localStorage.setItem('ceu_planilha_id', retorno.token.id_planilha_banco);
                    localStorage.setItem('ceu_nome', retorno.token.nome_ceu);
                    localStorage.setItem('ceu_nome_especifico', retorno.token.nome_ceu);
                    localStorage.setItem('ceu_nome_usuario', retorno.token.nome_usuario);
                    
                    if(retorno.token.logo_ceu) localStorage.setItem('ceu_logo', retorno.token.logo_ceu);
                    if(retorno.token.foto_usuario) localStorage.setItem('ceu_foto_usuario', retorno.token.foto_usuario);
                    
                    localStorage.setItem('ceu_perfil', retorno.token.perfil_usuario); 
                    
                    Swal.fire('Bem-vindo!', retorno.mensagem, 'success').then(() => { 
                        window.location.href = "dashboard.html"; 
                    }); 
                } 
                else {
                    Swal.fire('Acesso Negado', retorno.mensagem || retorno.erro || 'Credenciais inválidas.', 'error');
                }
            })
            .catch(erro => {
                Swal.fire('Erro de Comunicação', 'Falha ao ligar ao servidor do Google. Tente novamente.', 'error');
                console.error("Erro fatal no Fetch de Login: ", erro);
            });
        }

        function tratarPrimeiroAcesso(mensagemDoServidor, dadosUsuario) {
            Swal.fire({
                title: '🔒 Primeiro Acesso',
                text: mensagemDoServidor,
                icon: 'info',
                html: `
                    <div style="text-align: left; font-size: 14px;">
                        <label class="mt-2 fw-bold">Nova Senha:</label>
                        <input type="password" id="swal-nova-senha" class="swal2-input" placeholder="Mínimo 8 caracteres">
                        <label class="mt-2 fw-bold">Confirmar Nova Senha:</label>
                        <input type="password" id="swal-conf-senha" class="swal2-input" placeholder="Repita a senha">
                    </div>
                `,
                confirmButtonText: 'Gravar Nova Senha',
                confirmButtonColor: '#198754',
                allowOutsideClick: false,
                preConfirm: () => {
                    const s1 = document.getElementById('swal-nova-senha').value;
                    const s2 = document.getElementById('swal-conf-senha').value;
                    if (s1 !== s2) { Swal.showValidationMessage('As senhas não conferem!'); return false; }
                    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                        Swal.showValidationMessage('A senha é muito fraca!'); return false;
                    }
                    return s1;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    enviarNovaSenha(dadosUsuario.rf, dadosUsuario.ceu, result.value);
                }
            });
        }

        function enviarNovaSenha(rf, ceu, novaSenha) {
            Swal.fire({ title: 'A gravar...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            
            fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "alterarSenhaPrimeiroAcesso", dados: { rf: rf, ceu: ceu, novaSenha: novaSenha } }) 
            })
            .then(resp => resp.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    Swal.fire('Sucesso!', retorno.mensagem, 'success').then(() => { document.getElementById('senha_usuario').value = ''; });
                } else {
                    Swal.fire('Erro', retorno.mensagem, 'error');
                }
            });
        }
    </script>
</body>
</html>
