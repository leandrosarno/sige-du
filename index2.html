<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-EDU - Login</title>
    
    <!-- Bloqueadores de Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    
    <style>
        :root { --cor-primaria: #0d6efd; --cor-fundo: #f4f7f6; }
        body { background-color: var(--cor-fundo); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .login-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 800px; max-width: 95%; display: flex; overflow: hidden; min-height: 400px; border: 1px solid #e2e8f0; }
        
        .login-left { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-right: 1px solid #e2e8f0; background: white; }
        .login-right { flex: 1; padding: 40px 50px; display: flex; flex-direction: column; justify-content: center; background: white; }
        
        .login-right h2 { font-weight: 800; color: #333; margin-bottom: 5px; font-size: 22px; }
        .login-right p.text-muted { font-size: 13px; margin-bottom: 25px; }
        
        .form-control { padding: 10px 12px 10px 40px; border-radius: 8px; border: 2px solid #e2e8f0; background: #f8fafc; font-weight: 600; font-size: 14px; width: 100%; box-sizing: border-box; }
        .form-control:focus { border-color: var(--cor-primaria); box-shadow: 0 0 0 3px rgba(13,110,253,0.1); background: white; outline: none; }
        
        .input-wrapper { position: relative; margin-bottom: 18px; text-align: left; }
        .input-wrapper .material-icons { position: absolute; left: 12px; top: 28px; color: #94a3b8; font-size: 20px; }
        
        .form-label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        
        .btn-login { background-color: var(--cor-primaria); border: none; width: 100%; padding: 12px; font-weight: bold; font-size: 14px; border-radius: 8px; margin-top: 10px; transition: 0.3s; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; }
        .btn-login:hover { background-color: #0b5ed7; transform: translateY(-2px); }
        
        @media (max-width: 768px) {
            .login-card { flex-direction: column; width: 100%; }
            .login-left { border-right: none; border-bottom: 1px solid #e2e8f0; padding: 30px 20px; min-height: 200px; }
            .login-right { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        
        <!-- LADO ESQUERDO: LOGO DO SISTEMA -->
        <div class="login-left" id="box-logo">
            <span class="material-icons" id="icone-padrao" style="font-size: 70px; margin-bottom: 15px; color: var(--cor-primaria);">account_balance</span>
            <img id="img-logo" src="" alt="Logo do Sistema" style="display: none; max-width: 90%; max-height: 100px; object-fit: contain; margin: 0 auto 15px auto;">
            
            <h3 id="titulo-sistema" style="font-weight: 800; color: var(--cor-primaria); font-size: 20px; margin: 0 0 5px 0;">A carregar...</h3>
            <p style="font-size: 13px; color: #64748b; margin: 0;">Plataforma de gestão escolar</p>
        </div>

        <!-- LADO DIREITO: FORMULÁRIO -->
        <div class="login-right">
            <h2>Acesso Restrito</h2>
            <p class="text-muted">Insira as credenciais da sua Unidade.</p>

            <!-- FORMULÁRIO ORIGINAL INTACTO -->
            <form id="formLogin" onsubmit="event.preventDefault(); fazerLogin();">
                
                <div class="input-wrapper">
                    <label class="form-label">Código EOL da Unidade</label>
                    <span class="material-icons">domain</span>
                    
                    <!-- Campo type="number" restaurado para manter a compatibilidade com seu banco de dados -->
                    <input type="number" class="form-control" id="id_ceu" list="lista-eols" placeholder="Ex: 123456" required>
                    
                    <!-- Adicione as outras opções de CEUs nesta lista para o menu ficar completo -->
                    <datalist id="lista-eols">
                        <option value="777777">DRE SANTO AMARO</option>
                        <option value="999999">SME (Secretaria)</option>
                        <option value="700039">CEU CAMINHO DO MAR</option>
                        <option value="700041">CEU VILA RUBI</option>
                        <option value="700042">CEU ALVARENGA</option>
                        <option value="700043">CEU CIDADE DUTRA</option>
                    </datalist>
                </div>

                <div class="input-wrapper">
                    <label class="form-label">RF do Funcionário</label>
                    <span class="material-icons">badge</span>
                    <input type="number" class="form-control" id="rf_usuario" placeholder="Apenas números" required>
                </div>

                <div class="input-wrapper">
                    <label class="form-label">Senha de Acesso</label>
                    <span class="material-icons">lock</span>
                    <input type="password" class="form-control" id="senha_usuario" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-login" id="btn-entrar">
                    ENTRAR <span class="material-icons" style="font-size: 18px;">login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- O SEU CÓDIGO JAVASCRIPT EXATAMENTE COMO VOCÊ ENVIOU, SEM NENHUMA ALTERAÇÃO -->
    <script>
        // ==========================================
        // 🔗 LIGAÇÃO COM A API DO GOOGLE SHEETS
        // ==========================================
/*        const API_URL = "https://script.google.com/macros/s/AKfycbxbwSw8M2Lj6wlYK2MX5cOTu6R0fMVJ5xfA74z20vsbwK6slju34YSCkp5MS24p1d-H/exec";  */

        window.onload = function() {
            localStorage.clear(); // Limpa sujeiras antigas de outros logins na máquina da escola

            // ==========================================
            // LOGO: Carrega as configs sem travar a tela
            // ==========================================
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "obterConfiguracoes", dados: {} })
            })
            .then(res => res.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    document.getElementById('titulo-sistema').innerText = retorno.dados.nomeSistema;
                    localStorage.setItem('ceu_nome_sistema', retorno.dados.nomeSistema);
                    
                    if (retorno.dados.logoUrl) {
                        localStorage.setItem('ceu_logo_sistema', retorno.dados.logoUrl);
                        document.getElementById('icone-padrao').style.display = 'none';
                        const img = document.getElementById('img-logo');
                        img.src = retorno.dados.logoUrl;
                        
                        if(retorno.dados.tamanhoLogo) {
                            img.style.height = retorno.dados.tamanhoLogo; 
                            localStorage.setItem('ceu_tamanho_logo', retorno.dados.tamanhoLogo); 
                        }
                        img.style.display = 'block';
                    }
                }
            })
            .catch(erro => console.error("Aviso: Falha ao puxar a Logo. Sistema continua rodando."));
        };

        // ==========================================
        // O MOTOR BLINDADO DE LOGIN
        // ==========================================
        function fazerLogin() {
            const ceu = document.getElementById('id_ceu').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!ceu || !rf || !senha) {
                Swal.fire('Atenção', 'Preencha todos os campos.', 'warning');
                return;
            }

            Swal.fire({
                title: 'A validar acessos...',
                text: 'A comunicar com o servidor central.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            // 🛡️ O TRUQUE MÁGICO DO CONTENT-TYPE
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    acao: "validarLogin", 
                    dados: { id_ceu: ceu, rf_usuario: rf, senha_usuario: senha } 
                })
            })
            .then(resposta => {
                if (!resposta.ok) throw new Error("Erro de servidor (HTTP " + resposta.status + ")");
                return resposta.json();
            })
            .then(retorno => {
                if (retorno.status === "primeiro_acesso") {
                    tratarPrimeiroAcesso(retorno.mensagem, retorno.dados_usuario);
                } 
                else if (retorno.status === "sucesso") {
                    
                    // 🎉 A MÁGICA SALVADORA DO SISTEMA - Todas as mochilas sendo preenchidas!
                    localStorage.setItem('ceu_codigo_eol', ceu);
                    localStorage.setItem('ceu_rf_logado', rf); 
                    
                    localStorage.setItem('ceu_planilha_id', retorno.token.id_planilha_banco);
                    localStorage.setItem('ceu_nome', retorno.token.nome_ceu);
                    localStorage.setItem('ceu_nome_especifico', retorno.token.nome_ceu);
                    localStorage.setItem('ceu_nome_usuario', retorno.token.nome_usuario);
                    
                    // Salva a Foto e a Logo se elas existirem na planilha
                    if(retorno.token.logo_ceu) localStorage.setItem('ceu_logo', retorno.token.logo_ceu);
                    if(retorno.token.foto_usuario) localStorage.setItem('ceu_foto_usuario', retorno.token.foto_usuario);
                    
                    // 🌟 A ESTRELA DO SHOW: O nosso Perfil para identificar a DRE!
                    localStorage.setItem('ceu_perfil', retorno.token.perfil_usuario); 
                    
                    Swal.fire('Bem-vindo!', retorno.mensagem, 'success').then(() => { 
                        window.location.href = "dashboard.html"; 
                    }); 
                } 
                else {
                    Swal.fire('Acesso Negado', retorno.mensagem || retorno.erro || 'Credenciais inválidas.', 'error');
                }
            })
            .catch(erro => {
                Swal.fire('Erro de Comunicação', 'Falha ao ligar ao servidor do Google. Tente novamente.', 'error');
                console.error("Erro fatal no Fetch de Login: ", erro);
            });
        }

        // ==========================================
        // PRIMEIRO ACESSO
        // ==========================================
        function tratarPrimeiroAcesso(mensagemDoServidor, dadosUsuario) {
            Swal.fire({
                title: '🔒 Primeiro Acesso',
                text: mensagemDoServidor,
                icon: 'info',
                html: `
                    <div style="text-align: left; font-size: 14px;">
                        <label class="mt-2 fw-bold">Nova Senha:</label>
                        <input type="password" id="swal-nova-senha" class="swal2-input" placeholder="Mínimo 8 caracteres">
                        <label class="mt-2 fw-bold">Confirmar Nova Senha:</label>
                        <input type="password" id="swal-conf-senha" class="swal2-input" placeholder="Repita a senha">
                    </div>
                `,
                confirmButtonText: 'Gravar Nova Senha',
                confirmButtonColor: '#198754',
                allowOutsideClick: false,
                preConfirm: () => {
                    const s1 = document.getElementById('swal-nova-senha').value;
                    const s2 = document.getElementById('swal-conf-senha').value;
                    if (s1 !== s2) { Swal.showValidationMessage('As senhas não conferem!'); return false; }
                    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                        Swal.showValidationMessage('A senha é muito fraca!'); return false;
                    }
                    return s1;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    enviarNovaSenha(dadosUsuario.rf, dadosUsuario.ceu, result.value);
                }
            });
        }

        function enviarNovaSenha(rf, ceu, novaSenha) {
            Swal.fire({ title: 'A gravar...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            
            fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: "alterarSenhaPrimeiroAcesso", dados: { rf: rf, ceu: ceu, novaSenha: novaSenha } }) 
            })
            .then(resp => resp.json())
            .then(retorno => {
                if(retorno.status === "sucesso") {
                    Swal.fire('Sucesso!', retorno.mensagem, 'success').then(() => { document.getElementById('senha_usuario').value = ''; });
                } else {
                    Swal.fire('Erro', retorno.mensagem, 'error');
                }
            });
        }
    </script>
</body>
</html>
