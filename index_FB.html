<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --navy: #0a2a73;
            --primary: #0b57d0;
            --primary-dark: #0842a0;
            --sun: #ffc933;
            --leaf: #1f9d6b;
            --paper: #f6f9ff;
            --grid: #dde6f7;
            --border: #d3dcf0;
            --text-main: #17203a;
            --text-muted: #4d5876;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; user-select: none; }

        .page { display: grid; grid-template-columns: minmax(340px, 46%) 1fr; min-height: 100vh; }

        /* ===== LADO ESQUERDO: logos + cidade ===== */
        .hero {
            position: relative; overflow: hidden;
            background: linear-gradient(160deg, var(--navy) 0%, var(--primary) 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 40px;
        }
        .sun { position: absolute; top: -90px; right: -70px; width: 260px; height: 260px; border-radius: 50%; background: var(--sun); }
        .sun::after { content: ""; position: absolute; inset: -26px; border-radius: 50%; border: 3px solid rgba(255, 201, 51, .35); }
        .deco { position: absolute; color: #fff; opacity: .15; font-size: 64px; }
        .deco.d1 { top: 14%; left: 8%; }
        .deco.d2 { top: 30%; right: 10%; font-size: 52px; }
        .deco.d3 { top: 56%; left: 6%; font-size: 56px; }
        .deco.d4 { bottom: 30%; right: 8%; font-size: 70px; }
        .deco.d5 { top: 8%; left: 40%; font-size: 44px; }
        .skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 170px; color: rgba(255, 255, 255, .14); }

        .logos { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 22px; width: min(380px, 100%); }
        .logo-card {
            background: #fff; border-radius: 28px; padding: 22px 28px; min-height: 140px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 18px 40px rgba(5, 20, 70, .35);
        }
        .logo-card.recreio { border-bottom: 7px solid var(--sun); }
        .logo-card img { max-width: 100%; max-height: 120px; object-fit: contain; }
        #logoSistema { display: none; }
        #iconePadrao { font-size: 64px; color: var(--primary); font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48; }
        .logo-fallback { font-weight: 800; font-size: 20px; text-align: center; color: var(--navy); line-height: 1.25; }

        /* ===== LADO DIREITO: formulário sobre papel quadriculado ===== */
        .side {
            display: flex; align-items: center; justify-content: center; padding: 32px;
            background-color: var(--paper);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .card {
            width: min(430px, 100%); background: #fff; border-radius: 26px; padding: 38px 34px 30px;
            border: 1px solid var(--border);
            box-shadow: 0 24px 60px rgba(10, 42, 115, .14);
        }
        .badge {
            width: 56px; height: 56px; border-radius: 18px; background: #e8f0ff; color: var(--primary);
            display: flex; align-items: center; justify-content: center; margin-bottom: 18px;
        }
        .badge .material-symbols-outlined { font-size: 32px; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 32; }
        h1 { margin: 0 0 6px; font-size: 28px; font-weight: 800; letter-spacing: -.3px; }
        .sub { margin: 0 0 26px; font-size: 15px; color: var(--text-muted); line-height: 1.45; }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 7px; color: var(--text-main); }
        .field { position: relative; }
        .field > .material-symbols-outlined { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 22px; color: #6f7a99; pointer-events: none; }
        .form-control {
            width: 100%; height: 52px; padding: 0 48px 0 46px;
            border: 2px solid var(--border); border-radius: 14px; background: #fff;
            font-family: inherit; font-size: 16px; color: var(--text-main);
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control::placeholder { color: #8d97b3; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(11, 87, 208, .15); }
        .toggle {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; border: none; background: transparent; border-radius: 10px;
            color: #6f7a99; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .toggle:hover { background: #eef3ff; color: var(--primary); }
        .toggle:focus-visible, .btn-login:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

        .btn-login {
            width: 100%; height: 54px; margin-top: 8px; border: none; border-radius: 14px;
            background: var(--primary); color: #fff; cursor: pointer;
            font-family: inherit; font-size: 17px; font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: background .2s, transform .1s, box-shadow .2s;
        }
        .btn-login:hover { background: var(--primary-dark); box-shadow: 0 8px 20px rgba(11, 87, 208, .3); }
        .btn-login:active { transform: translateY(1px); }
        .foot { margin: 22px 0 0; text-align: center; font-size: 13px; color: var(--text-muted); }
        .foot .material-symbols-outlined { font-size: 16px; vertical-align: -3px; color: var(--leaf); margin-right: 4px; }

        /* ===== CELULAR / TABLET ===== */
        @media (max-width: 860px) {
            .page { grid-template-columns: 1fr; }
            .hero { padding: 26px 18px 84px; }
            .sun { width: 170px; height: 170px; top: -70px; right: -50px; }
            .deco { display: none; }
            .skyline { height: 110px; }
            .logos { flex-direction: row; gap: 12px; width: 100%; max-width: 460px; }
            .logo-card { flex: 1; min-height: 96px; padding: 12px; border-radius: 20px; }
            .logo-card img { max-height: 70px; }
            #iconePadrao { font-size: 48px; }
            .logo-fallback { font-size: 14px; }
            .side { align-items: flex-start; padding: 0 16px 28px; }
            .card { margin-top: -46px; padding: 30px 22px 24px; position: relative; z-index: 3; }
        }

        /* ===== SWEETALERT ===== */
        div:where(.swal2-container) div:where(.swal2-popup) { width: 340px !important; padding: 24px !important; border-radius: 22px !important; border: none !important; box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif !important; }
        div:where(.swal2-container) h2:where(.swal2-title) { font-size: 18px !important; font-weight: 800 !important; color: var(--text-main) !important; margin: 0 0 8px 0 !important; }
        div:where(.swal2-container) div:where(.swal2-html-container) { font-size: 14px !important; color: var(--text-muted) !important; margin: 8px 0 20px 0 !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm { border-radius: 50px !important; font-size: 14px !important; font-weight: 700 !important; padding: 9px 26px !important; width: auto !important; background-color: var(--primary) !important; border: none !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm:hover { background-color: var(--primary-dark) !important; }
        div:where(.swal2-container) .swal2-icon { transform: scale(0.6) !important; margin: 0 auto 10px auto !important; }
    </style>
</head>
<body>
    <main class="page">

        <!-- LADO ESQUERDO: OS DOIS LOGOS -->
        <section class="hero">
            <div class="sun"></div>
            <span class="material-symbols-outlined deco d1">menu_book</span>
            <span class="material-symbols-outlined deco d2">palette</span>
            <span class="material-symbols-outlined deco d3">sports_soccer</span>
            <span class="material-symbols-outlined deco d4">music_note</span>
            <span class="material-symbols-outlined deco d5">edit</span>

            <!-- Skyline de São Paulo: prédios, vão do MASP e ponte estaiada -->
            <svg class="skyline" viewBox="0 0 900 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
                <g fill="currentColor">
                    <rect x="0" y="105" width="48" height="65"/><rect x="54" y="70" width="36" height="100"/>
                    <rect x="96" y="95" width="52" height="75"/><rect x="154" y="45" width="30" height="125"/>
                    <rect x="190" y="85" width="44" height="85"/><path d="M240 170V90l30-26 30 26v80z"/>
                    <rect x="306" y="100" width="40" height="70"/><rect x="352" y="60" width="34" height="110"/>
                    <rect x="392" y="92" width="120" height="14"/><rect x="408" y="106" width="9" height="64"/><rect x="487" y="106" width="9" height="64"/>
                    <rect x="518" y="112" width="382" height="8"/>
                </g>
                <g stroke="currentColor" fill="none" stroke-linecap="round">
                    <path stroke-width="6" d="M650 170L735 18M770 170L685 18"/>
                    <path stroke-width="1.5" d="M710 45L560 112M710 45L600 112M710 45L640 112M710 45L780 112M710 45L820 112M710 45L860 112"/>
                </g>
            </svg>

            <div class="logos">
                <div class="logo-card">
                    <img id="logoSistema" src="" alt="Logo do Sistema">
                    <span id="iconePadrao" class="material-symbols-outlined">school</span>
                </div>
                <div class="logo-card recreio">
                    <img id="logoRecreio" src="" alt="Recreio nas Férias, Prefeitura de São Paulo, edição Janeiro 2027">
                </div>
            </div>
        </section>

        <!-- LADO DIREITO: FORMULÁRIO -->
        <section class="side">
            <div class="card">
                <div class="badge"><span class="material-symbols-outlined">waving_hand</span></div>
                <h1>Bem-vindo(a)!</h1>
                <p class="sub">Entre com os seus dados de servidor para acessar o sistema.</p>

                <form id="formLogin" onsubmit="event.preventDefault(); window.fazerLogin();">
                    <div class="form-group">
                        <label class="form-label" for="id_unidade">Código EOL da unidade</label>
                        <div class="field">
                            <span class="material-symbols-outlined">apartment</span>
                            <input type="text" class="form-control" id="id_unidade" placeholder="Ex: 700038" inputmode="numeric" autocomplete="off" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="rf_usuario">RF do servidor</label>
                        <div class="field">
                            <span class="material-symbols-outlined">badge</span>
                            <input type="text" class="form-control" id="rf_usuario" placeholder="Apenas números" inputmode="numeric" autocomplete="username" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="senha_usuario">Senha de acesso</label>
                        <div class="field">
                            <span class="material-symbols-outlined">lock</span>
                            <input type="password" class="form-control" id="senha_usuario" placeholder="Digite a sua senha" autocomplete="current-password" required>
                            <button type="button" class="toggle" id="btnOlho" aria-label="Mostrar senha" onclick="window.alternarSenha()">
                                <span class="material-symbols-outlined" id="iconeOlho">visibility</span>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-login">
                        <span class="material-symbols-outlined">login</span> Entrar
                    </button>
                </form>
                <!-- <a class="link-senha" onclick="window.recuperarSenha()">Esqueceu sua senha?</a> -->

                <p class="foot"><span class="material-symbols-outlined">verified_user</span>Educação pública da cidade de São Paulo</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // 🖼️ LOGO DO RECREIO NAS FÉRIAS (pasta "imagens" do GitHub) — ajuste o nome do arquivo se for diferente
        const LOGO_RECREIO = "imagens/recreio_2027.png";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        localStorage.clear();

        // Logo do Recreio (com aviso visível caso o arquivo não seja encontrado)
        const imgRecreio = document.getElementById('logoRecreio');
        imgRecreio.onerror = () => {
            const aviso = document.createElement('div');
            aviso.className = 'logo-fallback';
            aviso.textContent = 'Recreio nas Férias – Janeiro 2027';
            imgRecreio.replaceWith(aviso);
        };
        imgRecreio.src = LOGO_RECREIO;

        async function carregarConfiguracoes() {
            try {
                const configRef = collection(db, "configuracoes");
                const configSnapshot = await getDocs(configRef);

                let logoEncontrada = null;
                let nomeParaTituloAba = "SIG-EDU Central";

                if (!configSnapshot.empty) {
                    configSnapshot.forEach((doc) => {
                        const dados = doc.data();
                        if (dados.logoUrl) logoEncontrada = dados.logoUrl;
                        if (dados.nomeSistema) nomeParaTituloAba = dados.nomeSistema;
                    });
                }

                document.title = "Login - " + nomeParaTituloAba;

                if (logoEncontrada) {
                    const imgLogo = document.getElementById('logoSistema');
                    imgLogo.src = logoEncontrada;
                    imgLogo.style.display = 'block';
                    document.getElementById('iconePadrao').style.display = 'none';
                }

            } catch (erro) {
                console.error("Erro ao carregar configurações do Firebase:", erro);
                document.title = "Login - Sistema CEU";
            }
        }

        carregarConfiguracoes();

        window.alternarSenha = function() {
            const campo = document.getElementById('senha_usuario');
            const mostrar = campo.type === 'password';
            campo.type = mostrar ? 'text' : 'password';
            document.getElementById('iconeOlho').textContent = mostrar ? 'visibility_off' : 'visibility';
            document.getElementById('btnOlho').setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
        };

        window.fazerLogin = async function() {
            const unidade = document.getElementById('id_unidade').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!unidade || !rf || !senha) {
                Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Por favor, preencha todos os campos.' });
                return;
            }

            Swal.fire({
                title: 'Validando...',
                text: 'Conectando ao servidor seguro.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const usuariosRef = collection(db, "usuarios");
                const q = query(usuariosRef,
                    where("id_unidade", "==", unidade),
                    where("rf_usuario", "==", rf)
                );

                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'Credenciais não encontradas ou Unidade incorreta.' });
                    return;
                }

                let usuarioValido = false;
                let dadosUsuario = null;

                querySnapshot.forEach((documento) => {
                    const dados = documento.data();
                    if (dados.senha_usuario === senha) {
                        usuarioValido = true;
                        dadosUsuario = dados;
                    }
                });

                if (!usuarioValido) {
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'A senha informada está incorreta.' });
                    return;
                }

                localStorage.setItem('sig_rf', dadosUsuario.rf_usuario);
                localStorage.setItem('sig_id_unidade', dadosUsuario.id_unidade);
                localStorage.setItem('sig_nivel_acesso', dadosUsuario.id_nivel_acesso);
                localStorage.setItem('sig_nome', dadosUsuario.nome_usuario);
                localStorage.setItem('sig_email', dadosUsuario.email_usuario || "");
                localStorage.setItem('sig_foto', dadosUsuario.url_foto || "");

                window.location.href = "dashboard_FB.html";

            } catch (erro) {
                Swal.fire({ icon: 'error', title: 'Erro de Conexão', text: 'Falha ao conectar no banco de dados.' });
                console.error(erro);
            }
        };

        window.recuperarSenha = function() {
            Swal.fire({
                title: 'Recuperação de Senha',
                text: 'Por favor, contate o Administrador de TI da sua Regional para solicitar uma nova credencial de acesso.',
                icon: 'info',
                confirmButtonText: 'Entendido'
            });
        };
    </script>
</body>
</html>
