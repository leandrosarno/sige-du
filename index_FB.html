<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <!-- ÍCONES VAZADOS E FINOS -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #0b57d0;
            --bg-color: #f0f4f9;
            --surface: #ffffff;
            --border: #e3e3e3;
            --text-main: #1f1f1f;
            --text-muted: #444746;
        }

        body { 
            background-color: var(--bg-color); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            color: var(--text-main); 
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .login-box { 
            background: var(--surface); 
            width: 320px; 
            padding: 32px 28px; 
            border: 1px solid var(--border); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
            border-radius: 24px; 
            box-sizing: border-box;
        }

        .login-header { 
            text-align: center; 
            border-bottom: 1px solid var(--border); 
            margin-bottom: 20px; 
            padding-bottom: 16px; 
        }
        
        #logoSistema { 
            max-width: 140px; 
            max-height: 60px; 
            object-fit: contain; 
            margin-bottom: 12px; 
            display: none; 
            margin-left: auto; 
            margin-right: auto; 
        }
        
        #iconePadrao { 
            font-size: 36px; 
            color: var(--primary); 
            font-variation-settings: 'FILL' 1;
        }

        .login-header h3 { font-weight: 600; margin: 8px 0 4px 0; font-size: 16px; color: var(--text-main); letter-spacing: -0.3px;}
        .login-header p { margin: 0; color: var(--text-muted); font-size: 11px; font-weight: 500;}
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        
        .form-control { 
            width: 100%; 
            padding: 10px 14px; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            font-size: 13px; 
            box-sizing: border-box; 
            background-color: #fafafa;
            color: var(--text-main);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .form-control:focus { 
            outline: none; 
            border-color: var(--primary); 
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(11, 87, 208, 0.1);
        }

        .btn-login { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 10px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            margin-top: 8px; 
            border-radius: 50px; 
            transition: 0.2s; 
        }
        .btn-login:hover { background-color: #0842a0; box-shadow: 0 2px 6px rgba(11, 87, 208, 0.2); }
        
        .link-senha { 
            display: block; 
            text-align: center; 
            margin-top: 16px; 
            color: var(--primary); 
            text-decoration: none; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 600;
        }
        .link-senha:hover { text-decoration: underline; color: #0842a0; }
        
        div:where(.swal2-container) div:where(.swal2-popup) { 
            width: 320px !important; 
            padding: 24px !important; 
            border-radius: 24px !important; 
            border: none !important; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important; 
        }
        div:where(.swal2-container) h2:where(.swal2-title) { font-size: 16px !important; font-weight: 600 !important; color: var(--text-main) !important; margin: 0 0 8px 0 !important; }
        div:where(.swal2-container) div:where(.swal2-html-container) { font-size: 13px !important; color: var(--text-muted) !important; margin: 8px 0 20px 0 !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm { 
            border-radius: 50px !important; 
            font-size: 13px !important; 
            font-weight: 600 !important; 
            padding: 8px 24px !important; 
            width: auto !important; 
            background-color: var(--primary) !important; 
            border: none !important; 
        }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm:hover { background-color: #0842a0 !important; }
        div:where(.swal2-container) .swal2-icon { transform: scale(0.6) !important; margin: 0 auto 10px auto !important; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <img id="logoSistema" src="" alt="Logo do Sistema">
            <span id="iconePadrao" class="material-symbols-outlined">admin_panel_settings</span>
            <h3 id="tituloSistema">Carregando...</h3>
            <p>Acesso Restrito ao Sistema</p>
        </div>
        <form id="formLogin" onsubmit="event.preventDefault(); window.fazerLogin();">
            <div class="form-group">
                <label class="form-label">Código EOL da Unidade</label>
                <input type="text" class="form-control" id="id_unidade" placeholder="Ex: 700038" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
            </div>
            <div class="form-group">
                <label class="form-label">RF do Servidor</label>
                <input type="text" class="form-control" id="rf_usuario" placeholder="Apenas números" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha_usuario" placeholder="******" required>
            </div>
            <button type="submit" class="btn-login">CONECTAR</button>
        </form>
        <a class="link-senha" onclick="window.recuperarSenha()">Esqueci minha senha</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f",
            measurementId: "G-E5LLYGW7DN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Limpa resíduos de acessos anteriores
        localStorage.clear();

        // MÁGICA 1: Busca o nome do sistema ou define um padrão seguro
        async function carregarConfiguracoes() {
            try {
                const configRef = collection(db, "configuracoes");
                const configSnapshot = await getDocs(configRef);
                
                let nomeEncontrado = "SIG-EDU Central"; // Nome garantido caso não ache no Firebase
                let logoEncontrada = null;
                
                if (!configSnapshot.empty) {
                    // Vasculha todos os documentos em busca do nome e da logo
                    configSnapshot.forEach((doc) => {
                        const dados = doc.data();
                        if (dados.nomeSistema) nomeEncontrado = dados.nomeSistema;
                        if (dados.logoUrl) logoEncontrada = dados.logoUrl;
                    });
                }
                
                // Aplica o nome
                document.getElementById('tituloSistema').innerText = nomeEncontrado;
                document.title = "Login - " + nomeEncontrado;
                
                // Aplica o logo (se existir)
                if (logoEncontrada) {
                    const imgLogo = document.getElementById('logoSistema');
                    imgLogo.src = logoEncontrada;
                    imgLogo.style.display = 'block';
                    document.getElementById('iconePadrao').style.display = 'none'; 
                }
                
            } catch (erro) {
                console.error("Erro ao carregar configurações do Firebase:", erro);
                document.getElementById('tituloSistema').innerText = "SIG-EDU Central";
                document.title = "Login - SIG-EDU Central";
            }
        }

        carregarConfiguracoes();

        window.fazerLogin = async function() {
            const unidade = document.getElementById('id_unidade').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!unidade || !rf || !senha) {
                Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Preencha todos os campos.' });
                return;
            }

            Swal.fire({
                title: 'A validar acessos...',
                text: 'Consultando servidor.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const usuariosRef = collection(db, "usuarios");
                const q = query(usuariosRef, 
                    where("id_unidade", "==", unidade),
                    where("rf_usuario", "==", rf)
                );
                
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'Credenciais não encontradas ou Unidade incorreta.' });
                    return;
                }

                let usuarioValido = false;
                let dadosUsuario = null;

                querySnapshot.forEach((documento) => {
                    const dados = documento.data();
                    if (dados.senha_usuario === senha) {
                        usuarioValido = true;
                        dadosUsuario = dados;
                    }
                });

                if (!usuarioValido) {
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'Senha incorreta.' });
                    return;
                }

                // Guardando as Chaves Estrangeiras no bolso do navegador
                localStorage.setItem('sig_rf', dadosUsuario.rf_usuario); 
                localStorage.setItem('sig_id_unidade', dadosUsuario.id_unidade);
                localStorage.setItem('sig_nivel_acesso', dadosUsuario.id_nivel_acesso);
                localStorage.setItem('sig_nome', dadosUsuario.nome_usuario);
                localStorage.setItem('sig_email', dadosUsuario.email_usuario || "");
                localStorage.setItem('sig_foto', dadosUsuario.url_foto || "");
                
                // Redireciona para o Painel de Controle
                window.location.href = "dashboard_FB.html";

            } catch (erro) {
                Swal.fire({ icon: 'error', title: 'Erro de Conexão', text: 'Falha ao conectar no banco de dados.' });
                console.error(erro);
            }
        };

        window.recuperarSenha = function() {
            Swal.fire({
                title: 'Recuperar Acesso',
                text: 'Contate o Administrador de TI da sua Regional para solicitar uma nova credencial.',
                icon: 'warning',
                confirmButtonText: 'ENTENDIDO'
            });
        };
    </script>
</body>
</html>
