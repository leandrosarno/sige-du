<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-EDU | Acesso Restrito</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root {
            --google-blue: #1a73e8;
            --bg-color: #eef0f3;
            --border-color: #999;
        }

        body { 
            background-color: var(--bg-color); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            font-size: 10px;
            color: #333;
        }
        
        .login-box {
            background: #fff;
            width: 280px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--google-blue);
            box-shadow: 2px 2px 10px rgba(0,0,0,0.15);
            border-radius: 0;
        }

        .login-header {
            text-align: center;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
            padding-bottom: 10px;
        }

        .login-header span { font-size: 32px; color: var(--google-blue); }
        .login-header h3 { font-weight: bold; margin: 5px 0 2px 0; font-size: 11px; }
        .login-header p { margin: 0; color: #666; font-size: 9px; }

        .form-group { margin-bottom: 10px; }
        .form-label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 10px; }
        
        .form-control { 
            width: 100%; padding: 4px 6px; border: 1px solid #aaa; 
            border-radius: 0; font-size: 10px; box-sizing: border-box; height: 22px;
        }
        .form-control:focus { outline: none; border-color: var(--google-blue); }

        .btn-login { 
            background-color: var(--google-blue); color: white; border: 1px solid #0d47a1; 
            width: 100%; padding: 4px; font-weight: bold; font-size: 10px; 
            cursor: pointer; margin-top: 10px; height: 24px; border-radius: 0;
        }
        .btn-login:hover { background-color: #1557b0; }

        .link-senha {
            display: block; text-align: center; margin-top: 12px; color: var(--google-blue);
            text-decoration: underline; cursor: pointer; font-size: 9px;
        }
        .link-senha:hover { color: #0d47a1; }

        /* SWEETALERT DESIGN CORPORATIVO */
        div:where(.swal2-container) div:where(.swal2-popup) {
            width: 280px !important; padding: 20px !important; border-radius: 0 !important;
            border: 1px solid var(--border-color) !important; border-top: 4px solid var(--google-blue) !important;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.15) !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        div:where(.swal2-container) h2:where(.swal2-title) { font-size: 11px !important; font-weight: bold !important; color: #333 !important; margin: 0 0 5px 0 !important; }
        div:where(.swal2-container) div:where(.swal2-html-container) { font-size: 10px !important; color: #666 !important; margin: 5px 0 15px 0 !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm {
            border-radius: 0 !important; font-size: 10px !important; font-weight: bold !important;
            padding: 4px !important; width: 100% !important; height: 24px !important;
            background-color: var(--google-blue) !important; border: 1px solid #0d47a1 !important;
        }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm:hover { background-color: #1557b0 !important; }
        div:where(.swal2-container) .swal2-icon { transform: scale(0.5) !important; margin: 0 auto 5px auto !important; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="login-header">
            <span class="material-icons">admin_panel_settings</span>
            <h3>SIG-EDU Central</h3>
            <p>Acesso Restrito ao Sistema</p>
        </div>

        <form id="formLogin" onsubmit="event.preventDefault(); window.fazerLogin();">
            <div class="form-group">
                <label class="form-label">Código EOL da Unidade</label>
                <input type="text" class="form-control" id="id_unidade" placeholder="Ex: 700038" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">RF do Servidor</label>
                <input type="text" class="form-control" id="rf_usuario" placeholder="Apenas números" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha_usuario" placeholder="******" required>
            </div>
            
            <button type="submit" class="btn-login">CONECTAR</button>
        </form>

        <a class="link-senha" onclick="window.recuperarSenha()">Esqueci minha senha</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f",
            measurementId: "G-E5LLYGW7DN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Limpa resíduos de acessos anteriores
        localStorage.clear();

        window.fazerLogin = async function() {
            const unidade = document.getElementById('id_unidade').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!unidade || !rf || !senha) {
                Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Preencha todos os campos.' });
                return;
            }

            Swal.fire({
                title: 'A validar acessos...',
                text: 'Consultando servidor.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const usuariosRef = collection(db, "usuarios");
                
                // MÁGICA 1: Busca exatamente pelas chaves numéricas que criamos!
                const q = query(usuariosRef, 
                    where("id_unidade", "==", unidade),
                    where("rf_usuario", "==", rf)
                );
                
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'Credenciais não encontradas ou Unidade incorreta.' });
                    return;
                }

                let usuarioValido = false;
                let dadosUsuario = null;

                querySnapshot.forEach((documento) => {
                    const dados = documento.data();
                    // Valida a senha (como string)
                    if (dados.senha_usuario === senha) {
                        usuarioValido = true;
                        dadosUsuario = dados;
                    }
                });

                if (!usuarioValido) {
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'Senha incorreta.' });
                    return;
                }

                // MÁGICA 2: Guardando as Chaves Estrangeiras no bolso do navegador
                localStorage.setItem('sig_rf', dadosUsuario.rf_usuario); 
                localStorage.setItem('sig_id_unidade', dadosUsuario.id_unidade);
                localStorage.setItem('sig_nivel_acesso', dadosUsuario.id_nivel_acesso);
                localStorage.setItem('sig_nome', dadosUsuario.nome_usuario);
                localStorage.setItem('sig_email', dadosUsuario.email_usuario || "");
                localStorage.setItem('sig_foto', dadosUsuario.url_foto || "");
                
                // Redireciona para o Painel de Controle
                window.location.href = "dashboard_FB.html"; 

            } catch (erro) {
                Swal.fire({ icon: 'error', title: 'Erro de Conexão', text: 'Falha ao conectar no banco de dados.' });
                console.error(erro);
            }
        };

        window.recuperarSenha = function() {
            Swal.fire({
                title: 'Recuperar Acesso',
                text: 'Contate o Administrador de TI da sua Regional para solicitar uma nova credencial.',
                icon: 'warning',
                confirmButtonText: 'ENTENDIDO'
            });
        };
    </script>
</body>
</html>
