<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-EDU | Sistema de Gestão</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* ------------------------------------------- */
        /* TELA DE LOGIN QUADRADA E PEQUENA            */
        /* ------------------------------------------- */
        #tela-login {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e293b, #0f172a);
        }
        .login-box {
            background: #ffffff;
            width: 360px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-box .material-icons { font-size: 50px; color: #0d6efd; margin-bottom: 10px; }
        .login-box h4 { font-weight: 800; color: #1e293b; margin-bottom: 5px; }
        .login-box p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .login-box .form-control { border-radius: 8px; padding: 12px 15px; margin-bottom: 15px; background-color: #f8fafc; border: 1px solid #cbd5e1; }
        .login-box .form-control:focus { border-color: #0d6efd; box-shadow: none; background-color: #ffffff; }
        .btn-login { background: #0d6efd; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; margin-top: 10px; transition: 0.3s; }
        .btn-login:hover { background: #0b5ed7; transform: translateY(-2px); }

        /* ------------------------------------------- */
        /* PAINEL DO SISTEMA (OCULTO ATÉ LOGAR)        */
        /* ------------------------------------------- */
        #tela-app { display: none; height: 100vh; }
        
        /* BARRA LATERAL (SIDEBAR) */
        #sidebar { width: 260px; background: #1e293b; color: white; display: flex; flex-direction: column; transition: all 0.3s; }
        .sidebar-header { padding: 25px 20px; text-align: center; border-bottom: 1px solid #334155; }
        .sidebar-header h4 { margin: 0; font-weight: 900; color: #38bdf8; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .sidebar-menu { padding: 20px 0; flex-grow: 1; overflow-y: auto; }
        
        .sidebar a { padding: 14px 25px; display: flex; align-items: center; gap: 15px; color: #cbd5e1; text-decoration: none; font-weight: 600; font-size: 15px; transition: 0.2s; border-left: 4px solid transparent; cursor: pointer; }
        .sidebar a:hover { background: #334155; color: white; }
        .sidebar a.ativo { background: #0f172a; color: #38bdf8; border-left-color: #38bdf8; }
        
        .sidebar-footer { padding: 20px; border-top: 1px solid #334155; }
        .btn-sair { color: #f87171; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; text-decoration: none; font-weight: bold; padding: 10px; border-radius: 8px; transition: 0.2s; }
        .btn-sair:hover { background: #451a20; color: #ef4444; }

        /* ÁREA PRINCIPAL */
        #main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; width: calc(100% - 260px); }
        
        /* BARRA SUPERIOR */
        #topbar { background: white; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); z-index: 10; }
        .unidade-badge { background: #e0f2fe; color: #0284c7; padding: 6px 16px; border-radius: 20px; font-weight: 800; font-size: 14px; letter-spacing: 0.5px;}
        
        /* IFRAME ONDE AS TELAS ABREM */
        #frame-conteudo { width: 100%; height: calc(100vh - 70px); border: none; background-color: #f4f7f6; }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- TELA 1: CAIXA DE LOGIN QUADRADA            -->
    <!-- ========================================== -->
    <div id="tela-login">
        <div class="login-box animate__animated animate__zoomIn">
            <span class="material-icons">admin_panel_settings</span>
            <h4>SIG-EDU</h4>
            <p>Acesso ao Módulo de Gestão</p>

            <input type="number" id="input-unidade" class="form-control text-center fw-bold" placeholder="CÓDIGO DA UNIDADE">
            <input type="text" id="input-rf" class="form-control text-center" placeholder="REGISTRO FUNCIONAL (RF)">
            <input type="password" id="input-senha" class="form-control text-center" placeholder="SENHA DE ACESSO">
            
            <button class="btn-login" onclick="fazerLogin()">ENTRAR NO SISTEMA</button>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- TELA 2: PAINEL DO SISTEMA                  -->
    <!-- ========================================== -->
    <div id="tela-app">
        <!-- MENU LATERAL -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h4><span class="material-icons fs-3">domain</span> SIG-EDU</h4>
                <small class="text-muted fw-bold mt-1 d-block" style="font-size: 11px; text-transform: uppercase;">Gestão de Unidades</small>
            </div>
            
            <div class="sidebar-menu">
                <a class="ativo" onclick="abrirFormFilho('inicio_FB.html', this)">
                    <span class="material-icons">dashboard</span> Painel Inicial
                </a>
                <a onclick="abrirFormFilho('alunos_FB.html', this)">
                    <span class="material-icons">people_alt</span> Munícipes
                </a>
                <a onclick="abrirFormFilho('turmas_FB.html', this)">
                    <span class="material-icons">class</span> Turmas / Aulas
                </a>
                <a onclick="abrirFormFilho('relatorios_FB.html', this)">
                    <span class="material-icons">insert_chart</span> Relatórios
                </a>
            </div>

            <div class="sidebar-footer">
                <a class="btn-sair" onclick="fazerLogout()">
                    <span class="material-icons">logout</span> Encerrar Sessão
                </a>
            </div>
        </nav>

        <!-- CONTEÚDO À DIREITA -->
        <div id="main-content">
            
            <header id="topbar">
                <div class="d-flex align-items-center gap-3">
                    <span class="unidade-badge" id="nome-unidade-topo">
                        <i class="fas fa-spinner fa-spin"></i> Conectando...
                    </span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <div style="text-align: right; line-height: 1.2;">
                        <div style="font-weight: 700; color: #1e293b; font-size: 14px;">Módulo Secretaria</div>
                        <div id="info-rf-topo" style="font-size: 12px; color: #64748b; font-weight: 600;">RF: ---</div>
                    </div>
                    <span class="material-icons ms-2" style="color: #cbd5e1; font-size: 38px;">account_circle</span>
                </div>
            </header>

            <!-- O Inicio.html ou Alunos.html abrem aqui dentro -->
            <iframe id="frame-conteudo" src="inicio_FB.html"></iframe>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- MOTOR JAVASCRIPT DE SESSÃO E NAVEGAÇÃO     -->
    <!-- ========================================== -->
    <script type="module">
        import { db } from './firebase_config.js';

        // 1. AO ABRIR O SITE, VERIFICA SE JÁ EXISTE LOGIN SALVO
        window.onload = function() {
            const idUnidade = localStorage.getItem('sig_id_unidade');
            const rfLogado = localStorage.getItem('sig_rf');
            
            if (idUnidade && rfLogado) {
                // Já está logado: Esconde a caixa de login e mostra o painel
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('tela-app').style.display = 'flex';
                
                document.getElementById('nome-unidade-topo').innerHTML = `<span class="material-icons align-middle fs-6 me-1">domain</span> UNIDADE: ${idUnidade}`;
                document.getElementById('info-rf-topo').innerText = `RF: ${rfLogado}`;
            } else {
                // Não está logado: Mostra apenas a caixa de login
                document.getElementById('tela-login').style.display = 'flex';
                document.getElementById('tela-app').style.display = 'none';
            }
        };

        // 2. FUNÇÃO DO BOTÃO "ENTRAR"
        window.fazerLogin = function() {
            const unidade = document.getElementById('input-unidade').value.trim();
            const rf = document.getElementById('input-rf').value.trim();
            const senha = document.getElementById('input-senha').value.trim();

            if (!unidade || !rf || !senha) {
                Swal.fire('Campos Incompletos', 'Por favor, preencha a Unidade, seu RF e sua Senha.', 'warning');
                return;
            }

            // Grava os dados na memória do navegador
            localStorage.setItem('sig_id_unidade', unidade);
            localStorage.setItem('sig_rf', rf);
            localStorage.setItem('sig_nivel_acesso', JSON.stringify(['SECRETARIA'])); // Permissão padrão por enquanto
            
            Swal.fire({
                title: 'Acesso Liberado!',
                text: 'Bem-vindo ao SIG-EDU',
                icon: 'success',
                timer: 1200,
                showConfirmButton: false
            }).then(() => {
                // Recarrega a página para entrar no painel
                window.location.reload();
            });
        };

        // 3. FUNÇÃO DO BOTÃO DE SAIR
        window.fazerLogout = function() {
            Swal.fire({
                title: 'Encerrar Sessão?',
                text: "Você será desconectado e voltará para a tela de login.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sim, Sair',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('sig_id_unidade');
                    localStorage.removeItem('sig_rf');
                    localStorage.removeItem('sig_nivel_acesso');
                    window.location.reload();
                }
            });
        };

        // 4. FUNÇÃO DO MENU LATERAL (Abre as telas dentro do Iframe)
        window.abrirFormFilho = function(url, elementoClicado) {
            const iframe = document.getElementById('frame-conteudo');
            iframe.src = url;
            
            if(elementoClicado) {
                const links = document.querySelectorAll('.sidebar a');
                links.forEach(link => link.classList.remove('ativo'));
                elementoClicado.classList.add('ativo');
            }
        };
    </script>
</body>
</html>
