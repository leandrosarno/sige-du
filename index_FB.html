<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG-EDU - Login (Homologação Firebase)</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        :root { --cor-primaria: #0d6efd; --cor-fundo: #f4f7f6; }
        body { 
            background-color: var(--cor-fundo); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        /* NOVO DESIGN: MODAL HORIZONTAL */
        .login-horizontal {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 950px; /* Bem mais largo para acomodar os campos */
            border-left: 6px solid #ff9800; /* Linha laranja indica o ambiente de testes Firebase */
            display: flex;
            align-items: center;
            gap: 30px;
        }

        /* COLUNA DA LOGO */
        .login-brand {
            flex: 0 0 240px;
            text-align: center;
            border-right: 1px solid #eee;
            padding-right: 25px;
        }
        .login-brand span { font-size: 50px; color: var(--cor-primaria); }
        .login-brand h3 { font-weight: 700; color: #333; margin-top: 10px; font-size: 20px; }
        
        /* COLUNA DO FORMULÁRIO */
        .login-form { flex-grow: 1; }
        
        .btn-login { 
            background-color: var(--cor-primaria); 
            border: none; 
            font-weight: bold; 
            font-size: 14px; 
            height: 42px; /* Alinha a altura do botão com os inputs */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-login:hover { background-color: #0b5ed7; }
        
        .form-control { padding: 10px; border-radius: 8px; font-size: 13px; height: 42px; }
        .form-label { font-size: 12px; margin-bottom: 4px; color: #555; }

        /* RESPONSIVIDADE PARA CELULARES (Empilha tudo de novo se a tela for pequena) */
        @media (max-width: 768px) {
            .login-horizontal { 
                flex-direction: column; 
                max-width: 400px; 
                border-left: none; 
                border-top: 6px solid #ff9800; 
                padding: 20px; 
                gap: 15px;
            }
            .login-brand { 
                border-right: none; 
                border-bottom: 1px solid #eee; 
                padding-right: 0; 
                padding-bottom: 15px; 
                flex: auto; 
                width: 100%; 
            }
        }
    </style>
</head>
<body>

    <div class="login-horizontal">
        
        <!-- LADO ESQUERDO: Branding -->
        <div class="login-brand" id="box-logo">
            <span class="material-icons" id="icone-padrao">account_balance</span>
            <img id="img-logo" src="" alt="Logo do Sistema" style="display: none; width: 100%; height: 70px; object-fit: contain; margin: 0 auto 10px auto;">
            <h3 id="titulo-sistema">A carregar...</h3>
            <p class="text-muted" style="font-size: 11px; margin: 0;">Acesso Restrito - Firebase</p>
        </div>

        <!-- LADO DIREITO: Campos Alinhados -->
        <div class="login-form">
            <!-- Ao usar o preventDefault, evitamos o recarregamento da tela e chamamos a função do Firebase -->
            <form id="formLogin" onsubmit="event.preventDefault(); window.fazerLogin();">
                <!-- Usamos a grade do Bootstrap dividida em 4 colunas iguais (col-md-3) -->
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Código EOL</label>
                        <input type="number" class="form-control" id="id_ceu" placeholder="Ex: 123456" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">RF Servidor</label>
                        <input type="number" class="form-control" id="rf_usuario" placeholder="Apenas números" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Senha de Acesso</label>
                        <input type="password" class="form-control" id="senha_usuario" placeholder="******" required>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary btn-login w-100" id="btn-entrar">ENTRAR</button>
                    </div>
                </div>
            </form>
        </div>
        
    </div>

    <!-- SCRIPT DO SISTEMA COM FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, getDoc, doc, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // CHAVE DO SEU PROJETO SIG-EDU
        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f",
            measurementId: "G-E5LLYGW7DN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // LOGO E CONFIGURAÇÕES GERAIS
        // ==========================================
        window.onload = async function() {
            localStorage.clear();

            try {
                const docRef = doc(db, "configuracoes", "sistema");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    document.getElementById('titulo-sistema').innerText = dados.nomeSistema || "SIG-EDU";
                    localStorage.setItem('ceu_nome_sistema', dados.nomeSistema || "SIG-EDU");
                    
                    if (dados.logoUrl) {
                        localStorage.setItem('ceu_logo_sistema', dados.logoUrl);
                        document.getElementById('icone-padrao').style.display = 'none';
                        const img = document.getElementById('img-logo');
                        img.src = dados.logoUrl;
                        
                        if(dados.tamanhoLogo) {
                            img.style.height = dados.tamanhoLogo; 
                            localStorage.setItem('ceu_tamanho_logo', dados.tamanhoLogo); 
                        }
                        img.style.display = 'block';
                    }
                } else {
                    document.getElementById('titulo-sistema').innerText = "SIG-EDU Central";
                }
            } catch (erro) {
                console.error("Aviso: Banco de dados ainda sem configurações registradas.", erro);
                document.getElementById('titulo-sistema').innerText = "SIG-EDU Central";
            }
        };

        // ==========================================
        // MOTOR DE LOGIN (FIREBASE)
        // ==========================================
        window.fazerLogin = async function() {
            const ceu = document.getElementById('id_ceu').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!ceu || !rf || !senha) {
                Swal.fire('Atenção', 'Preencha todos os campos.', 'warning');
                return;
            }

            Swal.fire({
                title: 'A validar acessos...',
                text: 'Consultando o banco de dados seguro.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const usuariosRef = collection(db, "usuarios");
                const q = query(usuariosRef, 
                    where("id_ceu", "==", ceu),
                    where("rf_usuario", "==", rf)
                );
                
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    Swal.fire('Acesso Negado', 'Usuário não encontrado.', 'error');
                    return;
                }

                let usuarioValido = false;
                let dadosUsuario = null;
                let idDocumentoFirebase = null;

                querySnapshot.forEach((documento) => {
                    const dados = documento.data();
                    if (dados.senha_usuario === senha) {
                        usuarioValido = true;
                        dadosUsuario = dados;
                        idDocumentoFirebase = documento.id; 
                    }
                });

                if (!usuarioValido) {
                    Swal.fire('Acesso Negado', 'Senha incorreta.', 'error');
                    return;
                }

                if (dadosUsuario.primeiro_acesso === true) {
                    window.tratarPrimeiroAcesso("É necessário redefinir a sua senha inicial de segurança.", { idDoc: idDocumentoFirebase });
                    return;
                }

                // SUCESSO
                localStorage.setItem('ceu_codigo_eol', ceu);
                localStorage.setItem('ceu_rf_logado', rf); 
                localStorage.setItem('ceu_planilha_id', dadosUsuario.id_planilha_banco || "");
                localStorage.setItem('ceu_nome', dadosUsuario.nome_ceu || "Escola");
                localStorage.setItem('ceu_nome_especifico', dadosUsuario.nome_ceu || "Escola");
                localStorage.setItem('ceu_nome_usuario', dadosUsuario.nome_usuario || "Gestor");
                
                if(dadosUsuario.logo_ceu) localStorage.setItem('ceu_logo', dadosUsuario.logo_ceu);
                if(dadosUsuario.foto_usuario) localStorage.setItem('ceu_foto_usuario', dadosUsuario.foto_usuario);
                
                localStorage.setItem('ceu_perfil', dadosUsuario.perfil_usuario || "padrao"); 
                
                window.location.href = "dashboard.html"; 

            } catch (erro) {
                Swal.fire('Erro de Conexão', 'Falha ao conectar com o banco de dados.', 'error');
                console.error("Erro no Login Firebase: ", erro);
            }
        };

        // ==========================================
        // FLUXO DE PRIMEIRO ACESSO 
        // ==========================================
        window.tratarPrimeiroAcesso = function(mensagemDoServidor, dadosAuxiliares) {
            Swal.fire({
                title: '🔒 Primeiro Acesso',
                text: mensagemDoServidor,
                icon: 'info',
                html: `
                    <div style="text-align: left; font-size: 14px;">
                        <label class="mt-2 fw-bold">Nova Senha:</label>
                        <input type="password" id="swal-nova-senha" class="swal2-input" placeholder="Mínimo 8 caracteres">
                        <label class="mt-2 fw-bold">Confirmar Nova Senha:</label>
                        <input type="password" id="swal-conf-senha" class="swal2-input" placeholder="Repita a senha">
                    </div>
                `,
                confirmButtonText: 'Gravar Nova Senha',
                confirmButtonColor: '#198754',
                allowOutsideClick: false,
                preConfirm: () => {
                    const s1 = document.getElementById('swal-nova-senha').value;
                    const s2 = document.getElementById('swal-conf-senha').value;
                    if (s1 !== s2) { Swal.showValidationMessage('As senhas não conferem!'); return false; }
                    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,12}$/.test(s1)) {
                        Swal.showValidationMessage('A senha é muito fraca (use maiúsculas, números e símbolos)!'); return false;
                    }
                    return s1;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    window.enviarNovaSenha(dadosAuxiliares.idDoc, result.value);
                }
            });
        };

        window.enviarNovaSenha = async function(idDocumentoFirebase, novaSenha) {
            Swal.fire({ title: 'A gravar no Firebase...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            
            try {
                const usuarioRef = doc(db, "usuarios", idDocumentoFirebase);
                await updateDoc(usuarioRef, {
                    senha_usuario: novaSenha,
                    primeiro_acesso: false
                });

                Swal.fire('Sucesso!', 'Senha alterada. Faça login com a nova senha!', 'success').then(() => { 
                    document.getElementById('senha_usuario').value = ''; 
                });
            } catch (erro) {
                Swal.fire('Erro', 'Ocorreu um erro ao atualizar a senha no banco.', 'error');
                console.error(erro);
            }
        };
    </script>
</body>
</html>
