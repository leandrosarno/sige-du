<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --ink: #0e2f33;          /* verde-petróleo profundo */
            --ink-soft: #1b4a4f;
            --accent: #0f766e;       /* ação principal */
            --accent-hover: #0b5e57;
            --gold: #d9a441;         /* detalhe do painel */
            --paper: #eef1f0;
            --surface: #ffffff;
            --line: #d9dfdd;
            --text: #14201f;
            --muted: #5b6b69;
            --danger: #b3261e;
            --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
            --font-body: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: var(--font-body);
            color: var(--text);
            background: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- CARTÃO ---------- */
        .login-shell {
            width: 100%;
            max-width: 940px;
            min-height: 560px;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            background: var(--surface);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 60px -30px rgba(14, 47, 51, .35), 0 2px 6px rgba(14, 47, 51, .06);
        }

        /* ---------- PAINEL DA MARCA ---------- */
        .brand {
            position: relative;
            background: var(--ink);
            color: #fff;
            padding: 48px 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* linhas finas que lembram uma pauta/caderno */
        .brand::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 35px,
                rgba(255, 255, 255, .045) 35px,
                rgba(255, 255, 255, .045) 36px
            );
            pointer-events: none;
        }
        /* margem vertical da pauta, em dourado */
        .brand::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            left: 28px;
            width: 1px;
            background: var(--gold);
            opacity: .55;
            pointer-events: none;
        }

        .brand > * { position: relative; z-index: 1; }

        .logo-box {
            width: 112px;
            height: 112px;
            background: #fff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
        }
        #logoSistema {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        #iconePadrao { width: 52px; height: 52px; color: var(--ink); }

        .brand-text h1 {
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 38px;
            line-height: 1.1;
            letter-spacing: -.01em;
            margin: 0 0 14px 0;
        }
        .brand-text p {
            margin: 0;
            max-width: 32ch;
            color: rgba(255, 255, 255, .72);
            font-size: 15px;
            line-height: 1.6;
        }

        /* ---------- FORMULÁRIO ---------- */
        .form-side {
            padding: 56px 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-side h2 {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -.01em;
            margin: 0 0 6px 0;
        }
        .form-side .sub {
            margin: 0 0 32px 0;
            color: var(--muted);
            font-size: 14.5px;
        }

        .field { margin-bottom: 20px; }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 7px;
        }

        .input-wrap { position: relative; }

        .field input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            font: inherit;
            font-size: 15px;
            color: var(--text);
            background: #f8faf9;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
        }
        .field input::placeholder { color: #98a5a3; }
        .field input:hover { border-color: #bcc7c4; }
        .field input:focus {
            outline: none;
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, .14);
        }

        .input-wrap.has-toggle input { padding-right: 48px; }

        .toggle-pass {
            position: absolute;
            top: 0; right: 0;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            background: none;
            border: 0;
            color: var(--muted);
            cursor: pointer;
            border-radius: 0 10px 10px 0;
        }
        .toggle-pass:hover { color: var(--ink); }
        .toggle-pass:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .toggle-pass svg { width: 20px; height: 20px; }
        .toggle-pass .eye-off { display: none; }
        .toggle-pass.visible .eye { display: none; }
        .toggle-pass.visible .eye-off { display: block; }

        .btn-login {
            width: 100%;
            height: 50px;
            margin-top: 8px;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color .15s ease, transform .05s ease;
        }
        .btn-login:hover { background: var(--accent-hover); }
        .btn-login:active { transform: translateY(1px); }
        .btn-login:focus-visible { outline: 3px solid rgba(15, 118, 110, .35); outline-offset: 2px; }
        .btn-login:disabled { opacity: .7; cursor: wait; }

        /* ---------- CELULAR / TELAS PEQUENAS ---------- */
        @media (max-width: 800px) {
            body { padding: 16px; align-items: flex-start; }
            .login-shell {
                grid-template-columns: 1fr;
                min-height: 0;
                max-width: 460px;
                margin: auto;
            }
            .brand {
                flex-direction: row;
                align-items: center;
                gap: 18px;
                padding: 24px 24px 24px 40px;
            }
            .brand::after { left: 18px; }
            .logo-box { width: 72px; height: 72px; padding: 10px; border-radius: 14px; flex-shrink: 0; }
            #iconePadrao { width: 34px; height: 34px; }
            .brand-text h1 { font-size: 22px; margin: 0; }
            .brand-text p { display: none; }
            .form-side { padding: 32px 24px 36px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        /* ---------- SWEETALERT ---------- */
        div:where(.swal2-container) div:where(.swal2-popup) { width: 340px !important; padding: 28px 24px !important; border-radius: 18px !important; border: none !important; box-shadow: 0 20px 50px rgba(14, 47, 51, .25) !important; font-family: var(--font-body) !important; }
        div:where(.swal2-container) h2:where(.swal2-title) { font-family: var(--font-display) !important; font-size: 20px !important; font-weight: 600 !important; color: var(--text) !important; margin: 0 0 8px 0 !important; }
        div:where(.swal2-container) div:where(.swal2-html-container) { font-size: 14px !important; color: var(--muted) !important; margin: 8px 0 20px 0 !important; line-height: 1.5 !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm { border-radius: 10px !important; font-size: 14px !important; font-weight: 700 !important; padding: 10px 28px !important; width: auto !important; background-color: var(--accent) !important; border: none !important; box-shadow: none !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm:hover { background-color: var(--accent-hover) !important; }
        div:where(.swal2-container) .swal2-icon { transform: scale(0.7) !important; margin: 0 auto 8px auto !important; }
    </style>
</head>
<body>

    <main class="login-shell">

        <!-- PAINEL DA MARCA -->
        <section class="brand">
            <div class="logo-box">
                <img id="logoSistema" src="" alt="Logo do Sistema">
                <svg id="iconePadrao" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3 4 6v6c0 4.4 3.1 8.1 8 9 4.9-.9 8-4.6 8-9V6l-8-3Z"/>
                    <path d="m9 12 2.2 2.2L15.5 10"/>
                </svg>
            </div>

            <div class="brand-text">
                <h1 id="nomeSistema">SIG-EDU</h1>
                <p></p>
            </div>
        </section>

        <!-- FORMULÁRIO -->
        <section class="form-side">
            <h2>Entrar</h2>
            <p class="sub">Informe os dados da sua unidade e do seu cadastro.</p>

            <form id="formLogin" onsubmit="event.preventDefault(); window.fazerLogin();" autocomplete="off">
                <div class="field">
                    <label for="id_unidade">Código EOL da unidade</label>
                    <div class="input-wrap">
                        <input type="text" id="id_unidade" inputmode="numeric" placeholder="Ex: 700038" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>
                </div>

                <div class="field">
                    <label for="rf_usuario">RF do servidor</label>
                    <div class="input-wrap">
                        <input type="text" id="rf_usuario" inputmode="numeric" placeholder="Apenas números" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>
                </div>

                <div class="field">
                    <label for="senha_usuario">Senha</label>
                    <div class="input-wrap has-toggle">
                        <input type="password" id="senha_usuario" placeholder="Digite sua senha" required>
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha">
                            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
            </form>

            <!-- <a class="link-senha" onclick="window.recuperarSenha()">Esqueceu sua senha?</a> -->
        </section>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        localStorage.clear();

        // Mostrar / ocultar senha
        const campoSenha = document.getElementById('senha_usuario');
        const botaoOlho = document.getElementById('togglePass');
        botaoOlho.addEventListener('click', () => {
            const mostrando = campoSenha.type === 'text';
            campoSenha.type = mostrando ? 'password' : 'text';
            botaoOlho.classList.toggle('visible', !mostrando);
            botaoOlho.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
        });

        async function carregarConfiguracoes() {
            try {
                const configRef = collection(db, "configuracoes");
                const configSnapshot = await getDocs(configRef);

                let logoEncontrada = null;
                let nomeParaTituloAba = "SIG-EDU Central";

                if (!configSnapshot.empty) {
                    configSnapshot.forEach((doc) => {
                        const dados = doc.data();
                        if (dados.logoUrl) logoEncontrada = dados.logoUrl;
                        if (dados.nomeSistema) nomeParaTituloAba = dados.nomeSistema;
                    });
                }

                document.title = "Login - " + nomeParaTituloAba;
                document.getElementById('nomeSistema').textContent = nomeParaTituloAba;

                if (logoEncontrada) {
                    const imgLogo = document.getElementById('logoSistema');
                    imgLogo.src = logoEncontrada;
                    imgLogo.style.display = 'block';
                    document.getElementById('iconePadrao').style.display = 'none';
                }

            } catch (erro) {
                console.error("Erro ao carregar configurações do Firebase:", erro);
                document.title = "Login - Sistema CEU";
            }
        }

        carregarConfiguracoes();

        window.fazerLogin = async function() {
            const unidade = document.getElementById('id_unidade').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!unidade || !rf || !senha) {
                Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Por favor, preencha todos os campos.' });
                return;
            }

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;

            Swal.fire({
                title: 'Validando...',
                text: 'Conectando ao servidor seguro.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const usuariosRef = collection(db, "usuarios");
                const q = query(usuariosRef,
                    where("id_unidade", "==", unidade),
                    where("rf_usuario", "==", rf)
                );

                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    btn.disabled = false;
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'Credenciais não encontradas ou Unidade incorreta.' });
                    return;
                }

                let usuarioValido = false;
                let dadosUsuario = null;

                querySnapshot.forEach((documento) => {
                    const dados = documento.data();
                    if (dados.senha_usuario === senha) {
                        usuarioValido = true;
                        dadosUsuario = dados;
                    }
                });

                if (!usuarioValido) {
                    btn.disabled = false;
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'A senha informada está incorreta.' });
                    return;
                }

                localStorage.setItem('sig_rf', dadosUsuario.rf_usuario);
                localStorage.setItem('sig_id_unidade', dadosUsuario.id_unidade);
                localStorage.setItem('sig_nivel_acesso', dadosUsuario.id_nivel_acesso);
                localStorage.setItem('sig_nome', dadosUsuario.nome_usuario);
                localStorage.setItem('sig_email', dadosUsuario.email_usuario || "");
                localStorage.setItem('sig_foto', dadosUsuario.url_foto || "");

                window.location.href = "dashboard_FB.html";

            } catch (erro) {
                btn.disabled = false;
                Swal.fire({ icon: 'error', title: 'Erro de Conexão', text: 'Falha ao conectar no banco de dados.' });
                console.error(erro);
            }
        };

        window.recuperarSenha = function() {
            Swal.fire({
                title: 'Recuperação de Senha',
                text: 'Por favor, contate o Administrador de TI da sua Regional para solicitar uma nova credencial de acesso.',
                icon: 'info',
                confirmButtonText: 'Entendido'
            });
        };
    </script>
</body>
</html>
