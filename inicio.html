<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 30px; background-color: #f4f7f6; }
        .card-resumo { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <h2>Bem-vindo ao Sistema!</h2>
    <p class="text-muted">Selecione uma opção no menu lateral para começar a trabalhar.</p>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card card-resumo p-4 text-center">
                <h3 class="text-primary">0</h3>
                <span>Alunos Matriculados</span>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-resumo p-4 text-center">
                <h3 class="text-success">0</h3>
                <span>Turmas Ativas</span>
            </div>
        </div>
    </div>
</body>
</html>
