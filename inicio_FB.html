<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <!-- ÍCONES VAZADOS E FINOS -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #0b57d0;
            --bg-color: #f0f4f9;
            --surface: #ffffff;
            --border: #e3e3e3;
            --text-main: #1f1f1f;
            --text-muted: #444746;
        }

        body { 
            background-color: var(--bg-color); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            color: var(--text-main); 
            padding: 20px;
            box-sizing: border-box;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* 🌟 O NOVO CARTÃO HORIZONTAL DIVIDIDO */
        .login-wrapper {
            display: flex;
            flex-direction: row;
            background: var(--surface);
            width: 100%;
            max-width: 720px; /* Largura total do cartão */
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            overflow: hidden; /* Mantém o fundo contido nos cantos redondos */
            border: 1px solid var(--border);
        }

        /* 🌟 LADO ESQUERDO: O PALCO DO LOGO */
        .login-left {
            flex: 1;
            background-color: #f8f9fa; /* Fundo sutil para destacar a marca */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-right: 1px solid var(--border);
        }

        #logoSistema { 
            width: 100%;
            max-width: 280px; /* Limite muito maior para a imagem */
            max-height: 140px; 
            object-fit: contain; 
            display: none; 
        }

        #iconePadrao { 
            font-size: 64px; 
            color: var(--primary); 
            font-variation-settings: 'FILL' 1;
        }

        /* 🌟 LADO DIREITO: FORMULÁRIO COMPACTO */
        .login-right {
            flex: 1.1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-right-header {
            margin-bottom: 24px;
            text-align: center;
        }
        .login-right-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }
        .login-right-header p {
            margin: 4px 0 0 0;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .form-group { margin-bottom: 12px; } /* Campos mais próximos */
        .form-label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 11px; color: var(--text-muted); }
        
        .form-control { 
            width: 100%; 
            padding: 10px 14px; /* Caixas menores */
            border: 1px solid var(--border); 
            border-radius: 12px; 
            font-size: 13px; 
            box-sizing: border-box; 
            background-color: #ffffff;
            color: var(--text-main);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .form-control:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 2px rgba(11, 87, 208, 0.15);
        }

        .btn-login { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 10px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            margin-top: 16px; 
            border-radius: 50px; 
            transition: 0.2s; 
        }
        .btn-login:hover { background-color: #0842a0; box-shadow: 0 2px 8px rgba(11, 87, 208, 0.25); }
        
        .link-senha { 
            display: block; 
            text-align: center; 
            margin-top: 16px; 
            color: var(--primary); 
            text-decoration: none; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 600;
        }
        .link-senha:hover { text-decoration: underline; color: #0842a0; }

        /* 📱 RESPONSIVIDADE: Empilha em telas pequenas */
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 380px;
            }
            .login-left {
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 30px;
            }
            .login-right {
                padding: 30px;
            }
            #logoSistema { max-height: 100px; }
        }
        
        /* SWEETALERT DESIGN (INALTERADO) */
        div:where(.swal2-container) div:where(.swal2-popup) { width: 340px !important; padding: 24px !important; border-radius: 24px !important; border: none !important; box-shadow: 0 10px 30px rgba(0,0,0,0.1) !important; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important; }
        div:where(.swal2-container) h2:where(.swal2-title) { font-size: 18px !important; font-weight: 600 !important; color: var(--text-main) !important; margin: 0 0 8px 0 !important; }
        div:where(.swal2-container) div:where(.swal2-html-container) { font-size: 14px !important; color: var(--text-muted) !important; margin: 8px 0 20px 0 !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm { border-radius: 50px !important; font-size: 14px !important; font-weight: 600 !important; padding: 10px 24px !important; width: auto !important; background-color: var(--primary) !important; border: none !important; }
        div:where(.swal2-container) button:where(.swal2-styled).swal2-confirm:hover { background-color: #0842a0 !important; }
        div:where(.swal2-container) .swal2-icon { transform: scale(0.7) !important; margin: 0 auto 16px auto !important; }
    </style>
</head>
<body>
    
    <div class="login-wrapper">
        <!-- LADO ESQUERDO: LOGOTIPO -->
        <div class="login-left">
            <img id="logoSistema" src="" alt="Logo do Sistema">
            <span id="iconePadrao" class="material-symbols-outlined">admin_panel_settings</span>
        </div>

        <!-- LADO DIREITO: FORMULÁRIO COMPACTO -->
        <div class="login-right">
            <div class="login-right-header">
                <h3>Acesso Restrito</h3>
                <p>Identifique-se para continuar</p>
            </div>
            
            <form id="formLogin" onsubmit="event.preventDefault(); window.fazerLogin();">
                <div class="form-group">
                    <label class="form-label">Código EOL da Unidade</label>
                    <input type="text" class="form-control" id="id_unidade" placeholder="Ex: 700038" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                </div>
                <div class="form-group">
                    <label class="form-label">RF do Servidor</label>
                    <input type="text" class="form-control" id="rf_usuario" placeholder="Apenas números" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha de Acesso</label>
                    <input type="password" class="form-control" id="senha_usuario" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <a class="link-senha" onclick="window.recuperarSenha()">Esqueceu sua senha?</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
            authDomain: "sig-edu.firebaseapp.com",
            projectId: "sig-edu",
            storageBucket: "sig-edu.firebasestorage.app",
            messagingSenderId: "233239725278",
            appId: "1:233239725278:web:809b9c42feacd99175ee4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        localStorage.clear();

        // 🌟 BUSCA APENAS O LOGO (O nome em texto foi removido da tela)
        async function carregarConfiguracoes() {
            try {
                const configRef = collection(db, "configuracoes");
                const configSnapshot = await getDocs(configRef);
                
                let logoEncontrada = null;
                let nomeParaTituloAba = "SIG-EDU Central";
                
                if (!configSnapshot.empty) {
                    configSnapshot.forEach((doc) => {
                        const dados = doc.data();
                        if (dados.logoUrl) logoEncontrada = dados.logoUrl;
                        if (dados.nomeSistema) nomeParaTituloAba = dados.nomeSistema;
                    });
                }
                
                document.title = "Login - " + nomeParaTituloAba;
                
                if (logoEncontrada) {
                    const imgLogo = document.getElementById('logoSistema');
                    imgLogo.src = logoEncontrada;
                    imgLogo.style.display = 'block';
                    document.getElementById('iconePadrao').style.display = 'none'; 
                }
                
            } catch (erro) {
                console.error("Erro ao carregar configurações do Firebase:", erro);
                document.title = "Login - Sistema CEU";
            }
        }

        carregarConfiguracoes();

        window.fazerLogin = async function() {
            const unidade = document.getElementById('id_unidade').value.trim();
            const rf = document.getElementById('rf_usuario').value.trim();
            const senha = document.getElementById('senha_usuario').value.trim();

            if(!unidade || !rf || !senha) {
                Swal.fire({ icon: 'warning', title: 'Atenção', text: 'Por favor, preencha todos os campos.' });
                return;
            }

            Swal.fire({
                title: 'Validando...',
                text: 'Conectando ao servidor seguro.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const usuariosRef = collection(db, "usuarios");
                const q = query(usuariosRef, 
                    where("id_unidade", "==", unidade),
                    where("rf_usuario", "==", rf)
                );
                
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'Credenciais não encontradas ou Unidade incorreta.' });
                    return;
                }

                let usuarioValido = false;
                let dadosUsuario = null;

                querySnapshot.forEach((documento) => {
                    const dados = documento.data();
                    if (dados.senha_usuario === senha) {
                        usuarioValido = true;
                        dadosUsuario = dados;
                    }
                });

                if (!usuarioValido) {
                    Swal.fire({ icon: 'error', title: 'Acesso Negado', text: 'A senha informada está incorreta.' });
                    return;
                }

                localStorage.setItem('sig_rf', dadosUsuario.rf_usuario); 
                localStorage.setItem('sig_id_unidade', dadosUsuario.id_unidade);
                localStorage.setItem('sig_nivel_acesso', dadosUsuario.id_nivel_acesso);
                localStorage.setItem('sig_nome', dadosUsuario.nome_usuario);
                localStorage.setItem('sig_email', dadosUsuario.email_usuario || "");
                localStorage.setItem('sig_foto', dadosUsuario.url_foto || "");
                
                window.location.href = "dashboard_FB.html";

            } catch (erro) {
                Swal.fire({ icon: 'error', title: 'Erro de Conexão', text: 'Falha ao conectar no banco de dados.' });
                console.error(erro);
            }
        };

        window.recuperarSenha = function() {
            Swal.fire({
                title: 'Recuperação de Senha',
                text: 'Por favor, contate o Administrador de TI da sua Regional para solicitar uma nova credencial de acesso.',
                icon: 'info',
                confirmButtonText: 'Entendido'
            });
        };
    </script>
</body>
</html>
