<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de QR Code da carteirinha</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root { --azul:#0d6efd; --azul-esc:#0a58ca; --verde:#198754; --texto:#2c3e50; --suave:#6c757d; --borda:#dee2e6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',Tahoma,sans-serif; color:var(--texto); background:#f0f2f5; min-height:100vh; display:flex; flex-direction:column; }
  header { background:linear-gradient(135deg,var(--azul),var(--azul-esc)); color:#fff; padding:14px 18px; font-size:17px; font-weight:700; }
  main { flex:1; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:560px; width:100%; margin:0 auto; }
  .camera { position:relative; border-radius:12px; overflow:hidden; background:#111; aspect-ratio:4/3; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .mira { position:absolute; inset:18% 26%; border:3px solid rgba(255,255,255,.9); border-radius:14px; box-shadow:0 0 0 999px rgba(0,0,0,.35); pointer-events:none; }
  #status { margin:0; font-size:15px; text-align:center; min-height:22px; }
  #status.erro { color:#dc3545; font-weight:600; }
  .resultado { display:none; background:#fff; border-radius:12px; padding:18px; text-align:center; border:2px solid var(--verde); }
  .resultado small { color:var(--suave); display:block; margin-bottom:6px; }
  .resultado strong { display:block; font-size:28px; color:var(--azul); word-break:break-all; margin-bottom:8px; }
  .resultado p { margin:0 0 12px; font-size:14px; }
  .manual { background:#fff; border-radius:12px; padding:14px; border:1px solid var(--borda); }
  .manual label { display:block; font-size:13px; color:var(--suave); margin-bottom:6px; }
  .linha { display:flex; gap:8px; }
  input { flex:1; padding:10px 12px; border:1px solid var(--borda); border-radius:8px; font-size:16px; }
  input:focus { outline:3px solid rgba(13,110,253,.25); border-color:var(--azul); }
  button { border:0; border-radius:8px; padding:10px 16px; font-size:15px; font-weight:700; cursor:pointer; color:#fff; background:var(--azul); }
  button:hover { background:var(--azul-esc); }
  button.sec { background:#6c757d; }
  button:focus-visible { outline:3px solid rgba(13,110,253,.4); outline-offset:2px; }
  .acoes { display:flex; gap:8px; justify-content:center; }
</style>
</head>
<body>
<header>Ler QR Code da carteirinha</header>
<main>
  <div class="camera" id="areaCamera"><video id="video" autoplay muted playsinline></video><div class="mira"></div></div>
  <p id="status">Abrindo a câmera...</p>

  <div class="resultado" id="resultado">
    <small>Prontuário lido</small>
    <strong id="valorLido"></strong>
    <p id="msgResultado"></p>
    <div class="acoes"><button id="btnCopiar">Copiar número</button><button class="sec" id="btnOutro">Ler outro</button></div>
  </div>

  <div class="manual" id="manual">
    <label for="campoManual">Sem leitura? Digite o prontuário</label>
    <div class="linha"><input id="campoManual" autocomplete="off" placeholder="Número do prontuário"><button id="btnManual">Enviar</button></div>
  </div>
  <div class="acoes"><button class="sec" id="btnFechar">Cancelar</button></div>
</main>

<script>
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const detector = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  let stream = null, ativo = false, enviado = false;

  function setStatus(txt, erro) { statusEl.textContent = txt; statusEl.className = erro ? 'erro' : ''; }

  async function iniciar() {
    enviado = false;
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('areaCamera').style.display = 'block';
    document.getElementById('manual').style.display = 'block';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setStatus('Este navegador não permite usar a câmera. Digite o prontuário abaixo.', true); return; }
    if (!detector && typeof jsQR !== 'function') { setStatus('Leitor indisponível. Verifique a internet ou digite o prontuário abaixo.', true); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream;
      await video.play();
      ativo = true;
      setStatus('Aponte a câmera para o QR Code da carteirinha.');
      ler();
    } catch (e) {
      setStatus('Não foi possível abrir a câmera. Permita o acesso pelo cadeado da barra de endereço e feche e abra esta janela de novo.', true);
    }
  }

  async function ler() {
    if (!ativo) return;
    try {
      let valor = '';
      if (video.readyState >= 2 && video.videoWidth) {
        if (detector) {
          const achados = await detector.detect(video);
          if (achados.length) valor = achados[0].rawValue;
        } else {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const c = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
          if (c) valor = c.data;
        }
      }
      valor = (valor || '').trim();
      if (valor) { enviar(valor); return; }
    } catch (e) { /* tenta o próximo quadro */ }
    setTimeout(ler, 150);
  }

  function parar() {
    ativo = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
  }

  function enviar(valor) {
    if (enviado) return;
    enviado = true;
    parar();
    document.getElementById('areaCamera').style.display = 'none';
    document.getElementById('manual').style.display = 'none';
    document.getElementById('valorLido').textContent = valor;
    document.getElementById('resultado').style.display = 'block';
    setStatus('');
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ tipo: 'qr', valor: valor }, '*');
      document.getElementById('msgResultado').textContent = 'Enviado ao cadastro.';
      setTimeout(() => window.close(), 700);
    } else {
      document.getElementById('msgResultado').textContent = 'Não foi possível enviar ao cadastro. Copie o número e cole na busca.';
    }
  }

  document.getElementById('btnManual').onclick = () => { const v = document.getElementById('campoManual').value.trim(); if (v) enviar(v); };
  document.getElementById('campoManual').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnManual').click(); });
  document.getElementById('btnCopiar').onclick = () => { const v = document.getElementById('valorLido').textContent; if (navigator.clipboard) navigator.clipboard.writeText(v); setStatus('Número copiado.'); };
  document.getElementById('btnOutro').onclick = iniciar;
  document.getElementById('btnFechar').onclick = () => { parar(); window.close(); };
  window.addEventListener('beforeunload', parar);
  iniciar();
</script>
</body>
</html>
