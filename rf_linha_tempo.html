<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo - Recreio nas Férias</title>
    <style>
        :root { --primary: #0056b3; --bg-color: #f4f7f6; --box-bg: #ffffff; --text: #333333; --border: #ccc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text); padding: 20px; }
        
        .container { background-color: var(--box-bg); padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto 20px auto; }
        h2 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0;}
        
        /* Painel de Impressão */
        .painel-impressao { background-color: #e9ecef; border-left: 5px solid var(--primary); padding: 15px; display: flex; align-items: center; justify-content: space-between; border-radius: 4px; margin-bottom: 30px; }
        .painel-impressao p { margin: 0; font-weight: bold; color: var(--text); }
        
        fieldset { border: 1px solid var(--border); border-radius: 5px; padding: 15px; margin-bottom: 15px; background-color: #fafafa; }
        legend { font-weight: bold; color: var(--primary); background: #fff; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
        .full-width { grid-column: 1 / -1; }
        
        label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button { padding: 10px 20px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .btn-salvar { background-color: #28a745; width: 100%; padding: 15px;}
        .btn-salvar:hover { background-color: #218838; }
        .btn-imprimir { background-color: var(--primary); padding: 12px 25px; }
        .btn-imprimir:hover { background-color: #004494; }

        /* CSS DE IMPRESSÃO A4 */
        #area_impressao { display: none; }
        @media print {
            .no-print { display: none !important; }
            #area_impressao { display: block !important; }
            @page { size: A4 landscape; margin: 10mm; }
            body { padding: 0; background-color: #fff; }
            
            .pagina-a4 { page-break-after: always; margin-bottom: 20px; }
            .pagina-a4 h2 { font-size: 18px; text-align: center; border: none; margin-bottom: 15px; }
            
            .tabela-timeline { width: 100%; border-collapse: collapse; text-align: center; font-family: Arial, sans-serif; }
            .tabela-timeline th, .tabela-timeline td { border: 1px solid #000; padding: 6px; font-size: 12px; }
            .tabela-timeline th { background-color: #f0f0f0; font-weight: bold; text-transform: uppercase; }
            .tabela-timeline td:first-child { font-weight: bold; width: 60px; background-color: #f9f9f9; }
        }
    </style>
</head>
<body>

<!-- MÓDULO 1: PAINEL DE IMPRESSÃO GERAL -->
<div class="container no-print painel-impressao">
    <p>Gere todas as Linhas do Tempo das turmas cadastradas com um clique.</p>
    <button type="button" class="btn-imprimir" id="btnImprimirMenu">🖨️ Imprimir Relatório Completo (A4)</button>
</div>

<!-- MÓDULO 2: FORMULÁRIO DE CADASTRO -->
<div class="container no-print">
    <h2>Cadastrar/Editar Cronograma</h2>
    <form id="formTimeline">
        
        <div class="form-grid full-width" style="margin-bottom: 20px;">
            <div>
                <label>Turma <span id="load_turma" style="font-size: 0.8em; color: gray;"></span></label>
                <select id="turma" required><option value="">Selecione...</option></select>
            </div>
            <div>
                <label>Data do Programa</label>
                <input type="date" id="data_atividade" required>
            </div>
        </div>

        <fieldset>
            <legend>1. Chegada e Acolhimento</legend>
            <div class="form-grid">
                <div>
                    <label>Horário da Chegada</label>
                    <select id="hora_chegada" class="hora-select"><option value="">Selecione...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>2. Refeições</legend>
            <div class="form-grid">
                <div>
                    <label>Café (Prédio Ex: CEI, EMEI)</label>
                    <input type="text" id="predio_cafe">
                </div>
                <div>
                    <label>Horário do Café</label>
                    <select id="hora_cafe" class="hora-select"><option value="">Selecione...</option></select>
                </div>

                <div>
                    <label>Almoço (Prédio Ex: CEI, EMEF)</label>
                    <input type="text" id="predio_almoco">
                </div>
                <div>
                    <label>Horário do Almoço</label>
                    <select id="hora_almoco" class="hora-select"><option value="">Selecione...</option></select>
                </div>

                <div>
                    <label>Lanche (Prédio Ex: CEI, EMEF)</label>
                    <input type="text" id="predio_lanche">
                </div>
                <div>
                    <label>Horário do Lanche</label>
                    <select id="hora_lanche" class="hora-select"><option value="">Selecione...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>3. Eventos / Passeios / Atrações</legend>
            <div class="form-grid">
                <div class="full-width">
                    <label>Atração Interna ou Passeio Externo <span id="load_evento" style="font-size: 0.8em; color: gray;"></span></label>
                    <select id="evento_interno">
                        <option value="">Nenhum evento selecionado...</option>
                        <!-- Os optgroups injetados dinamicamente via JS -->
                    </select>
                </div>
                <div>
                    <label>Horário de Início (Para alinhar na tabela)</label>
                    <select id="hora_evento" class="hora-select"><option value="">Selecione...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>4. Saída</legend>
            <div class="form-grid">
                <div>
                    <label>Horário da Saída</label>
                    <select id="hora_saida" class="hora-select"><option value="">Selecione...</option></select>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="btn-salvar" id="btnSalvar">Salvar Cronograma no Banco</button>
    </form>
</div>

<!-- ÁREA DE IMPRESSÃO -->
<div id="area_impressao"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, collection, getDocs, setDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
        authDomain: "sig-edu.firebaseapp.com",
        projectId: "sig-edu",
        storageBucket: "sig-edu.firebasestorage.app",
        messagingSenderId: "233239725278",
        appId: "1:233239725278:web:809b9c42feacd99175ee4f",
        measurementId: "G-E5LLYGW7DN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ceuLogado = "CEU Caminho do Mar";

    const gradeHorarios = ['08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];

    document.querySelectorAll('.hora-select').forEach(select => {
        gradeHorarios.forEach(h => {
            const opt = document.createElement('option'); opt.value = h; opt.textContent = h;
            select.appendChild(opt);
        });
    });

    async function inicializarDados() {
        // Carregar Turmas
        try {
            const snapTurmas = await getDocs(collection(db, "rf_inscricoes"));
            const turmasSet = new Set();
            snapTurmas.forEach(doc => { if (doc.data().turma) turmasSet.add(doc.data().turma); });
            const comboTurma = document.getElementById('turma');
            Array.from(turmasSet).sort().forEach(t => {
                const opt = document.createElement('option'); opt.value = t; opt.textContent = t;
                comboTurma.appendChild(opt);
            });
        } catch(e) { console.error(e); }

        // Carregar Eventos e Passeios
        const comboEvento = document.getElementById('evento_interno');
        try {
            const snapPasseios = await getDocs(collection(db, "rf_passeios"));
            if (!snapPasseios.empty) {
                const grupoPasseios = document.createElement('optgroup'); grupoPasseios.label = "Passeios Externos";
                snapPasseios.forEach(doc => {
                    const d = doc.data();
                    const opt = document.createElement('option');
                    opt.value = `PASSEIO: ${d.passeio} (Saída: ${d.saidaCeu} / Volta: ${d.chegadaCeu})`;
                    opt.textContent = opt.value;
                    grupoPasseios.appendChild(opt);
                });
                comboEvento.appendChild(grupoPasseios);
            }

            const qAtracoes = query(collection(db, "rf_atracoes"), where("ceus", "==", ceuLogado));
            const snapAtracoes = await getDocs(qAtracoes);
            if (!snapAtracoes.empty) {
                const grupoAtracoes = document.createElement('optgroup'); grupoAtracoes.label = "Atrações Internas";
                snapAtracoes.forEach(doc => {
                    const d = doc.data();
                    const opt = document.createElement('option');
                    const dicaHorario = d.horario ? ` | Horário: ${d.horario}` : '';
                    opt.value = `ATRAÇÃO: ${d.titulo} - ${d.local}${dicaHorario}`;
                    opt.textContent = opt.value;
                    grupoAtracoes.appendChild(opt);
                });
                comboEvento.appendChild(grupoAtracoes);
            }
        } catch(e) { console.error(e); }
    }

    // SALVAR DADOS
    document.getElementById('formTimeline').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = document.getElementById('data_atividade').value;
        const turma = document.getElementById('turma').value;
        
        const cronograma = {};
        const add = (id, txt) => { const v = document.getElementById(id).value; if(v) cronograma[v] = txt; };

        add('hora_chegada', 'Chegada e Acolhimento');
        add('hora_cafe', `Café (${document.getElementById('predio_cafe').value || '?'})`);
        add('hora_almoco', `Almoço (${document.getElementById('predio_almoco').value || '?'})`);
        add('hora_lanche', `Lanche (${document.getElementById('predio_lanche').value || '?'})`);
        if (document.getElementById('evento_interno').value) add('hora_evento', document.getElementById('evento_interno').value);
        add('hora_saida', 'Saída');

        const docId = `${turma}_${data}`;
        try {
            await setDoc(doc(db, "rf_linha_tempo", docId), { data, turma, ceu: ceuLogado, cronograma });
            alert(`Salvo para a turma ${turma} no dia ${data.split('-').reverse().join('/')}!`);
            document.getElementById('formTimeline').reset();
            document.getElementById('turma').value = turma; // Facilita manter a turma para preencher o próximo dia
        } catch(e) { alert("Erro ao salvar."); console.error(e); }
    });

    // LÓGICA DE IMPRESSÃO CORRIGIDA (Eixo X = Dias / Eixo Y = Horários)
    document.getElementById('btnImprimirMenu').addEventListener('click', async function() {
        const btn = this; btn.textContent = "Buscando e processando dados...";
        
        try {
            // 1. Busca todos os cronogramas do CEU
            const qImpressao = query(collection(db, "rf_linha_tempo"), where("ceu", "==", ceuLogado));
            const snapshot = await getDocs(qImpressao);
            
            if(snapshot.empty) {
                btn.textContent = "🖨️ Imprimir Relatório Completo (A4)";
                return alert("Nenhum dado cadastrado para este CEU.");
            }

            // 2. Organiza os dados no formato: dadosPorTurma["4A"]["2026-07-15"]["08:30"]
            const dadosPorTurma = {};
            snapshot.forEach(doc => {
                const d = doc.data();
                if (!dadosPorTurma[d.turma]) dadosPorTurma[d.turma] = {};
                dadosPorTurma[d.turma][d.data] = d.cronograma;
            });

            const turmas = Object.keys(dadosPorTurma).sort();
            const diasPorPagina = 6; // Limite de colunas (dias) para não estourar a folha A4
            let htmlFinal = "";

            // 3. Monta as páginas Turma por Turma
            turmas.forEach(turma => {
                const diasCadastrados = Object.keys(dadosPorTurma[turma]).sort();
                
                // Se a turma tem muitos dias, fatiamos as colunas em mais de uma página
                for (let i = 0; i < diasCadastrados.length; i += diasPorPagina) {
                    const diasLote = diasCadastrados.slice(i, i + diasPorPagina);
                    
                    htmlFinal += `<div class="pagina-a4">`;
                    htmlFinal += `<h2>${ceuLogado} - Linha do Tempo - Turma ${turma}</h2>`;
                    htmlFinal += `<table class="tabela-timeline"><thead><tr><th>Horário</th>`;
                    
                    // Cabeçalho das Colunas (Dias formatados para DD/MM)
                    diasLote.forEach(dia => {
                        const partes = dia.split('-'); // ex: 2026-07-15
                        htmlFinal += `<th>${partes[2]}/${partes[1]}</th>`; 
                    });
                    htmlFinal += `</tr></thead><tbody>`;

                    // Linhas da Tabela (Horários)
                    gradeHorarios.forEach(hora => {
                        htmlFinal += `<tr><td>${hora}</td>`;
                        diasLote.forEach(dia => {
                            const atividade = dadosPorTurma[turma][dia][hora] || '';
                            htmlFinal += `<td>${atividade}</td>`;
                        });
                        htmlFinal += `</tr>`;
                    });

                    htmlFinal += `</tbody></table></div>`;
                }
            });

            // 4. Injeta na tela e chama a impressão
            document.getElementById('area_impressao').innerHTML = htmlFinal;
            window.print();
            
        } catch(e) { 
            alert("Erro na impressão."); 
            console.error(e); 
        } finally { 
            btn.textContent = "🖨️ Imprimir Relatório Completo (A4)"; 
        }
    });

    window.onload = inicializarDados;
</script>
</body>
</html>
