<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo - Recreio nas Férias</title>
    <style>
        :root { --primary: #0056b3; --bg-color: #f4f7f6; --box-bg: #ffffff; --text: #333333; --border: #ccc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text); padding: 20px; }
        
        .container { background-color: var(--box-bg); padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto 20px auto; }
        h2 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0;}
        
        .painel-controle { background-color: #e9ecef; border-left: 5px solid var(--primary); padding: 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; border-radius: 4px; margin-bottom: 30px; gap: 15px; }
        .painel-controle p { margin: 0 0 10px 0; font-weight: bold; width: 100%; font-size: 1.1em;}
        
        fieldset { border: 1px solid var(--border); border-radius: 5px; padding: 15px; margin-bottom: 15px; background-color: #fafafa; }
        legend { font-weight: bold; color: var(--primary); background: #fff; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
        .full-width { grid-column: 1 / -1; }
        
        label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .btn-salvar { background-color: #28a745; width: 100%; padding: 15px; margin-bottom: 10px;}
        .btn-salvar:hover { background-color: #218838; }
        .btn-visualizar { background-color: var(--primary); flex: 1;}
        .btn-visualizar:hover { background-color: #004494; }
        .btn-limpar { background-color: #dc3545; }
        .btn-limpar:hover { background-color: #c82333; }
        .btn-imprimir { background-color: #333; display: none; margin-top: 15px; width: 100%; padding: 15px;}

        .btn-buscar-salvos { background-color: #17a2b8; width: 100%; padding: 12px; margin-bottom: 10px; }
        .btn-buscar-salvos:hover { background-color: #138496; }
        .lista-atividades li { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 4px; }
        .btn-deletar-item { background-color: #dc3545; font-size: 0.8em; padding: 6px 12px; }

        #relatorio_visivel { display: none; max-width: 100%; overflow-x: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .pagina-a4 { margin-bottom: 40px; border-bottom: 2px dashed #ccc; padding-bottom: 20px;}
        .cabecalho-dia { font-size: 18px; text-align: center; font-weight: bold; color: #333; margin-bottom: 15px; text-transform: uppercase; }
        
        .tabela-timeline { width: 100%; border-collapse: collapse; text-align: center; }
        .tabela-timeline th { border: 1px solid #555; padding: 6px; font-size: 13px; }
        .tabela-timeline td { border: 1px solid #ccc; padding: 2px; }
        .tabela-timeline td:first-child, .tabela-timeline th:first-child { font-weight: bold; width: 60px; background-color: #e9ecef; border: 1px solid #555;}
        
        .tabela-timeline tbody tr:nth-child(even) { background-color: #fcfcfc; }

        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            #relatorio_visivel { display: block !important; box-shadow: none; padding: 0; }
            @page { size: A4 landscape; margin: 5mm; }
            body { padding: 0; background-color: #fff; margin: 0; }
            .pagina-a4 { page-break-after: always; border: none; margin-bottom: 0; padding-bottom: 0;}
            .pagina-a4:last-of-type { page-break-after: auto; }
            .tabela-timeline th { padding: 4px; font-size: 11px; line-height: 1.1; }
        }
    </style>
</head>
<body>

<div class="container no-print painel-controle">
    <p>Painel de Controle do Relatório</p>
    <button type="button" class="btn-visualizar" id="btnVisualizar">👁️ Visualizar Grade na Tela</button>
    <button type="button" class="btn-limpar" id="btnLimpar">🗑️ Limpar Dados (IRREVERSÍVEL!)</button>
</div>

<div class="container no-print">
    <h2>Cadastrar / Adicionar Atividades</h2>
    
    <div class="form-grid full-width" style="margin-bottom: 20px;">
        <div>
            <label>Data do Programa</label>
            <input type="date" id="data_atividade" required form="formTimeline">
        </div>
        <div>
            <label>Turma <span id="load_turma" style="font-size: 0.8em; color: gray;"></span></label>
            <select id="turma" required form="formTimeline"><option value="">Selecione...</option></select>
        </div>
    </div>

    <!-- GERENCIADOR DE ATIVIDADES -->
    <fieldset style="background-color: #eef2f5; border-color: #b8c2cc;">
        <legend style="background-color: #17a2b8; color: white;">Gerenciar / Excluir Atividades</legend>
        <div class="full-width">
            <button type="button" class="btn-buscar-salvos" id="btnBuscarSalvos">🔍 Ver Atividades Salvas (Data + Turma)</button>
        </div>
        <div id="box_atividades_salvas" class="full-width" style="display: none; margin-top: 15px;">
            <ul id="ul_atividades" class="lista-atividades" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>
    </fieldset>

    <form id="formTimeline">
        <fieldset>
            <legend>1. Chegada e Refeições</legend>
            <div class="form-grid">
                <div><label>Horário Chegada</label><select id="hora_chegada" class="hora-select"><option value="">Nenhum...</option></select></div>
                <div><label>Fim (Opcional)</label><select id="hora_chegada_fim" class="hora-select"><option value="">Nenhum...</option></select></div>
                
                <div><label>Prédio Café</label><input type="text" id="predio_cafe"></div>
                <div style="display: flex; gap: 5px;">
                    <div style="flex: 1;"><label>Início</label><select id="hora_cafe" class="hora-select"><option value="">Nenhum...</option></select></div>
                    <div style="flex: 1;"><label>Fim</label><select id="hora_cafe_fim" class="hora-select"><option value="">Nenhum...</option></select></div>
                </div>
                
                <div><label>Prédio Almoço</label><input type="text" id="predio_almoco"></div>
                <div style="display: flex; gap: 5px;">
                    <div style="flex: 1;"><label>Início</label><select id="hora_almoco" class="hora-select"><option value="">Nenhum...</option></select></div>
                    <div style="flex: 1;"><label>Fim</label><select id="hora_almoco_fim" class="hora-select"><option value="">Nenhum...</option></select></div>
                </div>
                
                <div><label>Prédio Lanche da Tarde</label><input type="text" id="predio_lanche"></div>
                <div style="display: flex; gap: 5px;">
                    <div style="flex: 1;"><label>Início</label><select id="hora_lanche" class="hora-select"><option value="">Nenhum...</option></select></div>
                    <div style="flex: 1;"><label>Fim</label><select id="hora_lanche_fim" class="hora-select"><option value="">Nenhum...</option></select></div>
                </div>
            </div>
        </fieldset>

        <fieldset style="border-color: #0056b3;">
            <legend style="background: #0056b3; color: white;">2. Passeios Externos e Atrações Internas</legend>
            
            <div class="form-grid" style="background: #f0f8ff; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                <div class="full-width" style="color: #0056b3;"><strong>🚍 PASSEIO EXTERNO</strong></div>
                <div class="full-width">
                    <label>Selecione o Passeio</label>
                    <select id="passeio_externo"><option value="">Nenhum Passeio selecionado...</option></select>
                </div>
                <div><label>Horário Início</label><select id="hora_passeio" class="hora-select"><option value="">Nenhum...</option></select></div>
                <div><label>Horário Término</label><select id="hora_passeio_fim" class="hora-select"><option value="">Nenhum...</option></select></div>
            </div>

            <div class="form-grid" style="background: #fdf5ff; padding: 10px; border-radius: 5px;">
                <div class="full-width" style="color: #6a0dad;"><strong>🎭 ATRAÇÃO INTERNA</strong></div>
                <div class="full-width">
                    <label>Selecione a Atração</label>
                    <select id="atracao_interna"><option value="">Nenhuma Atração selecionada...</option></select>
                </div>
                <div><label>Horário Início</label><select id="hora_atracao" class="hora-select"><option value="">Nenhum...</option></select></div>
                <div><label>Horário Término</label><select id="hora_atracao_fim" class="hora-select"><option value="">Nenhum...</option></select></div>
            </div>
        </fieldset>
        
        <fieldset>
            <legend>3. Saída</legend>
            <div class="form-grid">
                <div><label>Horário da Saída</label><select id="hora_saida" class="hora-select"><option value="">Nenhum...</option></select></div>
            </div>
        </fieldset>

        <button type="submit" class="btn-salvar" id="btnSalvar">Adicionar à Grade da Turma</button>
    </form>
</div>

<div id="relatorio_visivel"></div>
<button type="button" class="btn-imprimir no-print" id="btnImprimir" style="max-width: 900px; margin: 20px auto;">🖨️ Enviar para Impressora (A4)</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, setDoc, deleteDoc, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
        authDomain: "sig-edu.firebaseapp.com",
        projectId: "sig-edu",
        storageBucket: "sig-edu.firebasestorage.app",
        messagingSenderId: "233239725278",
        appId: "1:233239725278:web:809b9c42feacd99175ee4f",
        measurementId: "G-E5LLYGW7DN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ceuLogado = "CEU Caminho do Mar";

    const gradeHorarios = ['08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];
    const coresCabecalhos = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8baff', '#f4c2c2', '#dcd0ff'];

    document.querySelectorAll('.hora-select').forEach(select => {
        gradeHorarios.forEach(h => {
            const opt = document.createElement('option'); opt.value = h; opt.textContent = h;
            select.appendChild(opt);
        });
    });

    async function inicializarDados() {
        try {
            const snapTurmas = await getDocs(collection(db, "rf_inscricoes"));
            const turmasSet = new Set();
            snapTurmas.forEach(doc => { if (doc.data().turma) turmasSet.add(doc.data().turma); });
            const comboTurma = document.getElementById('turma');
            Array.from(turmasSet).sort().forEach(t => {
                const opt = document.createElement('option'); opt.value = t; opt.textContent = t;
                comboTurma.appendChild(opt);
            });
        } catch(e) { console.error("Erro nas turmas:", e); }

        try {
            const snapPasseios = await getDocs(collection(db, "rf_passeios"));
            const comboPasseio = document.getElementById('passeio_externo');
            snapPasseios.forEach(doc => {
                const d = doc.data();
                const opt = document.createElement('option');
                opt.value = `PASSEIO: ${d.passeio}`;
                opt.textContent = `${d.passeio} (Destino: ${d.destino || '-'})`;
                comboPasseio.appendChild(opt);
            });
        } catch(e) { console.error("Erro nos passeios:", e); }

        try {
            const snapAtracoes = await getDocs(collection(db, "rf_atracoes"));
            const comboAtracao = document.getElementById('atracao_interna');
            snapAtracoes.forEach(doc => {
                const d = doc.data();
                const opt = document.createElement('option');
                opt.value = `ATRAÇÃO: ${d.titulo} - Local: ${d.local}`;
                opt.textContent = `${d.titulo} (Local: ${d.local || '-'})`;
                comboAtracao.appendChild(opt);
            });
        } catch(e) { console.error("Erro nas atrações:", e); }
    }

    document.getElementById('btnBuscarSalvos').addEventListener('click', async function() {
        const data = document.getElementById('data_atividade').value;
        const turma = document.getElementById('turma').value;
        
        if(!data || !turma) return alert("Selecione a Data e a Turma acima primeiro!");
        
        this.textContent = "Buscando...";
        const ul = document.getElementById('ul_atividades');
        ul.innerHTML = '';
        
        try {
            const docRef = doc(db, "rf_linha_tempo", `${data}_${turma}`);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists() && docSnap.data().eventos && docSnap.data().eventos.length > 0) {
                const eventos = docSnap.data().eventos;
                eventos.sort((a, b) => a.inicio.localeCompare(b.inicio));
                
                eventos.forEach(evt => {
                    ul.innerHTML += `
                        <li>
                            <span><strong>${evt.inicio} às ${evt.fim}</strong>: ${evt.texto}</span>
                            <button type="button" class="btn-deletar-item" data-id="${evt.id}">🗑️ Excluir</button>
                        </li>
                    `;
                });
            } else {
                ul.innerHTML = '<li>Nenhuma atividade cadastrada.</li>';
            }
            document.getElementById('box_atividades_salvas').style.display = 'block';
        } catch(e) {
            console.error(e);
        } finally {
            this.textContent = "🔍 Ver Atividades Salvas (Data + Turma)";
        }
    });

    document.getElementById('ul_atividades').addEventListener('click', async function(e) {
        if (e.target.classList.contains('btn-deletar-item')) {
            const idEvento = e.target.getAttribute('data-id');
            const data = document.getElementById('data_atividade').value;
            const turma = document.getElementById('turma').value;
            
            if(confirm(`Tem certeza que deseja excluir esta atividade?`)) {
                e.target.textContent = "Apagando...";
                try {
                    const docRef = doc(db, "rf_linha_tempo", `${data}_${turma}`);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        let eventos = docSnap.data().eventos || [];
                        eventos = eventos.filter(evt => evt.id !== idEvento);
                        await updateDoc(docRef, { eventos: eventos });
                        document.getElementById('btnBuscarSalvos').click();
                    }
                } catch(error) {}
            }
        }
    });

    document.getElementById('btnLimpar').addEventListener('click', async function() {
        if(confirm("Deseja APAGAR TODOS os registros da Linha do Tempo e começar do zero?")) {
            this.textContent = "Apagando...";
            try {
                const snap = await getDocs(collection(db, "rf_linha_tempo"));
                snap.forEach(async (documento) => {
                    await deleteDoc(doc(db, "rf_linha_tempo", documento.id));
                });
                alert("Banco limpo!");
                document.getElementById('relatorio_visivel').style.display = 'none';
                document.getElementById('btnImprimir').style.display = 'none';
                document.getElementById('box_atividades_salvas').style.display = 'none';
            } catch(e) {} finally {
                this.textContent = "🗑️ Limpar Dados (IRREVERSÍVEL!)";
            }
        }
    });

    document.getElementById('formTimeline').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = document.getElementById('data_atividade').value;
        const turma = document.getElementById('turma').value;
        const docId = `${data}_${turma}`;
        const docRef = doc(db, "rf_linha_tempo", docId);
        
        try {
            const docSnap = await getDoc(docRef);
            let eventosExistentes = (docSnap.exists() && docSnap.data().eventos) ? docSnap.data().eventos : [];

            const adicionar = (idInicio, idFim, txt, corFundo) => {
                const horaInicio = document.getElementById(idInicio)?.value;
                if (!horaInicio) return;

                let horaFim = document.getElementById(idFim)?.value;
                if (!horaFim) { 
                    const idx = gradeHorarios.indexOf(horaInicio);
                    horaFim = (idx !== -1 && idx < gradeHorarios.length - 1) ? gradeHorarios[idx + 1] : horaInicio;
                }

                eventosExistentes.push({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    texto: txt,
                    inicio: horaInicio,
                    fim: horaFim,
                    cor: corFundo
                });
            };

            adicionar('hora_chegada', 'hora_chegada_fim', 'Chegada e Acolhimento', '#d4edda');
            adicionar('hora_cafe', 'hora_cafe_fim', `Café (${document.getElementById('predio_cafe').value || '-'})`, '#fff3cd');
            adicionar('hora_almoco', 'hora_almoco_fim', `Almoço (${document.getElementById('predio_almoco').value || '-'})`, '#fff3cd');
            adicionar('hora_lanche', 'hora_lanche_fim', `Lanche (${document.getElementById('predio_lanche').value || '-'})`, '#fff3cd');
            adicionar('hora_saida', null, 'Saída', '#d4edda');

            if (document.getElementById('passeio_externo').value) {
                adicionar('hora_passeio', 'hora_passeio_fim', document.getElementById('passeio_externo').value, '#cce5ff');
            }
            if (document.getElementById('atracao_interna').value) {
                adicionar('hora_atracao', 'hora_atracao_fim', document.getElementById('atracao_interna').value, '#e8baff');
            }

            await setDoc(docRef, { data, turma, ceu: ceuLogado, eventos: eventosExistentes }, { merge: true });
            alert(`Atividade(s) adicionada(s) à grade da turma ${turma}!`);
            
            if (document.getElementById('box_atividades_salvas').style.display === 'block') {
                document.getElementById('btnBuscarSalvos').click();
            }

            document.getElementById('formTimeline').reset();
            document.getElementById('data_atividade').value = data; 
            document.getElementById('turma').value = turma; 
        } catch(e) { alert("Erro ao salvar."); console.error(e);}
    });

    document.getElementById('btnVisualizar').addEventListener('click', async function() {
        const btn = this; 
        btn.textContent = "Montando Grade Inteligente...";
        
        try {
            const qImpressao = query(collection(db, "rf_linha_tempo"), where("ceu", "==", ceuLogado));
            const snapshot = await getDocs(qImpressao);
            
            if(snapshot.empty) {
                btn.textContent = "👁️ Visualizar Grade na Tela";
                return alert("Não há nada cadastrado.");
            }

            const funilDeDias = {};
            
            snapshot.forEach(doc => {
                const d = doc.data();
                if(!d.data || !d.turma) return;
                
                const dia = d.data.substring(0, 10);
                const turma = d.turma.trim().toUpperCase();
                
                if (!funilDeDias[dia]) funilDeDias[dia] = {};
                if (!funilDeDias[dia][turma]) funilDeDias[dia][turma] = [];
                
                if (d.eventos) {
                    funilDeDias[dia][turma] = funilDeDias[dia][turma].concat(d.eventos);
                }
            });

            const diasOrdenados = Object.keys(funilDeDias).sort();
            let htmlFinal = "";

            diasOrdenados.forEach(dia => {
                const dataBR = dia.split('-').reverse().join('/');
                const turmasDesteDia = Object.keys(funilDeDias[dia]).sort();
                
                const maxColunasPorFolha = 7;
                
                for (let i = 0; i < turmasDesteDia.length; i += maxColunasPorFolha) {
                    const loteTurmas = turmasDesteDia.slice(i, i + maxColunasPorFolha);
                    
                    htmlFinal += `<div class="pagina-a4">`;
                    htmlFinal += `<div class="cabecalho-dia">${ceuLogado} - LINHA DO TEMPO - ${dataBR}</div>`;
                    htmlFinal += `<table class="tabela-timeline"><thead><tr><th>Horário</th>`;
                    
                    loteTurmas.forEach((t, index) => {
                        const cor = coresCabecalhos[index % coresCabecalhos.length];
                        htmlFinal += `<th style="background-color: ${cor};">Turma ${t}</th>`; 
                    });
                    htmlFinal += `</tr></thead><tbody>`;

                    gradeHorarios.forEach(hora => {
                        htmlFinal += `<tr style="height: 38px;"><td>${hora}</td>`;
                        
                        loteTurmas.forEach(t => {
                            const atividadesAtivas = (funilDeDias[dia][t] || []).filter(evt => {
                                if (evt.inicio === evt.fim) return evt.inicio === hora;
                                return hora >= evt.inicio && hora < evt.fim;
                            });

                            if (atividadesAtivas.length > 0) {
                                /* O SEGREDO DO PREENCHIMENTO: height: 1px no TD obriga a div interna a esticar 100% da altura da linha */
                                htmlFinal += `<td style="padding: 1px; vertical-align: top; height: 1px;">
                                                <div style="display: flex; gap: 2px; height: 100%; min-height: 36px; align-items: stretch;">`;
                                
                                atividadesAtivas.forEach(evt => {
                                    const isStart = (hora === evt.inicio);
                                    const idxAtual = gradeHorarios.indexOf(hora);
                                    const nextHora = gradeHorarios[idxAtual + 1];
                                    const isEnd = (nextHora === evt.fim || evt.inicio === evt.fim || !nextHora);

                                    let borderRadius = "0";
                                    let borderTop = "none";
                                    let borderBottom = "none";
                                    const borderSides = "1px solid rgba(0,0,0,0.3)";
                                    let content = "&nbsp;"; // Garante que a linha murcha expanda

                                    if (isStart && isEnd) {
                                        borderRadius = "4px"; borderTop = borderSides; borderBottom = borderSides;
                                        content = `<strong>${evt.texto}</strong>`;
                                    } else if (isStart) {
                                        borderRadius = "4px 4px 0 0"; borderTop = borderSides; borderBottom = "none";
                                        content = `<strong>${evt.texto}</strong><br><small>${evt.inicio} - ${evt.fim}</small>`;
                                    } else if (isEnd) {
                                        borderRadius = "0 0 4px 4px"; borderTop = "none"; borderBottom = borderSides;
                                    } else {
                                        borderRadius = "0"; borderTop = "none"; borderBottom = "none";
                                    }

                                    htmlFinal += `<div style="
                                        flex: 1;
                                        background-color: ${evt.cor};
                                        border-left: ${borderSides};
                                        border-right: ${borderSides};
                                        border-top: ${borderTop};
                                        border-bottom: ${borderBottom};
                                        border-radius: ${borderRadius};
                                        padding: 2px;
                                        box-sizing: border-box;
                                        overflow: hidden;
                                        font-size: 10px;
                                        line-height: 1.1;
                                    ">${content}</div>`;
                                });
                                htmlFinal += `</div></td>`;
                            } else {
                                htmlFinal += `<td></td>`;
                            }
                        });
                        htmlFinal += `</tr>`;
                    });

                    htmlFinal += `</tbody></table></div>`;
                }
            });

            const divRelatorio = document.getElementById('relatorio_visivel');
            divRelatorio.innerHTML = htmlFinal;
            divRelatorio.style.display = 'block';
            document.getElementById('btnImprimir').style.display = 'block';
            
        } catch(e) { 
            alert("Erro ao montar grade de horários."); 
            console.error(e);
        } finally { 
            btn.textContent = "👁️ Visualizar Grade na Tela"; 
        }
    });

    document.getElementById('btnImprimir').addEventListener('click', () => {
        window.print();
    });

    window.onload = inicializarDados;
</script>
</body>
</html>
