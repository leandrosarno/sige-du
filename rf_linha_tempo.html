<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo - Recreio nas Férias</title>
    <style>
        :root { --primary: #0056b3; --bg-color: #f4f7f6; --box-bg: #ffffff; --text: #333333; --border: #ccc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text); padding: 20px; }
        
        .container { background-color: var(--box-bg); padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto 20px auto; }
        h2 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0;}
        
        .painel-impressao { background-color: #e9ecef; border-left: 5px solid var(--primary); padding: 15px; display: flex; align-items: center; justify-content: space-between; border-radius: 4px; margin-bottom: 30px; gap: 15px; }
        .painel-impressao p { margin: 0; font-weight: bold; color: var(--text); font-size: 1.1em;}
        
        fieldset { border: 1px solid var(--border); border-radius: 5px; padding: 15px; margin-bottom: 15px; background-color: #fafafa; }
        legend { font-weight: bold; color: var(--primary); background: #fff; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
        .full-width { grid-column: 1 / -1; }
        
        label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button { padding: 10px 20px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .btn-salvar { background-color: #28a745; width: 100%; padding: 15px;}
        .btn-salvar:hover { background-color: #218838; }
        .btn-imprimir { background-color: var(--primary); padding: 12px 25px; }
        .btn-imprimir:hover { background-color: #004494; }

        /* CSS BLINDADO DE IMPRESSÃO A4 (Comprimido para não vazar de página) */
        #area_impressao { display: none; }
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            #area_impressao { display: block !important; }
            
            /* Margens reduzidas a 5mm para dar mais espaço à tabela */
            @page { size: A4 landscape; margin: 5mm; }
            body { padding: 0; background-color: #fff; margin: 0; }
            
            .pagina-a4 { page-break-after: always; width: 100%; box-sizing: border-box; }
            .pagina-a4:last-of-type { page-break-after: auto; }
            
            .cabecalho-dia { font-size: 18px; text-align: center; font-weight: bold; color: #333; margin-bottom: 10px; text-transform: uppercase; }
            
            /* Tabela com layout fixo e palavras quebrando se necessário */
            .tabela-timeline { width: 100%; border-collapse: collapse; text-align: center; font-family: 'Segoe UI', Arial, sans-serif; table-layout: fixed; word-wrap: break-word; }
            
            /* Fonte e paddings pequenos para garantir que 17 linhas caibam na altura do papel */
            .tabela-timeline th, .tabela-timeline td { border: 1px solid #555; padding: 4px; font-size: 11px; line-height: 1.1; overflow: hidden; }
            
            .tabela-timeline td:first-child, .tabela-timeline th:first-child { font-weight: bold; width: 45px; background-color: #e9ecef; font-size: 12px; }
            .tabela-timeline tbody tr:nth-child(even) { background-color: #f8f9fa; }
        }
    </style>
</head>
<body>

<div class="container no-print painel-impressao">
    <p>Gere todas as turmas de um mesmo DIA lado a lado em UMA única folha TESTE.</p>
    <button type="button" class="btn-imprimir" id="btnImprimirMenu">🖨️ Imprimir Diários de Bordo</button>
</div>

<div class="container no-print">
    <h2>Cadastrar / Atualizar Atividades</h2>
    <form id="formTimeline">
        <div class="form-grid full-width" style="margin-bottom: 20px;">
            <div>
                <label>Data do Programa</label>
                <input type="date" id="data_atividade" required>
            </div>
            <div>
                <label>Turma <span id="load_turma" style="font-size: 0.8em; color: gray;"></span></label>
                <select id="turma" required><option value="">Selecione...</option></select>
            </div>
        </div>

        <fieldset>
            <legend>1. Chegada e Acolhimento</legend>
            <div class="form-grid">
                <div>
                    <label>Horário da Chegada</label>
                    <select id="hora_chegada" class="hora-select"><option value="">Nenhum...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>2. Refeições</legend>
            <div class="form-grid">
                <div>
                    <label>Café (Prédio Ex: CEI, EMEI)</label>
                    <input type="text" id="predio_cafe">
                </div>
                <div>
                    <label>Horário do Café</label>
                    <select id="hora_cafe" class="hora-select"><option value="">Nenhum...</option></select>
                </div>
                <div>
                    <label>Almoço (Prédio Ex: CEI, EMEF)</label>
                    <input type="text" id="predio_almoco">
                </div>
                <div>
                    <label>Horário do Almoço</label>
                    <select id="hora_almoco" class="hora-select"><option value="">Nenhum...</option></select>
                </div>
                <div>
                    <label>Lanche (Prédio Ex: CEI, EMEF)</label>
                    <input type="text" id="predio_lanche">
                </div>
                <div>
                    <label>Horário do Lanche</label>
                    <select id="hora_lanche" class="hora-select"><option value="">Nenhum...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>3. Eventos / Passeios / Atrações</legend>
            <div class="form-grid">
                <div class="full-width">
                    <label>Atração Interna ou Passeio Externo</label>
                    <select id="evento_interno"><option value="">Nenhum evento selecionado...</option></select>
                </div>
                <div>
                    <label>Horário de Início</label>
                    <select id="hora_evento" class="hora-select"><option value="">Nenhum...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>4. Saída</legend>
            <div class="form-grid">
                <div>
                    <label>Horário da Saída</label>
                    <select id="hora_saida" class="hora-select"><option value="">Nenhum...</option></select>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="btn-salvar" id="btnSalvar">Salvar no Banco de Dados</button>
    </form>
</div>

<div id="area_impressao"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, setDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
        authDomain: "sig-edu.firebaseapp.com",
        projectId: "sig-edu",
        storageBucket: "sig-edu.firebasestorage.app",
        messagingSenderId: "233239725278",
        appId: "1:233239725278:web:809b9c42feacd99175ee4f",
        measurementId: "G-E5LLYGW7DN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ceuLogado = "CEU Caminho do Mar";

    const gradeHorarios = ['08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];
    const coresTurmas = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8baff', '#f4c2c2', '#dcd0ff', '#c2f4c2', '#c2d0f4', '#f4c2f4', '#f4e8c2', '#ffe4e1'];

    document.querySelectorAll('.hora-select').forEach(select => {
        gradeHorarios.forEach(h => {
            const opt = document.createElement('option'); opt.value = h; opt.textContent = h;
            select.appendChild(opt);
        });
    });

    async function inicializarDados() {
        try {
            const snapTurmas = await getDocs(collection(db, "rf_inscricoes"));
            const turmasSet = new Set();
            snapTurmas.forEach(doc => { if (doc.data().turma) turmasSet.add(doc.data().turma); });
            const comboTurma = document.getElementById('turma');
            Array.from(turmasSet).sort().forEach(t => {
                const opt = document.createElement('option'); opt.value = t; opt.textContent = t;
                comboTurma.appendChild(opt);
            });
        } catch(e) {}

        const comboEvento = document.getElementById('evento_interno');
        try {
            const snapPasseios = await getDocs(collection(db, "rf_passeios"));
            if (!snapPasseios.empty) {
                const grupoPasseios = document.createElement('optgroup'); grupoPasseios.label = "Passeios Externos";
                snapPasseios.forEach(doc => {
                    const d = doc.data();
                    const opt = document.createElement('option');
                    opt.value = `PASSEIO: ${d.passeio} (Saída: ${d.saidaCeu} / Volta: ${d.chegadaCeu})`;
                    opt.textContent = opt.value;
                    grupoPasseios.appendChild(opt);
                });
                comboEvento.appendChild(grupoPasseios);
            }

            const qAtracoes = query(collection(db, "rf_atracoes"), where("ceus", "==", ceuLogado));
            const snapAtracoes = await getDocs(qAtracoes);
            if (!snapAtracoes.empty) {
                const grupoAtracoes = document.createElement('optgroup'); grupoAtracoes.label = "Atrações Internas";
                snapAtracoes.forEach(doc => {
                    const d = doc.data();
                    const opt = document.createElement('option');
                    const dicaHorario = d.horario ? ` | ${d.horario}` : '';
                    opt.value = `ATRAÇÃO: ${d.titulo} - ${d.local}${dicaHorario}`;
                    opt.textContent = opt.value;
                    grupoAtracoes.appendChild(opt);
                });
                comboEvento.appendChild(grupoAtracoes);
            }
        } catch(e) {}
    }

    document.getElementById('formTimeline').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = document.getElementById('data_atividade').value;
        const turma = document.getElementById('turma').value;
        const docId = `${data}_${turma}`;
        const docRef = doc(db, "rf_linha_tempo", docId);
        
        try {
            const docSnap = await getDoc(docRef);
            let cronogramaExistente = {};
            if (docSnap.exists() && docSnap.data().cronograma) {
                cronogramaExistente = docSnap.data().cronograma;
            }

            const adicionar = (id, txt) => { 
                const v = document.getElementById(id).value; 
                if(v) cronogramaExistente[v] = txt; 
            };

            adicionar('hora_chegada', 'Chegada e Acolhimento');
            adicionar('hora_cafe', `Café (${document.getElementById('predio_cafe').value || '?'})`);
            adicionar('hora_almoco', `Almoço (${document.getElementById('predio_almoco').value || '?'})`);
            adicionar('hora_lanche', `Lanche (${document.getElementById('predio_lanche').value || '?'})`);
            if (document.getElementById('evento_interno').value) adicionar('hora_evento', document.getElementById('evento_interno').value);
            adicionar('hora_saida', 'Saída');

            await setDoc(docRef, { 
                data: data, 
                turma: turma, 
                ceu: ceuLogado, 
                cronograma: cronogramaExistente 
            });
            
            alert(`Atividades salvas para a turma ${turma} no dia ${data.split('-').reverse().join('/')}!`);
            document.getElementById('formTimeline').reset();
            document.getElementById('data_atividade').value = data; 
            document.getElementById('turma').value = turma; 
            
        } catch(e) { alert("Erro ao salvar."); }
    });

    // IMPRESSÃO - COM AGRUPAMENTO ABSOLUTO POR DIA
    document.getElementById('btnImprimirMenu').addEventListener('click', async function() {
        const btn = this; 
        btn.textContent = "Formatando páginas...";
        
        try {
            const qImpressao = query(collection(db, "rf_linha_tempo"), where("ceu", "==", ceuLogado));
            const snapshot = await getDocs(qImpressao);
            
            if(snapshot.empty) {
                btn.textContent = "🖨️ Imprimir Diários de Bordo";
                return alert("Nenhuma atividade cadastrada ainda.");
            }

            const funilDeDias = {};
            
            snapshot.forEach(doc => {
                const d = doc.data();
                if(!d.data || !d.turma) return;
                
                // Normaliza datas e turmas para garantir que não se separem por erro de digitação
                const dia = d.data.substring(0, 10).trim();
                const turma = d.turma.trim().toUpperCase();
                
                if (!funilDeDias[dia]) funilDeDias[dia] = {};
                if (!funilDeDias[dia][turma]) funilDeDias[dia][turma] = {};
                
                if (d.cronograma) {
                    for(let hora in d.cronograma) {
                        funilDeDias[dia][turma][hora] = d.cronograma[hora];
                    }
                }
            });

            const diasOrdenados = Object.keys(funilDeDias).sort();
            let htmlFinal = "";

            // O laço agora força TODAS as turmas do mesmo DIA dentro da mesma Tabela
            diasOrdenados.forEach(dia => {
                const dataBR = dia.split('-').reverse().join('/');
                const turmasDesteDia = Object.keys(funilDeDias[dia]).sort();
                
                htmlFinal += `<div class="pagina-a4">`;
                htmlFinal += `<div class="cabecalho-dia">${ceuLogado} - RELATÓRIO DE ATIVIDADES - ${dataBR}</div>`;
                htmlFinal += `<table class="tabela-timeline"><thead><tr><th>Horário</th>`;
                
                // Cria as colunas com as Turmas do dia (lado a lado na mesma página)
                turmasDesteDia.forEach((t, index) => {
                    const cor = coresTurmas[index % coresTurmas.length];
                    htmlFinal += `<th style="background-color: ${cor};">Turma ${t}</th>`; 
                });
                htmlFinal += `</tr></thead><tbody>`;

                // Insere os horários nas linhas e cruza com a coluna da turma
                gradeHorarios.forEach(hora => {
                    htmlFinal += `<tr><td>${hora}</td>`;
                    turmasDesteDia.forEach(t => {
                        const atividade = funilDeDias[dia][t][hora] || '';
                        htmlFinal += `<td>${atividade}</td>`;
                    });
                    htmlFinal += `</tr>`;
                });

                htmlFinal += `</tbody></table></div>`;
            });

            document.getElementById('area_impressao').innerHTML = htmlFinal;
            window.print();
            
        } catch(e) { 
            alert("Erro ao montar a impressão."); 
            console.error(e);
        } finally { 
            btn.textContent = "🖨️ Imprimir Diários de Bordo"; 
        }
    });

    window.onload = inicializarDados;
</script>
</body>
</html>
