<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo - Recreio nas Férias</title>
    <style>
        :root {
            --primary: #0056b3;
            --bg-color: #f4f7f6;
            --box-bg: #ffffff;
            --text: #333333;
            --border: #ccc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            padding: 20px;
        }
        .container {
            background-color: var(--box-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: 0 auto;
        }
        h2 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        
        fieldset {
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }
        legend { font-weight: bold; color: var(--primary); background: #fff; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            align-items: center;
        }
        .full-width { grid-column: 1 / -1; }
        
        label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        .botoes-acao { display: flex; gap: 15px; margin-top: 20px; }
        button {
            padding: 12px 20px; color: white; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; font-size: 1em; flex: 1;
        }
        .btn-salvar { background-color: #28a745; }
        .btn-salvar:hover { background-color: #218838; }
        .btn-imprimir { background-color: var(--primary); }
        .btn-imprimir:hover { background-color: #004494; }

        /* =========================================
           CSS ESPECÍFICO PARA IMPRESSÃO A4 PAISAGEM
           ========================================= */
        #area_impressao { display: none; }
        
        @media print {
            .no-print { display: none !important; }
            #area_impressao { display: block !important; }
            @page { size: A4 landscape; margin: 10mm; }
            body { padding: 0; background-color: #fff; }
            
            .tabela-timeline {
                width: 100%;
                border-collapse: collapse;
                page-break-after: always;
                margin-bottom: 20px;
                text-align: center;
                font-family: Arial, sans-serif;
            }
            .tabela-timeline th, .tabela-timeline td {
                border: 1px solid #000;
                padding: 8px;
                font-size: 12px;
            }
            .tabela-timeline th { background-color: #f0f0f0; font-weight: bold; }
            .tabela-timeline td:first-child { font-weight: bold; width: 60px; background-color: #f9f9f9; }
        }
    </style>
</head>
<body>

<!-- ÁREA DO FORMULÁRIO (Oculta na impressão) -->
<div class="container no-print">
    <h2>Montar Linha do Tempo Diária</h2>
    <form id="formTimeline">
        
        <div class="form-grid full-width" style="margin-bottom: 20px;">
            <div>
                <label>Data do Programa</label>
                <input type="date" id="data_atividade" required>
            </div>
            <div>
                <label>Turma <span id="load_turma" style="font-size: 0.8em; color: gray;"></span></label>
                <select id="turma" required><option value="">Selecione...</option></select>
            </div>
        </div>

        <fieldset>
            <legend>1. Chegada e Acolhimento</legend>
            <div class="form-grid">
                <div>
                    <label>Horário da Chegada</label>
                    <select id="hora_chegada" class="hora-select"><option value="">Selecione...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>2. Refeições (Informe o Prédio e o Horário)</legend>
            <div class="form-grid">
                <div>
                    <label>Café (Prédio Ex: CEI, EMEI)</label>
                    <input type="text" id="predio_cafe" placeholder="Onde será?">
                </div>
                <div>
                    <label>Horário do Café</label>
                    <select id="hora_cafe" class="hora-select"><option value="">Selecione...</option></select>
                </div>

                <div>
                    <label>Almoço (Prédio Ex: CEI, EMEF)</label>
                    <input type="text" id="predio_almoco" placeholder="Onde será?">
                </div>
                <div>
                    <label>Horário do Almoço</label>
                    <select id="hora_almoco" class="hora-select"><option value="">Selecione...</option></select>
                </div>

                <div>
                    <label>Lanche (Prédio Ex: CEI, EMEF)</label>
                    <input type="text" id="predio_lanche" placeholder="Onde será?">
                </div>
                <div>
                    <label>Horário do Lanche</label>
                    <select id="hora_lanche" class="hora-select"><option value="">Selecione...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>3. Atividade e Evento Interno</legend>
            <div class="form-grid">
                <div>
                    <label>Atividade (Tipo/Descrição)</label>
                    <input type="text" id="desc_atividade" placeholder="Ex: Gincana, Leitura...">
                </div>
                <div>
                    <label>Espaço da Atividade</label>
                    <input type="text" id="espaco_atividade" placeholder="Ex: Quadra, Sala 4...">
                </div>
                <div class="full-width">
                    <label>Horário da Atividade</label>
                    <select id="hora_atividade" class="hora-select" style="width: 50%;"><option value="">Selecione...</option></select>
                </div>

                <div style="margin-top: 15px;">
                    <label>Evento Interno (Atração) <span id="load_evento" style="font-size: 0.8em; color: gray;"></span></label>
                    <select id="evento_interno"><option value="">Selecione...</option></select>
                </div>
                <div style="margin-top: 15px;">
                    <label>Horário do Evento</label>
                    <select id="hora_evento" class="hora-select"><option value="">Selecione...</option></select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>4. Saída</legend>
            <div class="form-grid">
                <div>
                    <label>Horário da Saída</label>
                    <select id="hora_saida" class="hora-select"><option value="">Selecione...</option></select>
                </div>
            </div>
        </fieldset>

        <div class="botoes-acao">
            <button type="submit" class="btn-salvar" id="btnSalvar">Salvar Cronograma da Turma</button>
            <button type="button" class="btn-imprimir" id="btnImprimir">Gerar e Imprimir (A4)</button>
        </div>
    </form>
</div>

<!-- ÁREA DE IMPRESSÃO (Visível apenas ao imprimir) -->
<div id="area_impressao"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, collection, getDocs, setDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
        authDomain: "sig-edu.firebaseapp.com",
        projectId: "sig-edu",
        storageBucket: "sig-edu.firebasestorage.app",
        messagingSenderId: "233239725278",
        appId: "1:233239725278:web:809b9c42feacd99175ee4f",
        measurementId: "G-E5LLYGW7DN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ceuLogado = "CEU Caminho do Mar";

    // Grade de horários padrão do Recreio nas Férias
    const gradeHorarios = ['08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];

    // Preenche todos os combos de horário do formulário
    document.querySelectorAll('.hora-select').forEach(select => {
        gradeHorarios.forEach(h => {
            const opt = document.createElement('option');
            opt.value = h; opt.textContent = h;
            select.appendChild(opt);
        });
    });

    // Carregar Turmas e Eventos
    async function inicializarDados() {
        try {
            // Turmas
            const snapTurmas = await getDocs(collection(db, "rf_inscricoes"));
            const turmasSet = new Set();
            snapTurmas.forEach(doc => { if (doc.data().turma) turmasSet.add(doc.data().turma); });
            const comboTurma = document.getElementById('turma');
            Array.from(turmasSet).sort().forEach(t => {
                const opt = document.createElement('option'); opt.value = t; opt.textContent = t;
                comboTurma.appendChild(opt);
            });

            // Eventos
            const qEventos = query(collection(db, "rf_atracoes"), where("ceus", "==", ceuLogado));
            const snapEventos = await getDocs(qEventos);
            const comboEvento = document.getElementById('evento_interno');
            snapEventos.forEach(doc => {
                const opt = document.createElement('option'); 
                opt.value = doc.data().nome || doc.data().titulo || "Atração"; 
                opt.textContent = opt.value;
                comboEvento.appendChild(opt);
            });
        } catch (error) {
            console.error("Erro ao carregar:", error);
        }
    }

    // SALVAR O CRONOGRAMA NO FIREBASE
    document.getElementById('formTimeline').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = document.getElementById('data_atividade').value;
        const turma = document.getElementById('turma').value;
        if(!data || !turma) return alert("Selecione a Data e a Turma.");

        // Monta um objeto de horários dinâmico para facilitar a impressão depois
        const cronograma = {};
        
        const addAoCronograma = (idHora, texto) => {
            const h = document.getElementById(idHora).value;
            if (h) cronograma[h] = texto;
        };

        addAoCronograma('hora_chegada', 'Chegada e Acolhimento');
        addAoCronograma('hora_cafe', `Café (${document.getElementById('predio_cafe').value || 'Não inf.'})`);
        addAoCronograma('hora_almoco', `Almoço (${document.getElementById('predio_almoco').value || 'Não inf.'})`);
        addAoCronograma('hora_lanche', `Lanche (${document.getElementById('predio_lanche').value || 'Não inf.'})`);
        
        const textoAtividade = document.getElementById('desc_atividade').value;
        const espacoAtividade = document.getElementById('espaco_atividade').value;
        if(textoAtividade || espacoAtividade) {
            addAoCronograma('hora_atividade', `${textoAtividade} no(a) ${espacoAtividade}`);
        }
        
        if (document.getElementById('evento_interno').value) {
            addAoCronograma('hora_evento', `Atração: ${document.getElementById('evento_interno').value}`);
        }
        
        addAoCronograma('hora_saida', 'Saída');

        // Cria um ID único por dia e turma, assim, se o usuário preencher de novo, ele ATUALIZA, não duplica.
        const docId = `${data}_${turma}`;
        
        try {
            await setDoc(doc(db, "rf_linha_tempo", docId), {
                data: data,
                turma: turma,
                ceu: ceuLogado,
                cronograma: cronograma,
                atualizadoEm: new Date()
            });
            alert(`Cronograma da turma ${turma} salvo com sucesso!`);
            document.getElementById('formTimeline').reset();
            document.getElementById('data_atividade').value = data; // Mantém a data para facilitar os próximos
        } catch (error) {
            console.error("Erro ao salvar:", error);
            alert("Erro ao salvar cronograma.");
        }
    });

    // LÓGICA DE IMPRESSÃO A4
    document.getElementById('btnImprimir').addEventListener('click', async function() {
        const dataFiltro = document.getElementById('data_atividade').value;
        if(!dataFiltro) return alert("Por favor, selecione a Data do Programa no topo para gerar o relatório.");

        const btn = this;
        btn.textContent = "Buscando dados...";

        try {
            // Busca apenas os cronogramas da data selecionada
            const qImpressao = query(collection(db, "rf_linha_tempo"), where("data", "==", dataFiltro), where("ceu", "==", ceuLogado));
            const snapshot = await getDocs(qImpressao);
            
            if(snapshot.empty) {
                btn.textContent = "Gerar e Imprimir (A4)";
                return alert("Nenhum cronograma cadastrado para esta data.");
            }

            // Organiza os dados em um mapa: dadosImpressao["4A"]["09:30"] = "Futebol..."
            const dadosImpressao = {};
            snapshot.forEach(doc => {
                const d = doc.data();
                dadosImpressao[d.turma] = d.cronograma;
            });

            const turmasEncontradas = Object.keys(dadosImpressao).sort();
            
            // Fatiamento (Chunk): 6 turmas por folha A4 para não estourar a largura
            const turmasPorPagina = 6;
            let htmlHTML = `<h2>Linha do Tempo - ${dataFiltro.split('-').reverse().join('/')} - ${ceuLogado}</h2>`;

            for (let i = 0; i < turmasEncontradas.length; i += turmasPorPagina) {
                const turmasLote = turmasEncontradas.slice(i, i + turmasPorPagina);
                
                htmlHTML += `<table class="tabela-timeline"><thead><tr><th>Horário</th>`;
                turmasLote.forEach(t => htmlHTML += `<th>Turma ${t}</th>`);
                htmlHTML += `</tr></thead><tbody>`;

                // Monta as linhas cruzando o horário com a turma
                gradeHorarios.forEach(hora => {
                    htmlHTML += `<tr><td>${hora}</td>`;
                    turmasLote.forEach(t => {
                        const atividade = dadosImpressao[t][hora] || '';
                        htmlHTML += `<td>${atividade}</td>`;
                    });
                    htmlHTML += `</tr>`;
                });
                
                htmlHTML += `</tbody></table>`;
            }

            // Injeta o HTML gerado na div de impressão e chama o print do navegador
            document.getElementById('area_impressao').innerHTML = htmlHTML;
            window.print();
            
        } catch (error) {
            console.error(error);
            alert("Erro ao montar impressão.");
        } finally {
            btn.textContent = "Gerar e Imprimir (A4)";
        }
    });

    window.onload = inicializarDados;
</script>
</body>
</html>
