<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo - Recreio nas Férias</title>
    <style>
        :root { --primary: #0056b3; --bg-color: #f4f7f6; --box-bg: #ffffff; --text: #333333; --border: #ccc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text); padding: 20px; }

        .container { background-color: var(--box-bg); padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto 20px auto; }
        h2 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0;}

        /* Painel de Controle Superior */
        .painel-controle { background-color: #e9ecef; border-left: 5px solid var(--primary); padding: 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; border-radius: 4px; margin-bottom: 30px; gap: 15px; }
        .painel-controle p { margin: 0 0 10px 0; font-weight: bold; width: 100%; font-size: 1.1em;}

        fieldset { border: 1px solid var(--border); border-radius: 5px; padding: 15px; margin-bottom: 15px; background-color: #fafafa; }
        legend { font-weight: bold; color: var(--primary); background: #fff; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
        .full-width { grid-column: 1 / -1; }

        label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        button { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em; }
        .btn-salvar { background-color: #28a745; width: 100%; padding: 15px; margin-bottom: 10px;}
        .btn-salvar:hover { background-color: #218838; }
        .btn-visualizar { background-color: var(--primary); flex: 1;}
        .btn-visualizar:hover { background-color: #004494; }
        .btn-limpar { background-color: #dc3545; }
        .btn-limpar:hover { background-color: #c82333; }
        .btn-imprimir { background-color: #333; display: none; margin-top: 15px; width: 100%; padding: 15px;}

        /* Resumo do que foi encontrado (só na tela) */
        #resumo { display: none; max-width: 900px; margin: 0 auto 20px auto; padding: 12px 16px; background: #e7f3ec; border-left: 5px solid #28a745; border-radius: 4px; font-size: 0.95em; line-height: 1.5; }
        #resumo .aviso { color: #a15c00; display: block; margin-top: 4px; }

        /* ===== RELATÓRIO NA TELA: uma "folha" por DIA, com cara de planilha ===== */
        #relatorio_visivel { display: none; overflow-x: auto; background: #dfe3e6; padding: 20px; border-radius: 8px; }

        .folha { --fs: 12px; width: 285mm; margin: 0 auto 30px auto; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
        .folha:last-child { margin-bottom: 0; }

        .tabela-timeline { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: var(--fs); border: 2px solid #2b2f33; }
        .tabela-timeline th, .tabela-timeline td { border: 1px solid #8a8f98; padding: 0.3em 0.5em; text-align: center; vertical-align: middle; line-height: 1.2; overflow-wrap: anywhere; }

        .tabela-timeline th.titulo { background: #0b3d7a; color: #fff; font-size: 1.3em; padding: 0.5em; border: 2px solid #2b2f33; }
        .tabela-timeline th.th-hora { background: #cfd4d9; width: 20mm; border-bottom: 2px solid #2b2f33; }
        .tabela-timeline th.th-turma { font-size: 1.1em; border-bottom: 2px solid #2b2f33; }

        .tabela-timeline td.col-hora { background: #e9ecef; font-weight: bold; color: #444; }
        .tabela-timeline tbody tr:nth-child(even) td { background-color: #f6f8fa; }
        .tabela-timeline tbody tr:nth-child(even) td.col-hora { background-color: #e1e5e9; }
        .tabela-timeline tbody td.preenchida { font-weight: 600; }

        /* ===== IMPRESSÃO: cada dia ocupa exatamente 1 folha A4 paisagem ===== */
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: A4 landscape; margin: 6mm; }

            html, body { height: auto; margin: 0; padding: 0; background: #fff; }
            .no-print { display: none !important; }

            #relatorio_visivel { display: block !important; overflow: visible !important; background: none; padding: 0; margin: 0; border-radius: 0; }

            .folha { width: 100%; height: 196mm; margin: 0; box-shadow: none; overflow: hidden;
                     break-inside: avoid; page-break-inside: avoid;
                     break-after: page; page-break-after: always; }
            .folha:last-child { break-after: auto; page-break-after: auto; }

            /* a tabela preenche a folha inteira, como uma planilha impressa */
            .tabela-timeline { height: 100%; }
        }
    </style>
</head>
<body>

<div class="container no-print painel-controle">
    <p>Painel de Controle do Relatório</p>
    <button type="button" class="btn-visualizar" id="btnVisualizar">👁️ Visualizar Relatório na Tela</button>
    <button type="button" class="btn-limpar" id="btnLimpar">🗑️ Limpar Dados Fantasmas</button>
</div>

<div class="container no-print">
    <h2>Cadastrar / Adicionar Atividades</h2>
    <form id="formTimeline">
        <div class="form-grid full-width" style="margin-bottom: 20px;">
            <div>
                <label>Data do Programa</label>
                <input type="date" id="data_atividade" required>
            </div>
            <div>
                <label>Turma <span id="load_turma" style="font-size: 0.8em; color: gray;"></span></label>
                <select id="turma" required><option value="">Selecione...</option></select>
            </div>
        </div>

        <fieldset>
            <legend>1. Chegada e Refeições</legend>
            <div class="form-grid">
                <div><label>Horário Chegada</label><select id="hora_chegada" class="hora-select"><option value="">Nenhum...</option></select></div>
                <div></div>
                <div><label>Prédio Café</label><input type="text" id="predio_cafe"></div>
                <div><label>Horário Café</label><select id="hora_cafe" class="hora-select"><option value="">Nenhum...</option></select></div>
                <div><label>Prédio Almoço</label><input type="text" id="predio_almoco"></div>
                <div><label>Horário Almoço</label><select id="hora_almoco" class="hora-select"><option value="">Nenhum...</option></select></div>
            </div>
        </fieldset>

        <fieldset>
            <legend>2. Eventos Internos e Passeios</legend>
            <div class="form-grid">
                <div class="full-width">
                    <label>Selecione a Atração ou Passeio</label>
                    <select id="evento_interno"><option value="">Nenhum evento selecionado...</option></select>
                </div>
                <div>
                    <label>Horário na Linha do Tempo</label>
                    <select id="hora_evento" class="hora-select"><option value="">Nenhum...</option></select>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="btn-salvar" id="btnSalvar">Salvar Dados da Turma</button>
    </form>
</div>

<!-- Resumo do que o relatório encontrou (só na tela) -->
<div id="resumo" class="no-print"></div>

<!-- VISUALIZADOR DE TELA: uma .folha por dia -->
<div id="relatorio_visivel"></div>
<button type="button" class="btn-imprimir no-print" id="btnImprimir" style="max-width: 900px; margin: 20px auto;">🖨️ Enviar para Impressora (A4)</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, setDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCpCXxJbD8dPXkT7mcoz4qK8Wjt7WTRwFA",
        authDomain: "sig-edu.firebaseapp.com",
        projectId: "sig-edu",
        storageBucket: "sig-edu.firebasestorage.app",
        messagingSenderId: "233239725278",
        appId: "1:233239725278:web:809b9c42feacd99175ee4f",
        measurementId: "G-E5LLYGW7DN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ceuLogado = "CEU Caminho do Mar";

    const gradeHorarios = ['08:30', '09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];
    const coresTurmas = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8baff', '#f4c2c2', '#dcd0ff'];

    // ---------- Funções auxiliares ----------
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    // Aceita "2026-07-06", "2026-07-06T00:00", "06/07/2026", Date ou Timestamp do Firestore
    function normalizarData(v) {
        if (!v) return null;
        if (typeof v.toDate === 'function') v = v.toDate();
        if (v instanceof Date && !isNaN(v)) {
            const p = n => String(n).padStart(2, '0');
            return `${v.getFullYear()}-${p(v.getMonth() + 1)}-${p(v.getDate())}`;
        }
        const s = String(v).trim();
        let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
        return null;
    }
    function normalizarHora(h) {
        const m = String(h).trim().match(/^(\d{1,2}):(\d{2})/);
        return m ? `${m[1].padStart(2, '0')}:${m[2]}` : String(h).trim();
    }
    function normalizarTurma(t) {
        return String(t || '').trim().replace(/\s+/g, ' ').toUpperCase();
    }

    document.querySelectorAll('.hora-select').forEach(select => {
        gradeHorarios.forEach(h => {
            const opt = document.createElement('option'); opt.value = h; opt.textContent = h;
            select.appendChild(opt);
        });
    });

    async function inicializarDados() {
        try {
            const snapTurmas = await getDocs(collection(db, "rf_inscricoes"));
            const turmasSet = new Set();
            snapTurmas.forEach(d => { if (d.data().turma) turmasSet.add(d.data().turma); });
            const comboTurma = document.getElementById('turma');
            Array.from(turmasSet).sort().forEach(t => {
                const opt = document.createElement('option'); opt.value = t; opt.textContent = t;
                comboTurma.appendChild(opt);
            });
        } catch(e) {}

        const comboEvento = document.getElementById('evento_interno');
        try {
            const snapPasseios = await getDocs(collection(db, "rf_passeios"));
            if (!snapPasseios.empty) {
                const grupoPasseios = document.createElement('optgroup'); grupoPasseios.label = "Passeios";
                snapPasseios.forEach(p => {
                    const d = p.data();
                    const opt = document.createElement('option');
                    opt.value = `PASSEIO: ${d.passeio} (Saída: ${d.saidaCeu} / Volta: ${d.chegadaCeu})`;
                    opt.textContent = opt.value;
                    grupoPasseios.appendChild(opt);
                });
                comboEvento.appendChild(grupoPasseios);
            }
        } catch(e) {}
    }

    // ---------- Limpar Banco (Zerar Testes) ----------
    document.getElementById('btnLimpar').addEventListener('click', async function() {
        if(confirm("Tem certeza que deseja APAGAR TODOS os registros da Linha do Tempo criados até agora e começar do zero?")) {
            this.textContent = "Apagando...";
            try {
                const snap = await getDocs(collection(db, "rf_linha_tempo"));
                // espera TODAS as exclusões terminarem antes de avisar
                await Promise.all(snap.docs.map(d => deleteDoc(doc(db, "rf_linha_tempo", d.id))));
                alert("Banco de dados limpo com sucesso! Pode cadastrar o dia 06 de forma limpa.");
                document.getElementById('relatorio_visivel').style.display = 'none';
                document.getElementById('resumo').style.display = 'none';
                document.getElementById('btnImprimir').style.display = 'none';
            } catch(e) {
                alert("Erro ao limpar o banco.");
            } finally {
                this.textContent = "🗑️ Limpar Dados Fantasmas";
            }
        }
    });

    // ---------- Salvamento ----------
    document.getElementById('formTimeline').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = document.getElementById('data_atividade').value;
        const turma = document.getElementById('turma').value;
        const docId = `${data}_${turma}`;
        const docRef = doc(db, "rf_linha_tempo", docId);

        try {
            const docSnap = await getDoc(docRef);
            let cronogramaExistente = {};
            if (docSnap.exists() && docSnap.data().cronograma) {
                cronogramaExistente = docSnap.data().cronograma;
            }

            const adicionar = (id, txt) => {
                const v = document.getElementById(id).value;
                if(v) cronogramaExistente[v] = txt;
            };

            adicionar('hora_chegada', 'Chegada');
            adicionar('hora_cafe', `Café (${document.getElementById('predio_cafe').value || '-'})`);
            adicionar('hora_almoco', `Almoço (${document.getElementById('predio_almoco').value || '-'})`);
            if (document.getElementById('evento_interno').value) adicionar('hora_evento', document.getElementById('evento_interno').value);

            await setDoc(docRef, { data, turma, ceu: ceuLogado, cronograma: cronogramaExistente });
            alert(`Salvo para a turma ${turma}!`);
            document.getElementById('formTimeline').reset();
            document.getElementById('data_atividade').value = data;
            document.getElementById('turma').value = turma;
        } catch(e) { alert("Erro ao salvar."); }
    });

    // ---------- Garante que cada dia caiba em UMA folha A4 paisagem ----------
    // Altura útil: 196 mm (210 mm - margens). Se a tabela ficar maior, reduz a fonte.
    const ALTURA_UTIL_PX = (196 / 25.4) * 96;
    function ajustarAoPapel() {
        document.querySelectorAll('.folha').forEach(folha => {
            const tabela = folha.querySelector('.tabela-timeline');
            let fs = 12;
            folha.style.setProperty('--fs', fs + 'px');
            while (tabela.offsetHeight > ALTURA_UTIL_PX && fs > 6) {
                fs -= 0.5;
                folha.style.setProperty('--fs', fs + 'px');
            }
        });
    }

    // ---------- Visualizar e montar o relatório ----------
    document.getElementById('btnVisualizar').addEventListener('click', async function() {
        const btn = this;
        btn.textContent = "Montando Tabela...";

        try {
            const qImpressao = query(collection(db, "rf_linha_tempo"), where("ceu", "==", ceuLogado));
            const snapshot = await getDocs(qImpressao);

            if(snapshot.empty) {
                return alert("Não há nada cadastrado no momento.");
            }

            // funil[dia][turma][hora] = Set de atividades (tudo do mesmo horário vai na mesma célula)
            const funil = {};
            const todasTurmas = new Set();
            let ignorados = 0;

            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                const dia = normalizarData(d.data);
                const turma = normalizarTurma(d.turma);
                if (!dia || !turma) { ignorados++; return; }

                todasTurmas.add(turma);
                if (!funil[dia]) funil[dia] = {};
                if (!funil[dia][turma]) funil[dia][turma] = {};

                const cron = d.cronograma || {};
                for (const horaBruta in cron) {
                    const hora = normalizarHora(horaBruta);
                    if (!funil[dia][turma][hora]) funil[dia][turma][hora] = new Set();
                    funil[dia][turma][hora].add(cron[horaBruta]);
                }
            });

            // cada turma mantém a MESMA cor em todos os dias
            const listaTurmas = Array.from(todasTurmas).sort();
            const corDaTurma = t => coresTurmas[listaTurmas.indexOf(t) % coresTurmas.length];

            const diasOrdenados = Object.keys(funil).sort();
            let htmlFinal = "";

            diasOrdenados.forEach(dia => {
                const dataBR = dia.split('-').reverse().join('/');
                const turmasDoDia = Object.keys(funil[dia]).sort();

                // horários da grade + qualquer horário fora da grade que exista nos dados
                const extras = new Set();
                turmasDoDia.forEach(t => Object.keys(funil[dia][t]).forEach(h => {
                    if (!gradeHorarios.includes(h)) extras.add(h);
                }));
                const horas = gradeHorarios.concat(Array.from(extras)).sort();

                // UMA folha, UMA tabela, uma coluna por turma
                htmlFinal += `<div class="folha"><table class="tabela-timeline">`;
                htmlFinal += `<colgroup><col style="width:20mm">${turmasDoDia.map(() => '<col>').join('')}</colgroup>`;
                htmlFinal += `<thead>`;
                htmlFinal += `<tr><th class="titulo" colspan="${turmasDoDia.length + 1}">${esc(ceuLogado)} - Linha do Tempo - ${dataBR}</th></tr>`;
                htmlFinal += `<tr><th class="th-hora">Horário</th>`;
                turmasDoDia.forEach(t => {
                    htmlFinal += `<th class="th-turma" style="background-color:${corDaTurma(t)};">Turma ${esc(t)}</th>`;
                });
                htmlFinal += `</tr></thead><tbody>`;

                horas.forEach(hora => {
                    htmlFinal += `<tr><td class="col-hora">${hora}</td>`;
                    turmasDoDia.forEach(t => {
                        const conjunto = funil[dia][t][hora];
                        if (conjunto && conjunto.size) {
                            const texto = Array.from(conjunto).map(esc).join(' + ');
                            htmlFinal += `<td class="preenchida" style="background-color:${corDaTurma(t)}55;">${texto}</td>`;
                        } else {
                            htmlFinal += `<td></td>`;
                        }
                    });
                    htmlFinal += `</tr>`;
                });

                htmlFinal += `</tbody></table></div>`;
            });

            const divRelatorio = document.getElementById('relatorio_visivel');
            divRelatorio.innerHTML = htmlFinal;
            divRelatorio.style.display = 'block';
            document.getElementById('btnImprimir').style.display = 'block';

            ajustarAoPapel();

            // resumo (só na tela) para conferir quantas folhas vão sair
            const linhas = diasOrdenados.map(dia =>
                `${dia.split('-').reverse().join('/')} (${Object.keys(funil[dia]).length} turma(s))`);
            const resumo = document.getElementById('resumo');
            resumo.innerHTML = `✅ <strong>${diasOrdenados.length} folha(s)</strong> serão impressas, uma por dia: ${linhas.join(' · ')}` +
                (ignorados ? `<span class="aviso">⚠️ ${ignorados} registro(s) ignorado(s) por falta de data ou turma válida.</span>` : '');
            resumo.style.display = 'block';

        } catch(e) {
            console.error(e);
            alert("Erro ao ler dados.");
        } finally {
            btn.textContent = "👁️ Visualizar Relatório na Tela";
        }
    });

    // ---------- Enviar para Impressora ----------
    document.getElementById('btnImprimir').addEventListener('click', () => {
        window.print();
    });

    window.onload = inicializarDados;
</script>
</body>
</html>
