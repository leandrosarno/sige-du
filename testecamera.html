<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>
    :root { --bg-color:#f0f2f5; --card-bg:#fff; --text-main:#2c3e50; --text-muted:#6c757d; --border-color:#eaedf1; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background-color:var(--bg-color); margin:0; padding:0; color:var(--text-main); }
    .topbar { background:linear-gradient(135deg,#0d6efd,#0a58ca); color:#fff; padding:18px 30px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 15px rgba(0,0,0,.05); margin-bottom:25px; border-bottom:4px solid #004494; }
    .topbar h2 { margin:0; font-size:22px; font-weight:800; display:flex; align-items:center; gap:10px; letter-spacing:-.5px; }
    .btn-voltar { background-color:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.3); padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:bold; transition:.3s; display:flex; align-items:center; gap:8px; }
    .btn-voltar:hover { background:#fff; color:#0d6efd; transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.1); }
    .container-main { max-width:1300px; margin:0 auto; padding:0 20px 50px; }
    .card-pro { background:var(--card-bg); border-radius:12px; box-shadow:0 6px 15px rgba(0,0,0,.04); margin-bottom:20px; border:none; overflow:hidden; transition:.3s; }
    .card-pro:hover { box-shadow:0 8px 25px rgba(0,0,0,.08); }
    .hdr-busca { background:linear-gradient(135deg,#495057,#343a40); color:#fff; }
    .hdr-pessoal { background:linear-gradient(135deg,#0d6efd,#0b5ed7); color:#fff; }
    .hdr-contato { background:linear-gradient(135deg,#fd7e14,#e8590c); color:#fff; }
    .hdr-foto { background:linear-gradient(135deg,#20c997,#1aa179); color:#fff; }
    .hdr-config { background:linear-gradient(135deg,#6f42c1,#59339d); color:#fff; }
    .hdr-mods { background:linear-gradient(135deg,#17a2b8,#138496); color:#fff; }
    .hdr-hist { background:linear-gradient(135deg,#343a40,#212529); color:#fff; }
    .hdr-aviso { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; }
    .card-header-pro { padding:12px 20px; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; border-bottom:none; text-transform:uppercase; letter-spacing:.5px; }
    .card-body-pro { padding:20px; }
    .form-label-pro { font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
    .form-control-pro,.form-select-pro { width:100%; padding:10px 14px; border:1px solid var(--border-color); border-radius:6px; font-size:14px; color:#495057; background:#f8f9fa; transition:all .2s ease-in-out; box-sizing:border-box; }
    .form-control-pro:focus,.form-select-pro:focus { border-color:#0d6efd; background:#fff; box-shadow:0 0 0 3px rgba(13,110,253,.15); outline:none; }
    .form-control-pro[readonly] { background:#e9ecef; cursor:not-allowed; font-weight:bold; color:#6c757d; }
    .input-prontuario { background:#e8f4f8!important; color:#0d6efd!important; font-weight:800!important; font-size:16px!important; border-color:#b6e2f3!important; }
    .select-config { font-weight:bold; cursor:pointer; padding:8px 12px; }
    .select-config:focus { box-shadow:0 0 0 3px rgba(111,66,193,.15); border-color:#6f42c1; }
    .foto-area { display:flex; flex-direction:column; align-items:center; justify-content:center; border:2px dashed #ced4da; padding:15px; border-radius:8px; background:#f8f9fa; transition:.3s; }

    .foto-preview { max-width:100%; max-height:180px; margin-top:5px; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.1); display:none; object-fit:cover; }
    .area-botoes { display:flex; gap:15px; margin-top:10px; background:#fff; padding:20px; border-radius:12px; box-shadow:0 6px 15px rgba(0,0,0,.04); align-items:center; }
    .btn-salvar,.btn-imprimir,.btn-declaracao { color:#fff!important; border:0!important; padding:16px 20px!important; border-radius:8px!important; cursor:pointer; transition:all .3s ease!important; font-weight:800!important; text-transform:uppercase; }
    .btn-salvar { background:linear-gradient(135deg,#198754,#146c43)!important; flex-grow:2; font-size:16px!important; letter-spacing:1px; box-shadow:0 4px 15px rgba(25,135,84,.3)!important; }

    .btn-imprimir { background:linear-gradient(135deg,#6f42c1,#563d7c)!important; flex-grow:1; font-size:15px!important; letter-spacing:.5px; box-shadow:0 4px 15px rgba(111,66,193,.3)!important; }
    .btn-declaracao { background:linear-gradient(135deg,#0d6efd,#0a58ca)!important; flex-grow:1; font-size:15px!important; letter-spacing:.5px; box-shadow:0 4px 15px rgba(13,110,253,.3)!important; }
    .alerta-status { text-align:center; padding:20px; font-size:18px; font-weight:bold; color:#0d6efd; background:#fff; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,.05); }

    .busca-acoes { display:flex; gap:10px; margin-top:12px; }
    .btn-qr { border:0; border-radius:6px; padding:10px 15px; background:#198754; color:#fff; font-weight:700; }

    .qr-overlay { position:fixed; inset:0; z-index:2000; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.72); }
    .qr-dialog { width:min(100%,560px); padding:20px; border-radius:12px; background:#fff; box-shadow:0 12px 40px rgba(0,0,0,.3); }
    .qr-video { display:block; width:100%; max-height:65vh; margin-top:12px; border-radius:8px; background:#111; object-fit:cover; }
    .qr-dialog-actions { display:flex; justify-content:flex-end; margin-top:14px; }
    @media(max-width:700px) { .area-botoes { flex-direction:column; align-items:stretch; } .topbar { padding:15px; gap:10px; } .topbar h2 { font-size:18px; } }
    @media(max-width:576px) { .busca-acoes { flex-direction:column; } }
  </style>
</head>

              <div class="col-6 mt-2"><label class="form-label-pro text-primary"><i class="fas fa-swimmer"></i> Raia</label><select id="permissaoRaia" class="form-select-pro select-config text-primary"><option value="NÃO">NÃO</option><option value="SIM">SIM</option></select></div>

            </div></div>

        <div class="col-md-6 mt-2"><div class="card-pro h-100 mb-0"><div class="card-header-pro hdr-mods"><i class="fas fa-medal"></i> Turmas e Modalidades Ativas</div><div class="card-body-pro p-3"><div id="containerModalidades" class="modalidades-container"></div></div></div></div>
        <div class="col-md-6 mt-2"><div class="card-pro h-100 mb-0"><div class="card-header-pro hdr-hist"><i class="fas fa-history"></i> Histórico de Vias (APM)</div><div class="card-body-pro p-3"><div id="containerViasHistorico" class="modalidades-container"></div></div></div></div>

        <button type="button" class="btn-declaracao" onclick="imprimirDeclaracao()"><i class="fas fa-file-signature me-2"></i> DECLARAÇÃO DE MATRÍCULA</button>

  </div>
  <script>
    let dadosBanco = [];
    const idAutomatico = "<?= typeof idVindoDaTabela !== 'undefined' ? idVindoDaTabela : '' ?>";
    let matriculasAtuais = [];
    let qrStream = null;
    let qrAtivo = false;
    let qrDetectando = false;
    const qrCanvas = document.createElement('canvas');
    const qrContext = qrCanvas.getContext('2d', { willReadFrequently: true });

    window.onload = function() {
      if (idAutomatico && idAutomatico !== "") {
        document.getElementById('blocoBusca').style.display = 'none';
        document.getElementById('statusBusca').innerHTML = "<i class='fas fa-spinner fa-spin me-2'></i> Carregando cadastro do aluno...";
        google.script.run.withSuccessHandler(preencherCampos).withFailureHandler(err => Swal.fire('Erro!', 'Falha ao carregar dados: ' + err, 'error')).buscarDadosAlunoCompleto(idAutomatico);
      } else {
        document.getElementById('statusBusca').innerHTML = "<i class='fas fa-spinner fa-spin me-2'></i> Carregando banco de dados...";
        google.script.run.withSuccessHandler(function(alunos) {
          dadosBanco = alunos || [];
          const datalist = document.getElementById('listaNomes');
          dadosBanco.forEach(aluno => { const option = document.createElement('option'); option.value = aluno.nome; datalist.appendChild(option); });
          document.getElementById('statusBusca').innerHTML = "<i class='fas fa-check-circle text-success me-2'></i> Banco conectado. Busque um aluno acima.";
          document.getElementById('statusBusca').style.color = '#198754';
        }).buscarAlunosParaCombo();
      }
    };

    async function iniciarLeitorQr() {
      const status = document.getElementById('qrStatus');
      const overlay = document.getElementById('qrOverlay');
      const video = document.getElementById('qrVideo');
      const detector = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
      if (!detector && typeof jsQR !== 'function') {
        Swal.fire('Leitor indisponível', 'Não foi possível carregar o leitor de QR Code. Verifique sua conexão com a internet e tente novamente.', 'warning');
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        Swal.fire('Câmera indisponível', 'A câmera precisa ser acessada por HTTPS e com a permissão do navegador.', 'warning');
        return;
      }
      overlay.style.display = 'flex';
      status.textContent = 'Solicitando acesso à câmera...';
      try {
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = qrStream;
        await video.play();
        qrAtivo = true;
        status.textContent = 'Aponte a câmera para o QR Code da carteirinha.';
        detectarQr(detector);
      } catch (erro) {
        pararLeitorQr();
        Swal.fire('Não foi possível abrir a câmera', 'Verifique a permissão de câmera do navegador e tente novamente. ' + (erro.message || ''), 'error');
      }
    }

    async function detectarQr(detector) {
      if (!qrAtivo || qrDetectando) return;
      const video = document.getElementById('qrVideo');
      qrDetectando = true;
      try {
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          let valorQr = '';
          if (detector) {
            const codigos = await detector.detect(video);
            if (codigos.length) valorQr = codigos[0].rawValue.trim();
          } else if (video.videoWidth && video.videoHeight) {
            qrCanvas.width = video.videoWidth;
            qrCanvas.height = video.videoHeight;
            qrContext.drawImage(video, 0, 0, qrCanvas.width, qrCanvas.height);
            const imagem = qrContext.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
            const codigo = jsQR(imagem.data, imagem.width, imagem.height, { inversionAttempts: 'dontInvert' });
            if (codigo) valorQr = codigo.data.trim();
          }
          if (valorQr) {
            qrAtivo = false;
            pararLeitorQr();
            carregarAlunoDoQr(valorQr);
            return;
          }
        }
      } catch (erro) {
        document.getElementById('qrStatus').textContent = 'Não foi possível ler a imagem. Ajuste a posição da carteirinha.';
      } finally { qrDetectando = false; }
      if (qrAtivo) setTimeout(() => detectarQr(detector), 180);
    }

    function pararLeitorQr() {
      qrAtivo = false;
      if (qrStream) { qrStream.getTracks().forEach(track => track.stop()); qrStream = null; }
      document.getElementById('qrVideo').srcObject = null;
      document.getElementById('qrOverlay').style.display = 'none';
    }

    function carregarAlunoDoQr(valorQr) {
      let identificador = valorQr;
      try {
        const url = new URL(valorQr);
        for (const [chave, valor] of url.searchParams.entries()) {
          if (['id', 'idaluno', 'idvindo databela', 'idvindoDaTabela', 'aluno'].includes(chave.toLowerCase()) && valor) {
            identificador = valor;
            break;
          }
        }
      } catch (erro) { /* O QR pode conter diretamente o identificador. */ }
      const valorBusca = identificador.trim();
      const aluno = dadosBanco.find(item => String(item.id).trim() === valorBusca || String(item.nome).trim().toLowerCase() === valorBusca.toLowerCase());
      if (aluno) identificador = aluno.id;
      document.getElementById('statusBusca').style.display = 'block';
      document.getElementById('statusBusca').innerHTML = "<i class='fas fa-spinner fa-spin me-2'></i> Localizando aluno pelo QR Code...";
      document.getElementById('statusBusca').style.color = '#0d6efd';
      google.script.run.withSuccessHandler(dados => {
        if (!dados) {
          document.getElementById('statusBusca').innerHTML = 'Aluno não encontrado. Confira se o QR Code contém o ID do aluno.';
          document.getElementById('statusBusca').style.color = '#dc3545';
          return;
        }
        preencherCampos(dados);
      }).withFailureHandler(err => {
        document.getElementById('statusBusca').innerHTML = 'Falha ao buscar o aluno pelo QR Code.';
        document.getElementById('statusBusca').style.color = '#dc3545';
        Swal.fire('Erro ao localizar aluno', 'O QR Code precisa conter o ID usado pelo sistema. ' + (err.message || err), 'error');
      }).buscarDadosAlunoCompleto(identificador);
    }

    document.getElementById('buscaNome').addEventListener('input', function(e) {
      const nomeDigitado = e.target.value.trim();
      const alunoEncontrado = dadosBanco.find(a => a.nome === nomeDigitado);
      if (alunoEncontrado) {
        document.getElementById('statusBusca').innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Puxando a ficha de ' + alunoEncontrado.nome + '...';
        document.getElementById('statusBusca').style.color = '#0d6efd';
        google.script.run.withSuccessHandler(preencherCampos).withFailureHandler(err => {
          document.getElementById('statusBusca').innerText = '❌ Falha ao buscar dados: ' + err;
          Swal.fire('Erro!', 'Falha ao buscar dados: ' + err, 'error');
        }).buscarDadosAlunoCompleto(alunoEncontrado.id);
      }
    });

    function preencherCampos(dados) {
      if (!dados) { Swal.fire('Atenção', 'Aluno não encontrado no banco de dados!', 'warning'); return; }
      matriculasAtuais = dados.matriculas || [];
      document.getElementById('statusBusca').style.display = 'none';
      document.getElementById('formCadastro').style.display = 'block';
      document.getElementById('linhaPlanilha').value = dados.linha || '';
      document.getElementById('idAluno').value = dados.id || '';
      document.getElementById('codEol').value = dados.codEol || '';
      document.getElementById('prontuario').value = dados.prontuario || '';
      document.getElementById('nome').value = dados.nome || '';
      document.getElementById('nomeSocial').value = dados.nomeSocial || '';
      document.getElementById('cpf').value = dados.cpf || '';
      document.getElementById('dataNascimento').value = dados.dataNascimento || '';
      document.getElementById('telPrincipal').value = dados.telPrincipal || '';
      document.getElementById('emailAluno').value = dados.email || '';
      document.getElementById('responsavel').value = dados.responsavel || '';
      document.getElementById('avisoAluno').value = dados.avisos || '';
      document.getElementById('imprimirCRL').value = dados.imprimirCRL ? 'SIM' : 'NÃO';
      document.getElementById('imprimirCAL').value = dados.imprimirCAL ? 'SIM' : 'NÃO';
      document.getElementById('imprimirCG').value = dados.imprimirCG ? 'SIM' : 'NÃO';
      document.getElementById('imprimirEnvelope').value = dados.imprimirEnvelope ? 'SIM' : 'NÃO';
      document.getElementById('permissaoRaia').value = dados.permissaoRaia ? 'SIM' : 'NÃO';
      document.getElementById('permissaoAcademia').value = dados.permissaoAcademia ? 'SIM' : 'NÃO';
      document.getElementById('containerViasHistorico').innerHTML = dados.viasHistoricoHtml || "<div class='tag-nenhuma'><i class='fas fa-info-circle me-1'></i> Nenhuma impressão registrada ainda.</div>";
      const imgPreview = document.getElementById('previewFoto');
      const debugTexto = document.getElementById('debugFoto');
      if (dados.fotoUrl) {
        imgPreview.src = dados.fotoUrl; imgPreview.style.display = 'block';
        debugTexto.innerHTML = "<i class='fas fa-check-circle text-success'></i> Imagem Carregada"; debugTexto.style.color = '#198754';
      } else {
        imgPreview.src = ''; imgPreview.style.display = 'none';
        debugTexto.innerHTML = "<i class='fas fa-exclamation-triangle text-warning'></i> Sem foto no sistema"; debugTexto.style.color = '#ffc107';
      }
      const containerMods = document.getElementById('containerModalidades');
      containerMods.innerHTML = '';
      if (dados.modalidadesCards && dados.modalidadesCards.length) {
        dados.modalidadesCards.forEach(mod => { const tag = document.createElement('div'); tag.className = 'tag-modalidade'; tag.innerHTML = mod; containerMods.appendChild(tag); });
      } else {
        const tagNone = document.createElement('div'); tagNone.className = 'tag-nenhuma'; tagNone.innerHTML = "<i class='fas fa-times-circle me-1'></i> Nenhuma matrícula ativa vinculada."; containerMods.appendChild(tagNone);
      }
    }

    function previewNovaFoto(event) {
      const arquivo = event.target.files[0];
      if (arquivo) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('previewFoto').src = e.target.result;
          document.getElementById('previewFoto').style.display = 'block';
          document.getElementById('fotoBase64').value = e.target.result;
          document.getElementById('nomeArquivo').value = arquivo.name;
          document.getElementById('debugFoto').innerHTML = "<i class='fas fa-upload text-primary'></i> Nova foto na agulha!";
          document.getElementById('debugFoto').style.color = '#0d6efd';
        };
        reader.readAsDataURL(arquivo);
      }
    }

    function voltar() { window.top.location.href = "<?= obterUrlWebApp() ?>?tela=TabelaAlunos"; }
    document.getElementById('cpf').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      v = v.replace(/(\d{3})(\d)/, '$1.$2'); v = v.replace(/(\d{3})(\d)/, '$1.$2'); v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2'); e.target.value = v;
    });
    document.getElementById('telPrincipal').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, ''); v = v.replace(/^(\d{2})(\d)/g, '($1) $2'); v = v.replace(/(\d)(\d{4})$/, '$1-$2'); e.target.value = v;
    });

    function salvarAlteracao() {
      const btn = document.getElementById('btnSalvar'); btn.disabled = true; btn.innerHTML = "<i class='fas fa-circle-notch fa-spin me-2'></i> SALVANDO NO BANCO...";
      const dadosFormulario = {
        linha:document.getElementById('linhaPlanilha').value,
        codEol:document.getElementById('codEol').value.trim().toUpperCase(),
        prontuario:document.getElementById('prontuario').value.trim().toUpperCase(),
        nome:document.getElementById('nome').value.trim().toUpperCase(),
        nomeSocial:document.getElementById('nomeSocial').value.trim().toUpperCase(),
        cpf:document.getElementById('cpf').value.trim(), dataNascimento:document.getElementById('dataNascimento').value,
        telPrincipal:document.getElementById('telPrincipal').value.trim(), email:document.getElementById('emailAluno').value.trim(),
        responsavel:document.getElementById('responsavel').value.trim().toUpperCase(), avisos:document.getElementById('avisoAluno').value.trim(),
        imprimirCRL:document.getElementById('imprimirCRL').value, imprimirCAL:document.getElementById('imprimirCAL').value,
        imprimirCG:document.getElementById('imprimirCG').value, imprimirEnvelope:document.getElementById('imprimirEnvelope').value,
        permissaoRaia:document.getElementById('permissaoRaia').value, permissaoAcademia:document.getElementById('permissaoAcademia').value,
        fotoBase64:document.getElementById('fotoBase64').value, nomeArquivo:document.getElementById('nomeArquivo').value
      };
      google.script.run.withSuccessHandler(msg => {
        Swal.fire({title:'Excelente!',text:msg,icon:'success',confirmButtonColor:'#28a745'}).then(() => voltar());
      }).withFailureHandler(err => {
        Swal.fire('Erro!', 'Falha ao salvar: ' + err.message, 'error');
        btn.disabled = false; btn.innerHTML = "<i class='fas fa-save me-2'></i> SALVAR ALTERAÇÕES NO SISTEMA";
      }).atualizarCadastro_Definitivo(dadosFormulario);
    }

    function imprimirFicha() {
      try {
        const nome = document.getElementById('nome').value.toUpperCase() || 'NÃO INFORMADO';
        const prontuario = document.getElementById('prontuario').value.toUpperCase() || 'NÃO INFORMADO';
        const codEol = document.getElementById('codEol').value.toUpperCase() || 'NÃO INFORMADO';
        const cpf = document.getElementById('cpf').value || 'NÃO INFORMADO';
        const dataNasc = document.getElementById('dataNascimento').value || 'NÃO INFORMADO';
        const tel = document.getElementById('telPrincipal').value || 'NÃO INFORMADO';
        const email = document.getElementById('emailAluno').value || 'NÃO INFORMADO';
        const resp = document.getElementById('responsavel').value.toUpperCase() || 'NÃO INFORMADO';
        let dataFormatada = 'NÃO INFORMADO';
        if (dataNasc !== 'NÃO INFORMADO' && dataNasc.includes('-')) dataFormatada = dataNasc.split('-').reverse().join('/');
        const fotoSrc = document.getElementById('previewFoto').src;
        const fotoHtml = (fotoSrc && fotoSrc !== '' && !fotoSrc.includes('localhost') && !fotoSrc.includes('.html')) ? `<img src="${fotoSrc}" style="max-width:140px;border:2px solid #ccc;border-radius:8px;">` : '<div style="width:140px;height:180px;border:2px dashed #ccc;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;text-align:center;">Sem Foto</div>';
        const modalidadesTagsHtml = document.getElementById('containerModalidades').innerHTML;
        const viasHistoricoHtml = document.getElementById('containerViasHistorico').innerHTML;
        const conteudoImpressao = `<!DOCTYPE html><html><head><title>Ficha do Aluno - ${nome}</title><style>
          body{font-family:Arial,sans-serif;padding:40px;color:#333}.cabecalho{border-bottom:3px solid #0056b3;padding-bottom:15px;margin-bottom:30px;text-align:center}.cabecalho h1{margin:0;color:#0056b3;font-size:24px;text-transform:uppercase}.bloco-dados{display:flex;justify-content:space-between;margin-bottom:30px}.dados-esq{width:70%;line-height:1.8;font-size:15px}.dados-dir{width:25%;text-align:right}.campo{border-bottom:1px dotted #ccc;margin-bottom:8px}.label{font-weight:bold;color:#555}.secao-titulo{background:#f0f0f0;padding:10px;font-weight:bold;font-size:16px;margin-top:30px;margin-bottom:15px;border-left:5px solid #0056b3}.tag-modalidade{background:#e3f2fd;color:#0d47a1;padding:12px 18px;border-radius:8px;font-size:14px;border:1px solid #bbdefb;display:block;margin-bottom:10px;line-height:1.4}.tag-nenhuma{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;padding:10px 15px;border-radius:8px;font-weight:bold}
          </style></head><body><div class="cabecalho"><h1>FICHA CADASTRAL DE MUNÍCIPE - CEU</h1><p style="margin:5px 0 0;font-size:14px;color:#666;">Documento Interno - Emissão: ${new Date().toLocaleDateString('pt-BR')}</p></div>
          <div class="bloco-dados"><div class="dados-esq"><div class="campo"><span class="label">NOME:</span> ${nome}</div><div class="campo"><span class="label">PRONTUÁRIO FÍSICO:</span> <strong style="color:#0056b3;">${prontuario}</strong></div><div class="campo"><span class="label">CÓDIGO EOL:</span> ${codEol}</div><div class="campo"><span class="label">CPF:</span> ${cpf}</div><div class="campo"><span class="label">NASCIMENTO:</span> ${dataFormatada}</div><div class="campo"><span class="label">TELEFONE:</span> ${tel}</div><div class="campo"><span class="label">E-MAIL:</span> ${email}</div><div class="campo"><span class="label">RESPONSÁVEL LEGAL:</span> ${resp}</div></div><div class="dados-dir">${fotoHtml}</div></div>
          <div class="secao-titulo">MODALIDADES E PERMISSÕES DE ACESSO</div><div>${modalidadesTagsHtml}</div><div class="secao-titulo" style="border-left-color:#6f42c1;">HISTÓRICO DE EMISSÕES DE CARTEIRINHAS (APM)</div><div>${viasHistoricoHtml}</div><div style="margin-top:60px;text-align:center;"><p>_______________________________________________________</p><p style="font-size:12px;color:#666;">Assinatura do Munícipe ou Responsável Legal</p></div></body></html>`;
        const janelaImpressao = window.open('', '_blank', 'width=800,height=600');
        if (!janelaImpressao) { Swal.fire('Atenção', 'O seu navegador bloqueou a janela de impressão. Por favor, permita a abertura de pop-ups para este site.', 'warning'); return; }
        janelaImpressao.document.write(conteudoImpressao); janelaImpressao.document.close(); janelaImpressao.focus();
        setTimeout(() => { janelaImpressao.print(); janelaImpressao.close(); }, 800);
      } catch (erroInterno) { Swal.fire('Erro na Impressão', erroInterno.message, 'error'); }
    }

    const LOGO_DECLARACAO = 'https://drive.google.com/thumbnail?id=1Ckp_Zb3w12N9hO_35Sj7xaLZoi228CV9&sz=w500';
    function imprimirDeclaracao() {
      const nome = document.getElementById('nome').value.trim().toUpperCase();
      if (!nome) { Swal.fire('Atenção', 'Nome do aluno não encontrado.', 'warning'); return; }
      if (!matriculasAtuais.length) { Swal.fire('Atenção', 'Este aluno não tem matrícula ativa para declarar.', 'warning'); return; }
      const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const cpf = document.getElementById('cpf').value.trim();
      const trechoCpf = cpf ? `, CPF nº ${esc(cpf)},` : '';
      const dataExtenso = new Date().toLocaleDateString('pt-BR', {day:'numeric',month:'long',year:'numeric',timeZone:'America/Sao_Paulo'});
      const linhas = matriculasAtuais.map(m => `<tr><td>${esc(m.codEolTurma)}</td><td>${esc(m.modalidade)}</td><td>${esc(m.diaHorario)}</td></tr>`).join('');
      const classeTabela = matriculasAtuais.length > 6 ? 'compacta' : '';
      const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Declaração de Matrícula - ${esc(nome)}</title><style>
        @page{size:A4 portrait;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#000}.declaracao{width:210mm;height:145mm;padding:10mm 15mm 8mm;border-bottom:.4mm dashed #000;display:flex;flex-direction:column}.cab{display:flex;align-items:center;gap:5mm;padding-bottom:3mm;border-bottom:.5mm solid #000}.cab img{height:18mm;width:auto}.cab h1{margin:0;font-size:17pt}.texto{margin:6mm 0 4mm;font-size:12pt;line-height:1.5;text-align:justify}table{width:100%;border-collapse:collapse;font-size:10.5pt}th,td{border:.3mm solid #000;padding:1.6mm 2mm;text-align:left}th{background:#e9e9e9}.compacta table{font-size:9pt}.compacta th,.compacta td{padding:.8mm 2mm}.data{margin-top:6mm;font-size:12pt}.assinatura{margin-top:auto;text-align:center;font-size:10pt}.assinatura .linha{width:90mm;margin:0 auto 1mm;border-top:.3mm solid #000}
        </style></head><body><div class="declaracao ${classeTabela}"><div class="cab"><img id="logo" src="${LOGO_DECLARACAO}" alt="" onerror="this.style.display='none'"><h1>CEU CAMINHO DO MAR</h1></div><p class="texto">Declaramos que <strong>${esc(nome)}</strong>${trechoCpf} está matriculado(a) na(s) seguinte(s) modalidade(s):</p><table><thead><tr><th>Código EOL da Turma</th><th>Modalidade</th><th>Dia / Horário</th></tr></thead><tbody>${linhas}</tbody></table><div class="data">São Paulo, ${dataExtenso}.</div><div class="assinatura"><div class="linha"></div>Assinatura e carimbo</div></div></body></html>`;
      const w = window.open('', '_blank', 'width=900,height=700');
      if (!w) { Swal.fire('Atenção', 'O navegador bloqueou a janela de impressão. Permita pop-ups para este site.', 'warning'); return; }
      w.document.write(html); w.document.close();
      const logo = w.document.getElementById('logo'); let impresso = false;
      const imprimir = () => { if (impresso) return; impresso = true; w.focus(); w.print(); w.close(); };
      if (logo.complete) setTimeout(imprimir, 200);
      else { logo.onload = () => setTimeout(imprimir, 200); logo.onerror = () => setTimeout(imprimir, 200); setTimeout(imprimir, 4000); }
    }
  </script>
