<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste de câmera</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      font-family: Arial, sans-serif;
    }
    h1 { font-size: 1.5rem; }
    video {
      display: block;
      width: 100%;
      min-height: 220px;
      margin: 16px 0;
      border-radius: 8px;
      background: #111;
      object-fit: cover;
    }
    button {
      margin: 0 8px 8px 0;
      padding: 10px 16px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #0d6efd;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { background: #777; cursor: not-allowed; }
    #status { min-height: 3em; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Teste de câmera</h1>
  <p>Clique em “Abrir câmera” e permita o acesso quando o navegador perguntar.</p>
  <button id="abrir" type="button">Abrir câmera</button>
  <button id="fechar" type="button" disabled>Fechar câmera</button>
  <video id="video" autoplay muted playsinline></video>
  <p id="status" role="status" aria-live="polite"></p>

  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const botaoAbrir = document.getElementById('abrir');
    const botaoFechar = document.getElementById('fechar');
    let fluxo = null;

    status.textContent = window.isSecureContext
      ? 'Página segura. A câmera pode ser solicitada.'
      : 'Esta página não está em um contexto seguro. A câmera normalmente exige HTTPS ou localhost.';

    botaoAbrir.addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = 'Este navegador ou contexto não disponibiliza acesso à câmera (getUserMedia).';
        return;
      }

      botaoAbrir.disabled = true;
      status.textContent = 'Solicitando acesso à câmera...';

      try {
        fluxo = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        video.srcObject = fluxo;
        await video.play();
        status.textContent = 'Câmera aberta com sucesso.';
        botaoFechar.disabled = false;
      } catch (erro) {
        const mensagens = {
          NotAllowedError: 'Permissão negada pelo navegador ou bloqueada pela página incorporada.',
          PermissionDeniedError: 'Permissão negada pelo navegador ou bloqueada pela página incorporada.',
          NotFoundError: 'Nenhuma câmera foi encontrada neste dispositivo.',
          NotReadableError: 'A câmera está ocupada ou não pôde ser acessada pelo sistema.',
          OverconstrainedError: 'A câmera solicitada não atende às configurações do navegador.',
          SecurityError: 'O navegador bloqueou a câmera por segurança. Verifique HTTPS e as permissões do site.'
        };
        status.textContent = (mensagens[erro.name] || 'Não foi possível abrir a câmera.') +
          ' Detalhe: ' + (erro.name || 'erro') + (erro.message ? ' — ' + erro.message : '');
        fecharCamera();
      } finally {
        botaoAbrir.disabled = false;
      }
    });

    function fecharCamera() {
      if (fluxo) {
        fluxo.getTracks().forEach(faixa => faixa.stop());
        fluxo = null;
      }
      video.srcObject = null;
      botaoFechar.disabled = true;
    }

    botaoFechar.addEventListener('click', () => {
      fecharCamera();
      status.textContent = 'Câmera fechada.';
    });

    window.addEventListener('pagehide', fecharCamera);
  </script>
</body>
</html>
