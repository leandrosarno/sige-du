<!DOCTYPE html>
<html>
<head>
  <title>Leitor de QR Code</title>
  <!-- Biblioteca gratuita e leve para ler QR Code e Código de Barras -->
  <script src="https://unpkg.com"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px;">
  <h3>Aponte o QR Code para a câmera</h3>
  <div id="leitor" style="width: 350px; margin: auto;"></div>

  <script>
    function aoLerComSucesso(textoDoQrCode) {
      // Para a câmera assim que ler
      scanner.clear();

      // Envia o texto do QR Code para o Modal do Google Sheets e fecha
      if (window.opener) {
        window.opener.postMessage(textoDoQrCode, "*");
        window.close();
      }
    }

    // Inicia a câmera automaticamente
    const scanner = new Html5QrcodeScanner("leitor", { 
      fps: 10, 
      qrbox: { width: 250, height: 250 } 
    });
    
    scanner.render(aoLerComSucesso);
  </script>
</body>
</html>
