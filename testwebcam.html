<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Leitor de QR Code</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px;">
  <h3>Aponte o QR Code para a câmera</h3>
  <p style="font-size: 13px; color: #666;">Dica: Mantenha o QR Code a uns 20–30 cm da lente (não encoste muito) e evite reflexo na tela.</p>
  
  <video id="video" width="400" height="300" style="border: 2px solid #ccc; border-radius: 8px; background: #000;" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <p id="status" style="color: #0066cc; font-weight: bold; font-size: 14px;">Abrindo câmera...</p>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const status = document.getElementById("status");
    let lendo = true;

    if (!("BarcodeDetector" in window)) {
      status.style.color = "red";
      status.innerText = "Este navegador no PC não suporta leitura nativa. Tente pelo Google Chrome ou Edge.";
    } else {
      iniciarCamera();
    }

    function iniciarCamera() {
      // Pede resolução HD para ajudar na nitidez do QR Code
      navigator.mediaDevices.getUserMedia({ 
        video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
      })
      .then((stream) => {
        video.srcObject = stream;
        status.innerText = "Procurando QR Code... (Mantenha firme)";
        const detector = new BarcodeDetector({ formats: ["qr_code"] });
        
        const intervalo = setInterval(async () => {
          if (!lendo) {
            clearInterval(intervalo);
            return;
          }
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
              const codigos = await detector.detect(canvas);
              if (codigos.length > 0) {
                clearInterval(intervalo);
                // Correção: pega o primeiro item da lista [0]
                const textoLido = codigos[0].rawValue;
                finalizarLeitura(textoLido);
              }
            } catch (e) {
              status.style.color = "red";
              status.innerText = "Erro no detector: " + e.message;
            }
          }
        }, 300);
      })
      .catch((err) => {
        status.style.color = "red";
        status.innerText = "Erro ao abrir câmera: " + err;
      });
    }

    function finalizarLeitura(texto) {
      lendo = false;
      status.style.color = "green";
      status.innerText = "Lido com sucesso: " + texto;

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      if (window.opener) {
        window.opener.postMessage(texto, "*");
        setTimeout(() => window.close(), 500);
      } else {
        alert("QR Code lido: " + texto);
      }
    }
  </script>
</body>
</html>
